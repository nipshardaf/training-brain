# Builds the iPhone app on a GitHub Mac and takes a simulator screenshot of it
# loading the live web app. Errors show as annotations on the run; the screenshot
# is pushed to the iphone-shots branch.
name: iPhone build
on:
  push:
    branches: [main]
    paths: ['iphone/**', '.github/workflows/iphone.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        working-directory: iphone
        run: |
          brew install xcodegen
          xcodegen
      - name: Build for the iPhone simulator
        working-directory: iphone
        run: |
          set +e
          xcodebuild -project TrainingBrainPhone.xcodeproj -target TrainingBrainPhone -sdk iphonesimulator \
            -configuration Debug SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          status=$?
          grep -E "error:" build.log | sed -E 's#^.*/iphone/([^:]+):([0-9]+):([0-9]+): error: (.*)$#::error file=iphone/\1,line=\2,col=\3::\4#' | sort -u | head -40
          grep -E "error:" build.log | grep -v "/iphone/" | sed -E 's#^(.*)$#::error::\1#' | sort -u | head -10
          grep -E "warning:" build.log | grep "/iphone/" | sed -E 's#^.*/iphone/([^:]+):([0-9]+):([0-9]+): warning: (.*)$#::warning file=iphone/\1,line=\2,col=\3::\4#' | sort -u | head -20
          tail -5 build.log
          exit $status
      # An unsigned .ipa for installing without Xcode: TrollStore installs it as is
      # (permanently); SideStore/AltStore sign it with your own free Apple ID. Published
      # as the "iphone-latest" release, with a SideStore/AltStore source (apps.json) so
      # those apps can offer updates.
      - name: Build the installable app (.ipa)
        working-directory: iphone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VER="1.0.${{ github.run_number }}"
          xcodebuild -project TrainingBrainPhone.xcodeproj -target TrainingBrainPhone -sdk iphoneos \
            -configuration Release SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VER" CURRENT_PROJECT_VERSION="${{ github.run_number }}" build > ipa.log 2>&1 \
            || { grep -E "error:" ipa.log | head -20 | sed 's/^/::error::/'; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R build/Release-iphoneos/TrainingBrainPhone.app Payload/
          zip -qry TrainingBrain.ipa Payload
          SIZE=$(stat -f%z TrainingBrain.ipa)
          BASE="https://github.com/${{ github.repository }}/releases/download/iphone-latest"
          cat > apps.json <<EOF
          {"name":"Training Brain","identifier":"com.nipshardaf.trainingbrain.source",
           "apps":[{"name":"Training Brain","bundleIdentifier":"com.nipshardaf.trainingbrain.phone",
            "developerName":"Training Brain","subtitle":"Gym & bike training, with Bluetooth for your bike",
            "localizedDescription":"The Training Brain app with Bluetooth for the Renpho bike and a heart-rate strap.",
            "iconURL":"https://raw.githubusercontent.com/${{ github.repository }}/main/iphone/Sources/Assets.xcassets/AppIcon.appiconset/icon.png",
            "tintColor":"7c3aed",
            "versions":[{"version":"$VER","buildVersion":"${{ github.run_number }}","date":"$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "downloadURL":"$BASE/TrainingBrain.ipa","size":$SIZE,"minOSVersion":"15.0"}],
            "appPermissions":{"entitlements":[],"privacy":{"NSBluetoothAlwaysUsageDescription":"Connects to your bike and heart-rate strap."}}}],
           "news":[]}
          EOF
          python3 -m json.tool apps.json > /dev/null
          gh release delete iphone-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create iphone-latest TrainingBrain.ipa apps.json --prerelease \
            --title "Training Brain for iPhone $VER" \
            --notes "Install without Xcode: open TrainingBrain.ipa in TrollStore, or add this source to SideStore: $BASE/apps.json (see iphone/README.md)."
          echo "::notice::published TrainingBrain.ipa $VER ($SIZE bytes)"
      - name: Screenshot
        continue-on-error: true
        working-directory: iphone
        run: |
          RT=$(xcrun simctl list runtimes | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | tail -1)
          DEV=$(xcrun simctl list devicetypes | grep -oE 'com\.apple\.CoreSimulator\.SimDeviceType\.iPhone-1[0-9][A-Za-z0-9-]*' | tail -1)
          echo "::notice::runtime=$RT device=$DEV"
          UDID=$(xcrun simctl create tbphone "$DEV" "$RT")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build -name "TrainingBrainPhone.app" -type d | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.nipshardaf.trainingbrain.phone
          sleep 25
          mkdir -p shots
          xcrun simctl io "$UDID" screenshot shots/launch.png
          ls -la shots
      - name: Publish screenshot
        continue-on-error: true
        run: |
          mv iphone/shots /tmp/shots
          git config user.name "iphone-ci"
          git config user.email "iphone-ci@users.noreply.github.com"
          git checkout --orphan iphone-shots
          git rm -rf -q .
          cp /tmp/shots/*.png .
          echo "$GITHUB_SHA" > commit.txt
          git add *.png commit.txt
          git commit -q -m "iPhone screenshot for $GITHUB_SHA"
          git push -f -q origin iphone-shots
