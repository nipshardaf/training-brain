// Maps bilateral leg exercises to their single-leg (unilateral) equivalents.
// Used by the make_legs_unilateral tool. Exercises already unilateral aren't
// listed (left unchanged). No single-leg machine hamstring curl exists in the
// image library, so curls map to single-leg RDL (a unilateral hamstring move).
const UNILATERAL_MAP={
  bb_squat:'sl_squat',front_squat:'sl_squat',goblet_squat:'sl_squat',bw_squat:'sl_squat',jump_squat:'sl_squat',
  hack_squat:'reverse_lunge',leg_press:'reverse_lunge',
  rdl:'sl_rdl',deadlift:'sl_rdl',nordic_curl:'sl_rdl',leg_curl:'sl_rdl',seated_leg_curl:'sl_rdl',
  hip_thrust:'cable_kickback',glute_bridge:'sl_glute_bridge',
  leg_ext:'sl_legext',
  calf_raise:'single_calf',seated_calf:'sl_seated_calf'
};

// Maps a function name + args to a human-readable summary for the confirmation
// card, plus the actual mutation handler. Each handler returns a short result
// string used for the success toast.
const COACH_TOOL_HANDLERS={
  set_week_capacity:{
    summarize:({days})=>{
      const n=parseInt(days,10);
      if(!n)return`Clear short-week override, regenerate normal plan`;
      const split=n===3?'Push · Pull · Legs':`${n} full-body session${n>1?'s':''}`;
      return`Compress this week to ${n} training day${n>1?'s':''} (${split}), rest is recovery`;
    },
    execute:({days})=>{
      const n=parseInt(days,10);
      const k='week_capacity_'+fd(S.weekStart);
      if(!n||n<1){try{localStorage.removeItem(k);}catch(e){}DB.set(k,null);genPlan();syncUp();return{ok:true,msg:'Short-week override cleared'};}
      if(n>3)return{ok:false,msg:'Short-week supports 1-3 days. For 4+ days adjust your profile setting instead.'};
      DB.set(k,n);
      genPlan();
      syncUp();
      return{ok:true,msg:`Week compressed to ${n} training day${n>1?'s':''}`};
    }
  },
  swap_workout_days:{
    summarize:({date1,date2})=>{
      const pk=DB.pk(getMon(new Date(date1+'T12:00:00')));
      const plan=DB.get(pk,null)||[];
      const d1=plan.find(d=>d.date===date1);
      const d2=plan.find(d=>d.date===date2);
      if(!d1||!d2)return`Swap ${date1} ↔ ${date2}`;
      return`Swap ${_dayLbl(date1)} (${_typeShort(d1.type)}) ↔ ${_dayLbl(date2)} (${_typeShort(d2.type)})`;
    },
    execute:({date1,date2})=>{
      const pk=DB.pk(getMon(new Date(date1+'T12:00:00')));
      const plan=DB.get(pk,null);
      if(!plan)return{ok:false,msg:'No plan for that week'};
      const i1=plan.findIndex(d=>d.date===date1);
      const i2=plan.findIndex(d=>d.date===date2);
      if(i1<0||i2<0)return{ok:false,msg:'Date not in plan'};
      [plan[i1].type,plan[i2].type]=[plan[i2].type,plan[i1].type];
      [plan[i1].exercises,plan[i2].exercises]=[plan[i2].exercises,plan[i1].exercises];
      [plan[i1].extraGym,plan[i2].extraGym]=[plan[i2].extraGym,plan[i1].extraGym];
      DB.set(pk,plan);
      syncUp();
      return{ok:true,msg:`Swapped ${date1} ↔ ${date2}`};
    }
  },
  change_day_type:{
    summarize:({date,new_type})=>{
      const pk=DB.pk(getMon(new Date(date+'T12:00:00')));
      const plan=DB.get(pk,null)||[];
      const d=plan.find(x=>x.date===date);
      const oldStr=d?_typeShort(d.type):'?';
      return`Change ${_dayLbl(date)}: ${oldStr} → ${_typeShort(new_type)}`;
    },
    execute:({date,new_type})=>{
      // doSwap handles type changes including cascade-when-gym-becomes-rest
      const pk=DB.pk(getMon(new Date(date+'T12:00:00')));
      const plan=DB.get(pk,null);
      if(!plan||!plan.find(d=>d.date===date))return{ok:false,msg:'Date not in plan'};
      doSwap(date,new_type);
      return{ok:true,msg:`${date} → ${new_type}`};
    }
  },
  add_workout_to_ride_day:{
    summarize:({date,gym_type})=>`Add ${_typeShort(gym_type)} workout to ${_dayLbl(date)} (cascade remaining gym days forward)`,
    execute:({date,gym_type})=>{
      const pk=DB.pk(getMon(new Date(date+'T12:00:00')));
      const plan=DB.get(pk,null);
      if(!plan)return{ok:false,msg:'No plan'};
      const d=plan.find(x=>x.date===date);
      const rideTypes=['LONG_OUTDOOR','SHORT_OUTDOOR','LONG_INDOOR','SHORT_INDOOR'];
      if(!d||!rideTypes.includes(d.type))return{ok:false,msg:'Not a ride day'};
      addGymToRideDay(date,gym_type,1); // shift=1 = cascade
      return{ok:true,msg:`Added ${gym_type} to ${date}, cascaded forward`};
    }
  },
  replace_gym_with_ride:{
    summarize:({date})=>`Replace ${_dayLbl(date)} gym with the Strava ride; cascade gym work forward`,
    execute:({date})=>{
      const pk=DB.pk(getMon(new Date(date+'T12:00:00')));
      const plan=DB.get(pk,null);
      const d=plan?.find(x=>x.date===date);
      const gymTypes=['PUSH','PULL','LEGS','UPPER_PUMP'];
      if(!d||!gymTypes.includes(d.type))return{ok:false,msg:'Not a gym day'};
      if(!stravaRideOnDate(date))return{ok:false,msg:'No Strava ride on that date'};
      replaceGymWithRide(date);
      return{ok:true,msg:`Replaced ${date} gym with the ride`};
    }
  },
  mark_day_complete:{
    summarize:({date,completed=true})=>`${completed===false?'Un-mark':'Mark'} ${_dayLbl(date)} as ${completed===false?'incomplete':'complete'}`,
    execute:({date,completed=true})=>{
      const lk='log_'+date;
      let log=DB.get(lk,null);
      if(!log){
        // Create a minimal log so completion can be marked even if no sets logged
        const pk=DB.pk(getMon(new Date(date+'T12:00:00')));
        const plan=DB.get(pk,null);
        const dp=plan?.find(d=>d.date===date);
        if(!dp)return{ok:false,msg:'Day not in plan'};
        log={date,type:dp.type,exercises:dp.exercises?.map(id=>({id,sets:[]}))||[],completed:false};
      }
      log.completed=completed!==false;
      DB.set(lk,log);
      syncUp();
      return{ok:true,msg:`${date} marked ${log.completed?'complete':'incomplete'}`};
    }
  },
  set_lock_day:{
    summarize:({date,locked=true})=>`${locked===false?'Unlock':'Lock'} ${_dayLbl(date)} ${locked===false?'(future regen can change it)':'(future regen will preserve it)'}`,
    execute:({date,locked=true})=>{
      const pk=DB.pk(getMon(new Date(date+'T12:00:00')));
      const plan=DB.get(pk,null);
      if(!plan)return{ok:false,msg:'No plan'};
      const i=plan.findIndex(d=>d.date===date);
      if(i<0)return{ok:false,msg:'Date not in plan'};
      plan[i].locked=locked!==false;
      DB.set(pk,plan);
      syncUp();
      return{ok:true,msg:`${date} ${plan[i].locked?'locked':'unlocked'}`};
    }
  },
  log_gym_sets:{
    summarize:({date,exercises})=>{
      const exCount=exercises?.length||0;
      const setCount=(exercises||[]).reduce((s,e)=>s+(e.sets?.length||0),0);
      const names=(exercises||[]).slice(0,3).map(e=>e.name).join(', ');
      return`Log ${exCount} exercise${exCount!==1?'s':''} · ${setCount} set${setCount!==1?'s':''} for ${_dayLbl(date)} (${names}${exCount>3?', …':''})`;
    },
    execute:({date,exercises})=>{
      if(!exercises||!exercises.length)return{ok:false,msg:'No exercises to log'};
      // Fuzzy match each input name against the EX library
      const matchExercise=name=>{
        const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
        const target=norm(name);
        if(!target)return null;
        const words=target.split(/\s+/);
        let best=null,bestScore=0;
        for(const [id,ex] of Object.entries(EX)){
          const exName=norm(ex.n);
          let score=0;
          if(exName===target)score=1000; // exact
          else{
            // Score = portion of input words found in exercise name
            const matched=words.filter(w=>exName.includes(w)).length;
            score=(matched/words.length)*100;
            // Bonus if all words match and exName is short (more specific match)
            if(matched===words.length)score+=50-Math.min(exName.length,50);
          }
          if(score>bestScore){bestScore=score;best={id,ex};}
        }
        return bestScore>=50?best:null;
      };
      const lk='log_'+date;
      let log=DB.get(lk,null);
      const pk=DB.pk(getMon(new Date(date+'T12:00:00')));
      const plan=DB.get(pk,null);
      const dp=plan?.find(d=>d.date===date);
      if(!log){
        log={date,type:dp?.type||'PUSH',exercises:[],completed:false};
      }
      const unmatched=[];
      for(const item of exercises){
        const m=matchExercise(item.name);
        if(!m){unmatched.push(item.name);continue;}
        const sets=(item.sets||[]).map(s=>({w:String(s.weight),r:String(s.reps),done:true}));
        if(!sets.length)continue;
        // Replace existing entry for this exercise if present, else append
        const existingIdx=log.exercises.findIndex(le=>le.id===m.id);
        if(existingIdx>=0){
          log.exercises[existingIdx].sets=sets;
        }else{
          log.exercises.push({id:m.id,sets});
        }
        // Update PRs if applicable (assisted exercises: lower weight = better)
        const prs=DB.get('prs',{})||{};
        const _assist=EX[m.id]?.assist;
        for(const s of sets){
          const w=parseFloat(s.w),r=parseInt(s.r);
          if(!w||!r)continue;
          const cur=prs[m.id];
          const better=!cur?true:_assist?(w<cur.w||(w===cur.w&&r>cur.r)):(w>cur.w||(w===cur.w&&r>cur.r));
          if(better){
            prs[m.id]={w,r,date};
          }
        }
        DB.set('prs',prs);
      }
      log.completed=true;
      DB.set(lk,log);
      syncUp();
      const ok=log.exercises.length;
      const note=unmatched.length?` (couldn't match: ${unmatched.join(', ')})`:'';
      return{ok:true,msg:`Logged ${ok} exercise${ok!==1?'s':''} on ${date}${note}`};
    }
  },
  regenerate_remaining_week:{
    summarize:({from_date})=>`Regenerate plan from ${_dayLbl(from_date)} forward (days before are preserved)`,
    execute:({from_date})=>{
      const pk=DB.pk(getMon(new Date(from_date+'T12:00:00')));
      const plan=DB.get(pk,null);
      if(!plan)return{ok:false,msg:'No plan for that week'};
      // Snapshot original lock state so we can restore after
      const origLocks={};
      plan.forEach(d=>{origLocks[d.date]=!!d.locked;});
      // Temporarily lock days before from_date so buildWeek preserves them
      plan.forEach(d=>{if(d.date<from_date)d.locked=true;});
      DB.set(pk,plan);
      // Rebuild using cached weather from the existing plan
      const wdays=plan.map(d=>({date:d.date,...(d.weather||{tmax:15,tmin:5,rain:0,wind:10,code:1,score:0})}));
      try{
        const newPlan=buildWeek(wdays);
        // Restore original lock state on the regenerated week
        newPlan.forEach(d=>{d.locked=origLocks[d.date]||false;});
        DB.set(pk,newPlan);
        syncUp();
        return{ok:true,msg:`Regenerated from ${from_date} forward`};
      }catch(e){
        return{ok:false,msg:'Regeneration failed: '+(e?.message||e)};
      }
    }
  },
  make_legs_unilateral:{
    summarize:({date})=>`Convert ${_dayLbl(date)} leg exercises to single-leg variants`,
    execute:({date})=>{
      const pk=DB.pk(getMon(new Date(date+'T12:00:00')));
      const plan=DB.get(pk,null);
      const dp=plan?.find(d=>d.date===date);
      if(!dp)return{ok:false,msg:'Date not in plan'};
      if(dp.type!=='LEGS')return{ok:false,msg:'Not a leg day'};
      if(!dp.exercises||!dp.exercises.length)return{ok:false,msg:'No exercises to convert'};
      let changed=0,skipped=0;
      const newEx=dp.exercises.map(id=>{
        const u=UNILATERAL_MAP[id];
        // Only convert if the single-leg variant exists AND the gym has its equipment
        if(u&&u!==id&&EX[u]){
          if(!exAvail(u)){skipped++;return id;} // gym lacks equipment — keep original
          changed++;return u;
        }
        return id;
      });
      if(!changed)return{ok:false,msg:skipped?'Single-leg variants need equipment your gym doesn\'t have':'Already all single-leg'};
      dp.exercises=newEx;
      DB.set(pk,plan);
      // Update an existing incomplete log for that day so the swap is reflected
      const lk='log_'+date;
      const log=DB.get(lk,null);
      if(log&&!log.completed){
        log.exercises=newEx.map(id=>({id,sets:makeSets(id,S.energy||'okay',getLastLog(id))}));
        DB.set(lk,log);
      }
      syncUp();
      return{ok:true,msg:`Converted ${changed} exercise${changed!==1?'s':''} to single-leg${skipped?` (${skipped} kept — gym lacks equipment)`:''}`};
    }
  },
  swap_exercise:{
    summarize:({date,from_exercise,to_exercise})=>{
      const f=_matchExerciseByName(from_exercise),t=_matchExerciseByName(to_exercise);
      return`Swap ${f?EX[f].n:from_exercise} → ${t?EX[t].n:to_exercise} on ${_dayLbl(date)}`;
    },
    execute:({date,from_exercise,to_exercise})=>{
      const pk=DB.pk(getMon(new Date(date+'T12:00:00')));
      const plan=DB.get(pk,null);
      const dp=plan?.find(d=>d.date===date);
      if(!dp)return{ok:false,msg:'Date not in plan'};
      if(!dp.exercises||!dp.exercises.length)return{ok:false,msg:'No exercises on that day'};
      const fromId=_matchExerciseByName(from_exercise);
      const toId=_matchExerciseByName(to_exercise);
      if(!fromId)return{ok:false,msg:`Couldn't find "${from_exercise}"`};
      if(!toId)return{ok:false,msg:`Couldn't find "${to_exercise}"`};
      const idx=dp.exercises.indexOf(fromId);
      if(idx<0)return{ok:false,msg:`${EX[fromId].n} isn't in that day's plan`};
      if(dp.exercises.includes(toId))return{ok:false,msg:`${EX[toId].n} is already in the plan`};
      // Respect the selected gym's equipment — don't swap into something it lacks
      if(!exAvail(toId))return{ok:false,msg:`Your gym doesn't have the equipment for ${EX[toId].n}`};
      dp.exercises[idx]=toId;
      DB.set(pk,plan);
      // Reflect in an incomplete log
      const lk='log_'+date;
      const log=DB.get(lk,null);
      if(log&&!log.completed){
        const li=log.exercises.findIndex(e=>e.id===fromId);
        if(li>=0)log.exercises[li]={id:toId,sets:makeSets(toId,S.energy||'okay',getLastLog(toId))};
        DB.set(lk,log);
      }
      syncUp();
      return{ok:true,msg:`Swapped ${EX[fromId].n} → ${EX[toId].n}`};
    }
  },
  set_exercise_targets:{
    summarize:({date,exercise,sets,reps,weight})=>{
      const m=_matchExerciseByName(exercise);
      const parts=[];
      if(sets!=null)parts.push(`${sets} sets`);
      if(reps!=null)parts.push(`${reps} reps`);
      if(weight!=null)parts.push(`${weight}${unit()}`);
      return`Set ${m?EX[m].n:exercise} to ${parts.join(' · ')||'targets'} on ${_dayLbl(date)}`;
    },
    execute:({date,exercise,sets,reps,weight})=>{
      const pk=DB.pk(getMon(new Date(date+'T12:00:00')));
      const plan=DB.get(pk,null);
      const dp=plan?.find(d=>d.date===date);
      if(!dp)return{ok:false,msg:'Date not in plan'};
      const exId=_matchExerciseByName(exercise);
      if(!exId)return{ok:false,msg:`Couldn't find "${exercise}"`};
      if(!dp.exercises||!dp.exercises.includes(exId))return{ok:false,msg:`${EX[exId].n} isn't in that day's plan`};
      // Determine the set count: explicit, else existing log, else exercise default
      const lk='log_'+date;
      let log=DB.get(lk,null);
      if(!log){
        log={date,type:dp.type,exercises:dp.exercises.map(id=>({id,sets:makeSets(id,S.energy||'okay',getLastLog(id))})),completed:false};
      }
      let le=log.exercises.find(e=>e.id===exId);
      if(!le){le={id:exId,sets:makeSets(exId,S.energy||'okay',getLastLog(exId))};log.exercises.push(le);}
      const nSets=sets!=null?Math.max(1,Math.min(10,sets)):(le.sets.length||EX[exId].sets||3);
      // Build the prescribed sets: each gets weight/reps if provided, else keep prior value
      const prevW=le.sets[0]?.w||'';
      const prevR=le.sets[0]?.r||'';
      const w=weight!=null?String(weight):prevW;
      const r=reps!=null?String(reps):prevR;
      le.sets=Array.from({length:nSets},()=>({w,r,done:false,_edited:!!w,_tgt:true}));
      DB.set(lk,log);
      syncUp();
      const parts=[];
      if(sets!=null)parts.push(`${nSets} sets`);
      if(reps!=null)parts.push(`${reps} reps`);
      if(weight!=null)parts.push(`${weight}${unit()}`);
      return{ok:true,msg:`${EX[exId].n}: ${parts.join(' · ')||'targets set'}`};
    }
  }
};

// Fuzzy-match an exercise name against the EX library. Returns the exercise id
// or null. Shared by the AI tools (swap_exercise, set_exercise_targets,
// log_gym_sets). Scores by portion of input words found in the exercise name.
function _matchExerciseByName(name){
  const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  const target=norm(name);
  if(!target)return null;
  const words=target.split(/\s+/);
  let best=null,bestScore=0;
  for(const [id,ex] of Object.entries(EX)){
    const exName=norm(ex.n);
    let score;
    if(exName===target)score=1000;
    else{
      const matched=words.filter(w=>exName.includes(w)).length;
      score=(matched/words.length)*100;
      if(matched===words.length)score+=50-Math.min(exName.length,50);
    }
    if(score>bestScore){bestScore=score;best=id;}
  }
  return bestScore>=50?best:null;
}

// Multi-turn chat — v2.48. The Coach now maintains a running conversation.
// Stored in DB.get('ai_chat_session') as an array of turns. Each turn:
//   { role: 'user' | 'model',
//     text: string (escaped HTML for display),
//     rawText: string (raw text used to rebuild API contents),
//     functionCalls: [{name, args}],            // model turns only
//     pendingActions: [{name, args}],           // model turns only — not-yet-handled
//     appliedActions: [{fc, result, at}],       // model turns only
//     skippedActions: [{fc, at}],               // model turns only
//     at: ISO timestamp }
// Removes/replaces training-jargon acronyms that the model occasionally slips
// into responses despite the prompt rules. Applied as a safety net on every
// model response. Patterns handled:
//   "Form (TSB)"  → "Form"
//   "(TSB)" / "TSB" → "Form"  (only as standalone token)
//   "(CTL)" / "CTL" → "Fitness"
//   "(ATL)" / "ATL" → "Fatigue"
//   "TSS X" / "(TSS)" → "load X"
//   "IF 0.85" / "(IF)" → "intensity 0.85"
//   "NP X" / "(NP)" → "normalized power X" (only when standalone)
function _stripAcronyms(text){
  if(!text)return text;
  let t=text;
  // Strip parenthetical acronyms when next to their plain term, e.g. "Form (TSB)" → "Form"
  t=t.replace(/\s*\((?:TSB|CTL|ATL|TSS|IF|NP|EF)\)/g,'');
  // Replace standalone acronyms (word boundary on both sides) with plain term
  t=t.replace(/\bTSB\b/g,'Form');
  t=t.replace(/\bCTL\b/g,'Fitness');
  t=t.replace(/\bATL\b/g,'Fatigue');
  t=t.replace(/\bTSS\b/g,'load');
  // "IF 0.85" → "intensity 0.85" (avoid matching the English word "if" by requiring uppercase + digit nearby)
  t=t.replace(/\bIF\s+(\d)/g,'intensity $1');
  return t;
}

// Show/hide the ↑Top and ↓Latest buttons based on scroll position. Called on
// every scroll event and on render. Within 40px of either edge counts as "at"
// that edge — the button for that edge hides, the other shows.
function _updateAskScrollBtns(){
  const el=document.getElementById('ask-thread');
  if(!el)return;
  const top=document.getElementById('ask-scroll-top');
  const bot=document.getElementById('ask-scroll-bottom');
  const atTop=el.scrollTop<40;
  const atBottom=el.scrollTop+el.clientHeight>=el.scrollHeight-40;
  // Also hide both if the thread isn't tall enough to scroll
  const isScrollable=el.scrollHeight>el.clientHeight+10;
  if(top)top.style.display=(!isScrollable||atTop)?'none':'block';
  if(bot)bot.style.display=(!isScrollable||atBottom)?'none':'block';
}

// Attach scroll listener to the (freshly rendered) chat thread. The DOM
// element is new on every render so dedup-checking via data attribute isn't
// needed — old listeners are dropped with the old element.
function _bindAskScrollObserver(){
  const el=document.getElementById('ask-thread');
  if(!el)return;
  el.addEventListener('scroll',_updateAskScrollBtns,{passive:true});
  _updateAskScrollBtns();
}

// Build the Gemini contents[] array from the conversation. The LAST user message
// gets the full training context prepended; earlier messages stay lean to save
// tokens but still preserve the back-and-forth.
function _buildAskContents(conv){
  const lastUserIdx=(()=>{
    for(let i=conv.length-1;i>=0;i--)if(conv[i].role==='user')return i;
    return -1;
  })();
  const contents=[];
  for(let i=0;i<conv.length;i++){
    const t=conv[i];
    if(t.role==='user'){
      const text=(i===lastUserIdx)?_buildAskUserContext(conv,t.rawText):t.rawText;
      contents.push({role:'user',parts:[{text}]});
    }else{
      // model role
      const parts=[];
      if(t.rawText)parts.push({text:t.rawText});
      for(const fc of(t.functionCalls||[]))parts.push({functionCall:fc});
      contents.push({role:'model',parts});
    }
  }
  return contents;
}

// Compose the full context-rich prompt for the latest user message. Includes
// a summary of recent actions applied in this conversation so the model knows
// what's already been done.
function _buildAskUserContext(conv,question){
  const ctx=buildAskPrompt(question);
  // Summarise actions applied earlier in this conversation
  const applied=[];
  for(const t of conv){
    if(t.role!=='model'||!t.appliedActions)continue;
    for(const a of t.appliedActions)applied.push(`${a.fc.name}(${JSON.stringify(a.fc.args)}) → ${a.result.msg}`);
  }
  if(applied.length){
    return ctx.replace('=== USER\'S QUESTION ===',`=== ACTIONS ALREADY APPLIED THIS CONVERSATION ===\n${applied.map(a=>'  '+a).join('\n')}\n\n=== USER'S QUESTION ===`);
  }
  return ctx;
}

async function sendAskCoach(){
  const inp=document.getElementById('ask-coach-input');
  if(!inp)return;
  const question=inp.value.trim();
  if(!question)return;
  const tier=getUserTier();
  const cfg=_TIERS[tier];
  if(cfg.quota===0){showToast('Ask Coach access by invitation only — contact the app owner','var(--t2)');return;}
  const used=getAskQuotaUsed();
  if(cfg.quota!==-1&&used>=cfg.quota){showToast(`Daily limit reached (${cfg.quota}). Resets at midnight.`,'var(--amb)');return;}
  // Client-side throttle: avoid tripping Gemini's 15-RPM limit. 4-second
  // cooldown for non-admin users. Admin bypasses (still subject to Gemini's
  // own 429 on excessive use, but the app doesn't pre-throttle them).
  if(tier!=='admin'){
    const now=Date.now();
    if(S._lastAskAt&&now-S._lastAskAt<4000){
      const waitMs=4000-(now-S._lastAskAt);
      showToast(`Hold on ${Math.ceil(waitMs/1000)}s — pacing requests`,'var(--amb)');
      return;
    }
    S._lastAskAt=now;
  }
  // Append user turn to the conversation immediately so UI updates
  const conv=getAskConversation();
  conv.push({role:'user',text:_esc(question),rawText:question,at:new Date().toISOString()});
  setAskConversation(conv);
  inp.value='';
  S.askLoading=true;S.askError=null;render();
  try{
    const r=await fetch(GEMINI_PROXY,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        contents:_buildAskContents(conv),
        tools:COACH_TOOLS,
        toolConfig:{functionCallingConfig:{mode:'AUTO'}},
        generationConfig:{maxOutputTokens:700,temperature:0.6,thinkingConfig:{thinkingBudget:0}}
      })});
    if(!r.ok){
      // Friendlier error messages for known status codes
      if(r.status===429)throw new Error('Too many requests in a short time. Wait ~30 seconds and try again — the free Gemini tier allows 15 requests per minute.');
      if(r.status===403)throw new Error('API access denied. Check your Gemini API key in the worker.');
      if(r.status>=500)throw new Error('Gemini service is having a moment. Try again in a few seconds.');
      throw new Error('Coach API error '+r.status+' — try again in a moment');
    }
    const json=await r.json();
    const parts=json.candidates?.[0]?.content?.parts||[];
    const textParts=parts.filter(p=>p.text).map(p=>p.text.trim()).filter(Boolean);
    const fnCalls=parts.filter(p=>p.functionCall).map(p=>p.functionCall);
    const text=textParts.join('\n\n');
    if(!text&&!fnCalls.length)throw new Error('empty response');
    incrementAskQuota();
    trackAICall?.('ask_coach',true);
    // Safety net: strip any acronyms the model slipped in despite the prompt rules
    const cleanedText=_stripAcronyms(text);
    const conv2=getAskConversation();
    conv2.push({
      role:'model',
      text:cleanedText?_esc(cleanedText).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n+/g,'<br>'):'',
      rawText:cleanedText,
      functionCalls:fnCalls,
      pendingActions:[...fnCalls],
      appliedActions:[],
      skippedActions:[],
      at:new Date().toISOString()
    });
    setAskConversation(conv2);
    S.askLoading=false;
    syncUp();render();
    // Scroll to bottom of the chat thread
    setTimeout(()=>{
      // Scroll the chat thread internal container to its bottom (latest message visible)
      const el=document.getElementById('ask-thread');
      if(el)el.scrollTop=el.scrollHeight;
      // Also scroll the page so the chat panel's bottom is in view — user may have
      // scrolled down to look at other sections while the coach was thinking.
      const inp=document.getElementById('ask-coach-input');
      if(inp)inp.scrollIntoView({behavior:'smooth',block:'end'});
    },100);
  }catch(e){
    console.warn('Ask Coach failed:',e);
    trackAICall?.('ask_coach',false);
    S.askLoading=false;S.askError=e?.message||'Network error';
    render();
  }
}

// Find the model turn at index `ti` and resolve its pending action at `ai`.
function applyCoachAction(ti,ai){
  const conv=getAskConversation();
  const turn=conv[ti];
  if(!turn||turn.role!=='model'||!turn.pendingActions)return;
  const fc=turn.pendingActions[ai];
  if(!fc)return;
  const handler=COACH_TOOL_HANDLERS[fc.name];
  if(!handler){showToast(`Unknown action: ${fc.name}`,'var(--red)');return;}
  const result=handler.execute(fc.args||{});
  if(result.ok){
    turn.appliedActions=turn.appliedActions||[];
    turn.appliedActions.push({fc,result,at:new Date().toISOString()});
    turn.pendingActions.splice(ai,1);
    setAskConversation(conv);
    showToast(`✓ ${result.msg}`,'var(--grn)');
  }else{
    showToast(`⚠️ ${result.msg}`,'var(--red)');
  }
  render();
}
function skipCoachAction(ti,ai){
  const conv=getAskConversation();
  const turn=conv[ti];
  if(!turn||turn.role!=='model'||!turn.pendingActions)return;
  const fc=turn.pendingActions[ai];
  if(!fc)return;
  turn.skippedActions=turn.skippedActions||[];
  turn.skippedActions.push({fc,at:new Date().toISOString()});
  turn.pendingActions.splice(ai,1);
  setAskConversation(conv);
  render();
}

function buildNextWeekPrompt(weekSessions,nextGymDays){
  const u=unit();
  const profile=DB.get('user_profile',{});
  const goalStr=(profile.goals||[]).filter(Boolean).length?(profile.goals||[]).join(', '):(profile.goal||'general fitness');
  const levelStr=profile.level||'intermediate';
  const sessionTxt=weekSessions.length?weekSessions.map(s=>{
    const exStr=s.exercises.map(e=>{
      const done=(e.sets||[]).filter(x=>x.done&&x.w);
      if(!done.length)return null;
      return`${EX[e.id]?.n||e.id}: ${done.map(x=>`${x.w}${u}x${x.r}`).join('/')}`;
    }).filter(Boolean).join(' | ');
    return`${s.date} (${s.type}): ${exStr||'no data'}`;
  }).join('\n'):'No gym sessions logged this week.';
  const nextTxt=nextGymDays.map(d=>`${d.date} (${d.type}): ${(d.exercises||[]).map(id=>EX[id]?.n||id).join(', ')}`).join('\n')||'No gym days planned.';
  return`You are a personal training coach. Review this week's performance and provide starting weight/rep suggestions for each exercise in next week's plan.

User goal: ${goalStr} | Level: ${levelStr} | Weight unit: ${u}

THIS WEEK'S PERFORMANCE:
${sessionTxt}

NEXT WEEK'S EXERCISES:
${nextTxt}

For each exercise listed in "NEXT WEEK'S EXERCISES", provide a starting weight and rep target using progressive overload principles. If the exercise was done this week, add 2.5–5${u} if all reps were completed, keep the same if it was hard, or reduce slightly if sets were missed. If not done this week, base on similar exercises or overall level.

Respond in EXACTLY this format (one line per exercise, nothing else before SUGGESTIONS:):
SUGGESTIONS:
<Exact Exercise Name>: <weight>${u}x<reps>
<Exact Exercise Name>: <weight>${u}x<reps>`;
}

function parseNextWeekSuggestions(text){
  const sugg={};
  const u=unit();
  const block=text.match(/SUGGESTIONS:\s*([\s\S]*)/i);
  if(!block)return sugg;
  const lines=block[1].split('\n');
  for(const line of lines){
    const m=line.match(/^(.+?):\s*([\d.]+)\s*(?:kg|lbs?)?\s*[x×]\s*(\d+)/i);
    if(!m)continue;
    const name=m[1].trim();
    const weight=parseFloat(m[2]);const reps=parseInt(m[3]);
    const exId=Object.entries(EX).find(([id,e])=>e.n.toLowerCase()===name.toLowerCase())?.[0];
    if(exId&&weight>0&&reps>0)sugg[exId]={w:String(weight),r:String(reps)};
  }
  return sugg;
}

// v2.66: Computes the progressive-overload target for an exercise based on
// the user's last completed session and their active goal profile.
//
// Algorithm (standard "double progression"):
//   1. Find the heaviest top set from the last completed session.
//   2. If all completed sets hit the top of the goal's rep range → bump
//      weight by progression_step, reset to bottom of rep range.
//   3. Otherwise → hold weight, add 1 rep (capped at top of range).
//   4. If goal is "maintain" (lose_weight, step=0) → hold both indefinitely.
//   5. No history → fall back to PR if available, else empty (user enters).
//
// Returns {w, r, change, reason} or null. `change` is a short pill label
// ("↑ +2.5kg", "→ +1 rep", "hold"). `reason` is human-readable context.
function computeProgressionTarget(exId,lastSets){
  const goalProfile=getActiveGoalProfile();
  if(!EX[exId])return null;
  const u=unit();
  const step=u==='lbs'?goalProfile.progression_step_lb:goalProfile.progression_step_kg;
  const repLow=goalProfile.rep_low;
  const repHigh=goalProfile.rep_high;
  // No usable history → use PR or empty starter
  const done=(lastSets||[]).filter(s=>s.done&&s.w&&s.r);
  if(!done.length){
    const pr=(DB.get('prs',{})||{})[exId];
    if(pr)return{w:pr.w,r:Math.max(repLow,Math.min(repHigh,pr.r)),change:'starting at your PR',reason:'no recent session — use PR as anchor'};
    return{w:'',r:repLow,change:'first time',reason:'no history yet — enter your starting weight'};
  }
  // Assisted exercises (assisted pull-up/dip): weight = ASSISTANCE, so progress
  // means REDUCING it toward 0 (unassisted). "Best" set is the LOWEST weight.
  const assist=EX[exId]?.assist;
  // Reference set: heaviest for normal exercises, lightest (least assist) for assisted
  const topSet=done.reduce((a,b)=>{
    const aw=parseFloat(a.w),bw=parseFloat(b.w);
    if(assist){if(bw<aw)return b;if(bw>aw)return a;}
    else{if(bw>aw)return b;if(bw<aw)return a;}
    return parseInt(b.r)>parseInt(a.r)?b:a;
  });
  const lastW=parseFloat(topSet.w);
  const lastR=parseInt(topSet.r);
  // Maintain mode (cutting / lose_weight goal) → hold
  if(step===0)return{w:lastW,r:lastR,change:'hold',reason:'cutting phase — preserve strength, don\'t push'};
  const allHitTop=done.every(s=>parseInt(s.r)>=repHigh);
  if(allHitTop){
    if(assist){
      // Reduce assistance (down to 0 = bodyweight). Getting stronger.
      const newW=Math.max(0,+(lastW-step).toFixed(1));
      return{
        w:newW,r:repLow,
        change:`↓ −${step}${u==='lbs'?'lb':'kg'} assist`,
        reason:newW===0?`hit top reps with minimal help — try it unassisted!`:`hit top of ${repLow}-${repHigh} reps — less assistance, you're getting stronger`
      };
    }
    return{
      w:+(lastW+step).toFixed(1),r:repLow,
      change:`↑ +${step}${u==='lbs'?'lb':'kg'}`,
      reason:`hit top of ${repLow}-${repHigh} rep range — progressing weight`
    };
  }
  // Not at top of range → hold weight, try for one more rep
  const newR=Math.min(repHigh,lastR+1);
  if(newR>lastR){
    return{w:lastW,r:newR,change:'+1 rep',reason:assist?`aim for ${repHigh} reps before dropping assistance`:`aim for ${repHigh} reps to unlock weight progression`};
  }
  return{w:lastW,r:lastR,change:'match last',reason:assist?'one more session at this assist level':'one more session at this load before bumping'};
}

function makeSets(exId,energy,last){
  const ex=EX[exId];if(!ex)return[];
  const n=energyTargets(exId,energy).sets;
  // v2.66: Use progression target as primary prefill source (replaces the
  // previous "copy last session's values" behavior). AI suggestion still used
  // as a fallback when no last-session data exists.
  const tgt=computeProgressionTarget(exId,last);
  const hasTgt=tgt&&tgt.w!==''&&tgt.w!=null;
  const hasLastData=last&&last.some(s=>s.w);
  const aiSugg=hasLastData?null:(DB.get('ai_week_sugg_'+fd(S.weekStart),null)?.suggestions||{})[exId]||null;
  const prefillW=hasTgt?String(tgt.w):(aiSugg?.w||'');
  const prefillR=hasTgt?String(tgt.r):(aiSugg?.r||'');
  const isAi=!hasTgt&&!!aiSugg;
  const isTgt=!!hasTgt;
  if(ex.uni){
    return Array.from({length:n*2},(_,i)=>{
      const side=i%2===0?'L':'R';
      return{w:prefillW,r:prefillR,done:false,side,_edited:!!prefillW,_ai:isAi,_tgt:isTgt};
    });
  }
  return Array.from({length:n},(_,si)=>({w:prefillW,r:prefillR,done:false,_edited:!!prefillW,_ai:isAi,_tgt:isTgt}));
}

function getLastLog(exId){

}

// Resolve an exercise name (from AI output) to an EX id
function findExByName(name){
  if(!name)return null;
  const q=name.toLowerCase().trim();
  let found=Object.entries(EX).find(([,e])=>e.n.toLowerCase()===q);if(found)return found[0];
  found=Object.entries(EX).find(([,e])=>e.n.toLowerCase().includes(q)||q.includes(e.n.toLowerCase()));
  return found?found[0]:null;
}

// Find an advisor-suggested swap for this exercise name (handles Firebase object/array)
function findWeekSwap(exName,swaps){
  if(!swaps)return null;
  if(!Array.isArray(swaps))swaps=Object.values(swaps);
  if(!swaps.length)return null;
  const name=exName.toLowerCase();
  const s=swaps.find(s=>s.current&&(
    s.current.toLowerCase()===name||
    name.includes(s.current.toLowerCase())||
    s.current.toLowerCase().includes(name)
  ));
  if(!s||!s.suggested)return null;
  const toId=findExByName(s.suggested);
  if(!toId||toId===findExByName(exName))return null; // don't swap to itself
  return{...s,toId};
}

function findWeekTarget(exName,targets){
  if(!targets?.length)return null;
  const name=exName.toLowerCase();
  // 1. exact match
  let t=targets.find(t=>t.ex?.toLowerCase()===name);if(t)return t;
  // 2. one contains the other
  t=targets.find(t=>t.ex&&(name.includes(t.ex.toLowerCase())||t.ex.toLowerCase().includes(name)));if(t)return t;
  // 3. two or more significant words overlap
  const words=name.split(' ').filter(w=>w.length>3);
  return targets.find(t=>{
    if(!t.ex)return false;
    const tw=t.ex.toLowerCase().split(' ').filter(w=>w.length>3);
    return words.filter(w=>tw.includes(w)).length>=2;
  })||null;
}

  // v2.66: progressive-overload target computed from last session + goal profile

<div class="log-ex-hdr" onclick="togLogEx(${ei})">
  <div class="log-ex-name">${ex.n}${pr?`<span class="pr-b">🏆 ${pr.w}${unit()}×${pr.r}</span>`:''}${!isOpen&&allDone?summary:''}</div>
  <button class="wt-adj" style="font-size:13px;padding:4px 7px;width:auto;height:auto;margin-left:4px;flex-shrink:0" onclick="event.stopPropagation();openExSwap('${le.id}',${ei},'${S.activeLog.date}','${S.activeLog.type}')">🔄</button>

function updSet(ei,si,field,val){
  if(!S.activeLog)return;
  const set=S.activeLog.exercises[ei]?.sets[si];
  if(!set)return;
  set[field]=val;
  _saveLog();
  debouncedSync();

function togSet(ei,si){
  if(!S.activeLog)return;
  if(guestLogBlock())return;
  const le=S.activeLog.exercises[ei];
  const set=le?.sets[si];if(!set)return;
  set.done=!set.done;
  _saveLog();
  if(set.done&&set.w&&set.r)checkPR(le.id,parseFloat(set.w),parseInt(set.r));
  debouncedSync();
  // patch DOM
  const row=document.getElementById(`sr${ei}_${si}`);
  const ck=document.getElementById(`ck${ei}_${si}`);
  if(row)row.className='set-row'+(set.done?' s-done':'');
  if(ck){ck.className='set-ck'+(set.done?' on':'');ck.textContent=set.done?'✓':'○';}
  const allDone=le.sets.every(s=>s.done);
  const doneSets=le.sets.filter(s=>s.done).length;
  const exEl=document.getElementById(`lex${ei}`);
  if(exEl)exEl.className='log-ex'+(allDone?' done-ex':'');
  const prog=document.getElementById('prog'+ei);
  if(prog){prog.textContent=allDone?'✓ Done':doneSets+'/'+le.sets.length;prog.className='log-ex-prog'+(allDone?' done':'');}
  // update compact summary in header
  if(allDone){
    const best=le.sets.filter(s=>s.done&&s.w).sort((a,b)=>parseFloat(b.w)-parseFloat(a.w))[0];
    const sumEl=document.getElementById('sum'+ei);
    if(sumEl&&best)sumEl.textContent=`${best.w}${unit()} × ${best.r}`;
    // Weekly target feedback — only fire when just completing (not un-completing)
    if(set.done&&best){
      const _aData=DB.get('weekly_advisor_'+fd(getMon(S.viewDate)),null);
      const _wt=findWeekTarget(EX[le.id]?.n||'',_aData?.targets||[]);
      if(_wt){
        const hitW=parseFloat(best.w)>=_wt.w,hitR=parseInt(best.r)>=_wt.r;
        if(hitW&&hitR)showToast('🎯 Target achieved!','var(--grn)');
        else if(hitW||hitR)showToast('💪 Close to your target — keep going','var(--amb)');
      }
    }
  }
  if(allDone&&set.done){
    setTimeout(()=>{
      const nextEi=ei+1;
      if(nextEi<S.activeLog.exercises.length&&!S.activeLog.exercises[nextEi].sets.every(s=>s.done))togLogEx(nextEi);
    },350);
    // End-of-week detection: fire when the entire workout is now complete
    if(S.activeLog.exercises.every(e=>e.sets.every(s=>s.done))){
      setTimeout(()=>checkWeekCompletion(),900);
    }
  }
}

function addSet(ei){
  if(!S.activeLog)return;

  const last=le.sets[le.sets.length-1]||{};

function checkPR(id,weight,reps){
  if(!weight||!reps)return;
  const prs=DB.get('prs',{});
  const cur=prs[id];
  // Assisted exercises (assisted pull-up/dip): the weight is ASSISTANCE, so
  // LESS weight = stronger. A PR is lower assist (at same/more reps) or same
  // assist with more reps. Inverted from normal exercises.
  const assist=EX[id]?.assist;
  const isBetter=!cur
    ?true
    :assist
      ?(weight<cur.w||(weight===cur.w&&reps>cur.r))
      :(weight>cur.w||(weight===cur.w&&reps>cur.r));
  if(isBetter){
    prs[id]={w:weight,r:reps,date:fd(new Date())};
    DB.set('prs',prs);
    prToast(EX[id]?.n||id);
  }
}

  t.classList.add('on');
  clearTimeout(t._tid);
  t._tid=setTimeout(()=>{t.classList.remove('on');},2800);
}

function adjW(ei,si,dir){
  if(!S.activeLog)return;
  const set=S.activeLog.exercises[ei]?.sets[si];if(!set)return;
  const step=DB.get('unit','kg')==='lb'?5:2.5;
  const cur=parseFloat(set.w)||0;
  const nw=Math.max(0,Math.round((cur+dir*step)*10)/10);
  set.w=nw%1===0?String(nw):nw.toFixed(1);
  set._edited=true;
  _saveLog();
  const inp=document.querySelector(`#sr${ei}_${si} .w-inp`);
  if(inp){inp.value=set.w;inp.classList.remove('prefilled','ai-fill');}
  debouncedSync();
}

function markEdited(ei,si,inp){
  if(!S.activeLog)return;
  const set=S.activeLog.exercises[ei]?.sets[si];if(!set)return;
  set._edited=true;
  inp.classList.remove('prefilled','ai-fill');
}

function completeWk(){
  if(!S.activeLog)return;
  S.activeLog.completed=true;
  _saveLog();
  const ids=S.activeLog.exercises.map(e=>e.id);
  const recent=DB.get('recent_ex',[]);
  DB.set('recent_ex',[...new Set([...ids,...recent])].slice(0,40));
  syncUp();
  // Done with this log session — clear it and return to the main week view
  // (previously went to the day-detail screen, which felt like a dead end).
  S.activeLog=null;S.activeLogKey=null;
  go('week',{_dir:'back'});
  showToast('✓ Workout logged','var(--grn)');
}

      <div style="font-size:24px;font-weight:800;margin-top:5px">${wpkg||'<span style="color:var(--t2);font-size:14px">—</span>'}</div>
      <div style="font-size:10px;color:var(--t2);margin-top:5px;line-height:1.3">${wpkg?_wkgLabel(wpkg,profile.gender)+`<br><span style="font-size:9px;opacity:.7">${ftp}W ÷ ${wDisp}</span>`:wt?`<span style="opacity:.7">Set FTP →</span>`:ftp?`<span style="opacity:.7">Log weight ↓</span>`:'—'}</div>

// Info sheet — plain-English explanation of the training-load metrics with
// the user's actual current numbers as concrete examples. Opens from the ⓘ
// button on the Fitness · Fatigue · Form panel.
function showFitnessInfo(){
  document.getElementById('fitness-info-sheet')?.remove();
  const curve=DB.get('bike_fitness_curve',null);
  const cur=curve?(curve[fd(new Date())]||curve[fd(addDays(new Date(),-1))]):null;

function _applyFtpEst(est){
  const profile=DB.get('user_profile',{})||{};
  profile.ftp=est;profile.ftp_source='estimated';
  DB.set('user_profile',profile);
  const rides=DB.get('strava_activities',[])||[];
  _annotateRideLoad(rides,est);
  DB.set('strava_activities',rides);
  const curve=computeFitnessCurve(rides);
  if(curve)DB.set('bike_fitness_curve',curve);
  syncUp();closeFtpEstSheet();render();
  showToast(`📊 FTP set to ${est}W (estimated)`,'var(--grn)');
}

function editFtp(){
  const cur=DB.get('user_profile',{})?.ftp||'';
  const v=prompt(`Your FTP (Functional Threshold Power) in watts.\n\nThe ~1hr max power you can sustain. Used to compute IF, TSS and the fitness curve.\n\nTypical: recreational 150-200W, trained 200-280W, strong 280-340W.`,cur);
  if(v===null)return;
  const n=parseInt(v,10);
  const profile=DB.get('user_profile',{})||{};
  if(!v.trim()){delete profile.ftp;delete profile.ftp_source;}
  else if(isNaN(n)||n<50||n>600){showToast('FTP must be 50-600W','var(--red)');return;}
  else{profile.ftp=n;profile.ftp_source='manual';}
  DB.set('user_profile',profile);
  // Recompute ride load + fitness curve with new FTP
  const rides=DB.get('strava_activities',[])||[];
  _annotateRideLoad(rides,profile.ftp);
  DB.set('strava_activities',rides);
  const curve=computeFitnessCurve(rides);
  if(curve)DB.set('bike_fitness_curve',curve);
  syncUp();render();
  showToast(profile.ftp?`FTP set to ${profile.ftp}W — load metrics recomputed`:'FTP cleared','var(--grn)');
}

// Weight conversion helpers. Storage is always in kg internally so W/kg math works.
// Display unit follows the same `unit` preference as gym weights ('lbs' or 'kg').
const _LB_PER_KG=2.20462262;
function _kgToLb(kg){return kg*_LB_PER_KG;}
function _lbToKg(lb){return lb/_LB_PER_KG;}
function bodyUnit(){return DB.get('unit','lbs')==='lbs'?'lb':'kg';}
// Parse a flexible weight input. Accepts:
//   "82.5" — interpreted as user's preferred unit
//   "82.5 kg", "82.5kg" — explicit kg
//   "180 lb", "180lbs", "180 pounds" — explicit lb
// Returns kg (number), or null on failure.
function _parseBodyWeight(input){
  if(!input||!input.trim())return null;
  const s=input.trim().toLowerCase();
  const n=parseFloat(s);
  if(isNaN(n))return null;
  if(/lb|pound/.test(s))return _lbToKg(n);
  if(/kg|kilo/.test(s))return n;
  // Bare number — use user's preference
  return bodyUnit()==='lb'?_lbToKg(n):n;
}
// Format a kg value for display in the user's preferred unit
function fmtBodyWt(kg,opts={}){
  const u=bodyUnit();
  const v=u==='lb'?_kgToLb(kg):kg;
  const dp=opts.dp==null?1:opts.dp;
  return v.toFixed(dp)+(opts.noUnit?'':' '+u);
}
// Format kg as "82.5 kg (182 lb)" — used in toasts to confirm conversions
function fmtBodyWtBoth(kg){
  return `${kg.toFixed(1)} kg (${_kgToLb(kg).toFixed(1)} lb)`;
}

// Inline conversion + unit-toggle handlers (kept global so onclick can reach them)
function _wtSetU(u){
  const sheet=document.getElementById('weight-sheet');if(!sheet)return;
  const oldU=sheet.dataset.unit;
  if(oldU===u)return;
  // Convert current input value to new unit so the user keeps the same actual weight
  const inp=document.getElementById('wt-input');
  const v=parseFloat(inp.value);
  if(!isNaN(v)){
    const newV=oldU==='lb'&&u==='kg'?_lbToKg(v):oldU==='kg'&&u==='lb'?_kgToLb(v):v;
    inp.value=newV.toFixed(1);
  }
  sheet.dataset.unit=u;
  // Update toggle button styles
  ['lb','kg'].forEach(x=>{
    const b=document.getElementById('wt-u-'+x);if(!b)return;
    const on=x===u;
    b.style.border='1.5px solid '+(on?'var(--acc)':'var(--bord)');
    b.style.background=on?'rgba(124,58,237,.14)':'var(--s2)';
    b.style.color=on?'var(--acc)':'var(--t2)';
  });
  _wtUpdate();
}
function _wtUpdate(){
  const sheet=document.getElementById('weight-sheet');if(!sheet)return;
  const u=sheet.dataset.unit;
  const v=parseFloat(document.getElementById('wt-input').value);
  const conv=document.getElementById('wt-conv');if(!conv)return;
  if(isNaN(v)||v<=0){conv.textContent='';return;}
  const other=u==='lb'?_lbToKg(v).toFixed(1)+' kg':_kgToLb(v).toFixed(1)+' lb';
  conv.innerHTML=`≈ <strong style="color:var(--al)">${other}</strong>`;
}
function _wtSave(mode){
  const sheet=document.getElementById('weight-sheet');if(!sheet)return;
  const profile=DB.get('user_profile',{})||{};
  // Clear operations: skip parsing
  if(mode==='clear-goal'){
    delete profile.weight_goal;DB.set('user_profile',profile);syncUp();render();closeWeightSheet();
    showToast('Goal cleared','var(--t2)');return;
  }
  if(mode==='clear-weight'){
    delete profile.weight;delete profile.weight_source;DB.set('user_profile',profile);syncUp();render();closeWeightSheet();
    showToast('Weight cleared','var(--grn)');return;
  }
  // Normal save: parse + validate
  const u=sheet.dataset.unit;
  const v=parseFloat(document.getElementById('wt-input').value);
  if(isNaN(v)||v<=0){
    const btn=document.getElementById('wt-save');btn.style.background='var(--red)';btn.textContent='Enter a number';
    setTimeout(()=>{btn.style.background='var(--acc)';btn.textContent=mode==='goal'?'Save goal':'Log weight';},1200);return;
  }
  const kg=u==='lb'?_lbToKg(v):v;
  if(kg<30||kg>200){
    const btn=document.getElementById('wt-save');btn.style.background='var(--red)';btn.textContent='Out of range';
    setTimeout(()=>{btn.style.background='var(--acc)';btn.textContent=mode==='goal'?'Save goal':'Log weight';},1200);return;
  }
  const rounded=+kg.toFixed(1);
  if(mode==='goal'){
    profile.weight_goal=rounded;
    DB.set('user_profile',profile);
    syncUp();render();closeWeightSheet();
    showToast(`🎯 Goal set to ${fmtBodyWtBoth(rounded)}`,'var(--grn)');
  }else{
    // Log mode: write to weight history at the selected date (defaults to today).
    // Only update profile.weight (the "current" used for W/kg) if the selected
    // date is today OR newer than any existing entry — backdated entries fill
    // gaps in history without overwriting your current weight.
    const dateInput=document.getElementById('wt-date');
    const selDate=(dateInput&&dateInput.value)||fd(new Date());
    const log=DB.get('weight_log',{})||{};
    log[selDate]=rounded;
    DB.set('weight_log',log);
    const allDates=Object.keys(log).sort();
    const latestDate=allDates[allDates.length-1];
    if(selDate===latestDate){
      profile.weight=rounded;
      profile.weight_source='manual';
      DB.set('user_profile',profile);
    }
    syncUp();render();closeWeightSheet();
    const isToday=selDate===fd(new Date());
    showToast(isToday?`✅ Logged ${fmtBodyWtBoth(rounded)}`:`✅ Backdated ${fmtBodyWtBoth(rounded)} to ${selDate}`,'var(--grn)');
  }
}

/* ── GYM PROGRESS: TONNAGE + 1RM ── */
// Scans both log_ and extralog_ keys for the last N days, returns flat list of
// {date, exId, exName, group, w, r} for every completed set.
function _scanGymSets(days){
  const today=new Date();
  const out=[];
  for(let i=0;i<days;i++){
    const ds=fd(addDays(today,-i));
    for(const k of ['log_'+ds,'extralog_'+ds]){
      const log=DB.get(k,null);
      if(!log||!log.exercises)continue;
      for(const le of log.exercises){
        const ex=EX[le.id];if(!ex)continue;
        const grp=_EX_GROUP[ex.g]||'Other';
        for(const s of(le.sets||[])){
          if(!s.done||!s.w||!s.r)continue;
          out.push({date:ds,exId:le.id,exName:ex.n,group:grp,w:+s.w,r:+s.r});
        }
      }
    }
  }
  return out;
}

// Epley estimated 1RM
function _e1rm(w,r){return r<=0?0:Math.round(w*(1+r/30));}

// ISO Monday-start week key, e.g. '2025-W12'. We use Mondays as week starts to
// match the rest of the app (DB.pk uses getMon).
function _weekKey(dateStr){
  const d=new Date(dateStr+'T12:00:00');
  const mon=getMon(d);
  return fd(mon);
}

/* ── WEEKLY TONNAGE CHART ── */
function rGymTonnage(){
  const sets=_scanGymSets(84); // 12 weeks
  if(!sets.length){
    return`<div style="margin-bottom:10px">

  No gym sets logged yet.<br><span style="font-size:11px">Complete a workout and the volume chart will start populating.</span>
</div></div>`;
  }
  // Bucket tonnage by week × group
  const groups=['Push','Pull','Legs','Core','Other'];
  const weeks={};
  for(const s of sets){
    const wk=_weekKey(s.date);
    if(!weeks[wk])weeks[wk]={Push:0,Pull:0,Legs:0,Core:0,Other:0,total:0};
    const t=s.w*s.r;
    weeks[wk][s.group]+=t;
    weeks[wk].total+=t;
  }
  // Last 12 weeks (most recent first becomes rightmost on chart)
  const today=new Date();
  const weekList=[];
  for(let i=11;i>=0;i--){
    const wk=fd(getMon(addDays(today,-i*7)));
    weekList.push({key:wk,data:weeks[wk]||{Push:0,Pull:0,Legs:0,Core:0,Other:0,total:0}});
  }
  const maxTotal=Math.max(...weekList.map(w=>w.data.total),1);
  // Compute current vs 4-week-ago, current vs 8-week-ago for trend
  const curW=weekList[weekList.length-1].data.total;
  const w4=weekList[weekList.length-5]?.data.total||0;
  const w8=weekList[weekList.length-9]?.data.total||0;
  // Recent 4-week avg vs prior 4-week avg
  const recent4=weekList.slice(-4).reduce((s,w)=>s+w.data.total,0)/4;
  const prior4=weekList.slice(-8,-4).reduce((s,w)=>s+w.data.total,0)/4;
  const trend4=prior4>0?((recent4-prior4)/prior4*100):0;
  const trendBadge=Math.abs(trend4)<5

      :`<span style="background:rgba(251,146,60,.12);color:var(--amb);font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px">↓ ${trend4.toFixed(0)}%</span>`;

  // Stacked bar chart
  const W=320,H=180,padL=44,padR=10,padT=8,padB=30;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const barW=plotW/12;
  // Y-axis ticks (4)
  const u=unit();
  const fmtK=v=>v>=1000?(v/1000).toFixed(1)+'k':Math.round(v);
  const gridLines=[0,0.33,0.66,1].map(t=>{
    const y=padT+plotH*(1-t);
    return`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--bord)" stroke-width="0.5" stroke-dasharray="2 3"/>
<text x="${padL-4}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--t2)">${fmtK(maxTotal*t)}</text>`;
  }).join('');

  const bars=weekList.map((w,wi)=>{
    const x=padL+wi*barW+barW*0.1;
    const bw=barW*0.8;
    let yBase=padT+plotH;
    const segs=[];
    for(const g of groups){
      const v=w.data[g];
      if(v<=0)continue;
      const h=(v/maxTotal)*plotH;
      yBase-=h;
      const color=_GROUP_META[g]?.color||'var(--t2)';
      segs.push(`<rect x="${x.toFixed(1)}" y="${yBase.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${color}" opacity="0.85"><title>${w.key} · ${g}: ${fmtK(v)} ${u}</title></rect>`);
    }

    const dateLabel=(wi%4===0||wi===11)?`<text x="${(x+bw/2).toFixed(1)}" y="${H-14}" text-anchor="middle" font-size="9" fill="var(--t2)">${w.key.slice(5)}</text>`:'';

    </div>
  </div>
  <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:190px;display:block">
    ${gridLines}
    ${bars}
    ${curLabel}
  </svg>
  ${legend}
  <div style="font-size:10px;color:var(--t2);margin-top:6px;text-align:center">12-week window · last bar = this week (in progress)</div>

/* ── PER-EXERCISE 1RM PROGRESSION ── */
function rExerciseProgress(){
  const sets=_scanGymSets(180);
  if(!sets.length)return''; // Tonnage panel already shows empty state
  // Per-exercise stats: frequency, latest date, best 1RM
  const byEx={};
  for(const s of sets){
    if(!byEx[s.exId])byEx[s.exId]={name:s.exName,group:s.group,sets:[],lastDate:s.date,best:0};
    byEx[s.exId].sets.push(s);
    if(s.date>byEx[s.exId].lastDate)byEx[s.exId].lastDate=s.date;
    const e1=_e1rm(s.w,s.r);
    if(e1>byEx[s.exId].best)byEx[s.exId].best=e1;
  }
  // Sort exercises: most-trained in last 30 days first, then by frequency
  const cutoff30=fd(addDays(new Date(),-30));
  const exList=Object.entries(byEx).map(([id,d])=>{
    const recent=d.sets.filter(s=>s.date>=cutoff30).length;
    return{id,name:d.name,group:d.group,recent,total:d.sets.length,lastDate:d.lastDate,best:d.best};
  }).sort((a,b)=>b.recent-a.recent||b.total-a.total);
  if(!exList.length)return'';

  // Selected exercise: stored pref, fall back to first
  let selId=DB.get('_gym_ex',null);
  if(!selId||!byEx[selId])selId=exList[0].id;
  const sel=byEx[selId];
  // Per-session: max 1RM across the day's sets
  const bySession={};
  for(const s of sel.sets){
    const e1=_e1rm(s.w,s.r);
    if(!bySession[s.date]||e1>bySession[s.date].e1rm){
      bySession[s.date]={e1rm:e1,w:s.w,r:s.r};
    }
  }
  const points=Object.entries(bySession).map(([date,v])=>({date,...v})).sort((a,b)=>a.date.localeCompare(b.date));

  // Dropdown — only show exercises with 2+ sessions for meaningful trend
  const dropdownItems=exList.filter(e=>{
    const sessions=new Set(byEx[e.id].sets.map(s=>s.date)).size;
    return sessions>=1;
  }).slice(0,40);
  const dropdown=`<select onchange="DB.set('_gym_ex',this.value);render()" style="background:var(--s2);border:1px solid var(--bord);border-radius:10px;color:var(--al);font-size:12px;font-weight:700;padding:7px 10px;cursor:pointer;font-family:inherit;max-width:180px">
    ${dropdownItems.map(e=>{
      const sessions=new Set(byEx[e.id].sets.map(s=>s.date)).size;
      return`<option value="${e.id}" ${e.id===selId?'selected':''}>${e.name} (${sessions})</option>`;
    }).join('')}
  </select>`;

  if(points.length<2){
    return`<div style="background:var(--s1);border:1px solid var(--bord);border-radius:14px;padding:14px 15px;margin-bottom:10px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <div>
      <div style="font-size:12px;font-weight:700;color:var(--al)">Estimated 1RM Progression</div>
      <div style="font-size:10px;color:var(--t2);margin-top:2px">Epley formula: weight × (1 + reps/30)</div>
    </div>
    ${dropdown}
  </div>
  <div style="font-size:12px;color:var(--t2);text-align:center;padding:24px 8px">Log this exercise on a second session to see the trend.</div>
</div>`;
  }

  // Chart dims
  const W=320,H=160,padL=36,padR=10,padT=14,padB=22;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const u=unit();
  const today=new Date();
  const startMs=addDays(today,-180).getTime();
  const ptsXY=points.map(p=>{
    const dayMs=new Date(p.date+'T12:00:00').getTime();
    return{...p,x:(dayMs-startMs)/86400000};
  }).filter(p=>p.x>=0);
  if(ptsXY.length<2)return'';
  let yMin=Math.min(...ptsXY.map(p=>p.e1rm));
  let yMax=Math.max(...ptsXY.map(p=>p.e1rm));
  if(yMin===yMax){yMin-=2;yMax+=2;}
  const yPad=(yMax-yMin)*0.15;
  yMin-=yPad;yMax+=yPad;
  if(yMin<0)yMin=0;
  const sx=x=>padL+(x/180)*plotW;
  const sy=y=>padT+plotH-((y-yMin)/(yMax-yMin))*plotH;

  // Linear regression line
  const reg=ptsXY.map(p=>({x:p.x,y:p.e1rm}));
  const slope=_regSlope(reg);
  const n=reg.length;
  const meanX=reg.reduce((s,p)=>s+p.x,0)/n;
  const meanY=reg.reduce((s,p)=>s+p.y,0)/n;
  const intercept=meanY-slope*meanX;
  const xLeft=Math.min(...reg.map(p=>p.x));
  const xRight=Math.max(...reg.map(p=>p.x));
  const yLeft=intercept+slope*xLeft;
  const yRight=intercept+slope*xRight;
  const regLine=`<line x1="${sx(xLeft).toFixed(1)}" y1="${sy(yLeft).toFixed(1)}" x2="${sx(xRight).toFixed(1)}" y2="${sy(yRight).toFixed(1)}" stroke="var(--acc)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>`;

  // Connect points with thin line
  const connectPath=ptsXY.map((p,i)=>`${i===0?'M':'L'}${sx(p.x).toFixed(1)},${sy(p.e1rm).toFixed(1)}`).join(' ');

  const gridLines=[0,0.33,0.66,1].map(t=>{
    const y=padT+plotH*(1-t);
    const label=Math.round(yMin+(yMax-yMin)*t);
    return`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--bord)" stroke-width="0.5" stroke-dasharray="2 3"/>
<text x="${padL-4}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--t2)">${label}</text>`;
  }).join('');
  const xMarks=[{d:180,l:'180d'},{d:120,l:'120d'},{d:60,l:'60d'},{d:0,l:'today'}].map(t=>{
    const x=sx(180-t.d);
    return`<text x="${x}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--t2)">${t.l}</text>`;
  }).join('');

  // Stats: best, current, slope
  const best=Math.max(...ptsXY.map(p=>p.e1rm));
  const cur=ptsXY[ptsXY.length-1].e1rm;
  const first=ptsXY[0].e1rm;
  const totalGain=cur-first;
  const pctGain=first>0?(totalGain/first*100):0;
  const slopePerMonth=slope*30;
  const slopeBadge=Math.abs(slopePerMonth)<0.5
    ?`<span style="background:var(--s2);color:var(--t2);font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px">→ PLATEAU</span>`
    :slopePerMonth>0
      ?`<span style="background:rgba(16,185,129,.15);color:var(--grn);font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px">↑ +${slopePerMonth.toFixed(1)}${u}/mo</span>`
      :`<span style="background:rgba(239,68,68,.12);color:var(--red);font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px">↓ ${slopePerMonth.toFixed(1)}${u}/mo</span>`;

  // Plateau detection: no new e1rm peak in 21+ days
  const peakIdx=ptsXY.reduce((bi,p,i)=>p.e1rm>=ptsXY[bi].e1rm?i:bi,0);
  const daysSincePeak=Math.round((Date.now()-new Date(ptsXY[peakIdx].date+'T12:00:00').getTime())/86400000);
  const plateauHint=daysSincePeak>=21&&ptsXY.length>=3
    ?`<div style="font-size:11px;color:var(--amb);margin-top:6px;text-align:center;line-height:1.4">⚠️ ${daysSincePeak} days since peak 1RM — consider a deload or rep-range switch</div>`
    :'';

  return`<div style="background:var(--s1);border:1px solid var(--bord);border-radius:14px;padding:14px 15px;margin-bottom:10px">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:10px">
    <div style="min-width:0;flex:1">
      <div style="font-size:12px;font-weight:700;color:var(--al)">Estimated 1RM Progression</div>
      <div style="font-size:10px;color:var(--t2);margin-top:2px">Epley: w × (1 + r/30) · peak set per session</div>
    </div>
    ${dropdown}
  </div>
  <div style="display:flex;gap:10px;margin-bottom:8px">
    <div style="flex:1;background:var(--s2);border-radius:10px;padding:8px;text-align:center">
      <div style="font-size:10px;color:var(--t2);font-weight:600">CURRENT</div>
      <div style="font-size:16px;font-weight:800;color:var(--al)">${cur}<span style="font-size:9px;color:var(--t2);font-weight:600"> ${u}</span></div>
    </div>
    <div style="flex:1;background:var(--s2);border-radius:10px;padding:8px;text-align:center">
      <div style="font-size:10px;color:var(--t2);font-weight:600">BEST</div>
      <div style="font-size:16px;font-weight:800;color:var(--acc)">${best}<span style="font-size:9px;color:var(--t2);font-weight:600"> ${u}</span></div>
    </div>
    <div style="flex:1;background:var(--s2);border-radius:10px;padding:8px;text-align:center">
      <div style="font-size:10px;color:var(--t2);font-weight:600">TREND</div>
      <div style="margin-top:2px">${slopeBadge}</div>
    </div>
  </div>
  <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:170px;display:block">
    ${gridLines}
    ${regLine}
    <path d="${connectPath}" stroke="var(--acc)" stroke-width="1" fill="none" opacity="0.35"/>
    ${ptsXY.map(p=>`<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.e1rm).toFixed(1)}" r="2.8" fill="var(--acc)" opacity="0.9"><title>${p.date} — ${p.w}${u}×${p.r} → ~${p.e1rm}${u} 1RM</title></circle>`).join('')}
    ${xMarks}
  </svg>
  <div style="font-size:11px;color:var(--t2);text-align:center;margin-top:6px">${ptsXY.length} sessions · total change <span style="color:${totalGain>0?'var(--grn)':totalGain<0?'var(--red)':'var(--t1)'};font-weight:700">${totalGain>0?'+':''}${totalGain}${u} (${pctGain>0?'+':''}${pctGain.toFixed(1)}%)</span></div>
  ${plateauHint}
</div>`;
}

/* ── BODY WEIGHT CHART ── */
// Renders a weigh-in chart with raw dots + 7-day rolling average. Trend rate
// (kg/week) computed via linear regression over the entire visible window.
// Always shows a "+ Log weight" button so the user can drop a weigh-in any time.
function rWeightChart(){
  const log=DB.get('weight_log',{})||{};
  const dates=Object.keys(log).sort();
  const profile=DB.get('user_profile',{})||{};
  const goal=profile.weight_goal||null;

  const logBtn=`<button onclick="logWeight()" style="background:var(--acc);border:none;border-radius:10px;color:#fff;font-size:12px;font-weight:700;padding:8px 14px;cursor:pointer">+ Log weight</button>`;
  const _u=bodyUnit();
  const _toU=kg=>_u==='lb'?_kgToLb(kg):kg; // kg → display units
  const goalBtn=`<button onclick="editWeightGoal()" style="background:var(--s2);border:1px solid var(--bord);border-radius:10px;color:var(--al);font-size:11px;font-weight:700;padding:8px 12px;cursor:pointer">🎯 ${goal?'Goal '+_toU(goal).toFixed(1)+_u:'Set goal'}</button>`;

  // Empty state
  if(!dates.length){
    return`<div style="margin-bottom:10px">
<div class="sec-hdr">⚖️ Body Weight</div>
<div style="background:var(--s1);border:1px solid var(--bord);border-radius:14px;padding:18px 15px;text-align:center">
  <div style="font-size:13px;color:var(--t2);margin-bottom:12px;line-height:1.5">No weigh-ins logged yet.<br><span style="font-size:11px">Drop a weigh-in and the chart will start tracking your progress.</span></div>
  <div style="display:flex;gap:8px;justify-content:center">${logBtn}${goalBtn}</div>
</div>
</div>`;
  }

  // Build points within 90-day window
  const today=new Date();
  const startMs=addDays(today,-90).getTime();
  const cutoff=fd(addDays(today,-90));
  const recent=dates.filter(d=>d>=cutoff);
  const all=dates.map(d=>{
    const dayMs=new Date(d+'T12:00:00').getTime();
    return{x:(dayMs-startMs)/86400000,y:log[d],date:d};
  });
  const pts=all.filter(p=>p.x>=0);

  // Current snapshot stats
  const cur=log[dates[dates.length-1]];
  const ptsAll=all.filter(p=>p.y!=null);
  const slope=_regSlope(pts.length>=2?pts:ptsAll); // kg per day
  const slopeWk=slope*7;
  // Display rate in user's preferred unit. Threshold for "stable" is 0.05 kg = 0.11 lb.
  const slopeWkDisp=_u==='lb'?_kgToLb(slopeWk):slopeWk;
  const slopeStr=Math.abs(slopeWk)<0.05?'→ stable':(slopeWk>0?'↑':'↓')+' '+Math.abs(slopeWkDisp).toFixed(2)+' '+_u+'/week';
  const trendColor=Math.abs(slopeWk)<0.05?'var(--t2)':(goal&&cur>goal?(slopeWk<0?'var(--grn)':'var(--red)'):goal&&cur<goal?(slopeWk>0?'var(--grn)':'var(--red)'):'var(--t1)');

  // Single weigh-in: skip the chart, show value + button
  if(pts.length<2){
    return`<div style="margin-bottom:10px">
<div class="sec-hdr">⚖️ Body Weight</div>
<div style="background:var(--s1);border:1px solid var(--bord);border-radius:14px;padding:14px 15px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div>
      <div style="font-size:22px;font-weight:800">${_toU(cur).toFixed(1)} <span style="font-size:12px;color:var(--t2);font-weight:600">${_u}</span></div>
      <div style="font-size:11px;color:var(--t2);margin-top:2px">${_u==='lb'?cur.toFixed(1)+' kg · ':''}Logged ${dates[dates.length-1]}</div>
    </div>
    <div style="display:flex;gap:6px">${logBtn}${goalBtn}</div>
  </div>
  <div style="font-size:11px;color:var(--t2);text-align:center;padding:8px 0">Log a second weigh-in to start tracking trend.</div>
</div>
</div>`;
  }

  // Chart dimensions
  const W=320,H=160,padL=36,padR=10,padT=10,padB=22;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  let yMin=Math.min(...pts.map(p=>p.y));
  let yMax=Math.max(...pts.map(p=>p.y));
  if(goal){yMin=Math.min(yMin,goal);yMax=Math.max(yMax,goal);}
  if(yMin===yMax){yMin-=1;yMax+=1;}
  const yPad=(yMax-yMin)*0.15;
  yMin-=yPad;yMax+=yPad;
  const sx=x=>padL+(x/90)*plotW;
  const sy=y=>padT+plotH-((y-yMin)/(yMax-yMin))*plotH;

  // 7-day rolling average — only meaningful when we have dense enough data
  const trendPts=pts.map(p=>{
    const win=pts.filter(q=>Math.abs(q.x-p.x)<=3.5);
    const avg=win.reduce((s,q)=>s+q.y,0)/win.length;
    return{x:p.x,y:avg};
  });
  const trendPath=trendPts.map((p,i)=>`${i===0?'M':'L'}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join(' ');

  // Horizontal gridlines (4 ticks) — labels in user's preferred unit
  const gridLines=[0,0.33,0.66,1].map(t=>{
    const y=padT+plotH*(1-t);
    const labelKg=yMin+(yMax-yMin)*t;
    const label=_toU(labelKg).toFixed(1);
    return`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--bord)" stroke-width="0.5" stroke-dasharray="2 3"/>
<text x="${padL-4}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--t2)">${label}</text>`;
  }).join('');
  const xMarks=[{d:90,l:'90d'},{d:60,l:'60d'},{d:30,l:'30d'},{d:0,l:'today'}].map(t=>{
    const x=sx(90-t.d);
    return`<text x="${x}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--t2)">${t.l}</text>`;
  }).join('');

  // Goal line (dashed amber, only if goal set + in visible range)
  const goalLine=goal?`<line x1="${padL}" y1="${sy(goal).toFixed(1)}" x2="${W-padR}" y2="${sy(goal).toFixed(1)}" stroke="var(--amb)" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7"/>
<text x="${W-padR-2}" y="${sy(goal).toFixed(1)-3}" text-anchor="end" font-size="9" fill="var(--amb)" font-weight="700">goal ${_toU(goal).toFixed(1)}${_u}</text>`:'';

  // Total change over window
  const first=pts[0].y;
  const last=pts[pts.length-1].y;
  const totalChange=last-first;
  const totalChangeDisp=_u==='lb'?_kgToLb(totalChange):totalChange;
  const pctChange=first>0?(totalChange/first*100):0;

  // Days to goal estimate
  let goalEta='';
  if(goal&&Math.abs(slopeWk)>0.05){
    const remaining=cur-goal;
    if((remaining>0&&slopeWk<0)||(remaining<0&&slopeWk>0)){
      const weeksToGoal=Math.abs(remaining/slopeWk);
      goalEta=`<div style="font-size:11px;color:var(--t2);text-align:center;margin-top:4px">At this rate: <span style="color:var(--al);font-weight:700">~${weeksToGoal.toFixed(0)} weeks</span> to reach goal</div>`;
    }
  }

  return`<div style="margin-bottom:10px">
<div class="sec-hdr" style="display:flex;justify-content:space-between;align-items:center">
  <span>⚖️ Body Weight</span>
  <span style="color:${trendColor};font-size:11px;font-weight:700">${slopeStr}</span>
</div>
<div style="background:var(--s1);border:1px solid var(--bord);border-radius:14px;padding:14px 15px">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
    <div>
      <div style="font-size:22px;font-weight:800;line-height:1">${_toU(cur).toFixed(1)} <span style="font-size:12px;color:var(--t2);font-weight:600">${_u}</span></div>
      <div style="font-size:11px;color:var(--t2);margin-top:3px">${_u==='lb'?cur.toFixed(1)+' kg · ':''}Logged ${dates[dates.length-1]}</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:11px;color:var(--t2)">90-day change</div>
      <div style="font-size:14px;font-weight:800;color:${totalChange<0?'var(--grn)':totalChange>0?(goal&&cur<goal?'var(--grn)':'var(--red)'):'var(--t2)'}">${totalChangeDisp>0?'+':''}${totalChangeDisp.toFixed(1)} ${_u} ${pctChange?`<span style="font-size:10px;color:var(--t2);font-weight:600">(${pctChange>0?'+':''}${pctChange.toFixed(1)}%)</span>`:''}</div>
    </div>
  </div>
  <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:170px;display:block">
    ${gridLines}
    ${goalLine}
    <path d="${trendPath}" stroke="var(--acc)" stroke-width="2" fill="none" opacity="0.7"/>
    ${pts.map(p=>`<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="2.6" fill="var(--acc)" opacity="0.85"><title>${p.date} — ${_toU(p.y).toFixed(1)} ${_u}</title></circle>`).join('')}
    ${xMarks}
  </svg>
  ${goalEta}
  <div style="display:flex;gap:8px;justify-content:center;margin-top:10px">${logBtn}${goalBtn}</div>
  <div style="font-size:10px;color:var(--t2);margin-top:6px;text-align:center">${pts.length} weigh-in${pts.length!==1?'s':''} · purple = 7-day rolling avg</div>
</div>
</div>`;
}

/* ── CYCLING PROGRESS CHART ── */
// Single SVG chart with a metric switcher. 90-day window, one dot per ride,
// smoothed 7-day rolling average line, smart default metric based on what data is
// present (EF if power+HR available, NP if power-only, HR otherwise). Trend badge
// in the header computed via linear regression slope across the window.
const CYCLE_METRICS={
  ef:{label:'Aerobic Efficiency',unit:'W/bpm',short:'Efficiency',
      get:a=>(a.average_watts&&a.average_heartrate)?+(a.average_watts/a.average_heartrate).toFixed(3):null,
      hint:'Watts produced per heartbeat. Rising = getting fitter at the same effort.',better:'up'},
  power:{label:'Avg Power',unit:'W',short:'Power',
      get:a=>a.average_watts?Math.round(a.average_watts):null,better:'up'},
  np:{label:'Normalized Power (effort-weighted)',unit:'W',short:'NP',
      get:a=>a.weighted_average_watts?Math.round(a.weighted_average_watts):null,
      hint:'Like average power, but penalizes hard surges — closer to how hard the ride felt.',better:'up'},
  hr:{label:'Avg Heart Rate',unit:'bpm',short:'HR',
      get:a=>a.average_heartrate?Math.round(a.average_heartrate):null,
      hint:'Falling at the same effort = improving fitness.',better:'down'},
  tss:{label:'Training Load per Ride',unit:'',short:'Load',
      get:a=>a._tss||null,
      hint:'How hard a ride was on your body. ~50=easy hour, ~100=hard hour at threshold, 150+=brutal.',better:'flat'},
  dist:{label:'Distance',unit:'km',short:'Distance',
      get:a=>a.distance?+(a.distance/1000).toFixed(1):null,better:'up'},
  suffer:{label:'Suffer Score (Strava)',unit:'',short:'Suffer',
      get:a=>a.suffer_score||null,
      hint:"Strava's heart-rate-based stress score for the ride.",better:'flat'}
};

function _pickChartDefault(rides){
  // Of last 30 days of rides, see which metrics have data and pick the most insightful
  const recent=rides.slice(-30);
  const hasEf=recent.filter(a=>a.average_watts&&a.average_heartrate).length;
  const hasPower=recent.filter(a=>a.average_watts).length;
  const hasHr=recent.filter(a=>a.average_heartrate).length;
  if(hasEf>=Math.max(3,recent.length*0.4))return'ef';
  if(hasPower>=Math.max(3,recent.length*0.4))return'np';
  if(hasHr>=3)return'hr';
  return'dist';
}

// Linear-regression slope over [{x, y}] points. Returns slope per day.
function _regSlope(pts){
  if(pts.length<2)return 0;
  const n=pts.length;
  const sx=pts.reduce((s,p)=>s+p.x,0);
  const sy=pts.reduce((s,p)=>s+p.y,0);
  const sxy=pts.reduce((s,p)=>s+p.x*p.y,0);
  const sxx=pts.reduce((s,p)=>s+p.x*p.x,0);
  const denom=n*sxx-sx*sx;
  return denom===0?0:(n*sxy-sx*sy)/denom;
}

function rCyclingChart(){
  const rides=DB.get('strava_activities',[])||[];
  if(!rides.length)return'';
  const cutoff=fd(addDays(new Date(),-90));
  const recent=rides
    .filter(a=>(a.start_date_local||'').slice(0,10)>=cutoff)
    .sort((a,b)=>(a.start_date_local||'').localeCompare(b.start_date_local||''));
  if(recent.length<2)return'';

  const sel=DB.get('_chart_metric',null)||_pickChartDefault(recent);
  const m=CYCLE_METRICS[sel]||CYCLE_METRICS.ef;
  const today=new Date();
  const startMs=addDays(today,-90).getTime();

  // Build data points: x = days-from-start (0..90), y = metric value
  const pts=recent.map(a=>{
    const ds=(a.start_date_local||'').slice(0,10);
    const v=m.get(a);
    if(v==null)return null;
    const dayMs=new Date(ds+'T12:00:00').getTime();
    return{x:(dayMs-startMs)/86400000,y:v,date:ds,name:a.name||''};
  }).filter(Boolean);

  // Switcher chips render regardless of whether selected metric has data
  const switcher=`<div style="display:flex;gap:5px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;-webkit-overflow-scrolling:touch">
    ${Object.entries(CYCLE_METRICS).map(([k,v])=>{
      const on=k===sel;
      return`<button onclick="DB.set('_chart_metric','${k}');render()" style="flex:0 0 auto;padding:6px 12px;border-radius:100px;border:1px solid ${on?'var(--acc)':'var(--bord)'};background:${on?'rgba(124,58,237,.14)':'var(--s2)'};color:${on?'var(--acc)':'var(--t2)'};font-size:11px;font-weight:${on?'800':'600'};cursor:pointer;white-space:nowrap">${v.short}</button>`;
    }).join('')}
  </div>`;

  if(pts.length<2){
    return`<div style="margin-bottom:10px">
<div style="font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.4px;margin:4px 4px 6px">📊 Progress chart</div>
<div style="background:var(--s1);border:1px solid var(--bord);border-radius:14px;padding:14px 15px">
  ${switcher}
  <div style="font-size:12px;color:var(--t2);text-align:center;padding:24px 8px">Not enough rides with ${m.label} data in the last 90 days.</div>
</div></div>`;
  }

  // Chart dimensions (viewBox space; SVG scales width:100%)
  const W=320,H=160,padL=36,padR=10,padT=10,padB=22;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const yVals=pts.map(p=>p.y);
  let yMin=Math.min(...yVals), yMax=Math.max(...yVals);
  if(yMin===yMax){yMin-=1;yMax+=1;}
  const yPad=(yMax-yMin)*0.12;
  yMin-=yPad;yMax+=yPad;
  if(['power','np','hr','tss','suffer','dist'].includes(sel)&&yMin<0)yMin=0;
  const sx=x=>padL+(x/90)*plotW;
  const sy=y=>padT+plotH-((y-yMin)/(yMax-yMin))*plotH;

  // 7-day rolling average — for each data point, average all points within ±3.5 days
  const trendPts=pts.map(p=>{
    const win=pts.filter(q=>Math.abs(q.x-p.x)<=3.5);
    const avg=win.reduce((s,q)=>s+q.y,0)/win.length;
    return{x:p.x,y:avg};
  });
  const trendPath=trendPts.map((p,i)=>`${i===0?'M':'L'}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join(' ');

  // Gridlines (4 horizontal)
  const gridLines=[0,0.33,0.66,1].map(t=>{
    const y=padT+plotH*(1-t);
    const label=(yMin+(yMax-yMin)*t);
    const fmt=sel==='ef'?label.toFixed(2):(sel==='dist'?label.toFixed(1):Math.round(label));
    return`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--bord)" stroke-width="0.5" stroke-dasharray="2 3"/>
<text x="${padL-4}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--t2)">${fmt}</text>`;
  }).join('');

  // X-axis: day markers at 90/60/30/today
  const xMarks=[{d:90,l:'90d'},{d:60,l:'60d'},{d:30,l:'30d'},{d:0,l:'today'}].map(t=>{
    const x=sx(90-t.d);
    return`<text x="${x}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--t2)">${t.l}</text>`;
  }).join('');

  // Trend slope → direction badge
  const slope=_regSlope(pts);
  const range=yMax-yMin;
  const slopeRel=range>0?slope*30/range:0; // change over 30 days as fraction of range
  let trendBadge='';
  const isUp=slopeRel>0.05, isDown=slopeRel<-0.05;
  if(m.better==='up'){
    if(isUp)trendBadge=`<span style="background:rgba(16,185,129,.15);color:var(--grn);font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px">↑ IMPROVING</span>`;
    else if(isDown)trendBadge=`<span style="background:rgba(239,68,68,.12);color:var(--red);font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px">↓ REGRESSING</span>`;
    else trendBadge=`<span style="background:var(--s2);color:var(--t2);font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px">→ STABLE</span>`;
  }else if(m.better==='down'){
    if(isDown)trendBadge=`<span style="background:rgba(16,185,129,.15);color:var(--grn);font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px">↓ IMPROVING</span>`;
    else if(isUp)trendBadge=`<span style="background:rgba(239,68,68,.12);color:var(--red);font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px">↑ REGRESSING</span>`;
    else trendBadge=`<span style="background:var(--s2);color:var(--t2);font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px">→ STABLE</span>`;
  }else{
    trendBadge=`<span style="background:var(--s2);color:var(--t2);font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px">${isUp?'↑':isDown?'↓':'→'} ${(slopeRel*100).toFixed(0)}%/mo</span>`;
  }

  // Compute first-half vs second-half averages for the value summary
  const sorted=[...pts].sort((a,b)=>a.x-b.x);
  const half=Math.floor(sorted.length/2);
  const firstAvg=sorted.slice(0,half).reduce((s,p)=>s+p.y,0)/Math.max(half,1);
  const lastAvg=sorted.slice(-half).reduce((s,p)=>s+p.y,0)/Math.max(half,1);
  const pctChange=firstAvg>0?((lastAvg-firstAvg)/firstAvg*100):0;
  const fmtVal=v=>sel==='ef'?v.toFixed(2):(sel==='dist'?v.toFixed(1):Math.round(v));
  const summary=`<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;font-size:11px">
    <div style="color:var(--t2)">First half avg: <span style="color:var(--t1);font-weight:700">${fmtVal(firstAvg)}${m.unit?' '+m.unit:''}</span></div>
    <div style="color:var(--t2)">Recent avg: <span style="color:var(--al);font-weight:800">${fmtVal(lastAvg)}${m.unit?' '+m.unit:''}</span> <span style="color:${pctChange>0?'var(--grn)':pctChange<0?'var(--red)':'var(--t2)'}">(${pctChange>0?'+':''}${pctChange.toFixed(1)}%)</span></div>
  </div>`;

  return`<div style="margin-bottom:10px">
<div style="display:flex;justify-content:space-between;align-items:center;margin:4px 4px 6px">
  <div style="font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.4px">📊 Progress chart</div>
  ${trendBadge}
</div>
<div style="background:var(--s1);border:1px solid var(--bord);border-radius:14px;padding:14px 15px">
