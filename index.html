  <div style="font-size:12px;font-weight:700;color:var(--al);margin-bottom:2px">${m.label}${m.unit?` <span style="font-size:10px;font-weight:500;color:var(--t2)">(${m.unit})</span>`:''}</div>
  ${m.hint?`<div style="font-size:10px;color:var(--t2);margin-bottom:6px">${m.hint}</div>`:''}
  <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:170px;display:block">
    ${gridLines}
    <path d="${trendPath}" stroke="var(--acc)" stroke-width="2" fill="none" opacity="0.55"/>
    ${pts.map(p=>`<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="2.6" fill="var(--acc)" opacity="0.85"><title>${p.date} — ${fmtVal(p.y)}${m.unit?' '+m.unit:''}${p.name?' · '+p.name.replace(/[<>"]/g,''):''}</title></circle>`).join('')}
    ${xMarks}
  </svg>
  ${summary}
  <div style="font-size:10px;color:var(--t2);margin-top:5px;text-align:center">${pts.length} ride${pts.length!==1?'s':''} · purple line = 7-day rolling average</div>
</div>
</div>`;
}

/* ── PERFORMANCE TRENDS ── */
function rPerfTrends(){
  const rides=DB.get('strava_activities',[])||[];
  if(!rides.length)return'';
  // Build 4-week buckets (Mon–Sun), most recent first
  const today=new Date();
  const weeks=[];
  for(let w=0;w<4;w++){
    const wMon=getMon(addDays(today,-w*7));
    const wSun=addDays(wMon,6);
    const wLabel=`${wMon.toLocaleDateString('en',{month:'short',day:'numeric'})}`;
    const wStart=fd(wMon);const wEnd=fd(wSun);
    // Strava rides in this week
    const wRides=rides.filter(a=>{
      const ds=(a.start_date_local||'').slice(0,10);
      return ds>=wStart&&ds<=wEnd;
    });
    let totalKm=0,totalKj=0,npSum=0,npCount=0,sufferSum=0,tssSum=0;
    for(const a of wRides){
      totalKm+=(a.distance||0)/1000;
      totalKj+=a.kilojoules||0;
      if(a.weighted_average_watts){npSum+=a.weighted_average_watts;npCount++;}
      sufferSum+=a.suffer_score||0;
      tssSum+=a._tss||0;
    }
    weeks.push({label:wLabel,km:+totalKm.toFixed(1),kj:Math.round(totalKj),np:npCount?Math.round(npSum/npCount):null,tss:Math.round(tssSum),sufferSum,rides:wRides.length});
  }
  // Trend arrows: compare week[0] (newest) vs week[3] (oldest)
  const _arr=(a,b,hi=true)=>{
    if(a==null||b==null||b===0)return'<span style="color:var(--t2)">—</span>';
    const pct=(a-b)/b*100;
    if(Math.abs(pct)<5)return'<span style="color:var(--t2);font-size:13px">→</span>';
    return pct>0
      ?`<span style="color:var(--grn);font-size:13px">↑</span>`
      :`<span style="color:${hi?'var(--red)':'var(--grn)'};font-size:13px">↓</span>`;
  };
  const newest=weeks[0],oldest=weeks[3]||weeks[weeks.length-1];
  // Overall trend chips — all cycling now (Gym chip moved to dedicated Gym Progress section)
  const trendChips=[
    {l:'Distance',v:_arr(newest.km,oldest.km,false)},
    {l:'Load (kJ)',v:_arr(newest.kj,oldest.kj,false)},
    {l:'Avg NP',v:newest.np&&oldest.np?_arr(newest.np,oldest.np,false):'<span style="color:var(--t2)">—</span>'},
    {l:'Rides',v:_arr(newest.rides,oldest.rides,false)},
  ];
  // Show TSS column only if there's any TSS data (requires FTP to compute)
  const hasTss=weeks.some(w=>w.tss>0);
  const cols=hasTss?'60px 1fr 1fr 1fr 1fr':'60px 1fr 1fr 1fr';
  const colStyle=`flex:1;min-width:0;background:var(--s2);border:1px solid var(--bord);border-radius:12px;padding:10px 8px;text-align:center`;
  return`<div style="margin-bottom:10px">
<div style="display:flex;justify-content:space-between;align-items:center;margin:4px 4px 6px">
  <div style="font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.4px">📈 Weekly summary</div>
  <div style="font-size:10px;color:var(--t2);font-weight:500">vs 4 weeks ago</div>
</div>
<div style="display:flex;gap:6px;margin-bottom:10px">
  ${trendChips.map(c=>`<div style="${colStyle}">
    <div style="font-size:18px;line-height:1">${c.v}</div>
    <div style="font-size:10px;color:var(--t2);margin-top:3px;font-weight:600;white-space:nowrap">${c.l}</div>
  </div>`).join('')}
</div>
<div style="background:var(--s1);border:1px solid var(--bord);border-radius:14px;overflow:hidden">
  <div style="display:grid;grid-template-columns:${cols};gap:0;font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--bord);background:var(--s2)">
    <div>Week</div><div style="text-align:right">Rides</div><div style="text-align:right">km</div><div style="text-align:right">kJ</div>${hasTss?'<div style="text-align:right">Load</div>':''}
  </div>
  ${weeks.map((w,wi)=>`<div style="display:grid;grid-template-columns:${cols};gap:0;padding:9px 10px;border-bottom:${wi<weeks.length-1?'1px solid var(--bord)':'none'};${wi===0?'font-weight:700;color:var(--al)':''}">
    <div style="font-size:11px">${w.label}</div>
    <div style="text-align:right;font-size:12px">${w.rides||'—'}</div>
    <div style="text-align:right;font-size:12px">${w.km||'—'}</div>
    <div style="text-align:right;font-size:12px">${w.kj?w.kj.toLocaleString():'—'}</div>
    ${hasTss?`<div style="text-align:right;font-size:12px">${w.tss||'—'}</div>`:''}
  </div>`).join('')}
</div>
</div>`;
}

  :history.map((log,hi)=>{
    if(log._strava){
      // Workout type badge
      const _wtMap={0:'',1:'Race',2:'Long',3:'Workout',11:'Virtual Race',12:'E-Bike Ride'};
      const wtLabel=_wtMap[log.wtype]||'';
      // Summary line: always-visible key metrics
      const _sumParts=[];
      if(log.dist)_sumParts.push(`${log.dist} km`);
      if(log.dur)_sumParts.push(`${log.dur} min`);
      if(log.elev)_sumParts.push(`↗ ${log.elev}m`);
      const summaryLine=_sumParts.join(' · ');
      // Secondary summary: TSS + power + HR condensed
      const _tssStr=log.tss?`📊 Load ${log.tss}${log.intf?` · Intensity ${log.intf}`:''}`:'';
      const _pow=log.np?`NP ${log.np}W`:(log.watts?`${log.watts}W avg`:'');
      const _hrt=log.hr?`❤️ ${log.hr}${log.maxhr?'/'+log.maxhr:''}`:'' ;
      const _kjStr=log.kj?`🔥 ${log.kj.toLocaleString()}kJ`:'';
      const _sec=[_tssStr,_pow,_hrt,_kjStr].filter(Boolean).join(' · ');
      // Expanded detail HTML
      const _detail=(()=>{
        const rows=[];
        // Power row
        if(log.watts||log.np||log.maxw||log.kj){
          const pParts=[];
          if(log.np&&log.watts)pParts.push(`⚡ NP <b>${log.np}W</b> · avg ${log.watts}W${!log.device_watts?' <span style="font-size:10px;color:var(--t2)">(est)</span>':''}` );
          else if(log.watts)pParts.push(`⚡ avg <b>${log.watts}W</b>${!log.device_watts?' <span style="font-size:10px;color:var(--t2)">(est)</span>':''}` );
          if(log.maxw)pParts.push(`max ${log.maxw}W`);
          if(log.kj)pParts.push(`🔥 ${log.kj.toLocaleString()} kJ`);
          if(pParts.length)rows.push(pParts.join(' · '));
        }
        // HR row
        if(log.hr||log.suffer){
          const hParts=[];
          if(log.hr)hParts.push(`❤️ avg <b>${log.hr} bpm</b>${log.maxhr?' · max '+log.maxhr+' bpm':''}`);
          if(log.suffer)hParts.push(`😰 suffer ${log.suffer}`);
          if(hParts.length)rows.push(hParts.join(' · '));
        }
        // Movement row
        if(log.speed||log.cad||log.elev){
          const mParts=[];
          if(log.speed)mParts.push(`🏎 ${log.speed} km/h`);
          if(log.cad)mParts.push(`🦵 ${log.cad} rpm`);
          if(log.elev)mParts.push(`↗ ${log.elev} m`);
          if(mParts.length)rows.push(mParts.join(' · '));
        }
        // Context row
        if(log.rpe||log.pr_count||log.elapsed){
          const cParts=[];
          if(log.elapsed&&log.dur&&log.elapsed>log.dur)cParts.push(`⏱ ${log.elapsed} min elapsed`);
          if(log.rpe)cParts.push(`RPE ${log.rpe}/10`);
          if(log.pr_count)cParts.push(`🏆 ${log.pr_count} PR${log.pr_count>1?'s':''}`);
          if(cParts.length)rows.push(cParts.join(' · '));
        }
        return rows.map(r=>`<div style="font-size:12px;color:var(--t2);margin-bottom:5px;line-height:1.5">${r}</div>`).join('');
      })();
      return`<div class="hist-row" onclick="togHist(${hi})">
  <div class="hist-date">${log.date} · 🟠 Strava${wtLabel?` · <span style="background:rgba(8,145,178,.15);color:#0891b2;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px">${wtLabel}</span>`:''}</div>
  <div class="hist-type" style="color:#0891b2">${_icon('ride-day.png','🚴',16)} ${log.name||'Ride'}</div>
  <div class="hist-exs">${summaryLine||'No data'}${_sec?`<br><span style="font-size:11px;color:var(--t2)">${_sec}</span>`:''}</div>
  <div class="hist-detail" id="hd${hi}">${_detail}</div>
</div>`;
    }
    const wi=WI[log.type]||WI.REST;
    const exsDone=log.exercises.filter(e=>e.sets.some(s=>s.done));
    const totalSets=log.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);
    const _zh=DB.get('lang','en')==='zh';
    return`<div class="hist-row" onclick="togHist(${hi})">
  <div class="hist-date">${log.date}${log.completed?' · ✓ '+_T('h_completed'):''}</div>
  <div class="hist-type" style="color:${wi.c}">${wi.i} ${typeof wi.l==='function'?wi.l():wi.l}</div>
  <div class="hist-exs">${exsDone.length} ${_T('h_exercises')} · ${totalSets} ${_T('h_sets_logged')}</div>
  <div class="hist-detail" id="hd${hi}">
    ${exsDone.map(le=>{
      const ex=EX[le.id];if(!ex)return'';
      const doneSets=le.sets.filter(s=>s.done);
      return`<div style="margin-bottom:8px"><div style="font-size:13px;font-weight:700;margin-bottom:3px">${ex.n}</div>${doneSets.map((s,i)=>`<div class="hist-set">${_zh?'第 '+(i+1)+' 組':'Set '+(i+1)}: ${s.w?s.w+unit():'—'} × ${s.r||'—'} ${_T('h_reps')}</div>`).join('')}</div>`;
    }).join('')}
  </div>
</div>`;}).join('')}

  const modal=document.createElement('div');
  modal.className='swap-modal';

<div class="swap-sheet">

  <button class="swap-cancel" onclick="closeSwap()">Cancel</button>

function closeSwap(){const m=document.getElementById('swap-modal');if(m)m.remove();}
function doSwap(ds,newType){
  const mon=getMon(new Date(ds+'T12:00:00'));
  const pk=DB.pk(mon);
  const plan=DB.get(pk,null);if(!plan)return;
  const di=plan.findIndex(d=>d.date===ds);if(di===-1)return;
  const oldType=plan[di].type;
  const gymTypes=['PUSH','PULL','LEGS','UPPER_PUMP'];
  const wasGym=gymTypes.includes(oldType);
  const goingToRest=newType==='REST';
  plan[di].type=newType;
  plan[di].exercises=gymTypes.includes(newType)?genSession(newType):null;
  // Gym day → REST: try to preserve the displaced workout. Two strategies:
  //  1. PREFERRED: place the displaced gym type into the next available REST
  //     day. This is non-destructive — no other workouts move or get dropped.
  //  2. FALLBACK: if no REST day available, shift everything forward (cascade).
  //     The LAST gym day's original type gets dropped (toast warns the user).
  if(wasGym&&goingToRest){
    const tl={PUSH:'Push',PULL:'Pull',LEGS:'Legs',UPPER_PUMP:'Upper Pump'};
    // Strategy 1: find the next REST day to put the displaced workout in
    const futureRest=plan.filter((d,i)=>i!==di&&d.date>ds&&d.type==='REST'&&!d.locked)
      .sort((a,b)=>a.date.localeCompare(b.date));
    if(futureRest.length>0){
      const target=futureRest[0];
      const pi=plan.findIndex(p=>p.date===target.date);
      plan[pi].type=oldType;
      plan[pi].exercises=genSession(oldType);
      DB.set(pk,plan);
      closeSwap();syncUp();render();
      showToast(`${tl[oldType]||oldType} moved to ${target.date.slice(5)}`,'var(--grn)');
      return;
    }
    // Strategy 2: fall back to cascade (might drop the last gym type)
    const futureGym=plan.filter((d,i)=>i!==di&&d.date>ds&&gymTypes.includes(d.type)&&!d.locked)
      .sort((a,b)=>a.date.localeCompare(b.date));
    if(futureGym.length>0){
      const cascadeTypes=[oldType,...futureGym.map(d=>d.type)];
      const droppedType=cascadeTypes[cascadeTypes.length-1]; // last one falls off the end
      futureGym.forEach((d,i)=>{
        const pi=plan.findIndex(p=>p.date===d.date);
        if(pi!==-1){plan[pi].type=cascadeTypes[i];plan[pi].exercises=genSession(cascadeTypes[i]);}
      });
      DB.set(pk,plan);
      closeSwap();syncUp();render();
      showToast(`Cascaded gym days forward — ${tl[droppedType]||droppedType} dropped (no slot available)`,'var(--amb)');
      return;
    }
  }
  DB.set(pk,plan);
  closeSwap();syncUp();render();
}

function addGymToRideDay(dateStr,gymType,shift){
  const pk=DB.pk(S.weekStart);
  const plan=DB.get(pk,null);
  if(!plan)return;
  const di=plan.findIndex(d=>d.date===dateStr);
  if(di<0)return;
  const gymTypes=['PUSH','PULL','LEGS','UPPER_PUMP'];
  // Attach the extra gym session to this ride day
  plan[di].extraGym={type:gymType,exercises:genSession(gymType)};
  if(shift){
    // Cascade: upcoming gym days shift one slot earlier
    // [Tue:PUSH, Wed:PULL, Thu:LEGS] → [Tue:PULL, Wed:LEGS, Thu:REST]
    const upcoming=plan
      .map((d,i)=>({d,i}))
      .filter(({d,i})=>i>di&&gymTypes.includes(d.type)&&!d.locked);
    for(let j=0;j<upcoming.length;j++){
      const idx=upcoming[j].i;
      if(j<upcoming.length-1){
        const nextType=upcoming[j+1].d.type;
        plan[idx].type=nextType;
        plan[idx].exercises=genSession(nextType);
      }else{
        plan[idx].type='REST';
        delete plan[idx].exercises;
      }
    }
  }else{
    // No cascade — fix any week-level duplicate types against the newly added extra
    // Find gym days that now share the same type as the extra (duplicates)
    const dups=plan
      .map((d,i)=>({d,i}))
      .filter(({d,i})=>i!==di&&gymTypes.includes(d.type)&&!d.locked&&d.type===gymType);
    for(const {i:dupIdx} of dups){
      // Types currently present in the week, excluding this duplicate slot
      const taken=[gymType,...plan
        .filter((d,pi)=>pi!==di&&pi!==dupIdx&&gymTypes.includes(d.type))
        .map(d=>d.type)];
      // Find a type that isn't covered yet
      const missing=gymTypes.find(t=>!taken.includes(t));
      if(missing){
        plan[dupIdx].type=missing;
        plan[dupIdx].exercises=genSession(missing);
      }
      // If all 4 types already present (5-session week edge case), leave it — can't avoid a duplicate
    }
  }
  DB.set(pk,plan);
  closeAddGymSheet();
  syncUp();
  render();
  showToast(_T('add_gym_toast'),'var(--grn)');
}

// Inverse of addGymToRideDay: a Strava ride was logged on a planned gym day,
// and the user wants to count today as the ride day. Replace today's plan type
// with a ride (matched to the actual ride: indoor vs outdoor, short vs long)
// and cascade the displaced gym work forward, shifting the last gym day to REST.
function replaceGymWithRide(dateStr){
  const pk=DB.pk(S.weekStart);
  const plan=DB.get(pk,null);
  if(!plan)return;
  const di=plan.findIndex(d=>d.date===dateStr);
  if(di<0)return;
  const a=stravaRideOnDate(dateStr);
  if(!a)return;
  const gymTypes=['PUSH','PULL','LEGS','UPPER_PUMP'];
  const displacedType=plan[di].type;
  if(!gymTypes.includes(displacedType))return;
  // Choose the ride plan type that fits the actual ride
  const isIndoor=(a.type==='VirtualRide'||a.sport_type==='VirtualRide');
  const isLong=(a.moving_time||0)>=60*60; // ≥1 hr
  const newType=isIndoor?(isLong?'LONG_INDOOR':'SHORT_INDOOR'):(isLong?'LONG_OUTDOOR':'SHORT_OUTDOOR');
  plan[di].type=newType;
  delete plan[di].exercises;
  delete plan[di].extraGym;
  // Cascade: shift displaced gym work forward. Insert displacedType at the
  // earliest available slot (REST or duplicate-of-displaced) AFTER di. If no
  // slot is available, find the next gym day and shift its type forward, etc.
  const gymTypesInWeek=plan.map((d,i)=>({d,i})).filter(({d,i})=>i>di&&gymTypes.includes(d.type)&&!d.locked);
  // Prepend the displaced type so it gets reassigned first
  const queue=[displacedType,...gymTypesInWeek.map(x=>x.d.type)];
  const slotIndices=[];
  // Slot candidates: REST days after di + the existing gym days (we'll overwrite their types in order)
  for(let i=di+1;i<plan.length;i++){
    if(plan[i].locked)continue;
    if(plan[i].type==='REST'||gymTypes.includes(plan[i].type))slotIndices.push(i);
  }
  // Take the first N slot indices to place the N items from queue
  // De-dup the queue: if displacedType already exists later in the week, drop one
  const seen=new Set();
  const dedup=queue.filter(t=>{if(seen.has(t))return false;seen.add(t);return true;});
  for(let j=0;j<slotIndices.length;j++){
    const idx=slotIndices[j];
    if(j<dedup.length){
      plan[idx].type=dedup[j];
      plan[idx].exercises=genSession(dedup[j]);
      delete plan[idx].extraGym;
    }else{
      // No more gym work to assign — leave as REST
      plan[idx].type='REST';
      delete plan[idx].exercises;
    }
  }
  DB.set(pk,plan);
  syncUp();
  go('week',{_dir:'back'});
  showToast(`🔄 ${displacedType.charAt(0)+displacedType.slice(1).toLowerCase()} cascaded forward — today is now a ride day`,'var(--grn)');
}

function getAlternatives(exId,type){
  const slots=SLOTS[type]||[];
  let slotAlts=[];
  for(const slot of slots){if(slot.includes(exId)){slotAlts=slot.filter(id=>id!==exId);break;}}
  const pk=DB.pk(S.weekStart);
  const plan=DB.get(pk,null);
  const ds=S.viewDate?fd(S.viewDate):null;
  const currentExs=plan?.find(d=>d.date===ds)?.exercises||[];
  const ex=EX[exId];
  // v2.79: only suggest exercises the user's selected gym actually has equipment
  // for. If filtering a section empties it (e.g. minimal home gym), fall back to
  // the unfiltered list so the user is never left with zero options.
  const avail=id=>exAvail(id);
  const slotAltsF=slotAlts.filter(avail); slotAlts=slotAltsF.length?slotAltsF:slotAlts;
  let sameGroup=Object.entries(EX)
    .filter(([id,e])=>id!==exId&&e.g===ex.g&&!currentExs.includes(id)&&!slotAlts.includes(id)&&exAvail(id))
    .map(([id])=>id);
  // broader same-category (adjacent muscle groups)
  let broader=Object.entries(EX)
    .filter(([id,e])=>id!==exId&&e.g!==ex.g&&!currentExs.includes(id)&&!slotAlts.includes(id)&&!sameGroup.includes(id)&&exAvail(id)&&ex.m.split(' · ').some(m=>e.m.includes(m.split(' ')[0])))
    .map(([id])=>id).slice(0,3);
  return{slotAlts,sameGroup,broader};
}

function filterSwap(exId,exIdx,ds,type,query){
  const q=query.trim().toLowerCase();
  const results=document.getElementById('swap-results');if(!results)return;
  if(!q){
    // restore suggestions
    const {slotAlts,sameGroup,broader}=getAlternatives(exId,type);
    function altBtn(id){const e=EX[id];if(!e)return'';
      return`<button class="swap-opt" onclick="doExSwap('${exId}',${exIdx},'${ds}','${type}','${id}')">${e.n}<span>${e.m} · ${e.t==='C'?'Compound':'Isolation'} · ${e.reps} reps · RPE ${e.rpe}</span></button>`;}
    function section(title,ids){return ids.length?`<div style="font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.8px;margin:10px 0 6px">${title}</div>${ids.map(altBtn).join('')}`:''}
    results.innerHTML=section('Same movement slot',slotAlts)+section('Same muscle group',sameGroup.slice(0,4))+section('Related muscles',broader);
    return;
  }
  const matches=Object.entries(EX).filter(([id,e])=>id!==exId&&(e.n.toLowerCase().includes(q)||e.m.toLowerCase().includes(q)||e.g.toLowerCase().includes(q)));
  if(!matches.length){results.innerHTML='<p style="color:var(--t2);font-size:13px;padding:10px 0">No exercises found.</p>';return;}
  results.innerHTML=`<div style="font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.8px;margin:10px 0 6px">Search results</div>`+
    matches.map(([id,e])=>`<button class="swap-opt" onclick="doExSwap('${exId}',${exIdx},'${ds}','${type}','${id}')">${e.n}<span>${e.m} · ${e.t==='C'?'Compound':'Isolation'} · ${e.reps} reps · RPE ${e.rpe}</span></button>`).join('');
}

function exLogAdd(ei){
  if(!S.activeLog)return;

function doExSwap(oldId,exIdx,ds,type,newId){
  // Update plan
  const mon=getMon(new Date(ds+'T12:00:00'));

  if(plan){
    const di=plan.findIndex(d=>d.date===ds);
    if(di!==-1&&plan[di].exercises){plan[di].exercises[exIdx]=newId;DB.set(pk,plan);}
  }
  // Update active log if we're currently logging this day
  if(S.activeLog&&S.activeLog.date===ds){

  closeExSwap();debouncedSync();render();
}

/* ── ENERGY ── */
function bindEnergy(){
  document.querySelectorAll('.ebtn').forEach(b=>{
    b.addEventListener('click',()=>{
      S.energy=b.dataset.e;
      document.querySelectorAll('.ebtn').forEach(x=>x.classList.toggle('sel',x.dataset.e===b.dataset.e));
      const pk=DB.pk(S.weekStart);
      const plan=DB.get(pk,null);
      const ds=S.viewDate?fd(S.viewDate):null;
      const dp=plan?.find(d=>d.date===ds);
      const isRide=dp&&['LONG_OUTDOOR','SHORT_OUTDOOR','LONG_INDOOR','SHORT_INDOOR'].includes(dp.type);
      const isGym=dp&&['PUSH','PULL','LEGS','UPPER_PUMP'].includes(dp.type);
      const ct=isRide?'ride':isGym?'gym':'rest';
      // Update coach message — show default immediately, upgrade to AI quietly
      const card=document.getElementById('coach-card');
      if(card){
        const p=card.querySelector('p');
        const defaultMsg=COACH[b.dataset.e][ct];
        p.style.transition='';p.style.opacity='1';
        p.textContent=defaultMsg;
        card.classList.add('on');
        getAICoach(b.dataset.e,ct,dp).then(msg=>{
          const c2=document.getElementById('coach-card');
          if(c2&&msg&&msg!==defaultMsg){
            const p2=c2.querySelector('p');
            p2.style.transition='opacity .35s ease';
            p2.style.opacity='0';
            setTimeout(()=>{p2.textContent=msg;p2.style.opacity='1';},350);
          }
          // Show quota note if AI hit its daily limit
          if(c2&&_aiQuotaHit){
            let note=c2.querySelector('.quota-note');
            if(!note){note=document.createElement('div');note.className='quota-note';note.style.cssText='font-size:10px;color:var(--t2);margin-top:7px;opacity:.7';c2.appendChild(note);}
            note.textContent='⏳ AI quota used up — showing default tips. Resets at midnight.';
          }
        });
      }
      // Swap exercises based on energy — gym days only
      if(isGym&&dp&&ds){
        if(!S.baseExercises)S.baseExercises=[...dp.exercises];
        const newExs=applyEnergySwap(S.baseExercises,b.dataset.e);
        const di=plan.findIndex(d=>d.date===ds);
        if(di!==-1){plan[di].exercises=newExs;DB.set(pk,plan);}
        render();
      }
    });
  });
}

/* ── CSV EXPORT — human-readable training records ── */
function exportCSV(){
  const u=unit();
  const cell=v=>{v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const rows=[['Date','Type','Exercise','Set','Weight ('+u+')','Reps','Notes']];
  const keys=[];
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('log_'))keys.push(k);}
  keys.sort();
  keys.forEach(k=>{
    const log=DB.get(k,null);if(!log)return;
    const date=k.slice(4);
    (log.exercises||[]).forEach(e=>{
      const ex=EX[e.id];const name=ex?ex.n:e.id;
      (e.sets||[]).filter(s=>s.done).forEach((s,i)=>{
        rows.push([date,'Workout',name,i+1,s.w||'',s.r||'','']);
      });
    });
    if(log.ride&&log.ride.dur!=null){
      const r=log.ride;
      const notes=[r.hr!=null?r.hr+' bpm':'',r.rpe!=null?'RPE '+r.rpe:'',r.notes||''].filter(Boolean).join(' · ');
      rows.push([date,'Ride','Cycling','',r.dist!=null?r.dist+' km':'',r.dur+' min',notes]);
    }
  });
  const prs=DB.get('prs',{});
  Object.entries(prs).forEach(([id,p])=>{
    const ex=EX[id];const name=ex?ex.n:id;
    rows.push([p.date||'','Personal Record',name,'',p.w||'',p.r||'','All-time best']);
  });
  const csv=rows.map(r=>r.map(cell).join(',')).join('\r\n');
  // BOM so Excel reads UTF-8 (Chinese exercise names) correctly
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`training-brain-${fd(new Date())}.csv`;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
}

function importData(){
  const input=document.createElement('input');
  input.type='file';input.accept='.json,.csv';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const isCSV=/\.csv$/i.test(file.name);
    const reader=new FileReader();
    reader.onload=ev=>{
      if(isCSV){importCSV(ev.target.result);return;}
      try{
        const data=JSON.parse(ev.target.result);
        let count=0;
        Object.entries(data).forEach(([k,v])=>{if(!k.startsWith('_')){DB.set(k,v);count++;}});
        syncUp();
        alert(`✅ Restored ${count} records successfully!`);
        render();
      }catch{alert('❌ Could not read file — make sure it\'s a Training Brain backup (.json) or export (.csv).');}
    };
    reader.readAsText(file);
  };
  input.click();
}

/* ── CSV PARSING + IMPORT ── */
function parseCSV(text){
  const rows=[];let row=[],field='',inQ=false;
  text=String(text).replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else inQ=false;}
      else field+=c;
    }else{
      if(c==='"')inQ=true;
      else if(c===','){row.push(field);field='';}
      else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
      else if(c==='\r'){/* skip */}
      else field+=c;
    }
  }
  if(field!==''||row.length){row.push(field);rows.push(row);}
  return rows;
}

function importCSV(text){
  let rows;
  try{rows=parseCSV(text);}catch{rows=null;}
  if(!rows||rows.length<2){alert('❌ Could not read CSV — it looks empty or malformed.');return;}
  // Build exercise name → id lookup (English, Chinese, and current display names)
  const nameToId={};
  Object.keys(EX).forEach(id=>{
    [EX_EN_NAMES[id],(typeof EX_ZH!=='undefined'?EX_ZH[id]:null),EX[id].n].forEach(nm=>{
      if(nm)nameToId[String(nm).trim().toLowerCase()]=id;
    });
  });
  const findId=nm=>nameToId[String(nm||'').trim().toLowerCase()]||null;
  const logs={}; // date → {exMap:{}, ride:null}
  const prs=DB.get('prs',{});
  let workoutRows=0,rideRows=0,prRows=0,skipped=0;
  rows.slice(1).forEach(r=>{
    if(!r||r.length<3)return;
    const date=(r[0]||'').trim(),type=(r[1]||'').trim(),exercise=r[2]||'',weight=(r[4]||'').trim(),reps=(r[5]||'').trim(),notes=r[6]||'';
    if(!date)return;
    if(type==='Workout'){
      const id=findId(exercise);
      if(!id){skipped++;return;}
      logs[date]=logs[date]||{exMap:{},ride:null};
      logs[date].exMap[id]=logs[date].exMap[id]||{id,sets:[]};
      logs[date].exMap[id].sets.push({w:weight,r:reps,done:true});
      workoutRows++;
    }else if(type==='Ride'){
      const dist=parseFloat(weight),dur=parseFloat(reps);
      let hr=null,rpe=null,note='';
      String(notes).split(' · ').forEach(tok=>{
        tok=tok.trim();if(!tok)return;
        if(/bpm$/i.test(tok))hr=parseFloat(tok);
        else if(/^rpe/i.test(tok))rpe=parseFloat(tok.replace(/rpe/i,''));
        else note=note?note+' · '+tok:tok;
      });
      logs[date]=logs[date]||{exMap:{},ride:null};
      logs[date].ride={dur:isNaN(dur)?null:dur,dist:isNaN(dist)?null:dist,hr:isNaN(hr)?null:hr,rpe:isNaN(rpe)?null:rpe,notes:note,logged:new Date().toISOString()};
      rideRows++;
    }else if(type==='Personal Record'){
      const id=findId(exercise);
      if(!id){skipped++;return;}
      prs[id]={w:parseFloat(weight)||weight,r:isNaN(+reps)?reps:+reps,date};
      prRows++;
    }
  });
  if(!workoutRows&&!rideRows&&!prRows){
    alert('❌ No recognisable rows found. Make sure this is a Training Brain CSV export.');
    return;
  }
  // Merge into storage — preserve any field the CSV does not carry
  Object.keys(logs).forEach(date=>{
    const k='log_'+date;
    const existing=DB.get(k,null)||{};
    const exList=Object.values(logs[date].exMap);
    if(exList.length)existing.exercises=exList;
    if(logs[date].ride)existing.ride=logs[date].ride;
    DB.set(k,existing);
  });
  DB.set('prs',prs);
  syncUp();
  render();
  alert(`✅ Imported ${workoutRows} workout sets, ${rideRows} rides and ${prRows} PRs across ${Object.keys(logs).length} day(s).`+(skipped?`\n⚠️ ${skipped} row(s) skipped — exercise name not recognised.`:''));
}

/* ── GENERATE PLAN ── */
function genPlan(){
  // Re-show the catch-up banner after a regenerate so the user can see what the
  // new plan accounted for (v2.81).
  DB.set('catchup_dismissed_'+fd(S.weekStart),false);
  const bikePref=DB.get('bike_pref','weather');
  if(bikePref!=='weather'){
    // No location needed — build plan directly with placeholder weather data
    const wdays=Array.from({length:7},(_,i)=>({
      date:fd(addDays(S.weekStart,i)),tmax:15,tmin:5,rain:0,wind:10,code:1,score:0
    }));
    const plan=buildWeek(wdays);
    DB.set(DB.pk(S.weekStart),plan);
    render();
    return;
  }
  const btn=document.querySelector('.btn-p,.btn-s');
  if(btn){btn.textContent='📡 Fetching weather…';btn.disabled=true;}
  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      const wdays=await fetchWeather(pos.coords.latitude,pos.coords.longitude,fd(S.weekStart),true);
      const plan=buildWeek(wdays);
      DB.set(DB.pk(S.weekStart),plan);
      render();
    }catch(e){alert('Could not fetch weather. Check your connection.');render();}
  },()=>{alert('Location access is needed to fetch your local weather forecast.');render();});
}

function shiftWeek(dir){S.weekStart=addDays(S.weekStart,dir*7);S.energy=null;render();}

function toggleHomeDay(dateStr){
  const key='home_day_'+dateStr;
  const on=!DB.get(key,false);
  DB.set(key,on);
  // Re-generate exercises for just this day immediately
  const pk=DB.pk(S.weekStart);
  const plan=DB.get(pk,null);
  if(plan){
    const dp=plan.find(d=>d.date===dateStr);
    const GYM_SEQ=['PUSH','PULL','LEGS','UPPER_PUMP'];
    if(dp&&GYM_SEQ.includes(dp.type)){
      dp.exercises=genSession(dp.type,'okay',on);
      DB.set(pk,plan);
    }

  render();
  if(on)showToast('🏠 Switched to bodyweight exercises','var(--acc)');

}

/* ── INIT ── */
function init(){
  // Restore Firebase user from localStorage cache
  const cached=DB.get('fb_user',null);
  if(cached){
    S.fbUser=cached;
    initFirebase();
    // Auto-unlock immediately if no PIN — avoids sign-in prompt on every PWA open
    if(!DB.get('pin',null))S.authed=true;
  }
  const today=new Date();
  S.weekStart=getMon(today);
  // Handle Strava OAuth callback (?code=... in URL after redirect)
  const _qp=new URLSearchParams(window.location.search);
  const _stravaCode=_qp.get('code');
  if(_stravaCode&&!_qp.get('error')){
    S.authed=true; // auto-unlock so user lands on the app
    stravaExchangeCode(_stravaCode);
  }
  render();
  loadGifDb();
  // Backfill IF/TSS + fitness curve for existing rides. Also auto-estimate FTP if not
  // set yet — handles users upgrading from older versions who don't trigger a fresh sync.
  {
    const _existingRides=DB.get('strava_activities',[])||[];
    if(_existingRides.length){
      _maybeAutoEstimateFtp(_existingRides);
      const _ftp=DB.get('user_profile',{})?.ftp;
      if(_ftp&&!DB.get('bike_fitness_curve',null)){
        _annotateRideLoad(_existingRides,_ftp);
        DB.set('strava_activities',_existingRides);
        const _c=computeFitnessCurve(_existingRides);
        if(_c)DB.set('bike_fitness_curve',_c);
      }
    }
  }
  // Auto-sync Strava if connected and last sync was >1 hour ago
  const _stravaTok=DB.get('strava_token',null);
  if(_stravaTok&&!_stravaCode){
    const _lastSync=DB.get('strava_last_sync',null);
    const _hourAgo=Date.now()-60*60*1000;
    if(!_lastSync||new Date(_lastSync).getTime()<_hourAgo){
      stravaFetchActivities();
    }
  }
  // Register service worker for cache-first loading (instant on return visits)
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/training-brain/sw.js')
      .catch(e=>console.warn('SW register failed:',e));
    // The SW serves the shell from cache instantly, then revalidates in the
    // background. When it detects a newer deploy it pings us — offer a reload.
    navigator.serviceWorker.addEventListener('message',ev=>{
      if(ev.data&&ev.data.type==='tb-shell-updated')showUpdateToast();
    });
  }
}

// ── SWIPE-BACK GESTURE (interactive finger-follow, Safari-style) ──
// Performance notes:
//   • rWeek() + DOM injection happens at touchSTART (before movement) — no jank on first drag frame
//   • DOM refs are cached in _sb — no querySelector on every move event
//   • No CSS transition on the behind layer — parallax is direct style assignment, 60fps
//   • Non-passive scroll blocker added only while actively tracking, removed immediately on end
let _sb=null;
let _sbScrollBlock=null;
function _sbScreenSupportsBack(){return S.screen==='day'||S.screen==='log';}

function _sbOnStart(e){
  if(!_sbScreenSupportsBack())return;
  if(document.querySelector('.swap-ov'))return;
  const t=e.touches?e.touches[0]:e;
  if(!t)return;
  const sEl=document.querySelector('#app > .screen');
  if(!sEl)return;
  // Pre-build the behind layer NOW at touchstart so there is zero DOM work on the first move frame
  let behindEl=document.getElementById('_sb_behind');
  if(!behindEl){
    const savedScreen=S.screen;
    S.screen='week';
    const weekHtml=rWeek();
    S.screen=savedScreen;
    behindEl=document.createElement('div');
    behindEl.id='_sb_behind';
    // No CSS transition — direct style writes on every frame keep it at 60fps
    behindEl.style.cssText='position:fixed;inset:0;overflow:hidden;pointer-events:none;opacity:0;transform:scale(0.95);transform-origin:center';
    behindEl.innerHTML=weekHtml;
    document.getElementById('app').insertBefore(behindEl,sEl);
  }
  _sb={startX:t.clientX,startY:t.clientY,lastX:t.clientX,lastTs:Date.now(),
       vX:0,tracking:false,cancelled:false,sEl,behindEl};
}

function _sbOnMove(e){
  if(!_sb||_sb.cancelled)return;
  const t=e.touches?e.touches[0]:e;
  if(!t)return;
  const now=Date.now();
  const dt=now-_sb.lastTs;
  if(dt>0){
    const inst=(t.clientX-_sb.lastX)/dt;
    _sb.vX=_sb.vX*0.6+inst*0.4;
  }
  _sb.lastX=t.clientX;_sb.lastTs=now;
  const dx=t.clientX-_sb.startX;
  const dy=t.clientY-_sb.startY;
  // Directional lock — cancel if clearly scrolling vertically
  if(!_sb.tracking&&Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){
    _sb.cancelled=true;
    if(_sbScrollBlock){window.removeEventListener('touchmove',_sbScrollBlock,{capture:true});_sbScrollBlock=null;}
    if(_sb.behindEl)_sb.behindEl.remove();
    return;
  }
  // Start tracking once we see clear rightward intent
  if(!_sb.tracking&&dx>10){
    _sb.tracking=true;
    if(!_sbScrollBlock){
      _sbScrollBlock=(ev)=>{if(_sb&&_sb.tracking)ev.preventDefault();};
      window.addEventListener('touchmove',_sbScrollBlock,{passive:false,capture:true});
    }
  }
  if(!_sb.tracking)return;
  const clampedDx=Math.max(0,dx);
  // Move screen with finger — use cached ref, no querySelector
  const sh=(Math.min(0.32,clampedDx/220)).toFixed(2);
  _sb.sEl.style.transform=`translateX(${clampedDx}px)`;
  _sb.sEl.style.boxShadow=`-8px 0 28px rgba(0,0,0,${sh})`;
  // Parallax: behind layer scales 0.95→1 and brightens 0→1 as you drag
  const prog=Math.min(1,clampedDx/(window.innerWidth*0.4));
  _sb.behindEl.style.transform=`scale(${(0.95+0.05*prog).toFixed(3)})`;
  _sb.behindEl.style.opacity=(prog).toFixed(3);
}

function _sbOnEnd(){
  if(!_sb)return;
  const sb=_sb;_sb=null;
  if(_sbScrollBlock){window.removeEventListener('touchmove',_sbScrollBlock,{capture:true});_sbScrollBlock=null;}
  const removeBehind=()=>{if(sb.behindEl)sb.behindEl.remove();};
  if(!sb.tracking){removeBehind();sb.sEl.style.transform='';sb.sEl.style.boxShadow='';return;}
  const dx=sb.lastX-sb.startX;
  const sw=window.innerWidth;
  const commit=(sb.vX>0.65&&dx>80)||(dx>sw*0.4);
  const sEl=sb.sEl;
  if(commit){
    sEl.getBoundingClientRect();
    sEl.style.transition='transform 0.32s cubic-bezier(.32,.72,0,1),box-shadow 0.32s linear';
    requestAnimationFrame(()=>{
      sEl.style.transform=`translateX(${sw+40}px)`;
      sEl.style.boxShadow='none';
    });
    let done=false;
    const finish=()=>{if(done)return;done=true;removeBehind();go('week',{_noAnim:true});};
    sEl.addEventListener('transitionend',finish,{once:true});
    setTimeout(finish,450);
  }else{
    sEl.getBoundingClientRect();
    sEl.style.transition='transform 0.3s cubic-bezier(.32,.72,0,1),box-shadow 0.3s linear';
    requestAnimationFrame(()=>{sEl.style.transform='translateX(0)';sEl.style.boxShadow='';});
    const cleanup=()=>{sEl.style.transition='';sEl.style.transform='';sEl.style.boxShadow='';removeBehind();};
    sEl.addEventListener('transitionend',cleanup,{once:true});
    setTimeout(cleanup,400);
  }
}

window.addEventListener('touchstart',_sbOnStart,{passive:true,capture:true});
window.addEventListener('touchmove',_sbOnMove,{passive:true,capture:true});
window.addEventListener('touchend',_sbOnEnd,{passive:true,capture:true});
window.addEventListener('touchcancel',_sbOnEnd,{passive:true,capture:true});

// ── AUTO-SYNC ORCHESTRATION ────────────────────────────────────────────────
// Three independent mechanisms, layered so the user never has to think about sync:
//   1. Real-time listener (startSyncListener) — instant when active, fragile on mobile
//   2. Visibility change — fires when PWA comes back to foreground
//   3. Polling (this section) — safety net for missed real-time events
//
// Each pull only re-renders if the remote 'updated' timestamp is actually newer than
// what we last pulled. Avoids unnecessary work and prevents flickers.

let _lastVisibilitySync=0;
async function _autoPullIfNewer(reason){
  if(!S.fbUser||!_fbDb||S.guest)return false;
  try{
    const snap=await _fbDb.ref('users/'+S.fbUser.uid+'/updated').once('value');
    const remoteUpdated=snap.val();
    if(!remoteUpdated)return false;
    if(remoteUpdated===_myLastSaveTs)return false; // our own save echo
    const lastPullRemote=DB.get('fb_last_pull_remote_ts','');
    if(remoteUpdated===lastPullRemote)return false; // already have this version
    await loadFromCloud();
    render();
    console.log('[auto-sync] pulled fresh data via',reason,'remote_ts=',remoteUpdated);
    return true;
  }catch(e){console.warn('[auto-sync] check failed',reason,e);return false;}
}

// Foreground refresh — covers PWA backgrounding (iOS suspends WebSockets when hidden)
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  const now=Date.now();
  if(now-_lastVisibilitySync<10000)return; // 10s debounce
  _lastVisibilitySync=now;
  _autoPullIfNewer('visibilitychange');
});

// Polling safety net — every 60s while visible, lightweight read of just the updated
// timestamp. Only triggers a full pull if the timestamp differs from what we last saw.
setInterval(()=>{
  if(document.visibilityState!=='visible')return;
  _autoPullIfNewer('poll');
},60000);

// Also pull when the network comes back online (e.g. phone leaves elevator/tunnel)
window.addEventListener('online',()=>{_autoPullIfNewer('online');});

// Firebase scripts are deferred — DOMContentLoaded fires after them, so init() is safe here
document.addEventListener('DOMContentLoaded', init);
