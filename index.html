  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

  <!-- Open Graph / Social link previews -->
  <meta property="og:type" content="website">

  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:description" content="AI-powered training companion. Plan your gym workouts, cycling rides, and track your progress — all in one place.">
  <meta name="twitter:image" content="https://nipshardaf.github.io/training-brain/og-image.png">
  <!-- PWA / Home screen icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Training%20Brain%22%2C%22short_name%22%3A%22Training%20Brain%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2309090f%22%2C%22theme_color%22%3A%22%2309090f%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22apple-touch-icon.png%22%2C%22sizes%22%3A%22180x180%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
  <title>Training Brain</title>
  <script defer src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
<style>
*,::before,::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#09090f;--s1:#111119;--s2:#18182a;--s3:#252540;
  --bord:rgba(120,80,255,.18);--acc:#7c3aed;--al:#a78bfa;
  --grn:#10b981;--amb:#f59e0b;--red:#ef4444;--blu:#3b82f6;
  --txt:#f1f5f9;--t2:#8892a4;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#f5f4ff;--s1:#ffffff;--s2:#ede9ff;--s3:#ddd5ff;
    --bord:rgba(120,80,255,.18);--acc:#7c3aed;--al:#6d28d9;
    --txt:#111827;--t2:#6b7280;
  }
  .bnav{background:rgba(245,244,255,.93)!important}
  .ex-banner{background:linear-gradient(to bottom,rgba(0,0,0,.75) 0%,transparent 100%)!important}
  .set-inp{background:var(--s2)!important;color:var(--txt)!important}
  .np-btn{background:var(--s2)!important;border-color:var(--bord)!important}
  .swap-ov{background:rgba(0,0,0,.35)!important}
}
html{height:-webkit-fill-available}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;min-height:100vh;min-height:-webkit-fill-available;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.screen{max-width:430px;margin:0 auto;padding:calc(var(--st) + 18px) 16px calc(var(--sb) + 88px)}

/* header */
.hdr{text-align:center;margin-bottom:18px}
.hdr h1{font-size:24px;font-weight:800;letter-spacing:-.6px;background:linear-gradient(135deg,#a78bfa,#f472b6 55%,#fb923c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr-sub{font-size:12px;color:var(--t2);margin-top:3px}

/* week nav */
.week-nav{display:flex;align-items:center;justify-content:space-between;background:var(--s1);border-radius:16px;padding:11px 14px;margin-bottom:14px}
.wnav-btn{background:var(--s2);border:none;color:var(--txt);font-size:18px;width:34px;height:34px;border-radius:10px;cursor:pointer;-webkit-appearance:none;display:flex;align-items:center;justify-content:center}
.wnav-btn:active{transform:scale(.9)}
.week-label{font-size:15px;font-weight:700}

/* day rows */
.day-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.day-row{background:var(--s1);border:1px solid var(--bord);border-radius:18px;padding:14px 15px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:transform .1s}
.day-row:active{transform:scale(.98)}
.day-row.is-today{border-color:var(--acc)}
.day-row.is-done{opacity:.55}
.dr-l{flex:1}
.dr-day{font-size:12px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.dr-type{font-size:15px;font-weight:700;margin-bottom:2px}
.dr-desc{font-size:11px;color:var(--t2)}
.dr-r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;margin-left:12px}
.dr-weather{font-size:14px;font-weight:600}
.dr-rain{font-size:11px;color:var(--blu);margin-left:3px}
.vtag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px}
.vg{background:rgba(16,185,129,.15);color:#10b981}
.vo{background:rgba(59,130,246,.15);color:#60a5fa}
.vw{background:rgba(245,158,11,.15);color:#f59e0b}
.vb{background:rgba(239,68,68,.15);color:#ef4444}
.done-tag{font-size:10px;font-weight:700;color:var(--grn);background:rgba(16,185,129,.1);padding:3px 8px;border-radius:100px}
.today-tag{font-size:10px;font-weight:700;color:var(--al);background:rgba(124,58,237,.12);padding:3px 8px;border-radius:100px}
.swap-btn{background:var(--s2);border:none;color:var(--t2);font-size:11px;font-weight:600;padding:5px 9px;border-radius:8px;cursor:pointer;-webkit-appearance:none;margin-top:4px}
.swap-btn:active{background:var(--s3)}

/* empty state */
.empty-wrap{text-align:center;padding:48px 20px}
.empty-icon{font-size:56px;margin-bottom:14px}
.empty-title{font-size:21px;font-weight:800;margin-bottom:8px}
.empty-sub{font-size:14px;color:var(--t2);line-height:1.6;margin-bottom:24px}

/* buttons */
.btn{border:none;border-radius:15px;font-size:15px;font-weight:700;cursor:pointer;-webkit-appearance:none;padding:15px 22px;transition:transform .1s;letter-spacing:-.2px;width:100%}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--acc);color:#fff}
.btn-s{background:var(--s1);color:var(--t2);border:1px solid var(--bord);font-size:14px}

/* bottom nav */
.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(9,9,15,.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bord);display:flex;justify-content:center;padding:8px 0 calc(var(--sb) + 4px)}
.bnav-btn{flex:1;max-width:160px;background:transparent;border:none;padding:7px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;-webkit-appearance:none;opacity:.45;transition:opacity .15s}
.bnav-btn.on{opacity:1}
.bnav-btn span:first-child{font-size:22px}
.bnav-btn span:last-child{font-size:10px;font-weight:700;color:var(--txt)}

/* day screen */
.day-hdr{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back-btn{background:var(--s1);border:none;color:var(--al);font-size:14px;font-weight:700;padding:8px 13px;border-radius:10px;cursor:pointer;-webkit-appearance:none;flex-shrink:0}
.back-btn:active{transform:scale(.95)}
.day-hdr-r{font-size:16px;font-weight:700}

.day-hero{border-radius:22px;padding:18px 20px;margin-bottom:18px;background:var(--s1);border:1px solid transparent}
.hero-tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;padding:4px 10px;border-radius:100px;margin-bottom:9px}
.hero-name{font-size:20px;font-weight:800;margin-bottom:7px;letter-spacing:-.4px}
.hero-weather{font-size:13px;color:var(--t2);margin-bottom:6px}

/* energy */
.sec-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--t2);margin-bottom:10px}
.egrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:13px}
.ebtn{background:var(--s1);border:2px solid transparent;border-radius:14px;padding:11px 4px;cursor:pointer;-webkit-appearance:none;text-align:center;width:100%}
.ebtn:active{transform:scale(.93)}
.ei{font-size:22px;display:block;margin-bottom:2px}
.en{font-size:11px;font-weight:700;color:var(--txt);display:block}
.ebtn[data-e=fresh].sel{border-color:var(--grn);background:rgba(16,185,129,.1)}
.ebtn[data-e=okay].sel{border-color:var(--blu);background:rgba(59,130,246,.1)}
.ebtn[data-e=tired].sel{border-color:var(--amb);background:rgba(245,158,11,.1)}
.ebtn[data-e=sore].sel{border-color:var(--red);background:rgba(239,68,68,.1)}

/* coach */
.coach{background:var(--s1);border-radius:16px;padding:13px 15px;margin-bottom:18px;border-left:3px solid var(--acc);display:none}
.coach.on{display:block;animation:su .25s ease}
.coach-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--al);margin-bottom:5px}
.coach p{font-size:13px;line-height:1.6}
@keyframes su{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* exercise cards */
.ex-list{display:flex;flex-direction:column;gap:13px;margin-bottom:18px}
.ex-card{background:var(--s1);border:1px solid var(--bord);border-radius:20px;overflow:hidden}
.ex-gif-wrap{position:relative;height:200px;background:var(--s2);overflow:hidden}
.ex-gif{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s;position:absolute;inset:0}
.ex-gif.on{opacity:1}
.gif-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:opacity .3s}
.gif-ph.off{opacity:0;pointer-events:none}
.gif-sh{position:absolute;inset:0;background:linear-gradient(90deg,var(--s2) 0%,var(--s3) 50%,var(--s2) 100%);background-size:200% 100%;animation:sh 1.6s infinite ease-in-out}
.gif-ph-txt{position:relative;font-size:12px;color:var(--t2);text-align:center}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.ex-banner{position:absolute;top:0;left:0;right:0;padding:10px 12px 28px;background:linear-gradient(to bottom,rgba(0,0,0,.72) 0%,transparent 100%);display:flex;align-items:center;gap:8px;z-index:2;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ex-num-i{font-size:11px;font-weight:800;color:rgba(255,255,255,.5);flex-shrink:0;background:rgba(255,255,255,.15);border-radius:100px;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.ex-num-n{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.5);flex:1}
.ex-banner-chev{font-size:12px;color:rgba(255,255,255,.6);flex-shrink:0;transition:transform .2s}
.ex-card-collapsed{cursor:pointer}
.ex-card-collapsed .ex-collapse-row{display:flex;align-items:center;gap:10px;padding:13px 14px}
.ex-collapse-num{font-size:11px;font-weight:800;color:var(--t2);background:var(--s2);border-radius:100px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ex-collapse-name{font-size:14px;font-weight:700;flex:1}
.ex-collapse-chev{font-size:13px;color:var(--t2);flex-shrink:0}
.ex-mt{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:100px;padding:3px 9px;font-size:11px;font-weight:600;color:rgba(255,255,255,.9);z-index:2}
.ex-play{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:none;border-radius:100px;padding:4px 10px;font-size:11px;font-weight:700;color:#fff;cursor:pointer;z-index:2;-webkit-appearance:none;display:flex;align-items:center;gap:5px}
.ex-play:active{transform:scale(.9)}
.ex-body{padding:13px 15px}
.ex-name{font-size:16px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.ex-bdgs{display:flex;flex-wrap:wrap;gap:6px}
.bdg{border-radius:100px;padding:3px 10px;font-size:11px;font-weight:700}
.bs{background:rgba(167,139,250,.12);color:var(--al)}
.br{background:rgba(241,245,249,.07);color:var(--t2)}
.bp{background:rgba(251,191,36,.12);color:#fbbf24}
.pr-b{background:rgba(251,191,36,.12);color:#fbbf24;font-size:10px;font-weight:700;padding:2px 7px;border-radius:100px}

/* ride / rest */
.ride-card,.rest-card{background:var(--s1);border:1px solid rgba(59,130,246,.2);border-radius:20px;padding:22px 18px;margin-bottom:18px;text-align:center}
.ride-icon,.rest-emoji{font-size:52px;display:block;margin-bottom:11px}
.ride-lbl,.rest-title{font-size:19px;font-weight:800;margin-bottom:13px}
.rest-sub{font-size:13px;color:var(--t2);line-height:1.6;margin-bottom:16px}
.tips{list-style:none;text-align:left;display:flex;flex-direction:column;gap:8px}
.tips li{display:flex;gap:9px;font-size:13px;line-height:1.4}
.ta{color:#60a5fa;font-weight:700;flex-shrink:0}
.mob-list{display:flex;flex-direction:column;gap:7px;text-align:left}
.mob-item{background:var(--s2);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:10px;font-size:13px}

/* log screen */
.log-list{display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
.log-ex{background:var(--s1);border:1px solid var(--bord);border-radius:18px;padding:15px}
.log-ex.done-ex{border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.04)}
.log-ex-hdr{display:flex;align-items:center;gap:6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.log-ex-name{font-size:15px;font-weight:700;display:flex;align-items:center;flex-wrap:wrap;gap:6px;flex:1}
.log-ex-prog{font-size:12px;font-weight:700;color:var(--t2);flex-shrink:0}
.log-ex-prog.done{color:var(--grn)}
.log-ex-chev{font-size:18px;color:var(--t2);transition:transform .2s;flex-shrink:0;line-height:1}
.log-ex-chev.open{transform:rotate(180deg)}
.log-ex-body{overflow:hidden}
.log-ex-body.collapsed{display:none}
.sets-hdr{display:grid;grid-template-columns:30px 1fr 80px 42px;gap:8px;margin-bottom:7px;font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.8px;text-align:center}
.set-row{display:grid;grid-template-columns:30px 1fr 80px 42px;gap:8px;align-items:center;margin-bottom:7px}
.set-row.s-done{opacity:.45}
.set-n{font-size:12px;font-weight:700;color:var(--t2);text-align:center}
.set-inp{background:var(--s2);border:1px solid var(--bord);border-radius:10px;color:var(--txt);font-size:17px;font-weight:700;padding:10px 6px;text-align:center;-webkit-appearance:none;width:100%;outline:none;font-family:inherit}
.set-inp:focus{border-color:var(--acc)}
.set-ck{background:var(--s2);border:2px solid var(--bord);border-radius:10px;color:var(--t2);font-size:15px;font-weight:700;width:42px;height:42px;cursor:pointer;-webkit-appearance:none;display:flex;align-items:center;justify-content:center;transition:all .15s}
.set-ck.on{background:rgba(16,185,129,.15);border-color:var(--grn);color:var(--grn)}
.set-ck:active{transform:scale(.88)}
.add-set{background:transparent;border:1px dashed rgba(120,80,255,.28);border-radius:10px;color:var(--t2);font-size:12px;font-weight:600;padding:8px;width:100%;cursor:pointer;margin-top:3px;-webkit-appearance:none}

/* PR screen */
.prs-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.pr-row{background:var(--s1);border:1px solid var(--bord);border-radius:14px;padding:13px 15px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:3px}
.pr-row-name{font-size:14px;font-weight:700;flex:1}
.pr-row-val{font-size:14px;font-weight:700;color:#fbbf24}
.pr-row-date{font-size:11px;color:var(--t2);width:100%;margin-top:2px}
/* grouped PRs */
.prg-hdr{background:var(--s1);border:1px solid var(--bord);border-radius:14px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin-bottom:4px}
.prg-hdr:active{opacity:.8}
.prg-body{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.prc-row{background:var(--s1);border:1px solid var(--bord);border-radius:11px;overflow:hidden;cursor:pointer}
.prc-main{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;gap:8px}
.prc-main:active{background:var(--s2)}
.prc-name{font-size:13px;font-weight:700;flex:1}
.prc-val{font-size:13px;font-weight:800;color:#fbbf24;flex-shrink:0}
.prc-actions{display:none;border-top:1px solid var(--bord);padding:8px 10px;gap:6px}
.prc-actions.open{display:flex}
.prc-date{font-size:10px;color:var(--t2);flex-shrink:0}
/* history */
.sec-hdr{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--t2);margin:20px 0 10px}
.hist-row{background:var(--s1);border:1px solid var(--bord);border-radius:14px;padding:13px 15px;margin-bottom:8px;cursor:pointer}
.hist-row:active{opacity:.75}
.hist-date{font-size:12px;color:var(--t2);margin-bottom:3px}
.hist-type{font-size:15px;font-weight:700;margin-bottom:5px}
.hist-exs{font-size:11px;color:var(--t2);line-height:1.6}
.hist-detail{margin-top:10px;border-top:1px solid var(--bord);padding-top:10px;display:none}
.hist-detail.open{display:block}
.hist-set{font-size:12px;color:var(--t2);padding:2px 0}
.data-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}

/* PR toast — offset 72px below top to clear Dynamic Island on iPhone 16 Pro Max */
.pr-toast{position:fixed;top:calc(var(--st) + 72px);left:50%;transform:translateX(-50%) translateY(-120px);background:#fbbf24;color:#000;font-size:13px;font-weight:800;padding:11px 20px;border-radius:100px;z-index:999;transition:transform .35s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.pr-toast.on{transform:translateX(-50%) translateY(0)}
/* weight ± buttons */
.wt-wrap{display:flex;align-items:center;gap:3px}
.wt-adj{background:var(--s3);border:none;border-radius:8px;color:var(--txt);font-size:18px;font-weight:700;width:30px;height:42px;cursor:pointer;-webkit-appearance:none;flex-shrink:0;display:flex;align-items:center;justify-content:center;line-height:1}
.wt-adj:active{background:var(--acc);color:#fff;transform:scale(.88)}
/* pre-filled weight (from last session) shown dimmed until user edits */
.set-inp.prefilled{color:var(--t2)}

/* swap modal */
.swap-modal{position:fixed;inset:0;z-index:200}
.swap-ov{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
.swap-sheet{position:absolute;bottom:0;left:0;right:0;background:var(--s1);border-radius:26px 26px 0 0;padding:18px 16px calc(var(--sb) + 18px);transform:translateY(100%);transition:transform .3s ease;max-height:80vh;overflow-y:auto}
.swap-modal.on .swap-sheet{transform:translateY(0)}
.swap-title{font-size:13px;font-weight:700;color:var(--t2);text-align:center;margin-bottom:14px;text-transform:uppercase;letter-spacing:.8px}
.swap-opt{background:var(--s2);border:1px solid var(--bord);border-radius:13px;padding:13px 15px;width:100%;text-align:left;color:var(--txt);font-size:15px;font-weight:700;cursor:pointer;margin-bottom:7px;display:flex;flex-direction:column;gap:2px;-webkit-appearance:none}
.swap-opt span{font-size:11px;font-weight:400;color:var(--t2)}
.swap-opt:active{background:var(--s3)}
.swap-cancel{background:transparent;border:1px solid var(--bord);border-radius:13px;padding:13px;width:100%;color:var(--t2);font-size:15px;font-weight:600;cursor:pointer;-webkit-appearance:none;margin-top:3px}
.ex-busy-btn{background:var(--s2);border:1px solid var(--bord);border-radius:8px;color:var(--t2);font-size:11px;font-weight:600;padding:5px 9px;cursor:pointer;-webkit-appearance:none;margin-top:9px;display:inline-block}
.ex-busy-btn:active{background:var(--s3)}
.unit-toggle{background:var(--s2);border:1px solid var(--bord);border-radius:8px;color:var(--al);font-size:11px;font-weight:700;padding:4px 10px;cursor:pointer;-webkit-appearance:none}
.unit-toggle:active{background:var(--s3)}

/* lock screen */
.lock-wrap{min-height:100vh;min-height:-webkit-fill-available;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;background:var(--bg)}
.lock-logo{font-size:64px;margin-bottom:12px}
.lock-title{font-size:24px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,#a78bfa,#f472b6 55%,#fb923c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.lock-sub{font-size:13px;color:var(--t2);margin-bottom:28px}
.pin-dots{display:flex;gap:14px;margin-bottom:28px;align-items:center}
.pin-dot{width:14px;height:14px;border-radius:50%;background:var(--s3);border:2px solid var(--bord);transition:all .15s}
.pin-dot.filled{background:var(--acc);border-color:var(--acc);transform:scale(1.2)}
.pin-dot.err{background:var(--red)!important;border-color:var(--red)!important}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:264px;margin-bottom:16px}
.np-btn{background:var(--s1);border:1px solid var(--bord);border-radius:16px;color:var(--txt);font-size:22px;font-weight:600;height:66px;cursor:pointer;-webkit-appearance:none;transition:transform .1s}
.np-btn:active{transform:scale(.91);background:var(--s2)}
.np-del{font-size:18px;color:var(--t2)}
.np-empty{background:transparent!important;border-color:transparent!important;pointer-events:none}
.lock-guest{background:transparent;border:none;color:var(--t2);font-size:13px;font-weight:600;cursor:pointer;padding:10px 20px;-webkit-appearance:none}
/* guest + sync bars */
.guest-bar{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);border-radius:10px;padding:9px 13px;font-size:12px;color:#f59e0b;font-weight:600;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sync-bar{background:var(--s1);border-radius:10px;padding:7px 12px;font-size:11px;color:var(--t2);display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--grn);display:inline-block;margin-right:5px}
/* utils */
.mt12{margin-top:12px}
.mt16{margin-top:16px}

html.lang-zh .bdg{font-size:10px}
html.lang-zh .empty-title{font-size:19px}
html.lang-zh .hero-name{font-size:18px}

/* ── HARDCODED COACH TIPS (no API needed) ── */
const EX_COACH_TIPS={
bb_bench:{CONNECT:'Imagine bending the bar apart — this external rotation cue fires the pecs and locks elbows at 75° automatically.',SETUP:'Retract and depress shoulder blades into the bench; plant feet flat and drive heels into the floor to create full-body tension.',REP:'Lower bar to nipple line in 3s, lightly touch, drive up in a slight arc toward the rack — elbows track at 75°, never flare.',AVOID:'Flaring elbows to 90° shifts stress to the shoulder joint — keep them at 60–75° to torso to protect your shoulders and max out chest activation.'},
db_bench:{CONNECT:'At the bottom, focus on the deep pec stretch the dumbbells allow — let them drop slightly below chest level to fully load the pecs.',SETUP:'Retract shoulder blades, feet flat; press the dumbbells together above your chest briefly to pre-contract the pecs before lowering.',REP:'Lower with elbows at 75°, pause 1s at the bottom stretch, then drive up and slightly in — nearly touch dumbbells at the top.',AVOID:'Dropping elbows past 90° puts the shoulder capsule in a vulnerable position — keep them slightly in front of your body plane throughout.'},
incline_bb:{CONNECT:'Visualise your clavicular head (upper chest near collar bone) contracting and shortening as you press — feel it working, not the front delts.',SETUP:'Set bench to 30° (not 45°), retract shoulder blades, unrack the bar directly over your upper chest, not mid-chest.',REP:'Lower to your upper chest / clavicle in 3s with elbows at 75°, then drive straight up — the path feels more vertical than flat bench.',AVOID:'A 45°+ incline shifts the work to front delts — keep it at 30° to stay in upper chest territory.'},
incline_db:{CONNECT:'Feel the stretch right at the top of your chest near the collar bone at the bottom — that\'s the clavicular head loading up.',SETUP:'Bench at 30°, let the dumbbells drop slightly lower than a bar would allow with elbows wide for maximum upper chest stretch.',REP:'Drive up and together on a slight arc, squeezing upper chest hard as they almost touch at the top; control descent in 3s.',AVOID:'Letting dumbbells drift too far back overhead shifts load to shoulders — keep them in line with your upper chest throughout.'},
cable_fly:{CONNECT:'Think of hugging a barrel — your arms round forward, your chest squeezes, not your shoulders pulling. Feel the inner chest at the top.',SETUP:'Set cables to chest height; step forward so there\'s constant tension with a consistent soft elbow bend throughout.',REP:'Move in a wide arc, feel the pec stretch on the way out; accelerate in and squeeze chest hard as hands meet, hold 1s.',AVOID:'Bending elbows too much turns a fly into a press — maintain that soft, fixed elbow bend throughout.'},
pec_deck:{CONNECT:'Lead with your elbows, not your hands — this keeps chest dominant and prevents front delt takeover.',SETUP:'Adjust seat so elbows align with pads at shoulder height; sit tall with chest out and a small upper-back arch.',REP:'Open to full stretch (pads at ear level), pause 1s, then squeeze pads together and hold the peak contraction for 2s before releasing slowly.',AVOID:'Using momentum to slam pads together — go light enough to control the full arc and feel every rep.'},
ohp:{CONNECT:'Brace core and squeeze glutes before pressing — this rigid base protects your lower back and transfers force directly into the bar.',SETUP:'Grip just outside shoulder width, bar resting on front delts; big breath and brace, tuck chin so the bar grazes your face on the way up.',REP:'Drive bar straight overhead — at lockout shrug traps slightly and push your head through so ears align with biceps. Lower in 3s.',AVOID:'Pressing forward and leaning back puts enormous stress on the lumbar spine — keep the bar path vertical over your mid-foot.'},
db_spress:{CONNECT:'Imagine pushing the ceiling away with both dumbbells — this focuses attention on the top where the delts are fully contracted.',SETUP:'Sit upright with neutral spine; dumbbells at ear level, elbows at 90°. Don\'t drop below elbows to reduce impingement risk.',REP:'Press up in a slight arc until dumbbells nearly touch overhead, stop just short of lockout. Lower in 3s back to ear level.',AVOID:'Letting your lower back hyperextend as you press — keep abs braced and ribs down throughout.'},
arnold:{CONNECT:'Focus on feeling each delt section fire in sequence — front delt at the start, side delt as you rotate and press overhead.',SETUP:'Start with palms facing you at chin height (like a curl finish), elbows close in front; rotate palms outward as you press up.',REP:'Rotate palms 180° as you press to overhead — rotation should be complete at the top. Reverse the rotation on the way down.',AVOID:'Rushing the rotation — the rotational component is the whole point, so slow it down to feel the delts through the full arc.'},
lat_raise:{CONNECT:'Lead with your pinky finger, not your thumb — this wrist position keeps the side delt dominant and prevents front delt takeover.',SETUP:'Stand with a slight forward lean and soft elbow bend; dumbbells hang just in front of your body, not at your sides.',REP:'Raise arms to shoulder height only (not higher), pinkies up, then lower in 3s — the slow eccentric is where side delt growth happens.',AVOID:'Using momentum and shrugging your traps — use 30–40% less weight than you think you need and feel the side delt on every rep.'},
cable_lat:{CONNECT:'Stand side-on and lean slightly away from the cable — this creates constant tension on the side delt even at the bottom, unlike dumbbells.',SETUP:'Reach across body to grab the low cable handle with the far hand; slight knee bend and slight forward lean.',REP:'Raise arm in a wide arc to shoulder height with a soft elbow bend, feeling constant delt tension throughout.',AVOID:'Bending the elbow too much shifts work to rear delt and traps — keep the arc wide and smooth with arm nearly straight.'},
tri_push:{CONNECT:'Imagine pushing the handle through the floor with elbows glued to your sides — this forces the triceps to do 100% of the work.',SETUP:'Stand close to cable, elbows pinned to sides; forearms roughly parallel to the floor at the start.',REP:'Push down to full lockout, squeeze triceps hard for 1s at the bottom. Return slowly in 3s until forearms are parallel.',AVOID:'Letting elbows drift forward and down — if you\'re leaning forward to push the weight, it\'s too heavy.'},
skull:{CONNECT:'As the bar lowers, the elbows stay vertical — feel the long head of the tricep stretching maximally in that end position.',SETUP:'Lie on bench, grip EZ bar inside shoulder width, press to lockout directly over your face — elbows point straight to the ceiling.',REP:'Lower by bending only at the elbows — upper arm stays completely still. 3s descent to near forehead, then extend back to lockout.',AVOID:'Letting elbows flare out or drift back toward your head — keep them stacked above your shoulders for maximum tricep tension.'},
tri_oh:{CONNECT:'The long head of the tricep only fully stretches when your arms are overhead — feel the deep stretch at the bottom of each rep.',SETUP:'Grab rope overhead with both hands; elbows close to your head, upper arms locked pointing up. Step away for a slight forward lean.',REP:'Lower rope behind your head in 3s for a deep tricep stretch, then drive hands forward and up explosively to full lockout.',AVOID:'Elbows drifting out wide — keep them close to your head throughout for maximum long-head recruitment.'},
dips:{CONNECT:'Stay upright for tricep focus — the moment you lean forward you shift tension to your chest.',SETUP:'Grip parallel bars, support at lockout. Stay vertical for triceps; lean forward 15–20° only if targeting chest.',REP:'Lower until elbows hit 90° (deeper for chest), then drive up through your palms to full lockout, squeezing triceps hard at the top.',AVOID:'Dipping only 45–60° — you miss the stretch entirely. Go to 90° minimum for triceps, deeper for chest.'},
pullup:{CONNECT:'Before pulling, think about driving your elbows down toward your back pockets — this activates lats and takes the biceps out of the dominant position.',SETUP:'Dead hang with arms fully extended, grip slightly wider than shoulders, overhand. Pack shoulders down away from ears before pulling.',REP:'Initiate by depressing shoulder blades, drive elbows down and back, pull chest to bar. Lower in 3s to full dead hang between reps.',AVOID:'Using momentum or kipping — strict pull-ups build far more lat thickness. Use a band if needed to maintain strict form.'},
lat_pull:{CONNECT:'Think about pulling your shoulder blades into your back pockets — this activates and depresses the lats so they drive the movement.',SETUP:'Lean back 10–15°, chest tall and forward, grip wider than shoulder width; depress shoulder blades before the pull.',REP:'Pull bar to upper chest, driving elbows down and back; squeeze lats for 1s at the bottom. Return in 3s to full overhead stretch.',AVOID:'Pulling behind the neck — this is hard on the cervical spine and doesn\'t improve lat activation. Always pull to the front.'},
bb_row:{CONNECT:'Pull with your elbows, not your hands — pretend your hands are hooks and the drive comes from elbows pulling toward your hips.',SETUP:'Hinge to 45°, bar over mid-foot, back neutral; retract shoulder blades before the bar even moves.',REP:'Pull to your lower chest / upper abdomen, elbows close to body; squeeze shoulder blades together for 1s at the top. Lower in 3s.',AVOID:'Jerking with your lower back — this is a back injury risk. Control the weight throughout and maintain spinal neutrality.'},
tbar_row:{CONNECT:'Feel your shoulder blades pinching together at the top of each rep — pause there for 1s and feel the mid-back fully contracted.',SETUP:'Chest on pad, spine long, neck neutral; depress shoulder blades before initiating the pull.',REP:'Pull handles to chest, driving elbows up and back; hold the squeeze for 1s at the top. Lower in 3s to full stretch.',AVOID:'Lifting your chest off the pad — this turns it into a partial movement and loads the lower back unnecessarily.'},
db_row:{CONNECT:'Think of starting a lawn mower with your elbow — the pull goes straight back toward your hip, not up toward your shoulder.',SETUP:'One knee and hand on the bench creating a flat back; DB hangs directly below the shoulder from a relaxed arm.',REP:'Drive elbow straight back past your hip — not up to shoulder height. Lower slowly in 3s to full hang.',AVOID:'Rotating too much and turning it into a torso exercise — keep movement in the arm with only slight torso involvement.'},
cable_row:{CONNECT:'Picture squeezing a pencil between your shoulder blades at the end of each rep — that\'s your rhomboids and mid-back fully contracting.',SETUP:'Sit tall with a slight lean back, knees soft, chest out, lower back neutral throughout.',REP:'Pull handle to belly button, drive elbows back, squeeze shoulder blades together, hold 1s. Return slowly letting shoulder blades protract fully.',AVOID:'Rocking your torso back and forth for momentum — stay relatively upright and let the back muscles do the work.'},
face_pull:{CONNECT:'As you pull to face level, focus on showing your armpits to the ceiling — that external rotation fires the rear delts and rotator cuff.',SETUP:'Cable at face height or above, rope attachment, thumbs up grip; stand back far enough for constant tension.',REP:'Pull rope to forehead level, splitting rope so hands end beside your ears with elbows high and wide — really externally rotate.',AVOID:'Pulling too low to chin or neck height — this recruits traps and loses rear delt activation. Keep it going to forehead height.'},
rear_fly:{CONNECT:'Lead with your elbows, not your hands — the rear delt\'s job is to move the upper arm back, so point the elbow toward the ceiling.',SETUP:'Lie chest-down on incline bench (30–45°), arms hanging with a soft elbow bend; this removes lower back and momentum.',REP:'Raise arms in a wide arc to shoulder level, leading with elbows; hold 1s at the top feeling rear delts contract. Lower in 3s.',AVOID:'Going too heavy and turning it into a shrugging movement — rear delts are small, so drop the weight and feel every rep.'},
bb_curl:{CONNECT:'Actively squeeze your biceps before the bar moves — this pre-contraction ensures they dominate rather than front delts taking over.',SETUP:'Stand tall, grip slightly wider than shoulder width underhand; pin elbows to your sides — they don\'t move during the set.',REP:'Curl in a smooth arc, squeeze maximally at the top; lower in 3s to a full dead hang for complete bicep stretch.',AVOID:'Swinging your back to help the bar up — if you\'re swinging, drop the weight 10–15%. Strict reps build more mass than heavy swings.'},
db_curl:{CONNECT:'Supinate (rotate) your wrist as you curl — starting neutral and rotating to palm-up increases bicep activation through a greater range of motion.',SETUP:'Arms at sides, palms facing in; curl while keeping the upper arm completely still and elbow pinned to your side.',REP:'Start neutral grip, rotate to fully supinated at the top — feel the bicep peak contract hard. Lower in 3s back to neutral.',AVOID:'Swinging the upper arm forward to initiate the lift — the upper arm must stay completely vertical throughout.'},
hammer:{CONNECT:'Focus on feeling thickness through the outer arm (brachialis) — this muscle sits under the bicep and pushing it up creates arm width.',SETUP:'Stand or sit, neutral grip (thumbs up) throughout the entire movement — don\'t rotate. Arms at sides, elbows pinned.',REP:'Curl in a strict arc with no wrist rotation; squeeze at the top, lower in 3s. Neutral grip stays constant throughout.',AVOID:'Swinging or using body english — hammers build brachialis thickness through strict, controlled reps, not heavy momentum.'},
preacher:{CONNECT:'The full stretch at complete extension at the bottom is where preacher curl growth happens — don\'t stop halfway down.',SETUP:'Upper arm fully on the pad from armpit to elbow with no gap; grip EZ bar at the inner angled grip.',REP:'Lower to complete extension — pause 1s in the stretch — then curl to near-full contraction, holding 1s at the top.',AVOID:'Bouncing out of the stretched position — the weight must be controlled into the full extension without snapping the elbow.'},
incline_curl:{CONNECT:'The incline puts your arms behind your body, maximally stretching the long head — feel the deep stretch through your entire upper arm at the bottom.',SETUP:'Incline bench at 45–60°; lie back with arms hanging straight down behind the body — let the dumbbells hang fully.',REP:'Curl both arms without letting elbows drift forward — they stay hanging straight down from the shoulder throughout.',AVOID:'Elbows drifting forward during the curl — if they do, you lose the long head stretch that makes this exercise special.'},
cable_curl:{CONNECT:'Cables maintain constant tension at the top where dumbbells go slack — focus on holding the peak contraction for 2s to maximise bicep activation.',SETUP:'Stand facing cable at arm\'s length, arms fully extended; slight forward lean so cable angle matches the bicep\'s line of pull.',REP:'Curl to full contraction, hold peak for 2s fighting the cable tension. Lower in 3s to full extension.',AVOID:'Moving your elbows forward as you curl — keep them pinned below your shoulders to maintain cable leverage on the bicep.'},
bb_squat:{CONNECT:'Before descending, take a huge breath and brace your core like you\'re about to get punched — this full-body tension is what keeps your spine safe under load.',SETUP:'Bar on traps, feet shoulder-width, toes out 15–30°; actively push knees out in the direction of toes before you begin the descent.',REP:'Sit between your heels (not back like a box squat), drive knees out all the way to depth, then drive the floor away — hips and chest rise together.',AVOID:'Knees caving inward (valgus collapse) — cue "spread the floor" with your feet throughout to protect knees and fire glutes.'},
front_squat:{CONNECT:'Front squats force an upright torso — feel your quads working significantly harder than back squat because the vertical position loads them directly.',SETUP:'Bar on front delts (not hands), elbows parallel to the floor and high; if elbows drop, the bar rolls off.',REP:'Descend straight down between heels, torso completely upright; drive knees out over toes and push floor away with quads.',AVOID:'Dropping elbows — this causes a forward lean, dumps the bar, and destroys the upright position that makes front squats effective.'},
leg_press:{CONNECT:'Place feet mid-platform at hip-width — lower placement = more quad, higher placement = more glute. Choose based on your goal.',SETUP:'Lower back stays pressed against pad; never fully lock out knees to maintain constant quad tension.',REP:'Lower until knees hit 90° or slightly deeper, pause 1s, press through mid-foot (not toes) to near lockout.',AVOID:'Letting lower back round off the pad at the bottom — this is a disc injury risk. Stop the descent before your lower back lifts.'},
bss:{CONNECT:'The rear foot is just for balance — put all mental focus on the front leg and feel the quad and glute doing 100% of the work.',SETUP:'Front foot far enough forward so the shin stays vertical at the bottom; rear foot on bench, hold dumbbells at sides.',REP:'Lower rear knee directly down toward the floor while keeping front shin vertical; drive through front heel to rise.',AVOID:'Front knee traveling far past toes — place foot further forward so the shin stays vertical. Vertical shin = balanced quad and glute.'},
lunge:{CONNECT:'Plant your front heel first and drive through it — this activates the glute of the front leg. Landing on toes = quad only.',SETUP:'Hold dumbbells at sides, stand tall; take a long stride so the front shin stays vertical when the knee bends.',REP:'Lower rear knee toward floor, push off front heel to step through. Long stride emphasises glutes, short stride emphasises quads.',AVOID:'Taking too short a stride — this forces the front knee far past the toes, increasing knee joint stress and reducing glute activation.'},
step_up:{CONNECT:'Place the whole foot on the box and drive exclusively through your front heel — the moment your back foot pushes, you\'ve lost the single-leg isolation.',SETUP:'Box at knee height; step up with full foot contact. Let the trail foot float after the push to confirm the front leg is doing all the work.',REP:'Drive up through front heel to standing, squeeze the glute at the top. Lower with control — don\'t drop back down.',AVOID:'Using the back foot to push off the floor — hover the back foot as you step down to keep it a true single-leg exercise.'},
goblet_squat:{CONNECT:'Hold the weight at your chest and let your elbows track inside your knees as you descend — this teaches perfect squat mechanics naturally.',SETUP:'Weight close to chest (not hanging down), feet shoulder-width, toes out 15–30°.',REP:'Sit straight down with elbows driving knees out and torso upright; aim for full depth. Stand through mid-foot.',AVOID:'Letting the weight pull you forward into a lean — use a lighter weight or hold it higher at your chest to stay upright.'},
hack_squat:{CONNECT:'Position feet slightly lower on the platform with a narrower stance to isolate the quads — feel the burn right in the quad muscle belly as you drive up.',SETUP:'Back against pad, feet hip-width or narrower, mid-platform; shoulders under the pads. Disengage safety handles.',REP:'Lower under control to 90° or deeper; drive through heels to return. Maintain a constant knee bend — don\'t fully lock out.',AVOID:'Knees caving inward on the way up — push knees out over toes throughout the movement.'},
leg_ext:{CONNECT:'At full extension, pause for 2s and flex your quads as hard as possible — this peak contraction is where leg extensions are most effective.',SETUP:'Sit with back against pad; pad just above ankle, knee joint aligns with machine pivot.',REP:'Extend legs to full lockout, squeeze quads for 2s; lower in 3s — don\'t let the weight stack drop between reps.',AVOID:'Going too heavy and recruiting hip flexors to swing the weight up — this should be isolated quad movement.'},
adductor_mach:{CONNECT:'Squeeze your inner thighs together slowly — this small stabilising muscle group responds to controlled movement, not heavy weight.',SETUP:'Sit tall with back against pad; adjust range so you feel a comfortable stretch at the open position.',REP:'Squeeze legs together in 2s, hold contracted position for 1s, then open slowly in 3–4s to full stretch.',AVOID:'Bouncing at the fully open position — this puts sudden stress on the adductor tendons. Control the full range.'},
abductor_mach:{CONNECT:'Push from your hips, not your knees — this activates the glute medius which stabilises the hip and prevents knee valgus during squats.',SETUP:'Sit tall; pad just above knee (not on knee joint), feet hip-width.',REP:'Push out to maximum range, hold 1s, return slowly in 3s. Feel the outer hip working, not the IT band.',AVOID:'Going too heavy and compensating with your lower back — this should be isolated outer hip and glute medius work.'},
rdl:{CONNECT:'Think "show your butt to the wall behind you" as you hinge — this hip push-back is what stretches the hamstrings and keeps the bar close to your legs.',SETUP:'Stand with bar at hips, soft knee bend; hinge at hips pushing them back as the bar slides down your thighs. Back neutral, chest proud.',REP:'Lower until you feel a significant hamstring stretch (bar reaches mid-shin), then drive hips forward explosively to return.',AVOID:'Bending your knees too much — RDL is a hinge, not a squat. More knee bend takes tension off the hamstrings.'},
deadlift:{CONNECT:'Think "push the floor away" rather than "pull the bar up" — this activates legs and glutes first, your strongest muscles, before the back engages.',SETUP:'Bar over mid-foot (1 inch from shins), hip-width stance; big breath, brace, pull the slack out of the bar, then push the floor away.',REP:'Bar stays dragging up shins and thighs; when bar passes knees, drive hips through to lockout squeezing glutes. Lower in 3s, reset.',AVOID:'Jerking the bar off the floor — take slack out first (you\'ll hear a click) to load everything gradually before it breaks the floor.'},
hip_thrust:{CONNECT:'At the top of each rep, squeeze your glutes as hard as you can and hold for 2s — this peak contraction is what makes hip thrusts the king of glute isolation.',SETUP:'Upper back on bench (shoulder blades on edge), padded bar across hips; feet flat and close enough so shins are vertical at the top.',REP:'Drive through heels, squeeze glutes, raise hips until body forms a straight line from knees to shoulders. Hold 2s. Lower in 3s.',AVOID:'Hyperextending your lower back at the top — keep chin tucked and ribs down. Movement comes from hips, not lumbar spine.'},
glute_bridge:{CONNECT:'Squeeze your glutes before the hips even move — this pre-activation ensures they lead the bridge rather than your lower back taking over.',SETUP:'Lie on back, feet flat and close to your glutes; bar or weight on hips if loading. Drive through heels, not toes.',REP:'Squeeze glutes, drive hips up until hips align with knees and shoulders. Squeeze hard for 2s at the top. Lower with control.',AVOID:'Driving through your toes — this activates calves and quads more than glutes. Push through heels for maximum glute activation.'},
glute_kick:{CONNECT:'Before kicking back, consciously squeeze the working glute — this ensures the glute initiates the movement rather than lower back extension.',SETUP:'Face the cable, ankle cuff attached; slight forward lean with hands on machine, hip-width stance.',REP:'Drive leg straight back in a smooth arc, squeeze the glute hard at full extension for 1s. Return with control.',AVOID:'Arching your lower back to get more range — keep spine neutral and let the glute work through its natural range of motion.'},
nordic_curl:{CONNECT:'The slow eccentric (lowering) phase IS the exercise — you\'re building hamstring resilience that protects against tears. Focus entirely on controlling the descent.',SETUP:'Kneel with feet anchored, hips fully extended (not hinged). Arms ready to catch yourself at the bottom.',REP:'Lower toward the floor as slowly as possible using hamstring tension — aim for 4–6s. When you lose control, catch with hands and push back up.',AVOID:'Using hip flexion or torso lean to make it easier — stay completely upright through your hips throughout.'},
leg_curl:{CONNECT:'Keep your hips pressed flat into the pad throughout — any hip rise means your lower back is compensating and hamstrings are losing their work.',SETUP:'Lie face down, pad just above heel; knee joint aligns with machine pivot.',REP:'Curl heels toward glutes with control; squeeze hamstrings hard for 1s at the top. Lower in 3s to full extension.',AVOID:'Hips rising off the pad — reduce the weight if they do. Hips lifting means lower back is taking over.'},
seated_leg_curl:{CONNECT:'The seated position pre-stretches the hamstrings via hip flexion, allowing greater range — feel the deep hamstring stretch at full extension.',SETUP:'Adjust knee pad just above the knee; sit tall or lean slightly forward to increase hamstring stretch. Start at full extension.',REP:'Curl your heels down explosively, squeezing hamstrings hard at the bottom for 1s. Return to full extension slowly in 3s.',AVOID:'Using only half the range of motion — full extension at the top is where hamstrings are maximally stretched and growth is triggered.'},
calf_raise:{CONNECT:'Pause for 2s in the fully stretched position at the bottom of every rep — calves respond best to the full range, especially the stretch.',SETUP:'Stand on edge of step or calf raise platform; balls of feet on the edge, heels dropping below the platform level.',REP:'Drop heels as far as possible and pause 2s; rise all the way onto the balls of your feet and squeeze for 1s at the top.',AVOID:'Partial range of motion — half reps barely stimulate calf growth. The stretch at the bottom is where the stimulus comes from.'},
seated_calf:{CONNECT:'The seated calf raise targets the soleus (lower calf), which creates calf thickness — feel the deep ache below the main calf belly.',SETUP:'Sit with knees at 90°, pad just above knees; full foot on platform with heels dropping below the edge.',REP:'Lower heels to a full stretch, pause 2s, then rise to maximum height and squeeze for 1s at the top.',AVOID:'Bouncing out of the stretched position — the soleus responds to slow, controlled reps with full range.'},
single_calf:{CONNECT:'Single-leg exposes any calf strength imbalance between legs — focus entirely on the working leg through the full range.',SETUP:'Stand on step edge with one foot; hold something lightly for balance only (not for assistance). Other foot crossed behind.',REP:'Full drop at the bottom (2s hold), all the way up onto the ball of your foot, squeeze 1s. Complete all reps before switching.',AVOID:'Relying on the support hand to reduce load — use it only for balance. The working leg should bear 100% of your body weight.'},
plank:{CONNECT:'Squeeze everything — core, glutes, quads, fists. A proper plank is a full-body isometric contraction, not just keeping your back straight.',SETUP:'Forearms on floor, body in a straight line from heels to head. No sagging hips, no elevated butt, neutral neck.',REP:'Breathe 360° into your belly and sides while maintaining intra-abdominal pressure. Stop before you sag — quality over duration.',AVOID:'Sagging hips or raising your butt — both defeat the purpose. A 20s perfect plank beats a 3-minute sagging one.'},
hang_raise:{CONNECT:'Tilt your pelvis backward (posterior pelvic tilt) as you raise your legs — this recruits the lower abs rather than hip flexors doing all the work.',SETUP:'Dead hang from pull-up bar, arms fully extended; engage your core before the movement starts.',REP:'Raise legs by curling your hips toward your ribcage first, then continuing up. Lower in 3s to dead hang.',AVOID:'Swinging legs using momentum — bend knees slightly to reduce the lever arm if you can\'t control the movement.'},
ab_wheel:{CONNECT:'As you roll out, resist the extension — your core fights against your lower back wanting to arch. That resistance is the training stimulus.',SETUP:'Kneel on a pad, hands on ab wheel directly below shoulders; spine neutral, core braced before moving.',REP:'Roll forward slowly keeping hips level with shoulders (no butt sticking up); go as far as you can without lower back arching. Pull back in using core.',AVOID:'Letting your lower back arch on the way out — this is when disc injuries occur. Shorter range with perfect form beats full extension with a sagging spine.'},
cable_crunch:{CONNECT:'Round your spine — flex your lumbar vertebrae — to activate the abs. Think of pulling your ribcage toward your pelvis, not bowing forward from the hips.',SETUP:'Kneel facing cable, rope behind your head; start position is upright with hips completely still throughout.',REP:'Crunch ribcage down toward pelvis by rounding your spine; hold contracted position for 1s. Return to fully upright for complete stretch.',AVOID:'Using your hip flexors by bowing torso forward from the hips — your hips must not move. All movement is in the spine.'},
mach_crunch:{CONNECT:'Place hands across your chest (not behind your head) to avoid neck strain; focus on feeling your abs shorten as you crunch down.',SETUP:'Adjust the machine so the axis aligns with your thoracic spine; sit tall in the start position with abs pre-engaged.',REP:'Crunch slowly in 2s, hold at maximum contraction for 2s, return slowly to the stretch. Breathe out on the crunch.',AVOID:'Going so heavy that you jerk or use momentum — abs respond to time under tension and contraction quality, not load.'},
short_foot:{CONNECT:'Think of "shortening" your foot by drawing the ball toward the heel without curling toes — this activates the tiny intrinsic muscles that support your arch.',SETUP:'Sit or stand barefoot, foot flat on floor with toes relaxed. The movement is very subtle — only a few millimetres of arch lifting.',REP:'Contract arch muscles to lift the arch while keeping toes flat on the floor. Hold for 5s, release, repeat. Quality over quantity.',AVOID:'Curling your toes — this recruits the extrinsic flexors, not the intrinsic arch muscles. Toes must remain flat throughout.'},
towel_scrunch:{CONNECT:'Feel each toe working individually to scrunch the towel — this builds coordinated strength in all the small muscles of the foot.',SETUP:'Sit barefoot with a towel flat under your foot; scrunch the towel toward you using only your toes and ball of foot.',REP:'Scrunch towel toward you, hold for 2s, release fully. Complete all reps, then switch feet.',AVOID:'Lifting your heel to help — keep it flat on the floor, working only toes and ball of foot.'},
arch_raise:{CONNECT:'Feel the entire medial arch lifting as a unit — this isometric hold strengthens the spring-like function of your arch for running and standing.',SETUP:'Stand barefoot, feet hip-width; keep all toes and heel in contact with the floor throughout.',REP:'Lift the arch of each foot without lifting toes or heel. Hold for 5s. This feels very subtle and tiring — that\'s correct.',AVOID:'Supinating the whole foot (rolling to the outside) — movement should come from lifting the arch, not shifting weight to the outer edge.'},
toe_spread:{CONNECT:'Try to spread your toes as wide as possible and hold — most people can\'t initially, as this exercise restores natural toe splay for better balance.',SETUP:'Sit or stand barefoot; try to spread all toes away from each other, especially the big toe away from the others.',REP:'Spread toes as wide as possible, hold for 5s; release, repeat. Work on moving your big toe independently from the others.',AVOID:'Curling your toes as you spread — focus on lateral spreading while keeping toes straight.'},
heel_raise:{CONNECT:'Think of your arch as a spring you\'re loading — this exercise trains the whole posterior chain from arch to Achilles to calf.',SETUP:'Stand with full foot contact, barefoot or minimal shoes; slow controlled rise throughout.',REP:'Rise onto ball of foot slowly in 3s, hold 1s at the top, lower in 3s. Single leg version doubles the load and reveals imbalances.',AVOID:'Rolling to the outside of your foot on the way up — keep weight centered through the big toe ball of foot.'}
};

function calcToday(id,prs,energy,u){
  const ex=EX[id];
  if(!prs)return`No PR logged yet. Start conservative — find a weight where ${ex.reps} reps feels like RPE ${ex.rpe}, rest 2–3 min, then add weight if it felt easy.`;
  const oneRM=Math.round(prs.w*(1+prs.r/30));
  const pct={fresh:0.83,okay:0.78,tired:0.70,sore:0.65}[energy]||0.78;
  const working=Math.round(oneRM*pct/2.5)*2.5;
  const feel={fresh:'push close to your limit',okay:'work at your normal pace',tired:'back off and prioritise form',sore:'keep it light and focus on recovery'}[energy]||'work at your normal pace';
  return`Based on your ${prs.w}${u} × ${prs.r} PR (~${oneRM}${u} 1RM), aim for ~${working}${u} × ${ex.reps} today and ${feel}.`;
}

// backward-compat: expose .name and .sub from chain/area
Object.values(GYMS_BUILTIN).forEach(g=>{g.name=g.chain;g.sub=g.area;});
function getActiveEquip(){
  const gid=DB.get('gym_profile',null);
  if(!gid)return _F; // no gym set — show all exercises
  if(gid==='home'){const h=DB.get('home_equip',[]);return new Set(h);}
  return GYMS_BUILTIN[gid]?.equip||_F;
}
function exAvail(id){
  const eq=getActiveEquip();
  const needed=EX_EQUIP[id]||[];
  return needed.every(e=>eq.has(e));
}
function filterSlot(slot){
  const filtered=slot.filter(id=>exAvail(id));
  return filtered.length>0?filtered:slot;
}

/* ── HTML-escape helper for untrusted user text ── */
function _esc(s){return String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}

  fresh:{gym:'🔥 狀態極佳 — 全力衝刺你的頂組，追求漸進負荷。若重量感覺輕鬆，就加 2.5 公斤。',ride:'🔥 雙腿充滿活力 — 高質量的 Zone 2 訓練日。保持心率穩定，可考慮騎得久一點。',rest:'🔥 精力充沛 — 慢慢做完整套活動度訓練。你的身體會在下次訓練回報你。'},
  okay:{gym:'💪 穩定的基礎。有控制地完成所有計劃組數。持續的訓練帶來持續的成果。',ride:'💪 能量穩定 — 維持 Zone 2，讓雙腿自由轉動。',rest:'💪 良好的休息日。完成整套活動度訓練，或許到外面散個步。'},
  tired:{gym:'😪 能量偏低。減重 10–15%，專注動作形式，略過頂組。能來訓練就值得肯定。',ride:'😪 考慮縮短至 15–20 分鐘 Zone 1，或乾脆休息。別在油盡燈枯時硬逼質量。',rest:'😪 今晚多睡一點比任何訓練都重要。只做輕度伸展。'},
  sore:{gym:'🤕 身體在發出訊號。熱身 10 分鐘以上，減輕重量。若有超出痠痛的疼痛，略過該動作。',ride:'🤕 若雙腿痠痛，休息或只做 10 分鐘非常輕鬆的踩踏。',rest:'🤕 只做溫和的活動度訓練。今晚以蛋白質和睡眠為優先。'},

function coachMsg(e,ct){
  const src=DB.get('lang','en')==='zh'?COACH_ZH:COACH;
  return((src[e]||COACH[e])||{})[ct]||'';
}

const APP_VERSION='1.45';
// Feature flags — flip to true once the backend setup is finished
const FEATURE_WEEKLY_REVIEW=false;
const CHANGELOG=[
  {v:'1.44',d:'Friendlier ride-log message — explains Strava syncs on its own and may just need time',det:'The hint on the manual ride log was reworded. The old wording ("Strava has no ride logged for today") sounded like the ride would never sync. It now makes clear that a connected Strava ride syncs in automatically once Strava finishes processing it — so you can skip the form — and that manual entry is there if you want it tracked right away. For users without Strava, the message is more encouraging about logging to keep progress moving.'},
  {v:'1.43',d:'Ride logging is now inline on the ride card (no pop-up); Weekly Review set to "coming soon"',det:'The manual ride log no longer opens a separate screen. The duration, distance, average heart rate, perceived effort and notes fields now sit directly on the ride card and save as you type — with a short note explaining that rides sync automatically once Strava is connected. The Weekly Review email setup in Settings is temporarily shown as "coming soon" while the email backend is being finished; it will be switched back on alongside the Feedback feature.'},
  {v:'1.42',d:'Import now accepts CSV files — restore workouts, rides and PRs from a CSV export',det:'The Restore button previously only accepted the JSON backup. It now also reads the CSV produced by Export CSV: it parses workout sets, rides and personal records back into the app, matching exercise names in English or Chinese. CSV import merges into your existing data rather than wiping it, and preserves any fields the CSV does not carry. Rows whose exercise name is not recognised are skipped and reported. The JSON backup is still the recommended full backup (it also carries your plan and settings); CSV import is handy for restoring training records specifically.'},
  {v:'1.41',d:'Performance — weather cached, AI coach recovers from failures, exercise images cached offline',det:'Three optimisations. (1) The AI coach previously marked its daily batch as "done" before the network call returned — so a single failed request disabled AI coaching for the rest of the day. It now only marks the batch done after a successful response, with an in-memory guard against duplicate concurrent calls. (2) Weather is cached for 3 hours per week and location, so regenerating your plan no longer re-hits the weather API every time. (3) The service worker now caches exercise demo images from the free-exercise-db CDN — they load instantly on repeat views and work fully offline (previously cross-origin "opaque" responses were skipped by the cache).'},
  {v:'1.40',d:'CSV export, manual ride logging fix, cleaner language labels, and a Feedback section preview',det:'Export data now offers a readable CSV (open it in Excel or Sheets to see every workout set, ride and PR as a plain table) alongside the existing JSON backup used for restore. Manual ride logging now appears on any ride day that Strava did not auto-capture — previously it was hidden entirely whenever a Strava account was connected, so connected users could not log a ride Strava missed. The language switcher no longer shows the stray "GB" / "HK" letters (unsupported flag emoji) before English / 繁體中文. A Feedback & Wishlist section was added to Settings as a coming-soon preview.'},
  {v:'1.39',d:'Chinese translation expanded — all 61 exercise names, form cues, coach messages, and the workout day screen',det:'All 61 exercises now show proper Traditional Chinese names (硬舉, 深蹲, 臥推, 引體向上, etc.) everywhere they appear — day screen, log, history, PRs and swap sheets. The 💡 form-cue tip on every exercise card is now translated. The "Coach says" pre-workout messages are fully translated for every energy level. The workout day screen UI is now translated too: the Exercises heading, Animate / Tutorial / collapse buttons, Busy? and Log sets buttons, set/rep badges, the back and swap buttons, and the log-workout button.'},
  {v:'1.38',d:'Fixed the Swap Workout sheet showing raw code instead of workout names',det:'After workout labels were made translatable (lazy functions), the "Change workout for this day" sheet was still rendering them directly — so it showed text like ()=>_T(\'wt_push\') instead of "Push". The swap sheet now calls the label and description functions correctly, matching every other screen.'},
  {v:'1.37',d:'Chinese language polish — history screen translated, overcrowding fixes, layout class added',det:'The Workout History screen is now fully translated (Completed, exercise/set counts, set rows). Added a lang-zh class on the page root when Traditional Chinese is active, with CSS rules that slightly reduce font sizes, allow exercise card titles to wrap to two lines instead of truncating, tighten button padding, and shrink the bottom-nav labels so nothing overflows. The My Training tab label was shortened to 訓練. Language preference now syncs to the cloud, so it restores correctly after signing in on a new device. Exercise-name and coach-message translation are still to come.'},
  {v:'1.36',d:'Weekly AI Review added — a Sunday training analysis covering 8 weeks of data',det:'Every Sunday a card appears on the Plan tab offering a weekly review. Tapping Generate sends your last 8 weeks of gym sessions, ride data (Strava or manually logged), all-time PRs and the current plan to the AI coach. It returns four sections: an honest performance summary, progressive overload targets for next week, recovery flags, and one focus goal. The result is cached per week and synced to the cloud, so reopening the app the same Sunday never re-calls the API. An optional "Email me this summary" button delivers it via EmailJS once you add your email and EmailJS keys in Settings. Fully bilingual.'},
  {v:'1.35',d:'Strava sync now pulls 8 weeks of ride history (was 30 days) to power the upcoming weekly AI review',det:'The Strava activity sync window was extended from 30 to 56 days, and the page size raised to 100 activities, so the app always holds a full 8 weeks of ride data — distance, duration, average heart rate and average power are all included in each activity. This history feeds the weekly AI review. Existing behaviour (per-day ride matching, plan auto-adapt) is unaffected; it simply has more data to work with.'},
  {v:'1.34',d:'Manual ride logging added for cyclists who haven\'t connected Strava',det:'On any ride day, users without a Strava connection now see a "Log this ride" button. Tapping it opens a form to record duration, distance, average heart rate, perceived effort (RPE) and free-text notes. Logged rides are saved alongside gym sessions, sync to the cloud automatically, and display in a summary card that can be edited later. This ride data also feeds the upcoming weekly AI review. Strava-connected users are unaffected — their rides still pull in automatically. Fully bilingual (English / 繁體中文).'},
  {v:'1.33',d:'Custom PNG icons replace emoji throughout the app — workout types, nav tabs, activities, logo',det:'All major emoji icons replaced with purpose-built PNG graphics: each gym workout type (Push/Pull/Legs/Upper Pump) has its own icon, cycling and ride days use a proper bicycle image, rest days show the mobility graphic, activity chips in Settings use the corresponding sport icons, and nav tabs use the branded icon set. The app logo symbol appears in the lock screen and screen headers. Emoji fallbacks activate automatically if an icon fails to load, so the app always looks correct even offline.'},
  {v:'1.32',d:'New users now see a 3-step welcome guide on the Plan tab instead of a blank "no plan" state',det:'When someone opens the app for the first time without a profile, the Plan tab now shows a friendly welcome screen with three numbered steps: set up your profile, generate your first plan, and start training. Step 1 is highlighted with a call-to-action button; steps 2 and 3 are greyed out until reached. Once a profile exists, the tab shows the standard "Ready to generate your plan" state with the preference tabs and Generate button.'},
  {v:'1.31',d:'Exercise "Coach" button renamed to "Tips" — more accurate label for hardcoded guidance',det:'The Coach button on each exercise opened a hardcoded tips panel with connection cues, setup notes, rep execution and what to avoid — not live AI coaching. Renamed to Tips with a 💡 icon to set the right expectation. The AI Coach section at the top of each workout day is the actual real-time coaching.'},
  {v:'1.30',d:'Traditional Chinese language support added — switch between English and 繁體中文 in Settings',det:'Added a full translations system with English and Traditional Chinese. Tap Settings → Language to switch. Translated: navigation tabs, screen subtitles, all section headers, workout type names, day names, energy selector, activity names, and key toasts. The language preference is saved locally and applied instantly on switch.'},
  {v:'1.29',d:'Sign-up hardened — orphaned accounts prevented, password length validated before attempting',det:'Fixed a gap where Firebase Auth could create an account but the database write immediately after could fail, leaving a user permanently locked out. Now if the database registration fails after auth creation, the auth account is automatically deleted so the user can try again cleanly. Also added an early password length check (minimum 6 chars) before any network call is made.'},
  {v:'1.28',d:'Active activity chips now have a − button to remove instantly; "Change my activities" button removed',det:'Each active activity chip (Cycling, Gym & Weights, etc.) now has a red − button on the right to remove it directly. The redundant "Change my activities" button is gone — add and remove are now handled entirely from the chips. The "Set up activities" button only appears when you have no activities at all.'},
  {v:'1.27',d:'Every changelog entry now has expandable detail explaining the logic and reasoning behind the change',det:'Tap any version row in What\'s New to expand a longer explanation of why the change was made, how the logic works, and any relevant context. Useful for understanding what the app actually does under the hood or checking if a specific behaviour was intentional.'},
  {v:'1.26',d:'Tapping + Add on an activity now adds it instantly — no more going through the full setup screen',det:'Each activity chip has its own + Add button. Tapping it immediately writes that activity into your profile and confirms with a green toast. Previously all chips opened the full goals setup screen, which was unnecessary when you just wanted to add one thing. The ⓘ button still opens the info popup independently.'},
  {v:'1.25',d:'Skipping a gym day automatically shifts the rest of the week — no prompts, no dropped muscle groups',det:'When you swap a gym day to Rest, the app finds all remaining gym days that week and cascades the missed workout type through them in order — Push moves to the next gym slot, that slot\'s type moves to the one after it, and so on. Cycling, running, cardio, and rest days are completely ignored by the cascade; only Push/Pull/Legs/Upper Pump sessions shift.'},
  {v:'1.23',d:'Activity chips now show an ⓘ info button explaining what each activity covers; renamed to Cardio & Classes',det:'Added a small ⓘ button to the right of every activity chip (both active and the dashed + Add ones). Tapping it opens a sheet describing what that activity covers in the app and what syncs automatically. Also renamed the fourth activity from "Other Cardio" to "Cardio & Classes" to better reflect that it covers HIIT, rowing, elliptical, stair master, swimming, group fitness and similar.'},
  {v:'1.22',d:'Smarter swap rebalancing — skipping a workout now offered to replace an upcoming session',det:'Intermediate version before the full auto-cascade in v1.25. When skipping a gym day, the app offered two options: move the workout to a free rest day, or replace a different upcoming gym session with the missed type. This was replaced in v1.25 with fully automatic cascading.'},
  {v:'1.21',d:'Your Activities card moved to My Training tab — activities and goals now live together',det:'The Your Activities card was previously in Settings. Moved it to the My Training tab so all your training setup — goals, activities, PRs — lives in one place. Settings is now purely about configuration (AI coach, gym, Strava, account).'},
  {v:'1.20',d:'Progress and Settings split into separate tabs — cleaner navigation',det:'The old Progress tab was getting crowded — it had PRs, history, goals, AND settings all mixed in. Split into My Training (PRs, history, goals, activities) and Settings (AI coach, gym profile, Strava, account, What\'s New). The bottom nav now has three tabs: Plan, My Training, Settings.'},
  {v:'1.19',d:'App loads faster — service worker caching for instant return visits, Firebase scripts deferred',det:'Added a service worker (sw.js) that caches the app shell on first visit. Every return visit loads instantly from cache and updates in the background. Also moved Firebase scripts to deferred loading so they don\'t block the initial render — Firebase only initialises after the page is ready.'},
  {v:'1.18',d:'Strava auto-syncs on app open if last sync was over 1 hour ago — no manual tap needed',det:'On every app open, checks the timestamp of the last Strava sync. If it was more than 60 minutes ago and you have a valid Strava token, a background sync runs automatically. Ride data is always fresh without you having to remember to tap Sync.'},
  {v:'1.17',d:'Edit PR sheet spacing fixed — better padding and breathing room around inputs',det:'The edit PR bottom sheet had inputs sitting too close to the card edges. Fixed padding on all sides so the sheet is comfortable to use on small screens.'},
  {v:'1.16',d:'Rest day swap now offers to move the workout to another rest day to keep your weekly goal on track',det:'Early version of the rebalancing logic. When swapping a workout to rest, the app checked for other rest days in the same week and offered to slot the workout there. Evolved into the full cascade in v1.22 and v1.25.'},
  {v:'1.15',d:'Goals are now multi-select; biological sex question added to onboarding; skip option on every step',det:'Previously you could only pick one goal (e.g. Build muscle OR Lose weight). Now you can select multiple. Biological sex was added so the app can tailor coaching — only Male and Female options. Every onboarding step now has a Skip option so you\'re never forced to answer before you\'re ready.'},
  {v:'1.14',d:'Strava connect now shows a success toast with ride count; error toast if connection fails',det:'After Strava OAuth completes, the app now shows a green toast confirming how many rides were synced, or a red toast with the error message if something went wrong. Previously there was no feedback at all.'},
  {v:'1.13',d:'Goals onboarding — set your activities and goal; non-cyclists no longer get bike days in their plan',det:'Added the goals setup flow: pick your activities, training days per week, experience level, and goals. The weekly plan generator now checks your selected activities — if cycling isn\'t in your list, no ride days appear in your plan.'},
  {v:'1.12',d:'Coach Says fetches all 4 mood notes in one API call — switching energy is now instant with zero extra calls',det:'Previously each energy level tap (Fresh/Okay/Tired/Sore) triggered a new API call. Now the app fetches all four mood variants in a single call on page load and caches them. Switching how you feel is instant and uses no extra quota.'},
  {v:'1.11',d:'Coach Says skips the API entirely for new users with no training data — shows a personalised explainer instead',det:'New users with no logged workouts got a generic or broken AI response. Now the app detects no training history and shows a built-in welcome message instead of wasting an API call.'},
  {v:'1.10',d:'Exercise Coach tips hardcoded for all 61 exercises — instant, works offline, zero API usage',det:'Exercise-specific coaching tips (connection cue, setup, rep execution, what to avoid, today\'s focus) are now baked into the app for all 61 exercises. No API call needed — tips appear instantly and work with no internet.'},
  {v:'1.9', d:'AI fallback chain added — Gemini → Perplexity → OpenAI so coaching never goes down when quota is hit',det:'The Cloudflare Worker now tries three AI providers in order: Gemini 2.5 Flash first, then Perplexity Sonar if Gemini hits its quota (429), then GPT-4o-mini if Perplexity also fails. All responses are normalised to the same format so the app never knows which provider responded.'},
  {v:'1.8', d:'Login fixed to support real Gmail addresses; Forgot Password button added',det:'Firebase email auth was rejecting some valid Gmail addresses due to a validation bug. Fixed. Also added a Forgot Password button that triggers Firebase\'s password reset email flow.'},
  {v:'1.7', d:'Edit PR modal overhauled — live lb↔kg conversion, current PR shown, better layout',det:'The edit PR sheet now shows your current PR value at the top, supports live unit conversion as you type (switch between kg and lb), and has a cleaner layout with proper spacing.'},
  {v:'1.6', d:'iOS PWA: install to home screen, correct app icon, social share preview image added',det:'Added the apple-touch-icon so the correct icon appears when you add the app to your iPhone home screen. Also added Open Graph meta tags so sharing the link shows a proper preview image instead of a blank card.'},
  {v:'1.5', d:'Exercise Coach overhauled — 5-section muscle-activation guide: Connect, Setup, Rep, Avoid, Today',det:'Replaced the single-paragraph coach tip with a structured 5-section breakdown for every exercise: muscle connection cue, setup position, rep execution, common mistakes to avoid, and a session-specific focus based on your energy level and PRs.'},
  {v:'1.4', d:'Coach Says introduced — AI pre-workout note personalised to energy level and PR history via Gemini',det:'Added the Coach Says card on the workout day screen. It sends your energy level, current PRs, and workout type to Gemini and returns a short personalised coaching note. Cached per session so it doesn\'t re-fetch on every render.'},
  {v:'1.3', d:'Energy selector (Fresh / Okay / Tired / Sore) added — exercises and coach adapt to how you feel',det:'Added a 4-state energy selector at the top of each workout day. The AI coach adjusts its tone and advice based on your selection. Tired/Sore states also show a reduced-intensity note on the session.'},
  {v:'1.2', d:'Strava integration — sync real ride data, gym profile picker, bike setup wizard',det:'Full Strava OAuth flow via Cloudflare Worker (keeps client secret off the device). Syncs recent rides and displays them in the plan. Added a gym picker with live search across a database of gyms, home gym equipment list, and a bike setup wizard with event target date and peak/taper periodisation.'},
  {v:'1.1', d:'Cycling planner added — weather-based outdoor/indoor day selection, Zone 2 ride blocks',det:'Added cycling days to the weekly plan. The app fetches weather for your location and recommends outdoor vs indoor based on temperature and rain. Ride sessions are Zone 2 blocks with progressive duration scaling across the week.'},
  {v:'1.0', d:'Exercise cards with GIF animations, collapse/expand, and muscle group banners added',det:'Added animated GIF demos to every exercise card. Cards collapse by default to keep the session view clean and expand on tap. Muscle group colour banners (Push/Pull/Legs) added to each session header.'},
  {v:'0.9', d:'Google Sign-In via Firebase replaced GitHub Gist sync — no setup required, works across devices',det:'Replaced the original GitHub Gist sync (which required a personal access token) with Firebase Auth + Realtime Database. Sign in with Google in one tap, data syncs automatically across all your devices.'},
  {v:'0.8', d:'Guest preview mode added — try the app without signing up, with sample data throughout',det:'Added a guest mode that pre-loads sample PRs, a sample weekly plan, and lets you explore all features without creating an account. Guest mode never makes API calls and never writes to the database.'},
  {v:'0.7', d:'PIN lock screen added — app locks on close, auto-unlocks on PWA open if no PIN is set',det:'Added an optional 4-digit PIN that locks the app when you close it. If no PIN is set, the app opens straight to the plan. PIN is stored locally and never sent to any server.'},
  {v:'0.6', d:'kg / lb toggle added — switch units in the log modal, all weights convert automatically',det:'Added a unit toggle in the set logging modal. Switching between kg and lb converts all displayed weights in real time. Preference is saved and applied globally across PRs and logging.'},
  {v:'0.5', d:'Workout history added — last 90 days of sessions; export and import backup for your data',det:'Added a workout history view showing the last 90 days of logged sessions with exercise count and sets. Also added export (downloads a JSON backup) and import (restores from a JSON file) for full data portability.'},
  {v:'0.4', d:'Per-exercise swap added — change any exercise mid-workout when machines are busy',det:'Added a Swap button on every exercise card during a session. Tapping it shows alternative exercises for the same muscle slot — so if the bench press is taken you can switch to dumbbell press without leaving the workout.'},
  {v:'0.3', d:'Inline set logging added — track weight × reps for every set with a done checkbox',det:'Added set-by-set logging directly on the exercise cards. Each set has weight, reps, and a done checkbox. Completed sets are highlighted and counted. Data saves automatically to localStorage and Firebase on each tap.'},
  {v:'0.2', d:'Change Workout button added to day screen — swap to a different workout type on the fly',det:'Added the Swap button to the day view. Lets you switch the day\'s workout type (e.g. Push → Pull) without going back to the weekly plan. The session regenerates immediately with the new type.'},
  {v:'0.1', d:'Initial build — weather-driven weekly planner, Push / Pull / Legs splits, exercise library, and PR tracking',det:'First working version. Weekly plan generated based on number of training days. Push/Pull/Legs splits with a fixed exercise library. Weather fetched from Open-Meteo and used to pick outdoor vs indoor days. PR tracking with localStorage persistence.'},
];

const GEMINI_PROXY='https://training-brain-ai.ht9323.workers.dev';
const STRAVA_CLIENT_ID='248514';
const STRAVA_REDIRECT='https://nipshardaf.github.io/training-brain/';
const _coachCache={};
const _coachInFlight={}; // in-memory guard against duplicate concurrent batch calls
// PR group open/closed state (UI only — not persisted)
const _prGroupOpen={Push:true,Pull:false,Legs:false,Core:false,Other:false};
// Map EX.g values → display group
const _EX_GROUP={
