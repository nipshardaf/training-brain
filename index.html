// 4-week repeating block: weeks 0-2 progressive build, week 3 recovery.
// Long ride = endurance anchor (duration progresses). Short ride = quality session that rotates.
const RIDE_PHASE=['Build week 1','Build week 2','Peak week','Recovery week'];
const RIDE_LONG_DUR=[60,75,90,50];
const RIDE_QUALITY_SEQ=['tempo','sweetspot','hills','recovery'];

function getRideWeek(){
  let start=DB.get('bike_block_start',null);
  if(!start){start=fd(S.weekStart);DB.set('bike_block_start',start);}
  const startMon=new Date(start+'T12:00:00');
  const weeks=Math.round((S.weekStart-startMon)/6048e5); // 6048e5 ms = 7 days
  const block=Math.max(0,Math.floor(weeks/4));
  // E: event-aware periodization
  const ev=DB.get('bike_event',null);
  if(ev?.date){
    const evDate=new Date(ev.date+'T12:00:00');
    const weeksToEvent=Math.round((evDate-S.weekStart)/6048e5);
    if(weeksToEvent<=0)  return{wk:0,block,phase:'done',weeksToEvent:0,ev};
    if(weeksToEvent===1) return{wk:3,block,phase:'taper',weeksToEvent:1,ev};
    if(weeksToEvent===2) return{wk:2,block,phase:'peak',weeksToEvent:2,ev};
    return{wk:((weeks%4)+4)%4,block,phase:'build',weeksToEvent,ev};
  }
  return{wk:((weeks%4)+4)%4,block,phase:'build',weeksToEvent:null,ev:null};
}

function getRideSession(type){
  const{wk,block,phase,weeksToEvent,ev}=getRideWeek();
  const indoor=type.includes('INDOOR');
  // A: use onboarding starting duration + goal progression rate
  const setup=DB.get('bike_setup',{dur:45,goal:'base'});
  const goalRate={base:15,event:20,active:10}[setup.goal]||15;
  // C: apply Strava adapt factor
  const adaptFactor=DB.get('bike_adapt_factor',1.0);

  // E: compute event-aware long ride duration
  function eventLongDur(){
    if(!ev?.date||weeksToEvent===null) return null;
    const distKm=ev.unit==='mi'?ev.dist*1.609:ev.dist;
    const targetDur=Math.min(Math.round(distKm/22*60*0.75/5)*5,180);
    if(phase==='taper') return Math.max(Math.round(targetDur*0.5/5)*5,20);
    if(phase==='peak')  return targetDur;
    const buildWeeks=Math.max(weeksToEvent-2,1);
    const prog=Math.min(1,(block*4+wk)/buildWeeks);
    return Math.min(Math.round((setup.dur+(targetDur-setup.dur)*prog)*adaptFactor/5)*5,180);
  }

  if(type.includes('LONG')){
    let dur=eventLongDur();
    if(dur===null){
      dur=setup.dur+(wk<3?wk*goalRate+block*10:Math.round(setup.dur*0.6));
      dur=Math.min(Math.round(dur*adaptFactor/5)*5,150);
    }
    const phaseLabel=phase==='taper'?'Taper week — event next week!':phase==='peak'?'Peak week — longest ride':phase==='done'?'Post-event recovery':RIDE_PHASE[wk];
    const focusText=phase==='taper'?'Legs are loaded — this is a confidence ride, not a training ride. Keep it genuinely easy and arrive at your event fresh.':phase==='peak'?'Your longest training ride. You\'ve earned this distance — the event distance will feel achievable after today.':wk===3?'Recovery week — keep it genuinely easy. Lower volume lets your body absorb the last 3 weeks of work.':'Your aerobic engine builder. The discipline is staying in Zone 2 even when the legs feel great.';
    return{
      name:'Endurance Ride',phase:phaseLabel,total:dur,
      blocks:[
        {t:'10 min',d:'Easy warm-up — spin up gradually, cadence 85-95 RPM'},
        {t:(dur-15)+' min',d:phase==='taper'?'Easy Zone 1-2 — conversational, save the legs. HR under 130.':'Steady Zone 2 — HR 120-140, fully conversational pace'},
        {t:'5 min',d:'Easy cool-down spin'},
      ],
      focus:focusText,
    };
  }

  // E: taper short ride — easy legs shake-out
  if(phase==='taper'){
    return{
      name:'Event Prep Spin',phase:'Taper — event this week!',total:35,
      blocks:[
        {t:'10 min',d:'Easy warm-up spin — just get the blood moving'},
        {t:'3 × 2 min',d:'Race-pace efforts — wake the legs up, not a workout. 3 min easy spin between each'},
        {t:'10 min',d:'Easy cool-down'},
      ],
      focus:'Your legs are loaded from weeks of training. This isn\'t a workout — it\'s a reminder to your neuromuscular system what the event pace feels like. Resist the urge to train hard.',
    };
  }
  // E: peak short ride — race-pace sharpener
  if(phase==='peak'&&ev?.date){
    return{
      name:'Race-Pace Sharpener',phase:'Peak week',total:60,
      blocks:[
        {t:'15 min',d:'Warm-up with 3 × 30s accelerations to wake up the fast-twitch fibres'},
        {t:'4 × 8 min',d:'At your target event pace — effort should feel "hard but sustainable for an hour". 3 min easy spin between'},
        {t:'10 min',d:'Easy cool-down — spin out any residual fatigue'},
      ],
      focus:'Your last hard quality session before the event. You\'re sharpening, not building — the fitness is already there. Trust the training.',
    };
  }

  // Quality (shorter) ride — rotates each phase week
  const q=RIDE_QUALITY_SEQ[wk];
  if(q==='tempo')return{
    name:'Tempo Intervals',phase:RIDE_PHASE[wk],total:55,
    blocks:[
      {t:'15 min',d:'Warm-up — build from easy to low Zone 2'},
      {t:'2 × 12 min',d:'Tempo — Zone 3, HR 140-155, steady & strong. 5 min easy spin between'},
      {t:'10 min',d:'Easy cool-down'},
    ],
    focus:'Tempo teaches your body to clear lactate efficiently — the bridge between easy riding and hard efforts.',
  };
  if(q==='sweetspot')return{
    name:'Sweet Spot',phase:RIDE_PHASE[wk],total:60,
    blocks:[
      {t:'15 min',d:'Warm-up with 2-3 short 30s pickups near the end'},
      {t:'3 × 10 min',d:'Sweet Spot — strong but controlled (~88-93% of threshold). 5 min recovery between'},
      {t:'10 min',d:'Easy cool-down'},
    ],
    focus:'The best return-on-time interval for raising sustainable power. Hard, but you should finish each block — not bury yourself.',
  };
  if(q==='hills')return{
    name:'Hill Repeats',phase:RIDE_PHASE[wk],total:55,
    blocks:[
      {t:'15 min',d:'Warm-up — easy spinning to the climb'},
      {t:'5 × 4 min',d:indoor?'High resistance, low cadence 60-70 RPM, strong & seated. Easy 3 min spin between':'Hill climbs — strong seated effort, low cadence. Easy descent to recover'},
      {t:'10 min',d:'Easy cool-down'},
    ],
    focus:'Hills build leg strength and force production — power that carries over to every other ride.',
  };
  return{
    name:'Recovery Spin',phase:RIDE_PHASE[wk],total:35,
    blocks:[
      {t:'35 min',d:'Very easy — Zone 1, light pressure on the pedals, high cadence 90+ RPM, flat route'},
    ],
    focus:'This is not training — it\'s active recovery. If you feel any strain, you\'re going too hard.',
  };
}

  cable_curl:['bb_curl'],               db_curl:['bb_curl'],
};
function applyEnergySwap(exs,energy){
  if(energy==='okay')return exs;
  const map=energy==='fresh'?SWAP_HEAVY:SWAP_LIGHT;
  // Pre-populate used with current plan so we never swap TO something already there
  const used=new Set(exs);
  const result=[];
  for(const id of exs){
    used.delete(id); // allow this slot to be replaced
    const alts=map[id]||[];
    const picked=alts.find(a=>EX[a]&&!used.has(a))||id;
    used.add(picked);
    result.push(picked);
  }
  return result;
}

async function fetchWeather(lat,lon,startStr,force=false){
  // Cache per week-start + coarse location for 3 hours — avoids re-hitting the API on every regenerate
  // force=true (explicit user refresh) bypasses the cache so stale mid-week results don't persist
  const ck='weather_'+startStr+'_'+lat.toFixed(2)+'_'+lon.toFixed(2);
  const cached=DB.get(ck,null);
  if(!force&&cached&&cached.t&&(Date.now()-cached.t)<10800000&&Array.isArray(cached.d))return cached.d;
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,windspeed_10m_max,weathercode&timezone=auto&forecast_days=16`;
  const r=await fetch(url);if(!r.ok)throw new Error();
  const data=await r.json();const d=data.daily;
  // Build 7 days from startStr — look each date up individually.
  // Past days won't be in the forecast; fill them with neutral placeholders
  // so Mon/Tue never disappear when you regenerate mid-week.
  const result=Array.from({length:7},(_,i)=>{
    const dateStr=fd(addDays(new Date(startStr+'T12:00:00'),i));
    const idx=d.time.indexOf(dateStr);
    if(idx>=0)return{
      date:dateStr,
      tmax:Math.round(d.temperature_2m_max[idx]),
      tmin:Math.round(d.temperature_2m_min[idx]),
      rain:Math.round(d.precipitation_sum[idx]*10)/10,
      wind:Math.round(d.windspeed_10m_max[idx]),
      code:d.weathercode[idx],
      score:bikeScore(d.precipitation_sum[idx],d.windspeed_10m_max[idx],d.temperature_2m_max[idx]),
    };
    // Past day — preserve existing plan entry weather if available, else use placeholder
    const existing=DB.get(DB.pk(S.weekStart),null)?.find(x=>x.date===dateStr);
    return existing?.weather||{date:dateStr,tmax:15,tmin:5,rain:0,wind:10,code:1,score:0};
  });
  DB.set(ck,{t:Date.now(),d:result});
  return result;
}
function bikeScore(rain,wind,tmax){
  let s=100;
  if(rain>10)return 0;
  if(rain>5)s-=40;else if(rain>2)s-=20;else if(rain>0.5)s-=8;
  if(wind>40)s-=30;else if(wind>25)s-=15;else if(wind>15)s-=5;
  if(tmax<3)s-=40;else if(tmax<8)s-=15;
  return Math.max(0,Math.round(s));
}
function wIcon(code,rain){
  if(rain>5)return'🌧';if(rain>1)return'🌦';
  if(code>=95)return'⛈';if(code>=80)return'🌧';if(code>=71)return'❄️';
  if(code>=51)return'🌦';if(code>=3)return'☁️';if(code>=1)return'⛅';return'☀️';
}
function verdict(score){
  if(score>=75)return{t:'Great day to ride',c:'vg'};
  if(score>=50)return{t:'Rideable',c:'vo'};
  if(score>=25)return{t:'Borderline',c:'vw'};
  return{t:'Gym day',c:'vb'};
}

// Resolve the user's effective goal profile by blending all selected goals.
// Equal weights by default; weighted by profile.goalRanks if set.
function blendGoalProfile(goalIds,ranks){
  const ids=(goalIds||[]).filter(g=>GOAL_PROFILES[g]);
  if(!ids.length)return GOAL_PROFILES.fitness;
  if(ids.length===1)return GOAL_PROFILES[ids[0]];
  const hasRanks=ranks&&typeof ranks==='object'&&Object.keys(ranks).length;
  const rawWeights=ids.map(id=>hasRanks?(1/(ranks[id]||ids.length)):1);
  const sumW=rawWeights.reduce((s,w)=>s+w,0);
  const w=rawWeights.map(x=>x/sumW);
  const numericFields=['gym_ratio','cardio_ratio','rep_low','rep_high','rpe_low','rpe_high','sets_per_muscle_week','progression_step_kg','progression_step_lb'];
  const blend={id:'blended'};
  for(const f of numericFields)blend[f]=ids.reduce((s,id,i)=>s+GOAL_PROFILES[id][f]*w[i],0);
  blend.rep_low=Math.round(blend.rep_low);
  blend.rep_high=Math.round(blend.rep_high);
  blend.sets_per_muscle_week=Math.round(blend.sets_per_muscle_week);
  const topIdx=w.indexOf(Math.max(...w));
  blend.exercise_bias=GOAL_PROFILES[ids[topIdx]].exercise_bias;
  blend.cardio_focus=GOAL_PROFILES[ids[topIdx]].cardio_focus;
  blend.label=ids.map(id=>GOAL_PROFILES[id].label.replace(/^.\s*/,'')).join(' + ');
  return blend;
}

function getActiveGoalProfile(){
  const p=DB.get('user_profile',{})||{};
  const goals=p.goals||(p.goal?[p.goal]:[]);
  return blendGoalProfile(goals,p.goalRanks);
}

function getLastGymType(){
  // Scan back up to 28 days for the last completed gym workout type
  for(let i=1;i<=28;i++){
    const d=addDays(new Date(),-i);
    const log=DB.get(DB.lk(d),null);
    if(log?.exercises?.some(e=>e.sets.some(s=>s.done))){
      const plan=DB.get(DB.pk(getMon(d)),null);
      const dp=plan?.find(x=>x.date===fd(d));
      if(dp&&GYM_SEQ.includes(dp.type))return dp.type;
    }
  }
  return'UPPER_PUMP'; // default so PUSH comes next
}

// Returns the gym type with the LONGEST gap since it was last completed.
// Used to anchor next week's rotation so neglected muscle groups get priority.
// v2.64: addresses the case where the rotation-continuation logic would
// otherwise repeat a recently-done type ahead of a long-skipped one.
// e.g. user did Pull (Wed) then Push (Fri) — old logic: next=Pull (repeats),
//      new logic: next=Legs (longest gap, never done in 14 days).
function getMostNeededGymType(){
  // v2.82: PRIMARY signal — anything planned in the last 7 days that wasn't done?
  // A directly-missed workout is the clearest "catch this up" signal there is.
  // We anchor the new week's rotation on the EARLIEST missed type so the user's
  // first gym day of the new week hits whatever they skipped longest ago.
  const missedRecently=[];
  for(let i=1;i<=7;i++){
    const d=addDays(new Date(),-i);
    const plan=DB.get(DB.pk(getMon(d)),null);
    const dp=plan?.find(x=>x.date===fd(d));
    if(dp&&GYM_SEQ.includes(dp.type)){
      const log=DB.get(DB.lk(d),null);
      const done=log?.exercises?.some(e=>e.sets?.some(s=>s.done));
      if(!done)missedRecently.push({type:dp.type,daysAgo:i});
    }
  }
  if(missedRecently.length){
    // Most overdue (largest daysAgo) goes first. Walking GYM_SEQ from there picks up
    // any later misses naturally — e.g. missed LEGS (5d ago) + UPPER (2d ago) →
    // rotation = LEGS, UPPER, PUSH, PULL → both missed types come first.
    missedRecently.sort((a,b)=>b.daysAgo-a.daysAgo);
    return missedRecently[0].type;
  }

  // FALLBACK: nothing was planned-but-skipped — use longest-gap logic.
  // Track how many days ago each gym type was last completed.
  const lastSeen={PUSH:-Infinity,PULL:-Infinity,LEGS:-Infinity,UPPER_PUMP:-Infinity};
  for(let i=1;i<=14;i++){
    const d=addDays(new Date(),-i);
    const log=DB.get(DB.lk(d),null);
    if(log?.exercises?.some(e=>e.sets.some(s=>s.done))){
      const plan=DB.get(DB.pk(getMon(d)),null);
      const dp=plan?.find(x=>x.date===fd(d));
      if(dp&&GYM_SEQ.includes(dp.type)){
        if(lastSeen[dp.type]===-Infinity)lastSeen[dp.type]=i;
      }
    }
  }
  // Any type never seen in the window? It's the highest-priority skipped type.
  for(const t of GYM_SEQ){
    if(lastSeen[t]===-Infinity)return t;
  }
  // All types done recently — return the one done longest ago.
  return Object.entries(lastSeen).sort((a,b)=>b[1]-a[1])[0][0];
}

// v2.80: Inspect the PRIOR week (Mon→Sun before this one) and return what was planned
// but not actually done. Used to surface a "catching up" notice on the week view so the
// user can SEE that the plan considered their misses (the catch-up logic in
// getMostNeededGymType is otherwise silent).
function getMissedLastWeek(){
  const lastMon=getMon(addDays(S.weekStart,-7));
  const lastPlan=DB.get(DB.pk(lastMon),null);
  if(!lastPlan)return{gym:[],rides:0,total:0};
  const gymTypes=new Set(['PUSH','PULL','LEGS','UPPER_PUMP']);
  const rideTypes=new Set(['LONG_OUTDOOR','SHORT_OUTDOOR','LONG_INDOOR','SHORT_INDOOR']);
  const today=fd(new Date());
  const missedGym=[];let missedRides=0;
  for(const day of lastPlan){
    if(day.date>=today)continue; // only count days that have passed
    const log=DB.get('log_'+day.date,null);
    const hasGymLog=log?.exercises?.some(e=>e.sets?.some(s=>s.done));
    if(gymTypes.has(day.type)&&!hasGymLog){
      missedGym.push({type:day.type,date:day.date});
    }else if(rideTypes.has(day.type)){
      // Ride is "done" if Strava synced an activity OR user logged a ride manually
      const hasStrava=(typeof stravaRideOnDate==='function')&&!!stravaRideOnDate(day.date);
      const hasManual=log?.ride?.dur!=null;
      if(!hasStrava&&!hasManual)missedRides++;
    }
  }
  return{gym:missedGym,rides:missedRides,total:missedGym.length+missedRides};
}

function dismissCatchUp(){
  DB.set('catchup_dismissed_'+fd(S.weekStart),true);
  render();
}

// v2.83: Auto-skip + cascade. When a past day in the current week had a workout
// planned but nothing was logged, mark the day SKIPPED and shift its workout into
// the next non-completed day, cascading later days forward by one position. So:
// missed Tue Push + today Wed (originally Legs) → Tue=SKIPPED, Wed=Push, Thu=Legs…
// Runs idempotently at every render of the current week. Never touches:
//   - already-completed days (logged sets / completed flag / Strava ride)
//   - REST days (skipping a rest day is not interesting)
//   - already-SKIPPED days
//   - days in the future (today included — user may still log)
function _dayPayload(d){const p={};for(const k in d)if(k!=='date')p[k]=d[k];return p;}
function _setDayPayload(d,p){for(const k of Object.keys(d))if(k!=='date')delete d[k];Object.assign(d,p);}
function _dayWasDone(d){
  const log=DB.get('log_'+d.date,null);
  if(log?.completed)return true;
  if(log?.exercises?.some(e=>e.sets?.some(s=>s.done)))return true;
  if(log?.ride?.dur!=null)return true;
  if(typeof stravaRideOnDate==='function'&&stravaRideOnDate(d.date))return true;
  return false;
}
function applyAutoSkipShift(){
  // Only operate on the currently-displayed week, and only if it's the current week.
  const todayMon=getMon(new Date());
  if(+S.weekStart!==+todayMon)return false;
  const pk=DB.pk(S.weekStart);
  const plan=DB.get(pk,null);
  if(!plan||!plan.length)return false;
  const sorted=[...plan].sort((a,b)=>a.date.localeCompare(b.date));
  const todayStr=fd(new Date());
  let changed=false;

  // Reusable: cascade ONE payload into this week — slot it into the first non-completed,
  // non-SKIPPED day, pushing later payloads down by one. Trailing payloads fall off (they
  // become catch-up signal for NEXT week via getMostNeededGymType).
  function _cascadeIn(carry){
    for(let j=0;j<sorted.length;j++){
      const futDay=sorted[j];
      if(_dayWasDone(futDay))break;
      if(futDay.type==='SKIPPED')continue;
      const next=_dayPayload(futDay);
      _setDayPayload(futDay,carry);
      carry=next;
    }
  }

  // v2.84: also pull in LAST week's trailing misses. Scan back from last Sunday: each
  // workout day with no log gets cascaded into this week. Stops at the first day that
  // WAS done (so we never drag earlier complete sessions forward). Most-recent miss
  // cascades first so the OLDEST miss ends up on Monday (chronological catch-up).
  const lastMonDate=getMon(addDays(S.weekStart,-7));
  const lastPk=DB.pk(lastMonDate);
  const lastPlan=DB.get(lastPk,null);
  if(lastPlan&&lastPlan.length){
    const lastSorted=[...lastPlan].sort((a,b)=>a.date.localeCompare(b.date));
    const carryIns=[]; // most-recent miss first (matches cascade-order requirement)
    for(let li=lastSorted.length-1;li>=0;li--){
      const ld=lastSorted[li];
      if(_dayWasDone(ld))break;                         // hit a completed day — stop
      if(ld.type==='SKIPPED'||ld.type==='REST')continue; // not a missed workout
      carryIns.push({orig:_dayPayload(ld),dayRef:ld});
    }
    if(carryIns.length){
      for(const c of carryIns){
        _cascadeIn(c.orig);
        _setDayPayload(c.dayRef,{type:'SKIPPED',weather:c.orig.weather||{score:0,code:1,tmax:15,tmin:5,rain:0,wind:10}});
      }
      DB.set(lastPk,lastSorted);
      changed=true;
    }
  }

  for(let i=0;i<sorted.length;i++){
    const day=sorted[i];
    if(day.date>=todayStr)break;          // only past days
    if(day.type==='SKIPPED'||day.type==='REST')continue;
    if(_dayWasDone(day))continue;
    // This day was missed — carry its payload forward, cascading later uncompleted days
    const orig=_dayPayload(day); // capture original (incl. weather) before cascade clobbers it
    let carry=orig;
    for(let j=i+1;j<sorted.length;j++){
      const futDay=sorted[j];
      if(_dayWasDone(futDay))break;       // hit a locked day — stop cascading
      if(futDay.type==='SKIPPED')continue; // step over earlier skipped slots
      const next=_dayPayload(futDay);
      _setDayPayload(futDay,carry);
      carry=next;
    }
    // Preserve weather so the day-row renderer (which reads day.weather) keeps working
    _setDayPayload(day,{type:'SKIPPED',weather:orig.weather||{score:0,code:1,tmax:15,tmin:5,rain:0,wind:10}});
    changed=true;
  }
  if(changed)DB.set(pk,sorted);
  return changed;
}

function rCatchUpBanner(){
  // Only show on the CURRENT or future week (not historical weeks)
  const todayMon=getMon(new Date());
  if(S.weekStart<todayMon)return'';
  if(DB.get('catchup_dismissed_'+fd(S.weekStart),false))return'';
  const m=getMissedLastWeek();
  if(!m.total)return'';
  const tl={PUSH:'Push',PULL:'Pull',LEGS:'Legs',UPPER_PUMP:'Upper'};
  const gymNames=[...new Set(m.gym.map(g=>tl[g.type]||g.type))];
  const parts=[];
  if(gymNames.length)parts.push(gymNames.join(' + '));
  if(m.rides)parts.push(`${m.rides} ride${m.rides>1?'s':''}`);
  // What did the planner prioritise?
  const needed=getMostNeededGymType();
  const prioritised=tl[needed]||needed;
  const gymCaughtUp=gymNames.length>0;
  return`<div style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.35);border-radius:14px;padding:12px 14px;margin:0 0 12px;display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.5">
  <div style="font-size:18px;line-height:1;flex-shrink:0">🔄</div>
  <div style="flex:1;color:var(--t1)">
    <div style="font-weight:700;margin-bottom:2px">Last week you missed ${parts.join(' · ')}</div>
    <div style="color:var(--t2);font-size:12px">${gymCaughtUp?`This week starts with <b>${prioritised}</b> to catch up.`:`Your rides catch up automatically as you log them this week.`}</div>
  </div>
  <button onclick="dismissCatchUp()" style="background:none;border:none;color:var(--t2);font-size:18px;cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0" title="Dismiss">×</button>
</div>`;
}

function buildWeek(wdays){
  const bikePref=DB.get('bike_pref','weather');
  const profile=DB.get('user_profile',{});
  // Honour the user's training-days-per-week setting (default 4, range 3-6)
  const targetDays=Math.min(6,Math.max(3,profile.days||4));
  // Safety net: if wdays is ever short (e.g. stale cache), pad to 7 full days
  while(wdays.length<7){
    const i=wdays.length;
    const dateStr=fd(addDays(S.weekStart,i));
    const existing=DB.get(DB.pk(S.weekStart),null)?.find(x=>x.date===dateStr);
    wdays.push(existing?.weather||{date:dateStr,tmax:15,tmin:5,rain:0,wind:10,code:1,score:0});
  }
  const ranked=[...wdays].map((d,i)=>({i,s:d.score})).sort((a,b)=>b.s-a.s);
  const rankedAsc=[...ranked].reverse(); // worst weather first — used to pick rest days

  // Lock days that already have completed activity — preserve on refresh.
  // Keyed by DATE STRING (not position) so a previously disordered plan can't corrupt a fresh rebuild.
  // Locks: day marked completed OR any sets done OR a Strava ride on a planned ride day.
  const existingPlan=DB.get(DB.pk(S.weekStart),null);
  const locked={}; // dateStr → existing plan entry
  // Primary lock scan: walk all 7 days directly from logs (doesn't rely on plan entry existing)
  for(let _li=0;_li<7;_li++){
    const _ld=addDays(S.weekStart,_li);
    const _lds=fd(_ld);
    const _ll=DB.get(DB.lk(_ld),null);
    const _hasActivity=_ll?.completed||_ll?.exercises?.some(e=>e?.sets?.some(s=>s?.done));
    if(_hasActivity){
      const _lp=existingPlan?.find(dp=>dp.date===_lds);
      if(_lp)locked[_lds]=_lp;
    }
  }
  if(existingPlan){
    existingPlan.forEach(dp=>{
      if(locked[dp.date])return; // already locked above
      const log=DB.get(DB.lk(new Date(dp.date+'T12:00:00')),null);
      const rideTypes=['LONG_OUTDOOR','SHORT_OUTDOOR','LONG_INDOOR','SHORT_INDOOR'];
      const rideDone=(stravaRideOnDate(dp.date)||log?.ride?.dur!=null)&&rideTypes.includes(dp.type);
      if(rideDone)locked[dp.date]=dp;
    });
  }

  // mk: locked days are fully preserved. Non-locked days preserve exercise content
  // if the day type is unchanged (weather refresh = move days, don't wipe workouts).
  // Only regenerates exercises when the day type actually changes.
  const mk=(w,type)=>{
    if(locked[w.date])return{...locked[w.date],weather:w};
    const existingDay=existingPlan?.find(d=>d.date===w.date);
    if(existingDay&&existingDay.type===type&&existingDay.exercises?.length){
      return{...existingDay,weather:w}; // same type → keep exercises, just update weather
    }
    // v2.85: generate exercises for any type defined in SLOTS (covers GYM_SEQ + FULL_BODY)
    const exs=SLOTS[type]?genSession(type):null;
    return{date:w.date,type,exercises:exs,weather:w};
  };

  // v2.85: Short-week override. User flagged "I can only train N days this week"
  // via the ⏱️ button or AI coach. Skip the rotation/ride logic and build a
  // minimal plan: N FULL_BODY days on the best-weather slots, rest = REST.
  // Locked days are preserved as always.
  const weekCap=DB.get('week_capacity_'+fd(S.weekStart),null);
  if(weekCap&&weekCap>=1&&weekCap<=3){
    const numTrain=weekCap;
    // Available (non-locked) days, ranked by score (best weather first)
    const _avail=ranked.filter(r=>!locked[wdays[r.i]?.date]);
    const _pickedIdx=new Set(_avail.slice(0,numTrain).map(r=>r.i));
    // For 3 days, give the user a PPL split; for 1-2 days, full-body.
    const _types=numTrain===3?['PUSH','PULL','LEGS']:Array(numTrain).fill('FULL_BODY');
    const _trainOrder=[...wdays.keys()].filter(i=>_pickedIdx.has(i));
    return wdays.map((w,i)=>{
      if(locked[w.date])return{...locked[w.date],weather:w};
      if(_pickedIdx.has(i)){
        const slot=_trainOrder.indexOf(i);
        return mk(w,_types[slot]||'FULL_BODY');
      }
      return mk(w,'REST');
    });
  }

  // Assign gym types, respecting locked days. v2.64: starts the rotation from
  // the MOST-NEEDED type (longest gap) rather than just "next after last done".
  // This catches skipped muscle groups proactively.
  function assignGym(gymDays,asgn){
    const sorted=[...gymDays].sort((a,b)=>a-b);
    // If there's a locked day in the future, its type anchors the rotation
    // (continue PPL from after it). Otherwise, start at the most-needed type.
    let lockedType=null;
    for(const i of sorted){const d=wdays[i]?.date;if(locked[d]){lockedType=locked[d].type;break;}}
    let si;
    if(lockedType){
      si=(GYM_SEQ.indexOf(lockedType)+1)%GYM_SEQ.length;
    }else{
      const needed=getMostNeededGymType();
      si=GYM_SEQ.indexOf(needed);
    }
    for(const i of sorted){
      const d=wdays[i]?.date;
      if(locked[d]){asgn[i]=locked[d].type;}
      else{asgn[i]=GYM_SEQ[si];si=(si+1)%GYM_SEQ.length;}
    }
  }

  // ── Gym only (no cardio/rides) ────────────────────────────────────────────
  // targetDays gym sessions; remaining days are rest (worst weather first)
  if(bikePref==='none'){
    const numRest=7-targetDays;
    const restSet=new Set(rankedAsc.slice(0,numRest).map(r=>r.i));
    const gymDays=[0,1,2,3,4,5,6].filter(i=>!restSet.has(i));
    const asgn={};
    assignGym(gymDays,asgn);
    return wdays.map((w,i)=>mk(w,restSet.has(i)?'REST':asgn[i]||'REST'));
  }

  // ── With rides (weather or indoor) ───────────────────────────────────────
  // Strava rides already done this week fill the ride quota — don't double-book
  const stravaRideIdx=new Set();
  wdays.forEach((w,i)=>{if(stravaRideOnDate(w.date))stravaRideIdx.add(i);});

  // Goal-based target: how many ride days per week this user should have.
  // v2.59: uses blended goal profile's cardio_ratio (all goals contribute, not just first).
  // Ratio is clamped so the user always gets at least 1 ride day (if cycling/running active)
  // and never more than (targetDays - 1) — must leave room for at least one gym day.
  const _goals=profile.goals||(profile.goal?[profile.goal]:[]);
  const _gp=blendGoalProfile(_goals,profile.goalRanks);
  const _rawRides=Math.round(targetDays*_gp.cardio_ratio);
  const ridesTarget=Math.max(1,Math.min(targetDays-1,_rawRides,3));

  // New ride days still needed after subtracting Strava rides already done
  const numRides=Math.max(0,ridesTarget-stravaRideIdx.size);
  const numGym=Math.max(0,targetDays-ridesTarget);
  const numRest=7-targetDays;
  const OT=45;

  // Days available for NEW ride assignment (not already ridden, not locked)
  const _rideAvail=ranked.filter(r=>!stravaRideIdx.has(r.i)&&!locked[wdays[r.i]?.date]);

  // Pre-pass: find where LEGS lands so short ride avoids the day after it
  const tentativeRideSet=new Set(_rideAvail.slice(0,numRides).map(r=>r.i));
  const tentativeNonRide=[0,1,2,3,4,5,6].filter(i=>!tentativeRideSet.has(i)&&!stravaRideIdx.has(i)&&!locked[wdays[i]?.date]);
  const tentativeRestSet=new Set(
    rankedAsc.filter(r=>tentativeNonRide.includes(r.i)).slice(0,numRest).map(r=>r.i)
  );
  const tentativeGymDays=tentativeNonRide.filter(i=>!tentativeRestSet.has(i)).sort((a,b)=>a-b);
  let legsIdx=-1;
  {
    // v2.64: pre-pass uses the same most-needed-first rotation as assignGym
    // so the simulated walk matches what assignGym will produce, and legsIdx
    // correctly identifies where LEGS will land.
    const needed=getMostNeededGymType();
    let si=GYM_SEQ.indexOf(needed);
    for(const i of tentativeGymDays){
      const ld=locked[wdays[i]?.date];
      if(ld){if(ld.type==='LEGS')legsIdx=i;}
      else{if(GYM_SEQ[si]==='LEGS')legsIdx=i;si=(si+1)%GYM_SEQ.length;}
    }
  }
  const postLegsIdx=legsIdx>=0?(legsIdx+1)%7:-1;

  // Pick actual ride days: long on best weather first, then short avoiding adjacency
  const longCandidates=[..._rideAvail];
  const r1=numRides>=1?longCandidates[0]:null;
  // Penalise day immediately before/after the long ride AND day after LEGS
  const postLongIdx=r1!=null?(r1.i+1)%7:-1;
  const preLongIdx=r1!=null?(r1.i+6)%7:-1;
  const shortCandidates=[..._rideAvail].map(r=>({...r,s:
    r.i===postLegsIdx?r.s-40:
    r.i===postLongIdx?r.s-60:  // day after long ride — strongest penalty
    r.i===preLongIdx?r.s-40:   // day before long ride — moderate penalty
    r.s})).sort((a,b)=>b.s-a.s);
  const r2=numRides>=2?(shortCandidates.find(r=>r.i!==r1?.i)||null):null;
  const rideSet=new Set([...(r1?[r1.i]:[]),...(r2?[r2.i]:[])]);

  const t1=r1?(bikePref==='indoor'?'LONG_INDOOR':r1.s>=OT?'LONG_OUTDOOR':'LONG_INDOOR'):null;
  const t2=r2?(bikePref==='indoor'?'SHORT_INDOOR':r2.s>=OT?'SHORT_OUTDOOR':'SHORT_INDOOR'):null;

  // Remaining days (no new ride, no Strava ride, not locked) → gym or rest
  const nonRide=[0,1,2,3,4,5,6].filter(i=>!rideSet.has(i)&&!stravaRideIdx.has(i)&&!locked[wdays[i]?.date]);
  const restSet=new Set(
    rankedAsc.filter(r=>nonRide.includes(r.i)).slice(0,Math.min(numRest,nonRide.length)).map(r=>r.i)
  );
  const gymDays=nonRide.filter(i=>!restSet.has(i));
  const asgn={};
  assignGym(gymDays,asgn);

  return wdays.map((w,i)=>{
    let type;
    if(r1&&i===r1.i)type=t1;
    else if(r2&&i===r2.i)type=t2;
    else if(stravaRideIdx.has(i))type='REST'; // already rode — REST type; rDayRow shows Strava override
    else if(restSet.has(i))type='REST';
    else type=asgn[i]||'REST';
    return mk(w,type);
  });
}

/* ── SESSION GENERATION ── */
function genSession(type,energy='okay',bwOnly=false){
  const slots=SLOTS[type];
  const recent=DB.get('recent_ex',[]);
  const goalProfile=getActiveGoalProfile();
  const picked=[];
  for(const candidates of slots){
    let avail=filterSlot(candidates,bwOnly).filter(id=>!picked.includes(id));
    if(!avail.length)continue;
    // Energy filter — prefer compound when fresh, isolation when tired/sore
    if(energy==='fresh'){
      const comp=avail.filter(id=>EX[id]?.t==='C');
      if(comp.length)avail=comp;
    } else if(energy==='tired'||energy==='sore'){
      const iso=avail.filter(id=>EX[id]?.t==='I');
      if(iso.length)avail=iso;
    }
    // Goal-profile bias (v2.59) — applied on top of energy filter
    if(goalProfile.exercise_bias==='compound'||goalProfile.exercise_bias==='functional'){
      const comp=avail.filter(id=>EX[id]?.t==='C');
      if(comp.length>=1)avail=comp;
    }
    // 'balanced' = no additional filtering
    const sorted=[...avail].sort((a,b)=>{
      const ai=recent.indexOf(a),bi=recent.indexOf(b);
      if(ai===-1&&bi===-1)return Math.random()<.5?-1:1;
      if(ai===-1)return -1;if(bi===-1)return 1;
      return bi-ai;
    });
    picked.push(sorted[0]);
  }
  return picked;
}

function loadGifDb(){
  // p can be:
  //   string  → free-exercise-db folder name → GIF_BASE+p+'/0.jpg' / '/1.jpg'
  //   array   → direct image URLs [frame0, frame1?] (e.g. wger.de)
  Object.entries(EX).forEach(([id,ex])=>{
    if(!ex.p)return;
    if(Array.isArray(ex.p)){
      S.gifCache[id]={f0:ex.p[0],f1:ex.p[1]||ex.p[0]};
    } else {
      S.gifCache[id]={f0:GIF_BASE+ex.p+'/0.jpg',f1:GIF_BASE+ex.p+'/1.jpg'};
    }
  });
  patchGifs();
}
// Exercise ids whose GIF has loaded at least once this session. render() rebuilds
// the DOM (new <img> elements) on every call, so we key off the exercise id, not
// the element — lets us skip the Image() preload + placeholder flash on re-render.
const _gifLoaded=new Set();
function patchGifs(){
  document.querySelectorAll('.ex-gif[data-xid]').forEach(img=>loadExImg(img));
}
function loadExImg(img){
  const xid=img.dataset.xid;
  const entry=S.gifCache[xid];
  const wrap=img.closest('.ex-gif-wrap');
  const ph=wrap?.querySelector('.gif-ph');
  if(!entry){
    // No image path — show styled placeholder. Make it tappable to open a
    // video demo (no GIF exists for this exercise in the free databases).
    const ex=EX[xid];
    const style=G_PH[ex?.g]||{bg:'linear-gradient(135deg,#374151,#6b7280)',i:'💪'};
    if(ph)ph.innerHTML=`<div onclick="event.stopPropagation();openVid('${xid}')" style="width:100%;height:100%;background:${style.bg};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer"><div style="font-size:38px">${style.i}</div><div style="font-size:12px;font-weight:700;color:rgba(255,255,255,.85);text-align:center;padding:0 16px">${ex?.n||''}</div><div style="font-size:10px;color:rgba(255,255,255,.55)">${ex?.m||''}</div><div style="margin-top:6px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.3);border-radius:100px;padding:5px 13px">▶ Watch demo</div></div>`;
    return;
  }
  // Loaded earlier this session — the URL is warm in the HTTP cache, so paint it
  // straight away with no preload Image() and no placeholder fade on re-render.
  if(_gifLoaded.has(xid)){img.src=entry.f0;img.classList.add('on');if(ph)ph.classList.add('off');return;}
  const t=new Image();
  t.onload=()=>{_gifLoaded.add(xid);img.src=t.src;img.classList.add('on');if(ph)ph.classList.add('off');};
  t.onerror=()=>{
    // Path wrong/broken — fall back to the same tappable styled placeholder
    const ex=EX[xid];
    const style=G_PH[ex?.g]||{bg:'linear-gradient(135deg,#374151,#6b7280)',i:'💪'};
    if(ph)ph.innerHTML=`<div onclick="event.stopPropagation();openVid('${xid}')" style="width:100%;height:100%;background:${style.bg};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer"><div style="font-size:38px">${style.i}</div><div style="font-size:12px;font-weight:700;color:rgba(255,255,255,.85);text-align:center;padding:0 16px">${ex?.n||''}</div><div style="font-size:10px;color:rgba(255,255,255,.55)">${ex?.m||''}</div><div style="margin-top:6px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.3);border-radius:100px;padding:5px 13px">▶ Watch demo</div></div>`;
  };
  t.src=entry.f0;
}
function loadAllGifs(){patchGifs();}

// Animate between frame 0 and frame 1 on tap — simulates motion
function toggleAnim(xid,btn){
  const entry=S.gifCache[xid];
  if(!entry||!entry.f1){openVid(xid);return;} // no second frame → go straight to video
  const img=document.querySelector(`.ex-gif[data-xid="${xid}"]`);if(!img)return;
  if(_animTimers[xid]){
    clearInterval(_animTimers[xid]);delete _animTimers[xid];
    img.src=entry.f0;btn.textContent='▶';return;
  }
  let frame=0;
  _animTimers[xid]=setInterval(()=>{
    frame=1-frame;
    img.src=frame?entry.f1:entry.f0;
  },700);
  btn.textContent='⏹';
}

// Opens the demo-video sheet. Resolves a real embeddable YouTube video ID
// (cached per exercise, or fetched once via the worker) and plays it inline in

function openVid(xid){
  const ex=EX[xid];if(!ex)return;

  modal.id='vid-modal';
  modal.style.cssText='position:fixed;inset:0;z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:flex-end';

</div>`;
  document.body.appendChild(modal);
  _resolveAndPlayVid(xid);
}

async function _resolveAndPlayVid(xid){
  const ex=EX[xid];if(!ex)return;
  // 1. Cached video ID for this exercise?
  const cache=DB.get('yt_cache',{})||{};
  if(cache[xid]&&cache[xid].videoId){_renderVidPlayer(xid,cache[xid].videoId);return;}
  // 2. Ask the worker to resolve it (one search, then cached forever)
  try{
    const q=ex.n+' exercise proper form tutorial';
    const r=await fetch(GEMINI_PROXY+'/yt-search?q='+encodeURIComponent(q));
    if(r.ok){
      const data=await r.json();
      if(data&&data.videoId){
        cache[xid]={videoId:data.videoId,title:data.title||'',at:Date.now()};
        DB.set('yt_cache',cache);
        debouncedSync&&debouncedSync();
        _renderVidPlayer(xid,data.videoId);
        return;
      }
    }
  }catch(e){console.warn('yt-search failed:',e);}
  // 3. Fallback — search links (in-app player not available yet)
  _renderVidSearchLinks(xid);
}

function _renderVidPlayer(xid,videoId){
  const body=document.getElementById('vid-body');if(!body)return;
  body.innerHTML=`
  <div style="position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;margin-bottom:10px">
    <iframe src="https://www.youtube.com/embed/${videoId}?playsinline=1&rel=0&modestbranding=1" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="accelerometer;autoplay;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>
  </div>
  <button onclick="_renderVidSearchLinks('${xid}')" style="width:100%;background:var(--s2);border:1px solid var(--bord);border-radius:12px;color:var(--t2);font-size:12px;font-weight:600;padding:9px;cursor:pointer">🔍 Not the right one? Browse more</button>`;
}

function unit(){return DB.get('unit','lbs');}
function toggleUnit(){
  const cur=unit();
  const next=cur==='lbs'?'kg':'lbs';
  DB.set('unit',next);

  document.querySelectorAll('.w-inp').forEach(inp=>{
    const v=parseFloat(inp.value);

  });
  document.querySelectorAll('.unit-lbl').forEach(el=>el.textContent=next);

}

    else{errPin();_pinBuf='';}

    if(S.lockMode==='setup'){
      S.pinConfirm=_pinBuf;_pinBuf='';S.lockMode='confirm';render();

function initFirebase(){
  if(_fb)return true;
  try{
    _fb=firebase.initializeApp(FB_CFG,'tb');
    _fbAuth=firebase.auth(_fb);
    _fbDb=firebase.database(_fb);
    // Safari ITP blocks Firebase's hidden auth iframe — force LOCAL persistence
    // (localStorage) so auth state survives without cross-origin cookies.
    _fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
    // When Firebase resolves its own session (handles PWA re-open on iOS)
    _fbAuth.onAuthStateChanged(async user=>{
      if(user){
        // Derive username from internal email (username@training-brain.app) or cached
        const cached=DB.get('fb_user',null);
        const username=cached?.username||(user.email.endsWith('@training-brain.app')?user.email.split('@')[0]:null)||user.displayName||user.email.split('@')[0];
        S.fbUser={uid:user.uid,name:username,email:user.email,username};
        DB.set('fb_user',S.fbUser);
        // Auto-unlock if no PIN set — user already authenticated
        // Also run a load→sync cycle so any local-only data (e.g. user_profile set
        // before v1.45) gets pushed up to Firebase, and Firebase data is fresh.
        startSyncListener(user.uid);
        ensureFriendCode().then(()=>loadFriendData());
        if(!S.authed&&!DB.get('pin',null)){
          S.authed=true;render();
        }
        // Always pull from cloud when Firebase confirms the session — covers returning
        // users where S.authed was already set by init() so the block above was skipped
        if(S.authed){
          loadFromCloud().then(()=>{syncUp();render();});
        }
      }
    });
    return true;
  }catch(e){return false;}
}

async function doAuth(isNew){
  const userEl=document.getElementById('auth-user');
  const passEl=document.getElementById('auth-pass');
  const recoveryEl=document.getElementById('auth-recovery');
  const errEl=document.getElementById('auth-err');
  const raw=(userEl?.value||'').trim();
  // Sign-up: always username (no @). Sign-in: accept username or email for existing users
  const isEmail=!isNew&&raw.includes('@');
  const username=(isEmail?raw.split('@')[0]:raw).toLowerCase().replace(/[^a-z0-9_]/g,'');
  const pass=passEl?.value||'';
  const recovery=(recoveryEl?.value||'').trim()||null;
  if(errEl)errEl.textContent='';
  if(!raw){if(errEl)errEl.textContent=isNew?'Choose a username.':'Enter your username or email.';return;}
  if(isNew&&raw.includes('@')){if(errEl)errEl.textContent='Use a username, not an email — e.g. "johndoe" instead of "john@gmail.com".';return;}
  if(isNew&&username.length<3){if(errEl)errEl.textContent='Username must be at least 3 characters.';return;}
  if(!pass){if(errEl)errEl.textContent='Enter a password.';return;}
  if(!username){if(errEl)errEl.textContent='Username can only contain letters, numbers and _.';return;}
  if(!initFirebase()){if(errEl)errEl.textContent='Could not connect — check your internet connection.';return;}
  const btn=document.querySelector('.btn-p');if(btn){btn.textContent='…';btn.disabled=true;}
  // Use real email directly if provided, otherwise derive internal email from username
  const internalEmail=isEmail?raw.toLowerCase():username+'@training-brain.app';
  try{
    let result;
    if(isNew){
      if(pass.length<6){if(errEl)errEl.textContent='Password must be at least 6 characters.';if(btn){btn.textContent='Create Account';btn.disabled=false;}return;}
      // Create auth account FIRST so we are authenticated before touching the DB
      // (reading /usernames/ without auth triggers permission_denied)
      // 12s timeout so a bad connection shows an error instead of hanging forever
      const _tout=(p,ms,msg)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error(msg),{code:'auth/network-request-failed'})),ms))]);
      result=await _tout(_fbAuth.createUserWithEmailAndPassword(internalEmail,pass),12000,'Connection timed out — check your internet and try again.');
      try{
        // Atomically claim the username — transaction aborts if already taken
        const tx=await _fbDb.ref('usernames/'+username).transaction(cur=>{
          if(cur!==null)return undefined; // abort — taken
          return{uid:result.user.uid,created:new Date().toISOString()};
        });
        if(!tx.committed){
          // Username was taken — roll back the auth account
          try{await result.user.delete();}catch(_){}
          if(errEl)errEl.textContent='Username already taken — choose another.';
          if(btn){btn.textContent='Create Account';btn.disabled=false;}
          return;
        }
        if(recovery)await _fbDb.ref('users/'+result.user.uid+'/profile').set({username,recovery});
        else await _fbDb.ref('users/'+result.user.uid+'/profile').set({username});
      }catch(dbErr){
        try{await result.user.delete();}catch(_){}
        throw dbErr;
      }
    }else{
      // Sign in: look up username → internal email
      // 12s timeout so a bad connection shows an error instead of hanging forever
      const _tout=(p,ms,msg)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error(msg),{code:'auth/network-request-failed'})),ms))]);
      result=await _tout(_fbAuth.signInWithEmailAndPassword(internalEmail,pass),12000,'Connection timed out — check your internet and try again.');
    }
    S.fbUser={uid:result.user.uid,name:username,email:internalEmail,username};
    DB.set('fb_user',S.fbUser);
    S._authNew=false;
    S.authed=true;S.lockMode='choose';
    // loadFromCloud with 8s timeout — don't leave the user stuck on "..." forever
    await Promise.race([loadFromCloud(),new Promise(r=>setTimeout(r,8000))]);
    syncUp(); // push any local-only data (e.g. profile pre-v1.45) up to Firebase
    startSyncListener(result.user.uid);
    ensureFriendCode().then(()=>loadFriendData());
    render();
  }catch(e){
    const msgs={
      'auth/user-not-found':'No account found — tap "Create Account" to sign up.',
      'auth/wrong-password':'Wrong password. Try again or use Forgot Password.',
      'auth/invalid-credential':'Wrong email or password.',
      'auth/invalid-login-credentials':'Wrong email or password.',
      'auth/weak-password':'Password must be at least 6 characters.',
      'auth/too-many-requests':'Too many attempts — try again in a few minutes.',
      'auth/network-request-failed':'Connection failed — check your internet and try again.',
    };
    if(errEl){
      // email-already-in-use: either account exists, or a previous signup failed mid-way (orphaned auth account)
      if(e.code==='auth/email-already-in-use'){
        errEl.innerHTML='An account already exists for this email. '
          +'<button onclick="S._authNew=false;render()" style="background:none;border:none;color:var(--al);font-size:inherit;font-weight:700;cursor:pointer;padding:0;text-decoration:underline">Sign in</button>'
          +' or <button onclick="doForgotPassword()" style="background:none;border:none;color:var(--al);font-size:inherit;font-weight:700;cursor:pointer;padding:0;text-decoration:underline">reset password</button>'
          +' — if you just tried to sign up and it failed, your email may be stuck. Use reset password to recover it.';
      } else {
        errEl.textContent=msgs[e.code]||('Error: '+e.message);
        // For wrong-password / invalid-credential on sign-in: nudge toward forgot password
        if(!isNew&&(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential'||e.code==='auth/invalid-login-credentials')){
          errEl.innerHTML=errEl.textContent+' <button onclick="doForgotPassword()" style="background:none;border:none;color:var(--al);font-size:inherit;font-weight:700;cursor:pointer;padding:0;text-decoration:underline">Forgot password?</button>';
        }
      }
    }
    if(btn){btn.textContent=isNew?'Create Account':'Sign In';btn.disabled=false;}
  }
}

async function saveToCloud(manual=false){
  if(!S.fbUser||!_fbDb||S.guest){if(manual)showToast('⚠️ Not signed in — cannot sync','var(--red)');return;}
  // Full snapshot on the first save of the session (or a manual sync) to
  // guarantee the cloud matches local; incremental diff-only writes after that.
  const full=_needFullSync||manual;
  if(!full&&_dirtyKeys.size===0)return; // nothing changed — skip the round-trip entirely
  const _ts=new Date().toISOString();
  let _payloadKb=0;
  try{
    _myLastSaveTs=_ts; // stamp before the write so the listener recognises our own echo
    // update() (not set()) so we only touch the data+updated children — this
    // respects the security rules (write granted on those children, not the
    // whole node) AND preserves siblings like profile/friends/advisor. v2.75.
    if(full){
      const data={};
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(_isSyncKey(k))data[k]=DB.get(k);
      }
      try{_payloadKb=Math.round(JSON.stringify(data).length/1024);}catch(_){}
      await _fbDb.ref('users/'+S.fbUser.uid).update({data,updated:_ts});
    }else{
      // Multi-path update: write only the changed children under data/. A null
      // value (key cleared locally) deletes that child in the cloud. The write
      // rule on users/{uid}/data cascades to these deeper paths.
      const upd={updated:_ts};
      _dirtyKeys.forEach(k=>{upd['data/'+k]=DB.get(k);});
      try{_payloadKb=Math.round(JSON.stringify(upd).length/1024);}catch(_){}
      await _fbDb.ref('users/'+S.fbUser.uid).update(upd);
    }
    _dirtyKeys.clear();
    _needFullSync=false;
    DB.set('fb_last_sync',_ts);
    DB.set('fb_last_sync_err',null);
    // Write public week summary so friends can see this user's weekly stats
    try{await _fbDb.ref('public/'+S.fbUser.uid+'/weekSummary').set(computeWeekSummary());}catch(_){}
    if(manual){showToast(`☁️ Synced to cloud (${_payloadKb}KB${full?'':' diff'})`,'var(--grn)');render();}
  }catch(e){
    const msg=e?.message||String(e)||'unknown';
    // Don't drop the dirty set on failure — keep it so the next save retries
    // those keys, and force a full snapshot next time to be safe.
    _needFullSync=true;
    DB.set('fb_last_sync_err',msg+' ['+_payloadKb+'KB]');
    if(manual)showToast(`⚠️ Sync failed: ${msg}`,'var(--red)');
    console.error('[saveToCloud failed]',msg,'payload='+_payloadKb+'KB',e);
  }
}

async function loadFromCloud(manual=false){
  if(!S.fbUser||!_fbDb){if(manual)showToast('⚠️ Not signed in','var(--red)');return;}
  try{
    const snap=await _fbDb.ref('users/'+S.fbUser.uid).once('value');
    if(!snap.exists()){
      if(manual)showToast('☁️ No cloud data yet','var(--amb)');
      return;
    }
    const val=snap.val()||{};
    const data=val.data||{};
    const remoteUpdated=val.updated;
    let planCount=0,logCount=0,otherCount=0;
    // Suppress dirty-tracking while applying the pull — these keys came FROM the
    // cloud, so they're already in sync and must not be queued for re-upload.
    _suppressDirty=true;
    try{
      Object.entries(data).forEach(([k,v])=>{
        if(k==='ai_usage'){
          const local=DB.get('ai_usage',{calls:[]})||{calls:[]};
          const remote=v||{calls:[]};
          const seen=new Set((local.calls||[]).map(c=>c.ts));
          const merged=[...(local.calls||[]),...(remote.calls||[]).filter(c=>!seen.has(c.ts))];
          merged.sort((a,b)=>a.ts-b.ts);
          const cutoff=fd(addDays(new Date(),-30));
          DB.set('ai_usage',{calls:merged.filter(c=>c.date>=cutoff)});
        } else {
          DB.set(k,v);
          if(k.startsWith('plan_'))planCount++;
          else if(k.startsWith('log_'))logCount++;
          else otherCount++;
        }
      });
    }finally{_suppressDirty=false;}
    DB.set('fb_last_pull',new Date().toISOString());
    DB.set('fb_last_pull_remote_ts',remoteUpdated||'');
    DB.set('fb_last_pull_err',null);
    if(manual){
      const age=remoteUpdated?Math.round((Date.now()-new Date(remoteUpdated).getTime())/1000):null;
      showToast(`☁️ Pulled ${planCount} plans, ${logCount} logs${age!==null?` (${age}s old)`:''}`,'var(--grn)');
    }
  }catch(e){
    const msg=e?.message||String(e)||'unknown';
    DB.set('fb_last_pull_err',msg);
    if(manual)showToast(`⚠️ Pull failed: ${msg}`,'var(--red)');
    console.error('[loadFromCloud failed]',msg,e);
  }
}

// Real-time cross-device listener — watches the 'updated' timestamp on Firebase.
// When another device saves, it's a different timestamp than _myLastSaveTs, so we pull.
function startSyncListener(uid){
  if(_syncListenerActive||!_fbDb||!uid)return;
  _syncListenerActive=true;
  let _firstFire=true; // skip the initial fire (that's our own loadFromCloud data)
  _fbDb.ref('users/'+uid+'/updated').on('value',async snap=>{
    const remoteTs=snap.val();
    if(!remoteTs){_firstFire=false;return;}
    if(_firstFire){_firstFire=false;return;} // skip the initial value event
    if(remoteTs===_myLastSaveTs)return; // this is our own echo — skip
    // A different device saved — pull their data
    await loadFromCloud();
    // Also pull current week's advisor (stored separately from the main bundle)
    try{
      const weekKey=fd(getMon(new Date()));
      const aSnap=await _fbDb.ref('users/'+uid+'/advisor/'+weekKey).once('value');
      if(aSnap.exists()){
        const fbResult=JSON.parse(aSnap.val());
        const local=DB.get('weekly_advisor_'+weekKey,null);
        if(!local||fbResult.ts>(local.ts||0))DB.set('weekly_advisor_'+weekKey,fbResult);
      }
    }catch(_){}
    showToast('☁️ Synced from another device','var(--al)');
    render();
  });
}

function _genFriendCode(){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // omit I,O,0,1 — visually confusing
  let code='';for(let i=0;i<6;i++)code+=c[Math.floor(Math.random()*c.length)];
  return code;
}

async function ensureFriendCode(){
  if(!S.fbUser||!_fbDb)return;
  const existing=DB.get('friend_code',null);
  if(existing){S._friendCode=existing;return;}
  // Generate unique code
  let code,tries=0;
  do{code=_genFriendCode();const snap=await _fbDb.ref('friendCodes/'+code).once('value');if(!snap.exists())break;}while(++tries<10);
  await _fbDb.ref('friendCodes/'+code).set({uid:S.fbUser.uid,name:S.fbUser.username||S.fbUser.name||''});
  await _fbDb.ref('users/'+S.fbUser.uid+'/profile/friendCode').set(code);
  DB.set('friend_code',code);S._friendCode=code;
}

function computeWeekSummary(){
  const ws=getMon(new Date());
  const _rSet=new Set(['Ride','VirtualRide','EBikeRide','EBikeSport','EMountainBikeRide','GravelRide','MountainBikeRide','Handcycle','Velomobile']);
  const stravaActs=DB.get('strava_activities',[])||[];
  const daysDone=[];let gymSessions=0,rideSessions=0,totalKm=0;
  for(let i=0;i<7;i++){
    const d=addDays(ws,i);const ds=fd(d);
    const log=DB.get(DB.lk(d),null);
    const sr=stravaActs.find(a=>(a.start_date_local||'').slice(0,10)===ds&&(_rSet.has(a.type)||_rSet.has(a.sport_type)));
    const gymDone=log?.exercises?.some(e=>e.sets.some(s=>s.done));
    if(gymDone){gymSessions++;if(!daysDone.includes(ds))daysDone.push(ds);}
    if(sr){rideSessions++;totalKm+=(sr.distance||0)/1000;if(!daysDone.includes(ds))daysDone.push(ds);}
  }
  // Week streak — consecutive weeks (including current) with at least 1 session
  let weekStreak=0;
  for(let w=0;w<=52;w++){
    const wMon=getMon(addDays(new Date(),-w*7));
    let has=false;
    for(let i=0;i<7;i++){const d=addDays(wMon,i);const ds=fd(d);const log=DB.get(DB.lk(d),null);const sr=stravaActs.find(a=>(a.start_date_local||'').slice(0,10)===ds&&(_rSet.has(a.type)||_rSet.has(a.sport_type)));if(log?.exercises?.some(e=>e.sets.some(s=>s.done))||sr){has=true;break;}}
    if(has)weekStreak++;else if(w>0)break;
  }
  return{displayName:S.fbUser?.username||S.fbUser?.name||'',weekStart:fd(ws),gymSessions,rideSessions,totalKm:Math.round(totalKm*10)/10,daysDone:daysDone.sort(),weekStreak};
}

async function loadFriendData(){
  if(!S.fbUser||!_fbDb)return;
  try{
    const [reqSnap,friendsSnap]=await Promise.all([
      _fbDb.ref('users/'+S.fbUser.uid+'/friendRequests').once('value'),
      _fbDb.ref('users/'+S.fbUser.uid+'/friends').once('value')
    ]);
    S._friendRequests=reqSnap.val()||{};
    const friends=friendsSnap.val()||{};
    S._friendSummaries={};
    await Promise.all(Object.keys(friends).map(async fuid=>{
      try{
        const snap=await _fbDb.ref('public/'+fuid+'/weekSummary').once('value');
        S._friendSummaries[fuid]={...friends[fuid],...(snap.val()||{})};
      }catch(_){S._friendSummaries[fuid]={...friends[fuid]};}
    }));
    S._friendsLoaded=true;
    render();
  }catch(_){}
}

async function sendFriendRequest(code){
  if(!S.fbUser||!_fbDb||!code)return;
  const c=code.trim().toUpperCase();
  if(c===S._friendCode){showToast('That\'s your own code!','var(--red)');return;}
  try{
    const snap=await _fbDb.ref('friendCodes/'+c).once('value');
    if(!snap.exists()){showToast('Code not found — double-check and try again','var(--red)');return;}
    const {uid:tUid}=snap.val();
    const already=await _fbDb.ref('users/'+S.fbUser.uid+'/friends/'+tUid).once('value');
    if(already.exists()){showToast('Already connected! 👋','var(--grn)');return;}
    const pendingOut=await _fbDb.ref('users/'+tUid+'/friendRequests/'+S.fbUser.uid).once('value');
    if(pendingOut.exists()){showToast('Request already sent — waiting for them to accept','var(--al)');return;}
    await _fbDb.ref('users/'+tUid+'/friendRequests/'+S.fbUser.uid).set({
      name:S.fbUser.username||S.fbUser.name||'',code:S._friendCode||'',ts:new Date().toISOString()
    });
    showToast('Friend request sent! 🤝','var(--grn)');
    document.getElementById('friend-code-input') && (document.getElementById('friend-code-input').value='');
  }catch(e){showToast('Could not send — check your connection','var(--red)');}
}

async function acceptFriend(fromUid){
  if(!S.fbUser||!_fbDb)return;
  const req=S._friendRequests?.[fromUid];if(!req)return;
  try{
    const now=new Date().toISOString();
    await Promise.all([
      _fbDb.ref('users/'+S.fbUser.uid+'/friends/'+fromUid).set({name:req.name,code:req.code,since:now}),
      _fbDb.ref('users/'+fromUid+'/friends/'+S.fbUser.uid).set({name:S.fbUser.username||S.fbUser.name||'',code:S._friendCode||'',since:now}),
      _fbDb.ref('users/'+S.fbUser.uid+'/friendRequests/'+fromUid).remove()
    ]);
    delete S._friendRequests[fromUid];
    showToast('Connected! 🎉','var(--grn)');
    await loadFriendData();
  }catch(e){showToast('Error — try again','var(--red)');}
}

async function declineFriend(fromUid){
  if(!S.fbUser||!_fbDb)return;
  try{
    await _fbDb.ref('users/'+S.fbUser.uid+'/friendRequests/'+fromUid).remove();
    delete S._friendRequests[fromUid];render();
  }catch(_){}
}

async function removeFriend(fuid){
  if(!S.fbUser||!_fbDb)return;
  if(!confirm('Remove this friend?'))return;
  try{
    await _fbDb.ref('users/'+S.fbUser.uid+'/friends/'+fuid).remove();
    delete S._friendSummaries[fuid];render();
  }catch(e){showToast('Error removing friend','var(--red)');}
}

/* ── NAVIGATION ── */
function go(screen,opts={}){
  // stop any running exercise animations
  Object.keys(_animTimers).forEach(k=>{clearInterval(_animTimers[k]);delete _animTimers[k];});
  // clear PR search when leaving progress tab
  if(screen!=='prs')DB.set('_pr_search','');
  // Extract optional navigation direction (slide-in animation) and _noAnim
  // (used when a manual gesture has already animated the transition).
  const _navDir=opts._dir;
  const _noAnim=opts._noAnim;
  if(_navDir)delete opts._dir;
  if(_noAnim)delete opts._noAnim;
  S.screen=screen;Object.assign(S,opts);render();
  if(_navDir&&!_noAnim){
    const sEl=document.querySelector('#app > .screen');
    if(sEl){
      sEl.classList.add('nav-'+_navDir);
      // Remove class after animation so bnav position:fixed is never inside a stacking context
      sEl.addEventListener('animationend',()=>{sEl.classList.remove('nav-fwd','nav-back');},{once:true});
    }
  }
  // Reset scroll on every screen change so new screen always opens at top
  window.scrollTo(0,0);
}
function openDay(dateStr){

function rDayRow(day,today){
  const date=new Date(day.date+'T12:00:00');
  const isToday=sameDay(date,today);
  const isPast=!isToday&&day.date<fd(today);
  const log=DB.get(DB.lk(date),null);
  const gymDone=log&&log.completed;
  const stravaRide=stravaRideOnDate(day.date);
  const done=gymDone||!!stravaRide;
  const wi=WI[day.type]||WI.REST;
  const w=day.weather;
  const isRide=['LONG_OUTDOOR','SHORT_OUTDOOR','LONG_INDOOR','SHORT_INDOOR'].includes(day.type);
  const isRest=day.type==='REST';
  const isGym=!isRide&&!isRest;
  const v=verdict(w.score);
  // Override the day's type display with the Strava ride only when the plan was
  // already a ride day or rest day. On a planned gym day, keep showing the gym
  // type as primary (so the planned workout isn't visually erased) and surface
  // the ride as a secondary "+ logged" line. v2.43 fix.
  const showStravaOverride=!!stravaRide&&!isGym;
  const distStr=stravaRide?+((stravaRide.distance||0)/1000).toFixed(1):0;
  const durStr=stravaRide?Math.round((stravaRide.moving_time||0)/60):0;
  const rideOnGymDay=!!stravaRide&&isGym;
  return`<div class="day-row${isToday?' is-today':''}${(done||isPast)?' is-done':''}" onclick="openDay('${day.date}')">
<div class="dr-l">
  <div class="dr-day">${DNAMES[date.getDay()]} ${date.getDate()}</div>
  <div class="dr-type" style="color:${showStravaOverride?'#0891b2':wi.c}">${showStravaOverride?_icon('ride-day.png','🚴',16)+' '+(stravaRide.name||'Ride'):wi.i+' '+(typeof wi.l==='function'?wi.l():wi.l)}</div>
  <div class="dr-desc">${showStravaOverride?(distStr?distStr+' km · ':'')+durStr+' min':(typeof wi.d==='function'?wi.d():wi.d)}</div>
  ${rideOnGymDay?`<div style="font-size:11px;color:#fc4c02;font-weight:600;margin-top:3px">+ 🚴 ${distStr?distStr+' km · ':''}${durStr} min logged</div>`:''}
</div>
<div class="dr-r">
  <div class="dr-weather">${wIcon(w.code,w.rain)} ${w.tmax}°${w.rain>0?`<span class="dr-rain">${w.rain}mm</span>`:''}</div>
  ${isRide&&!stravaRide?`<div class="vtag ${v.c}">${v.t}</div>`:''}
  ${stravaRide?'<div class="done-tag" style="background:rgba(252,76,2,.12);color:#fc4c02;border:1px solid rgba(252,76,2,.3)">🟠 Logged · Strava</div>':gymDone?'<div class="done-tag">✓ Done</div>':''}
  ${isToday&&!done?'<div class="today-tag">Today</div>':''}
  <button class="swap-btn" onclick="event.stopPropagation();openSwap('${day.date}')">Swap ↕</button>
</div>
</div>`;
}

/* ── WEEKLY ADVISOR ── */
async function getWeeklyAdvisor(weekStartDate,force=false){
  if(S.guest)return null;
  const cacheKey='weekly_advisor_'+fd(weekStartDate);
  // 1. Local cache (fastest, works offline)
  if(!force){const cached=DB.get(cacheKey,null);if(cached)return cached;}
  // 2. Firebase — check for result generated on another device (saves API call)
  // Stored as JSON string to avoid Firebase array→object conversion issues
  if(!force&&_fbDb&&S.fbUser){
    try{
      const snap=await _fbDb.ref('users/'+S.fbUser.uid+'/advisor/'+fd(weekStartDate)).once('value');
      if(snap.exists()){const fbResult=JSON.parse(snap.val());DB.set(cacheKey,fbResult);return fbResult;}
    }catch(_){}
  }
  const profile=DB.get('user_profile',null);
  const prs=DB.get('prs',{});
  const u=unit();
  const _gm={muscle:'build muscle',lose_weight:'lose weight',fitness:'general fitness',endurance:'endurance',performance:'sport performance'};
  const _goals=profile?.goals||(profile?.goal?[profile.goal]:[]);
  const goalDesc=_goals.map(g=>_gm[g]||g).join(' + ')||'general fitness';
  const _rSet=new Set(['Ride','VirtualRide','EBikeRide','EBikeSport','EMountainBikeRide','GravelRide','MountainBikeRide','Handcycle','Velomobile']);
  // Human-readable labels for workout types sent to AI (never raw constants)
  const _typeLabel={PUSH:'Push (Chest/Shoulders/Triceps)',PULL:'Pull (Back/Biceps)',LEGS:'Legs',UPPER_PUMP:'Upper Body (Full Upper)',FULL_BODY:'Full Body',LONG_OUTDOOR:'Long Outdoor Ride',SHORT_OUTDOOR:'Short Outdoor Ride',LONG_INDOOR:'Long Indoor Ride',SHORT_INDOOR:'Short Indoor Ride',REST:'Rest & Mobility',SKIPPED:'Skipped'};
  const _tl=t=>_typeLabel[t]||t;
  // Count weeks with actual gym sessions logged (Option A: experience context)
  let weeksOfGymHistory=0;
  for(let w=1;w<=52;w++){
    const mon=getMon(addDays(weekStartDate,-w*7));
    let hasGym=false;
    for(let i=0;i<7;i++){const d=addDays(mon,i);const log=DB.get(DB.lk(d),null);if(log?.exercises?.some(e=>e.sets.some(s=>s.done))){hasGym=true;break;}}
    if(hasGym)weeksOfGymHistory++;
  }
  const isEarlyUser=weeksOfGymHistory<=1;
  // Gather last 2 weeks of training data
  const dataLines=[];
  for(let w=1;w>=0;w--){
    const mon=getMon(addDays(weekStartDate,-w*7));
    const wLabel=w===1?'Last week':'This week (so far)';
    const wPlan=DB.get(DB.pk(mon),null);
    const wLines=[];
    for(let i=0;i<7;i++){
      const d=addDays(mon,i);const ds=fd(d);
      const log=DB.get(DB.lk(d),null);
      const sr=(DB.get('strava_activities',[])||[]).find(a=>(a.start_date_local||'').slice(0,10)===ds&&(_rSet.has(a.type)||_rSet.has(a.sport_type)));
      if(sr){
        const dur=Math.round((sr.moving_time||0)/60);
        const dist=+((sr.distance||0)/1000).toFixed(1);
        const hr=sr.average_heartrate?Math.round(sr.average_heartrate):null;
        const watts=sr.average_watts?Math.round(sr.average_watts):null;
        wLines.push(`  ${ds} RIDE: ${dist}km ${dur}min${hr?' HR '+hr+'bpm':''}${watts?' '+watts+'W':''}`);
      }
      if(log?.exercises?.some(e=>e.sets.some(s=>s.done))){
        const planDay=wPlan?.find(p=>p.date===ds);
        const type=planDay?.type||log.type||'GYM';
        const exLines=log.exercises.map(le=>{
          const ex=EX[le.id];if(!ex)return null;
          const done=le.sets.filter(s=>s.done&&s.w&&s.r);if(!done.length)return null;
          const pr=prs[le.id];
          const _assist=EX[le.id]?.assist;
          const avgW=Math.round(done.reduce((a,s)=>a+(parseFloat(s.w)||0),0)/done.length*10)/10;
          const avgR=Math.round(done.reduce((a,s)=>a+(parseInt(s.r)||0),0)/done.length);
          // Best set: highest weight×reps normally; for assisted exercises the
          // best set is the LOWEST assist weight (with reps as tiebreaker).
          const bestSet=_assist
            ?done.reduce((b,s)=>{const sw=parseFloat(s.w)||1e9,bw=parseFloat(b.w)||1e9;return sw<bw||(sw===bw&&(parseInt(s.r)||0)>(parseInt(b.r)||0))?s:b;},done[0])
            :done.reduce((b,s)=>(((parseFloat(s.w)||0)*(parseInt(s.r)||0))>((parseFloat(b.w)||0)*(parseInt(b.r)||0))?s:b),done[0]);
          const bestW=Math.round((parseFloat(bestSet?.w)||0)*10)/10;
          const bestR=parseInt(bestSet?.r)||0;
          let prLabel='';
          if(pr){
            // Assisted: at/above PR means LESS assist (bestW <= pr.w) at equal/more reps
            const atOrAbovePR=_assist?(bestW<=pr.w&&bestR>=pr.r):(bestW>=pr.w&&bestR>=pr.r);
            if(atOrAbovePR){prLabel=isEarlyUser?' [baseline]':' [NEW PR]';}
            else{prLabel=` [below PR: ${pr.w}${u}×${pr.r}${_assist?' assist':''}]`;}
          }
          return `    ${ex.n}: best ${bestW}${u}×${bestR}, avg ${avgW}${u}×${avgR}, ${done.length} sets${prLabel}`;
        }).filter(Boolean);
        wLines.push(`  ${ds} ${_tl(type)}:${log.completed?' ✓':''}`);
        exLines.forEach(l=>wLines.push(l));
      }
    }
    if(wLines.length){dataLines.push(wLabel+':');dataLines.push(...wLines);}
  }
  if(!dataLines.length)return null;
  // Upcoming days this week for context
  const upPlan=DB.get(DB.pk(weekStartDate),null);
  const todayStr=fd(new Date());
  const upLines=(upPlan||[]).filter(d=>d.date>=todayStr).map(d=>{
    const exNames=d.exercises?.map(id=>EX[id]?.n).filter(Boolean).join(', ');
    return`  ${d.date}: ${_tl(d.type)}${exNames?' → '+exNames:''}`;
  });
  const _earlyCtx=isEarlyUser?`\nIMPORTANT: This athlete has ${weeksOfGymHistory===0?'no prior':'only 1 week of'} gym history in this app. All exercise entries marked [baseline — first logged] are first-time measurements, NOT progression over previous sessions. Do NOT say "excellent progression" or compare gym numbers to prior weeks. Instead: acknowledge they are establishing their baseline, note what they lifted/rode, and give forward-looking targets for next session.`:'';
  const _bodyStats=(()=>{const parts=[];if(profile?.weight&&profile?.weightUnit)parts.push(`${profile.weight}${profile.weightUnit}`);if(profile?.height&&profile?.heightUnit)parts.push(`${profile.height}${profile.heightUnit}`);if(profile?.age)parts.push(`age ${profile.age}`);return parts.length?' | '+parts.join(', '):'';})();
  const prompt=`You are a data-driven personal trainer. Analyze this athlete's recent training data and write a concise weekly advisory. Be specific — use exercise names, weights, distances, HR. Identify patterns: dropped reps at same weight = fatigue; consistent increases = progression; missed sessions = load drop.${_earlyCtx}

Goal: ${goalDesc} | Level: ${profile?.level||'intermediate'}${profile?.gender?' | '+profile.gender:''}${_bodyStats} | App gym history: ${weeksOfGymHistory===0?'Week 1 — no prior gym data':weeksOfGymHistory+' week(s)'}

Training data:
${dataLines.join('\n')}
${upLines.length?'\nUpcoming this week:\n'+upLines.join('\n'):''}

Write exactly 6 sections:
LOAD: [1 sentence: overall load — sessions completed, volume, any rides]
TREND: [1-2 sentences: what the numbers show — name specific exercises or rides; for early users note these are baselines not progressions]
FOCUS: [1-2 sentences: what to prioritise this week — specific targets to aim for, using exact exercise names and numbers]
RECOVERY: [1 sentence: recovery or readiness note]
TARGETS: For every exercise listed in the Upcoming section, look up its most recent "best" entry in the training data above and set a next-session target using this rule: if reps were met at that weight → increase weight by 2.5${u}; if reps fell short → keep same weight and add 1 rep; if no prior data → omit that exercise. Use the EXACT exercise name as shown in Upcoming. Format: [{"ex":"Exact Exercise Name","w":number,"r":number}] — JSON array only, no prose. Cover ALL upcoming exercises that have prior data.
SWAPS: [{"current":"Exact Exercise Name","suggested":"Exact Alternative Name","reason":"one sentence"}] — JSON array only. Recommend a swap ONLY if: (a) the same exercise appears in 3+ sessions with zero weight or rep progression, (b) a key movement pattern is missing for their stated goal, or (c) a clearly more effective alternative exists for their training level. Use EXACT names from the training data for "current". "suggested" must be a real gym exercise. Max 2 swaps. Empty array [] if no swap is warranted.`;
  // Let fetch errors throw — caller distinguishes "no data" (null) from "API error" (thrown)
  const r=await fetch(GEMINI_PROXY,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:700,temperature:0.65,thinkingConfig:{thinkingBudget:0}}})});
  trackAICall('weekly_advisor',r.ok);
  if(!r.ok)throw new Error('API '+r.status);
  const data=await r.json();
  const text=data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
  if(!text)throw new Error('empty response');
  const sections={};
  ['LOAD','TREND','FOCUS','RECOVERY'].forEach(k=>{
    const rx=new RegExp(k+'[:\\*]+\\s*(.+?)(?=(?:LOAD|TREND|FOCUS|RECOVERY|TARGETS|SWAPS)[:\\*]|$)','si');
    const m=text.match(rx);if(m)sections[k]=m[1].trim().replace(/\*\*/g,'');
  });
  let targets=[];
  try{const tm=text.match(/TARGETS:\s*(\[[\s\S]*?\])/);if(tm)targets=JSON.parse(tm[1]);}catch(_){}
  let swaps=[];
  try{const sm=text.match(/SWAPS:\s*(\[[\s\S]*?\])/);if(sm)swaps=JSON.parse(sm[1]);}catch(_){}
  const result={sections,targets,swaps,ts:Date.now()};
  DB.set(cacheKey,result);
  // Push to Firebase as a JSON string so it syncs to other devices without array conversion issues
  if(_fbDb&&S.fbUser){try{await _fbDb.ref('users/'+S.fbUser.uid+'/advisor/'+fd(weekStartDate)).set(JSON.stringify(result));}catch(_){}}
  return result;
}

async function loadWeeklyAdvisor(force=false){
  if(S._advisorLoading)return;
  if(force)DB.set('weekly_advisor_'+fd(S.weekStart),null);
  S._advisorLoading=true;
  S._advisorError=null;
  S._advisorNoData=false;
  render();
  try{
    const result=await getWeeklyAdvisor(S.weekStart,force);
    if(!result){
      S._advisorNoData=true; // genuinely no logged data yet
    } else {
      showToast('🧠 Weekly analysis ready','var(--grn)');
      saveToCloud(); // update 'updated' timestamp so other devices' listeners wake up and pull the new advisor
    }
  }catch(e){
    console.warn('Weekly advisor error:',e);
    S._advisorError=e.message||'fetch failed';
    if(isQuotaErr(e.message))_aiQuotaHit=true;
  }
  S._advisorLoading=false;
  render();
}

function collectReviewData(){
  const today=new Date();
  const cutoff=fd(addDays(today,-56));
  const gymSessions=[],rides=[];
  for(let i=0;i<56;i++){
    const ds=fd(addDays(today,-i));
    const log=DB.get('log_'+ds,null);
    if(!log)continue;
    if(log.exercises&&log.exercises.length){
      const exs=log.exercises.map(e=>{
        const ex=EX[e.id];
        const done=(e.sets||[]).filter(s=>s.done&&s.w);
        if(!done.length)return null;
        return`${ex?ex.n:e.id} ${done.map(s=>`${s.w||'?'}×${s.r||'?'}`).join('/')}`;
      }).filter(Boolean);
      if(exs.length)gymSessions.push({date:ds,energy:log.energy||'-',completed:!!log.completed,exercises:exs});
    }
    if(log.ride&&log.ride.dur!=null){
      rides.push({date:ds,src:'manual',dur:log.ride.dur,dist:log.ride.dist,hr:log.ride.hr,rpe:log.ride.rpe});
    }
  }
  (DB.get('strava_activities',[])||[]).forEach(a=>{
    const ds=(a.start_date_local||'').slice(0,10);
    if(ds>=cutoff)rides.push({date:ds,src:'strava',
      dur:Math.round((a.moving_time||0)/60),
      dist:+((a.distance||0)/1000).toFixed(1),
      hr:a.average_heartrate?Math.round(a.average_heartrate):null,
      maxhr:a.max_heartrate?Math.round(a.max_heartrate):null,
      watts:a.average_watts?Math.round(a.average_watts):null,
      np:a.weighted_average_watts?Math.round(a.weighted_average_watts):null,
      elev:a.total_elevation_gain?Math.round(a.total_elevation_gain):null,
      cad:a.average_cadence?Math.round(a.average_cadence):null,
      kj:a.kilojoules?Math.round(a.kilojoules):null,
      suffer:a.suffer_score||null,
      tss:a._tss||null,
      intf:a._if||null});
  });
  // Fitness/Fatigue/Form snapshot + 4-week curve trend
  const curve=DB.get('bike_fitness_curve',null);
  let fitness=null;
  if(curve){
    const tk=fd(today);
    const yk=fd(addDays(today,-1));
    const cur=curve[tk]||curve[yk]||null;
    const wk1=curve[fd(addDays(today,-7))]||null;
    const wk4=curve[fd(addDays(today,-28))]||null;
    if(cur)fitness={
      ctl:Math.round(cur.ctl),atl:Math.round(cur.atl),tsb:Math.round(cur.tsb),
      ctl_7d_delta:wk1?+(cur.ctl-wk1.ctl).toFixed(1):null,
      ctl_28d_delta:wk4?+(cur.ctl-wk4.ctl).toFixed(1):null
    };
  }
  // Weight trend: current value + 7/28-day deltas + linear slope
  const wLog=DB.get('weight_log',{})||{};
  const wDates=Object.keys(wLog).sort();
  let weight=null;
  if(wDates.length){
    const cur=wLog[wDates[wDates.length-1]];
    const start=addDays(today,-90).getTime();
    const pts=wDates.map(d=>({x:(new Date(d+'T12:00:00').getTime()-start)/86400000,y:wLog[d]})).filter(p=>p.x>=0);
    const slope=pts.length>=2?_regSlope(pts):0;
    // Find nearest weigh-in 7 and 28 days ago for delta
    const nearestBefore=(target)=>{
      let best=null,bestDiff=Infinity;
      for(const d of wDates){
        const dayMs=new Date(d+'T12:00:00').getTime();
        const diff=Math.abs(dayMs-target);
        if(diff<bestDiff){bestDiff=diff;best=wLog[d];}
      }
      return best;
    };
    const wk1=nearestBefore(addDays(today,-7).getTime());
    const wk4=nearestBefore(addDays(today,-28).getTime());
    weight={
      current:cur,
      goal:DB.get('user_profile',{})?.weight_goal||null,
      rate_kg_per_week:+(slope*7).toFixed(2),
      d7:wk1!=null?+(cur-wk1).toFixed(1):null,
      d28:wk4!=null?+(cur-wk4).toFixed(1):null,
      logged_days:wDates.length
    };
  }
  // Gym progress: weekly tonnage trend + top exercise 1RM progressions
  const gymSets=_scanGymSets(84);
  let gymProgress=null;
  if(gymSets.length){
    // Weekly tonnage for last 12 weeks
    const weeks={};
    for(const s of gymSets){
      const wk=_weekKey(s.date);
      weeks[wk]=(weeks[wk]||0)+s.w*s.r;
    }
    const weekList=[];
    for(let i=11;i>=0;i--){
      const wk=fd(getMon(addDays(today,-i*7)));
      weekList.push({wk,tonnage:Math.round(weeks[wk]||0)});
    }
    const recent4=weekList.slice(-4).reduce((s,w)=>s+w.tonnage,0)/4;
    const prior4=weekList.slice(-8,-4).reduce((s,w)=>s+w.tonnage,0)/4;
    const tonnageTrend=prior4>0?+((recent4-prior4)/prior4*100).toFixed(1):0;
    // Top 5 exercises by recent frequency → e1RM trend
    const byEx={};
    for(const s of gymSets){
      if(!byEx[s.exId])byEx[s.exId]={name:s.exName,sessions:{},dates:new Set()};
      byEx[s.exId].dates.add(s.date);
      const e1=_e1rm(s.w,s.r);
      if(!byEx[s.exId].sessions[s.date]||e1>byEx[s.exId].sessions[s.date])byEx[s.exId].sessions[s.date]=e1;
    }
    const exTrends=Object.entries(byEx).map(([id,d])=>{
      const sessions=Object.entries(d.sessions).sort((a,b)=>a[0].localeCompare(b[0]));
      if(sessions.length<2)return null;
      const first=sessions[0][1], last=sessions[sessions.length-1][1];
      const best=Math.max(...sessions.map(s=>s[1]));
      const peakIdx=sessions.findIndex(s=>s[1]===best);
      const peakDate=sessions[peakIdx][0];
      const daysSincePeak=Math.round((Date.now()-new Date(peakDate+'T12:00:00').getTime())/86400000);
      const change=last-first;
      return{name:d.name,sessions:sessions.length,first,last,best,change,days_since_peak:daysSincePeak};
    }).filter(Boolean).sort((a,b)=>b.sessions-a.sessions).slice(0,6);
    gymProgress={
      tonnage_recent_4wk_avg:Math.round(recent4),
      tonnage_prior_4wk_avg:Math.round(prior4),
      tonnage_trend_pct:tonnageTrend,
      tonnage_this_week:weekList[weekList.length-1].tonnage,
      top_exercises:exTrends
    };
  }
  return{gymSessions,rides,prs:DB.get('prs',{}),plan:DB.get(DB.pk(getMon(today)),null),fitness,weight,gymProgress,profile:DB.get('user_profile',{})};
}

function parseReview(text){
  const keys=['SUMMARY','OVERLOAD','RECOVERY','FOCUS','SEQUENCE'];
  const out={};
  keys.forEach((k,i)=>{
    const next=keys[i+1];
    const re=new RegExp(k+'\\s*:\\s*([\\s\\S]*?)(?='+(next?next+'\\s*:':'$')+')','i');
    const m=text.match(re);
    let c=m?m[1].trim():'';
    c=_esc(c).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n+/g,'<br>');
    out[k.toLowerCase()]=c;
  });
  return out;
}
