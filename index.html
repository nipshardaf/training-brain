async function getAICoach(energy,ct,dp){
  // Guests get hardcoded responses — no API keys wasted
  if(S.guest)return coachMsg(energy,ct);

  const date=dp?.date||'';
  const cacheKey='coach_'+energy+'_'+date;
  // Return from cache if already fetched
  if(_coachCache[cacheKey])return _coachCache[cacheKey];
  const stored=DB.get(cacheKey,null);
  if(stored){_coachCache[cacheKey]=stored;return stored;}

  // Check if we already fetched all 4 moods today (avoid duplicate batch call)
  const batchKey='coach_batch_'+date+'_'+(dp?.type||ct);
  if(DB.get(batchKey,false))return coachMsg(energy,ct);
  if(_coachInFlight[batchKey])return coachMsg(energy,ct);

  // Build rich context — skip API entirely if no meaningful data
  const prs=DB.get('prs',{});
  const u=unit();
  let hasPRs=0,hasHistory=0;
  const exLines=(dp?.exercises||[]).map(id=>{
    const ex=EX[id];if(!ex)return null;
    const pr=prs[id];
    const lastSets=getLastLog(id);
    let line=ex.n;
    if(pr){
      hasPRs++;
      line+=` (PR: ${pr.w}${u}×${pr.r}`;
      if(lastSets){
        const done=lastSets.filter(s=>s.done&&s.w);
        if(done.length){
          hasHistory++;
          const avgW=Math.round(done.reduce((a,s)=>a+(parseFloat(s.w)||0),0)/done.length);
          const avgR=Math.round(done.reduce((a,s)=>a+(parseInt(s.r)||0),0)/done.length);
          const pct=pr.w>0?Math.round(avgW/pr.w*100):0;
          line+=`, last session: ${avgW}${u}×${avgR} avg — ${done.length}/${lastSets.length} sets done${pct<85?' ⚠️ below PR pace':''}`;
        }
      }
      line+=')';
    }
    return line;
  }).filter(Boolean);

  // Not worth calling AI if user has no real data yet — hardcoded is just as good
  if(hasPRs===0&&hasHistory===0){
    DB.set(batchKey,false); // allow retry once they have data
    return coachMsg(energy,ct);
  }

  let weekSessions=0;
  for(let i=0;i<7;i++){const d=addDays(S.weekStart,i);const l=DB.get(DB.lk(d),null);if(l?.exercises?.some(e=>e.sets.some(s=>s.done)))weekSessions++;}
  let lastDone='unknown';
  for(let i=1;i<=30;i++){
    const d=addDays(new Date(),-i);
    const pk2=DB.pk(getMon(d));
    const pl=DB.get(pk2,null);
    const dd=pl?.find(x=>x.date===fd(d)&&x.type===dp?.type);
    if(dd&&DB.get(DB.lk(d),null)?.exercises?.some(e=>e.sets.some(s=>s.done))){lastDone=i===1?'yesterday':`${i} days ago`;break;}
  }

  const profile=DB.get('user_profile',null);
  const _goalMap={muscle:'build muscle and strength',lose_weight:'lose weight and recomp',fitness:'general fitness',endurance:'endurance and event prep',performance:'sport performance'};
  const _goals=profile?.goals?.length?profile.goals:(profile?.goal?[profile.goal]:[]);
  const goalDesc=_goals.length?_goals.map(g=>_goalMap[g]||g).join(' + '):'general fitness';
  const genderNote=profile?.gender?`- Sex: ${profile.gender}`:'';
  const levelNote=profile?.level?`- Experience: ${profile.level}`:'- Experience: intermediate';
  const prompt=`You are a no-nonsense personal trainer. Write 4 pre-workout coaching notes for today's ${dp?.type||ct} session. Each note is 2 sentences max — specific, direct, no fluff. You have real performance data — use it. Reference exercises, weights, and completion rates by name.

Athlete data:
- Main goal: ${goalDesc}
${levelNote}
${genderNote}
- Workout: ${dp?.type||ct}
- Sessions completed this week: ${weekSessions}
- Last ${dp?.type||ct}: ${lastDone}
- Exercises (with PRs and last session performance):
  ${exLines.join('\n  ')}

Write exactly 4 notes labelled like this:
FRESH: [note for feeling great — push for PRs or high reps]
OKAY: [note for normal day — hit targets, stay consistent]
TIRED: [note for low energy — adjust weights, don't skip]
SORE: [note for sore/recovering — what to reduce or focus on]`;

  _coachInFlight[batchKey]=true;
  try{
    const r=await fetch(GEMINI_PROXY,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:300,temperature:0.75,thinkingConfig:{thinkingBudget:0}}})
    });
    const raw=await r.text();
    if(!r.ok)throw new Error('API '+r.status);
    const data=JSON.parse(raw);
    const text=data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
    if(text){
      // Parse all 4 moods from one response
      const moods=['FRESH','OKAY','TIRED','SORE'];
      moods.forEach((m,i)=>{
        const next=moods[i+1];
        const re=new RegExp(m+':\\s*([\\s\\S]*?)(?='+( next?next+':':'$')+')','i');
        const match=text.match(re);
        if(match){
          const msg=match[1].trim();
          const ck='coach_'+m.toLowerCase()+'_'+date;
          _coachCache[ck]=msg;
          DB.set(ck,msg);
        }
      });
      DB.set(batchKey,true); // mark the batch done only after a successful fetch — a failed call retries
      return _coachCache[cacheKey]||coachMsg(energy,ct);
    }
  }catch(e){console.warn('AI coach failed:',e);}
  finally{delete _coachInFlight[batchKey];}
  return coachMsg(energy,ct);
}

/* ── STRAVA INTEGRATION ── */
function stravaConnect(){
  const url=`https://www.strava.com/oauth/authorize?client_id=${STRAVA_CLIENT_ID}&redirect_uri=${encodeURIComponent(STRAVA_REDIRECT)}&response_type=code&scope=activity:read_all&approval_prompt=auto`;
  window.location.href=url;
}

async function stravaExchangeCode(code){
  try{
    const r=await fetch(GEMINI_PROXY+'/strava/token',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({grant_type:'authorization_code',code})
    });
    if(!r.ok)throw new Error('exchange '+r.status);
    const data=await r.json();
    if(!data.access_token)throw new Error('no token');
    DB.set('strava_token',{
      access:data.access_token,refresh:data.refresh_token,
      expires:data.expires_at,
      athlete:{name:data.athlete?.firstname,id:data.athlete?.id}
    });
    // Clean the ?code= from the URL
    window.history.replaceState({},'',window.location.pathname);
    await stravaFetchActivities();
    const rides=DB.get('strava_activities',[]);
    const name=data.athlete?.firstname?` — hey ${data.athlete.firstname}!`:'';
    showToast(`✅ Strava connected${name} ${rides.length} ride${rides.length!==1?'s':''} synced`,'var(--grn)');
  }catch(e){
    console.warn('Strava exchange failed:',e);
    showToast('⚠️ Strava connection failed — try again','var(--red)');
  }
}

async function _stravaAccessToken(){
  const tok=DB.get('strava_token',null);
  if(!tok)return null;
  // Refresh if expiring within 5 minutes
  if(Date.now()/1000<tok.expires-300)return tok.access;
  try{
    const r=await fetch(GEMINI_PROXY+'/strava/token',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({grant_type:'refresh_token',refresh_token:tok.refresh})
    });
    if(!r.ok)throw new Error('refresh '+r.status);
    const data=await r.json();
    DB.set('strava_token',{...tok,access:data.access_token,refresh:data.refresh_token,expires:data.expires_at});
    return data.access_token;
  }catch(e){console.warn('Strava refresh failed:',e);return tok.access;}
}

async function stravaFetchActivities(){
  const token=await _stravaAccessToken();
  if(!token)return;
  try{
    const after=Math.floor(Date.now()/1000)-56*86400; // 8 weeks — feeds the weekly AI review
    const r=await fetch(`https://www.strava.com/api/v3/athlete/activities?after=${after}&per_page=100`,{
      headers:{Authorization:'Bearer '+token}
    });
    if(!r.ok)throw new Error('activities '+r.status);
    const acts=await r.json();
    const rides=acts.filter(a=>a.type==='Ride'||a.type==='VirtualRide');
    DB.set('strava_activities',rides);
    DB.set('strava_last_sync',new Date().toISOString());
    analyzeStravaAdapt(rides); // C: auto-adapt plan based on completion
    render();
  }catch(e){console.warn('Strava activities failed:',e);}
}

/* ── C: STRAVA AUTO-ADAPT ── */
function analyzeStravaAdapt(rides){
  // Look at last 2 completed weeks and measure ride completion vs plan
  let totalPlanned=0,totalCompleted=0,durationMatch=0;
  for(let w=1;w<=2;w++){
    const mon=getMon(addDays(new Date(),-w*7));
    const plan=DB.get(DB.pk(mon),null);
    if(!plan)continue;
    const rideDays=plan.filter(d=>['LONG_OUTDOOR','SHORT_OUTDOOR','LONG_INDOOR','SHORT_INDOOR'].includes(d.type));
    totalPlanned+=rideDays.length;
    rideDays.forEach(dp=>{
      const actual=rides.find(a=>(a.start_date_local||'').slice(0,10)===dp.date);
      if(actual){
        totalCompleted++;
        // Check if they hit ≥80% of planned duration
        const setup=DB.get('bike_setup',{dur:45});
        const plannedMin=dp.type.includes('LONG')?getRideDuration('LONG'):getRideDuration('SHORT');
        if(actual.moving_time/60>=plannedMin*0.8)durationMatch++;
      }
    });
  }
  if(totalPlanned===0)return;
  const compRate=totalCompleted/totalPlanned; // 0–1
  const durRate=totalCompleted>0?durationMatch/totalCompleted:0;
  let cur=DB.get('bike_adapt_factor',1.0);
  if(compRate>=0.9&&durRate>=0.8){cur=Math.min(1.3,cur+0.08);} // crushed it
  else if(compRate>=0.6){/* on track — hold */}
  else{cur=Math.max(0.7,cur-0.1);} // struggling — back off
  DB.set('bike_adapt_factor',Math.round(cur*100)/100);
  DB.set('bike_adapt_check',fd(new Date()));
}

function getRideDuration(which){
  const{wk,block,phase,weeksToEvent,ev}=getRideWeek();
  const setup=DB.get('bike_setup',{dur:45,goal:'base'});
  const goalRate={base:15,event:20,active:10}[setup.goal]||15;
  if(which==='LONG'){
    if(ev?.date&&weeksToEvent!==null){
      const distKm=ev.unit==='mi'?ev.dist*1.609:ev.dist;
      const targetDur=Math.min(Math.round(distKm/22*60*0.75/5)*5,180);
      if(phase==='taper') return Math.round(targetDur*0.5/5)*5;
      if(phase==='peak')  return targetDur;
      // build: interpolate from setup.dur to targetDur
      const buildWeeks=Math.max(weeksToEvent-2,1);
      const prog=Math.min(1,(block*4+wk)/buildWeeks);
      return Math.min(Math.round((setup.dur+(targetDur-setup.dur)*prog)/5)*5,180);
    }
    let d=setup.dur+(wk<3?wk*goalRate+block*10:0);
    return Math.min(d,150);
  }
  if(phase==='taper') return 35;
  if(phase==='peak'&&ev?.date) return 60;
  return[55,60,55,35][wk]||50; // short ride durations by phase week
}

function stravaRideOnDate(dateStr){
  const acts=DB.get('strava_activities',[]);
  return acts.find(a=>(a.start_date_local||'').slice(0,10)===dateStr)||null;
}

/* ── CYCLING PLANNER — aerobic base block ── */
// 4-week repeating block: weeks 0-2 progressive build, week 3 recovery.
// Long ride = endurance anchor (duration progresses). Short ride = quality session that rotates.
const RIDE_PHASE=['Build week 1','Build week 2','Peak week','Recovery week'];
const RIDE_LONG_DUR=[60,75,90,50];
const RIDE_QUALITY_SEQ=['tempo','sweetspot','hills','recovery'];

function getRideWeek(){
  let start=DB.get('bike_block_start',null);
  if(!start){start=fd(S.weekStart);DB.set('bike_block_start',start);}
  const startMon=new Date(start+'T12:00:00');
  const weeks=Math.round((S.weekStart-startMon)/6048e5); // 6048e5 ms = 7 days
  const block=Math.max(0,Math.floor(weeks/4));
  // E: event-aware periodization
  const ev=DB.get('bike_event',null);
  if(ev?.date){
    const evDate=new Date(ev.date+'T12:00:00');
    const weeksToEvent=Math.round((evDate-S.weekStart)/6048e5);
    if(weeksToEvent<=0)  return{wk:0,block,phase:'done',weeksToEvent:0,ev};
    if(weeksToEvent===1) return{wk:3,block,phase:'taper',weeksToEvent:1,ev};
    if(weeksToEvent===2) return{wk:2,block,phase:'peak',weeksToEvent:2,ev};
    return{wk:((weeks%4)+4)%4,block,phase:'build',weeksToEvent,ev};
  }
  return{wk:((weeks%4)+4)%4,block,phase:'build',weeksToEvent:null,ev:null};
}

function getRideSession(type){
  const{wk,block,phase,weeksToEvent,ev}=getRideWeek();
  const indoor=type.includes('INDOOR');
  // A: use onboarding starting duration + goal progression rate
  const setup=DB.get('bike_setup',{dur:45,goal:'base'});
  const goalRate={base:15,event:20,active:10}[setup.goal]||15;
  // C: apply Strava adapt factor
  const adaptFactor=DB.get('bike_adapt_factor',1.0);

  // E: compute event-aware long ride duration
  function eventLongDur(){
    if(!ev?.date||weeksToEvent===null) return null;
    const distKm=ev.unit==='mi'?ev.dist*1.609:ev.dist;
    const targetDur=Math.min(Math.round(distKm/22*60*0.75/5)*5,180);
    if(phase==='taper') return Math.max(Math.round(targetDur*0.5/5)*5,20);
    if(phase==='peak')  return targetDur;
    const buildWeeks=Math.max(weeksToEvent-2,1);
    const prog=Math.min(1,(block*4+wk)/buildWeeks);
    return Math.min(Math.round((setup.dur+(targetDur-setup.dur)*prog)*adaptFactor/5)*5,180);
  }

  if(type.includes('LONG')){
    let dur=eventLongDur();
    if(dur===null){
      dur=setup.dur+(wk<3?wk*goalRate+block*10:Math.round(setup.dur*0.6));
      dur=Math.min(Math.round(dur*adaptFactor/5)*5,150);
    }
    const phaseLabel=phase==='taper'?'Taper week — event next week!':phase==='peak'?'Peak week — longest ride':phase==='done'?'Post-event recovery':RIDE_PHASE[wk];
    const focusText=phase==='taper'?'Legs are loaded — this is a confidence ride, not a training ride. Keep it genuinely easy and arrive at your event fresh.':phase==='peak'?'Your longest training ride. You\'ve earned this distance — the event distance will feel achievable after today.':wk===3?'Recovery week — keep it genuinely easy. Lower volume lets your body absorb the last 3 weeks of work.':'Your aerobic engine builder. The discipline is staying in Zone 2 even when the legs feel great.';
    return{
      name:'Endurance Ride',phase:phaseLabel,total:dur,
      blocks:[
        {t:'10 min',d:'Easy warm-up — spin up gradually, cadence 85-95 RPM'},
        {t:(dur-15)+' min',d:phase==='taper'?'Easy Zone 1-2 — conversational, save the legs. HR under 130.':'Steady Zone 2 — HR 120-140, fully conversational pace'},
        {t:'5 min',d:'Easy cool-down spin'},
      ],
      focus:focusText,
    };
  }

  // E: taper short ride — easy legs shake-out
  if(phase==='taper'){
    return{
      name:'Event Prep Spin',phase:'Taper — event this week!',total:35,
      blocks:[
        {t:'10 min',d:'Easy warm-up spin — just get the blood moving'},
        {t:'3 × 2 min',d:'Race-pace efforts — wake the legs up, not a workout. 3 min easy spin between each'},
        {t:'10 min',d:'Easy cool-down'},
      ],
      focus:'Your legs are loaded from weeks of training. This isn\'t a workout — it\'s a reminder to your neuromuscular system what the event pace feels like. Resist the urge to train hard.',
    };
  }
  // E: peak short ride — race-pace sharpener
  if(phase==='peak'&&ev?.date){
    return{
      name:'Race-Pace Sharpener',phase:'Peak week',total:60,
      blocks:[
        {t:'15 min',d:'Warm-up with 3 × 30s accelerations to wake up the fast-twitch fibres'},
        {t:'4 × 8 min',d:'At your target event pace — effort should feel "hard but sustainable for an hour". 3 min easy spin between'},
        {t:'10 min',d:'Easy cool-down — spin out any residual fatigue'},
      ],
      focus:'Your last hard quality session before the event. You\'re sharpening, not building — the fitness is already there. Trust the training.',
    };
  }

  // Quality (shorter) ride — rotates each phase week
  const q=RIDE_QUALITY_SEQ[wk];
  if(q==='tempo')return{
    name:'Tempo Intervals',phase:RIDE_PHASE[wk],total:55,
    blocks:[
      {t:'15 min',d:'Warm-up — build from easy to low Zone 2'},
      {t:'2 × 12 min',d:'Tempo — Zone 3, HR 140-155, steady & strong. 5 min easy spin between'},
      {t:'10 min',d:'Easy cool-down'},
    ],
    focus:'Tempo teaches your body to clear lactate efficiently — the bridge between easy riding and hard efforts.',
  };
  if(q==='sweetspot')return{
    name:'Sweet Spot',phase:RIDE_PHASE[wk],total:60,
    blocks:[
      {t:'15 min',d:'Warm-up with 2-3 short 30s pickups near the end'},
      {t:'3 × 10 min',d:'Sweet Spot — strong but controlled (~88-93% of threshold). 5 min recovery between'},
      {t:'10 min',d:'Easy cool-down'},
    ],
    focus:'The best return-on-time interval for raising sustainable power. Hard, but you should finish each block — not bury yourself.',
  };
  if(q==='hills')return{
    name:'Hill Repeats',phase:RIDE_PHASE[wk],total:55,
    blocks:[
      {t:'15 min',d:'Warm-up — easy spinning to the climb'},
      {t:'5 × 4 min',d:indoor?'High resistance, low cadence 60-70 RPM, strong & seated. Easy 3 min spin between':'Hill climbs — strong seated effort, low cadence. Easy descent to recover'},
      {t:'10 min',d:'Easy cool-down'},
    ],
    focus:'Hills build leg strength and force production — power that carries over to every other ride.',
  };
  return{
    name:'Recovery Spin',phase:RIDE_PHASE[wk],total:35,
    blocks:[
      {t:'35 min',d:'Very easy — Zone 1, light pressure on the pedals, high cadence 90+ RPM, flat route'},
    ],
    focus:'This is not training — it\'s active recovery. If you feel any strain, you\'re going too hard.',
  };
}

  cable_curl:['bb_curl'],               db_curl:['bb_curl'],
};
function applyEnergySwap(exs,energy){
  if(energy==='okay')return exs;
  const map=energy==='fresh'?SWAP_HEAVY:SWAP_LIGHT;
  // Pre-populate used with current plan so we never swap TO something already there
  const used=new Set(exs);
  const result=[];
  for(const id of exs){
    used.delete(id); // allow this slot to be replaced
    const alts=map[id]||[];
    const picked=alts.find(a=>EX[a]&&!used.has(a))||id;
    used.add(picked);
    result.push(picked);
  }
  return result;
}

async function fetchWeather(lat,lon,startStr){
  // Cache per week-start + coarse location for 3 hours — avoids re-hitting the API on every regenerate
  const ck='weather_'+startStr+'_'+lat.toFixed(2)+'_'+lon.toFixed(2);
  const cached=DB.get(ck,null);
  if(cached&&cached.t&&(Date.now()-cached.t)<10800000&&Array.isArray(cached.d))return cached.d;
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,windspeed_10m_max,weathercode&timezone=auto&forecast_days=16`;
  const r=await fetch(url);if(!r.ok)throw new Error();
  const data=await r.json();const d=data.daily;
  let si=d.time.indexOf(startStr);if(si<0)si=0;
  const result=Array.from({length:7},(_,i)=>({
    date:d.time[si+i],
    tmax:Math.round(d.temperature_2m_max[si+i]),
    tmin:Math.round(d.temperature_2m_min[si+i]),
    rain:Math.round(d.precipitation_sum[si+i]*10)/10,
    wind:Math.round(d.windspeed_10m_max[si+i]),
    code:d.weathercode[si+i],
    score:bikeScore(d.precipitation_sum[si+i],d.windspeed_10m_max[si+i],d.temperature_2m_max[si+i]),
  }));
  DB.set(ck,{t:Date.now(),d:result});
  return result;
}
function bikeScore(rain,wind,tmax){
  let s=100;
  if(rain>10)return 0;
  if(rain>5)s-=40;else if(rain>2)s-=20;else if(rain>0.5)s-=8;
  if(wind>40)s-=30;else if(wind>25)s-=15;else if(wind>15)s-=5;
  if(tmax<3)s-=40;else if(tmax<8)s-=15;
  return Math.max(0,Math.round(s));
}
function wIcon(code,rain){
  if(rain>5)return'🌧';if(rain>1)return'🌦';
  if(code>=95)return'⛈';if(code>=80)return'🌧';if(code>=71)return'❄️';
  if(code>=51)return'🌦';if(code>=3)return'☁️';if(code>=1)return'⛅';return'☀️';

function verdict(score){

}

/* ── WEEK GENERATION ── */
const GYM_SEQ=['PUSH','PULL','LEGS','UPPER_PUMP'];

function getLastGymType(){
  // Scan back up to 28 days for the last completed gym workout type
  for(let i=1;i<=28;i++){
    const d=addDays(new Date(),-i);
    const log=DB.get(DB.lk(d),null);
    if(log?.exercises?.some(e=>e.sets.some(s=>s.done))){
      const plan=DB.get(DB.pk(getMon(d)),null);
      const dp=plan?.find(x=>x.date===fd(d));
      if(dp&&GYM_SEQ.includes(dp.type))return dp.type;
    }
  }
  return'UPPER_PUMP'; // default so PUSH comes next
}

function buildWeek(wdays){
  const bikePref=DB.get('bike_pref','weather');
  const ranked=[...wdays].map((d,i)=>({i,s:d.score})).sort((a,b)=>b.s-a.s);

  // Lock days that already have completed sets — preserve them on refresh
  const existingPlan=DB.get(DB.pk(S.weekStart),null);
  const locked={}; // dayIndex → type
  if(existingPlan){
    existingPlan.forEach((dp,i)=>{
      const log=DB.get(DB.lk(new Date(dp.date+'T12:00:00')),null);
      if(log?.exercises?.some(e=>e.sets.some(s=>s.done))&&GYM_SEQ.includes(dp.type))locked[i]=dp.type;
    });
  }

  // mk: preserves exercises for locked days, generates fresh for new days
  const mk=(w,type,idx)=>{
    if(locked[idx]&&existingPlan?.[idx])return{...existingPlan[idx],weather:w};
    const exs=GYM_SEQ.includes(type)?genSession(type):null;
    return{date:w.date,type,exercises:exs,weather:w};
  };

  // Assign gym types in PPL sequence, respecting locked days
  function assignGym(gymDays,asgn){
    const sorted=[...gymDays].sort((a,b)=>a-b);
    // Find last completed type (locked days this week first, then history)
    let lastType=null;
    for(const i of sorted){if(locked[i])lastType=locked[i];}
    if(!lastType)lastType=getLastGymType();
    let si=(GYM_SEQ.indexOf(lastType)+1)%GYM_SEQ.length;
    for(const i of sorted){
      if(locked[i]){asgn[i]=locked[i];}
      else{asgn[i]=GYM_SEQ[si];si=(si+1)%GYM_SEQ.length;}
    }
  }

  if(bikePref==='none'){
    const restIdx=ranked[ranked.length-1].i;
    const gymDays=[0,1,2,3,4,5,6].filter(i=>i!==restIdx);
    const asgn={};
    assignGym(gymDays,asgn);
    return wdays.map((w,i)=>mk(w,i===restIdx?'REST':asgn[i]||'REST',i));
  }

  // D: gym-aware — find tentative LEGS day to avoid placing hard ride after it
  // We do a quick pre-pass to figure out which gym day would get LEGS
  const OT=45;
  const tentativeRideSet=new Set([ranked[0].i,ranked[1].i]);
  const tentativeRest5=[0,1,2,3,4,5,6].filter(i=>!tentativeRideSet.has(i));
  let tentativeRestIdx=(ranked[0].i+1)%7;
  if(!tentativeRest5.includes(tentativeRestIdx))tentativeRestIdx=tentativeRest5[tentativeRest5.length-1];
  const tentativeGymDays=tentativeRest5.filter(i=>i!==tentativeRestIdx).sort((a,b)=>a-b);
  let legsIdx=-1;
  {
    let lastType=getLastGymType();
    let si=(GYM_SEQ.indexOf(lastType)+1)%GYM_SEQ.length;
    for(const i of tentativeGymDays){
      if(locked[i]){if(locked[i]==='LEGS')legsIdx=i;}
      else{if(GYM_SEQ[si]==='LEGS')legsIdx=i;si=(si+1)%GYM_SEQ.length;}
    }
  }
  const postLegsIdx=legsIdx>=0?(legsIdx+1)%7:-1;

  // Pick long ride day: best weather overall
  // Pick short (quality) ride day: best weather that is NOT the day after LEGS
  const longCandidates=[...ranked];
  const shortCandidates=[...ranked].map(r=>({...r,s:r.i===postLegsIdx?r.s-40:r.s})).sort((a,b)=>b.s-a.s);
  const r1=longCandidates[0];
  const r2=shortCandidates.find(r=>r.i!==r1.i)||shortCandidates[1];

  const t1=bikePref==='indoor'?'LONG_INDOOR':r1.s>=OT?'LONG_OUTDOOR':'LONG_INDOOR';
  const t2=bikePref==='indoor'?'SHORT_INDOOR':r2.s>=OT?'SHORT_OUTDOOR':'SHORT_INDOOR';
  const rideSet=new Set([r1.i,r2.i]);
  const rest5=[0,1,2,3,4,5,6].filter(i=>!rideSet.has(i));
  let restIdx=(r1.i+1)%7;
  if(!rest5.includes(restIdx))restIdx=rest5[rest5.length-1];
  const gymDays=rest5.filter(i=>i!==restIdx);
  const asgn={};
  assignGym(gymDays,asgn);
  return wdays.map((w,i)=>{
    let type;
    if(i===r1.i)type=t1;
    else if(i===r2.i)type=t2;
    else if(i===restIdx)type='REST';
    else type=asgn[i]||'REST';
    return mk(w,type,i);
  });
}

/* ── SESSION GENERATION ── */
function genSession(type,energy='okay'){
  const slots=SLOTS[type];
  const recent=DB.get('recent_ex',[]);
  const picked=[];
  for(const candidates of slots){
    let avail=filterSlot(candidates).filter(id=>!picked.includes(id));
    if(!avail.length)continue;
    // Filter by energy level — prefer compound when fresh, isolation when tired/sore
    if(energy==='fresh'){
      const comp=avail.filter(id=>EX[id]?.t==='C');
      if(comp.length)avail=comp;
    } else if(energy==='tired'||energy==='sore'){
      const iso=avail.filter(id=>EX[id]?.t==='I');
      if(iso.length)avail=iso;
    }
    const sorted=[...avail].sort((a,b)=>{
      const ai=recent.indexOf(a),bi=recent.indexOf(b);
      if(ai===-1&&bi===-1)return Math.random()<.5?-1:1;
      if(ai===-1)return -1;if(bi===-1)return 1;
      return ai-bi;
    });
    picked.push(sorted[0]);
  }
  return picked;
}

function loadGifDb(){
  // Build cache directly from hardcoded paths — instant, no network call
  Object.entries(EX).forEach(([id,ex])=>{
    if(ex.p){
      S.gifCache[id]={
        f0:GIF_BASE+ex.p+'/0.jpg',
        f1:GIF_BASE+ex.p+'/1.jpg',
      };
    }
  });
  patchGifs();
}
function patchGifs(){
  document.querySelectorAll('.ex-gif[data-xid]').forEach(img=>loadExImg(img));
}
function loadExImg(img){
  const xid=img.dataset.xid;
  const entry=S.gifCache[xid];
  const wrap=img.closest('.ex-gif-wrap');
  const ph=wrap?.querySelector('.gif-ph');
  if(!entry){
    // No image path — show styled placeholder immediately
    const ex=EX[xid];
    const style=G_PH[ex?.g]||{bg:'linear-gradient(135deg,#374151,#6b7280)',i:'💪'};
    if(ph)ph.innerHTML=`<div style="width:100%;height:100%;background:${style.bg};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px"><div style="font-size:40px">${style.i}</div><div style="font-size:12px;font-weight:700;color:rgba(255,255,255,.8);text-align:center;padding:0 16px">${ex?.n||''}</div><div style="font-size:10px;color:rgba(255,255,255,.55)">${ex?.m||''}</div></div>`;
    return;
  }
  const t=new Image();
  t.onload=()=>{img.src=t.src;img.classList.add('on');if(ph)ph.classList.add('off');};
  t.onerror=()=>{
    // Path wrong — fall back to styled placeholder
    const ex=EX[xid];
    const style=G_PH[ex?.g]||{bg:'linear-gradient(135deg,#374151,#6b7280)',i:'💪'};
    if(ph)ph.innerHTML=`<div style="width:100%;height:100%;background:${style.bg};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px"><div style="font-size:40px">${style.i}</div><div style="font-size:12px;font-weight:700;color:rgba(255,255,255,.8);text-align:center;padding:0 16px">${ex?.n||''}</div><div style="font-size:10px;color:rgba(255,255,255,.55)">${ex?.m||''}</div></div>`;
  };
  t.src=entry.f0;
}
function loadAllGifs(){patchGifs();}

// Animate between frame 0 and frame 1 on tap — simulates motion
function toggleAnim(xid,btn){
  const entry=S.gifCache[xid];
  if(!entry||!entry.f1){openVid(xid);return;} // no second frame → go straight to video
  const img=document.querySelector(`.ex-gif[data-xid="${xid}"]`);if(!img)return;
  if(_animTimers[xid]){
    clearInterval(_animTimers[xid]);delete _animTimers[xid];
    img.src=entry.f0;btn.textContent='▶';return;
  }
  let frame=0;
  _animTimers[xid]=setInterval(()=>{
    frame=1-frame;
    img.src=frame?entry.f1:entry.f0;
  },700);
  btn.textContent='⏹';
}

function pinKey(k){

  for(let i=0;i<4;i++){const d=document.getElementById('pd'+i);if(d)d.classList.toggle('filled',i<_pinBuf.length);}

function checkPin(){
  const saved=DB.get('pin',null);
  if(saved){
    if(_pinBuf===saved){S.authed=true;_pinBuf='';syncDown().then(()=>render());render();}
    else{errPin();_pinBuf='';}
  } else {
    if(S.lockMode==='setup'){
      S.pinConfirm=_pinBuf;_pinBuf='';S.lockMode='confirm';render();
    } else {
      if(_pinBuf===S.pinConfirm){
        DB.set('pin',_pinBuf);_pinBuf='';S.pinConfirm='';
        S.lockMode='github_setup';render(); // prompt to connect cloud before entering
      } else {
        errPin();_pinBuf='';S.pinConfirm='';S.lockMode='setup';setTimeout(()=>{S.lockMode='setup';render();},600);
      }
    }
  }
}

async function doForgotPassword(){
  const userEl=document.getElementById('auth-user');
  const errEl=document.getElementById('auth-err');
  const raw=(userEl?.value||'').trim();
  const isEmail=raw.includes('@');
  const username=raw.toLowerCase().replace(/[^a-z0-9_]/g,'');
  if(!raw){if(errEl)errEl.textContent='Enter your email or username above first.';return;}
  if(!initFirebase()){if(errEl)errEl.textContent='Could not connect — check your connection.';return;}
  try{
    const loginEmail=isEmail?raw.toLowerCase():username+'@training-brain.app';
    await _fbAuth.sendPasswordResetEmail(loginEmail);
    if(errEl){errEl.style.color='var(--grn)';errEl.textContent='✅ Reset link sent — check your inbox.';}
  }catch(e){
    if(errEl){errEl.style.color='var(--red)';errEl.textContent=e.code==='auth/user-not-found'?'No account found for that email.':'Error: '+e.message;}
  }
}

async function doAuth(isNew){
  const userEl=document.getElementById('auth-user');
  const passEl=document.getElementById('auth-pass');
  const recoveryEl=document.getElementById('auth-recovery');
  const errEl=document.getElementById('auth-err');
  const raw=(userEl?.value||'').trim();
  const isEmail=raw.includes('@');
  const username=raw.toLowerCase().replace(/[^a-z0-9_]/g,'');
  const pass=passEl?.value||'';
  const recovery=(recoveryEl?.value||'').trim()||null;
  if(errEl)errEl.textContent='';
  if(!raw){if(errEl)errEl.textContent='Enter your email or username.';return;}
  if(!pass){if(errEl)errEl.textContent='Enter a password.';return;}
  if(!initFirebase()){if(errEl)errEl.textContent='Could not connect — check your internet connection.';return;}
  const btn=document.querySelector('.btn-p');if(btn){btn.textContent='…';btn.disabled=true;}
  // Use real email directly if provided, otherwise derive internal email from username
  const internalEmail=isEmail?raw.toLowerCase():username+'@training-brain.app';
  try{
    let result;
    if(isNew){
      // Check username not taken
      const snap=await _fbDb.ref('usernames/'+username).once('value');
      if(snap.exists()){
        if(errEl)errEl.textContent='Username already taken — choose another.';
        if(btn){btn.textContent='Create Account';btn.disabled=false;}
        return;
      }
      if(pass.length<6){if(errEl)errEl.textContent='Password must be at least 6 characters.';if(btn){btn.textContent='Create Account';btn.disabled=false;}return;}
      result=await _fbAuth.createUserWithEmailAndPassword(internalEmail,pass);
      // Store username → uid mapping — if this fails, roll back auth user to prevent orphaned accounts
      try{
        await _fbDb.ref('usernames/'+username).set({uid:result.user.uid,created:new Date().toISOString()});
        if(recovery)await _fbDb.ref('users/'+result.user.uid+'/profile').set({username,recovery});
        else await _fbDb.ref('users/'+result.user.uid+'/profile').set({username});
      }catch(dbErr){
        try{await result.user.delete();}catch(_){}
        throw dbErr;
      }
    }else{
      // Sign in: look up username → internal email
      result=await _fbAuth.signInWithEmailAndPassword(internalEmail,pass);
    }
    S.fbUser={uid:result.user.uid,name:username,email:internalEmail,username};
    DB.set('fb_user',S.fbUser);
    S._authNew=false;
    S.authed=true;S.lockMode='choose';
    await loadFromCloud();
    render();
  }catch(e){
    const msgs={
      'auth/user-not-found':'No account with that username — try "Create Account".',
      'auth/wrong-password':'Wrong password. Try again.',
      'auth/invalid-credential':'Wrong username or password.',
      'auth/email-already-in-use':'Username already taken — choose another.',
      'auth/weak-password':'Password must be at least 6 characters.',
      'auth/too-many-requests':'Too many attempts. Try again later.',
    };
    if(errEl)errEl.textContent=msgs[e.code]||('Error: '+e.message);
    if(btn){btn.textContent=isNew?'Create Account':'Sign In';btn.disabled=false;}
  }
}

async function saveToCloud(manual=false){
  if(!S.fbUser||!_fbDb||S.guest)return;
  const data={};
  const _syncKeys=['prs','recent_ex','lang','review_email','emailjs_service','emailjs_template','emailjs_key',
    'user_profile','strava_token','strava_activities','bike_setup','bike_adapt_factor','bike_block_start','bike_event','bike_pref'];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k.startsWith('log_')||k.startsWith('plan_')||k.startsWith('weekreview_')||_syncKeys.includes(k))data[k]=DB.get(k);
  }
  try{
    await _fbDb.ref('users/'+S.fbUser.uid).set({data,updated:new Date().toISOString()});
    DB.set('fb_last_sync',new Date().toISOString());
    if(manual){const b=document.querySelector('.sync-bar');if(b)b.innerHTML=`<span><span class="sync-dot"></span>☁️ Backed up just now</span><button onclick="saveToCloud(true)" style="background:none;border:none;color:var(--al);font-size:11px;font-weight:700;cursor:pointer">Back up now</button>`;render();}
  }catch(_){}
}

async function loadFromCloud(){
  if(!S.fbUser||!_fbDb)return;
  try{
    const snap=await _fbDb.ref('users/'+S.fbUser.uid).once('value');
    if(snap.exists()){const {data}=snap.val()||{};Object.entries(data||{}).forEach(([k,v])=>DB.set(k,v));}
  }catch(_){}
}

function saveFBConfig(){

  const match=raw.match(/\{[\s\S]*\}/);
  if(!match){alert('Could not read the config — copy the full firebaseConfig object from Firebase console.');return;}

function collectReviewData(){
  const today=new Date();
  const cutoff=fd(addDays(today,-56));
  const gymSessions=[],rides=[];
  for(let i=0;i<56;i++){
    const ds=fd(addDays(today,-i));
    const log=DB.get('log_'+ds,null);
    if(!log)continue;
    if(log.exercises&&log.exercises.length){
      const exs=log.exercises.map(e=>{
        const ex=EX[e.id];
        const done=(e.sets||[]).filter(s=>s.done&&s.w);
        if(!done.length)return null;
        return`${ex?ex.n:e.id} ${done.map(s=>`${s.w||'?'}×${s.r||'?'}`).join('/')}`;
      }).filter(Boolean);
      if(exs.length)gymSessions.push({date:ds,energy:log.energy||'-',completed:!!log.completed,exercises:exs});
    }
    if(log.ride&&log.ride.dur!=null){
      rides.push({date:ds,src:'manual',dur:log.ride.dur,dist:log.ride.dist,hr:log.ride.hr,rpe:log.ride.rpe});
    }
  }
  (DB.get('strava_activities',[])||[]).forEach(a=>{
    const ds=(a.start_date_local||'').slice(0,10);
    if(ds>=cutoff)rides.push({date:ds,src:'strava',dur:Math.round((a.moving_time||0)/60),dist:+((a.distance||0)/1000).toFixed(1),hr:a.average_heartrate?Math.round(a.average_heartrate):null,watts:a.average_watts?Math.round(a.average_watts):null});
  });
  return{gymSessions,rides,prs:DB.get('prs',{}),plan:DB.get(DB.pk(getMon(today)),null)};
}

function buildReviewPrompt(d){
  const u=unit();
  const gymTxt=d.gymSessions.length?d.gymSessions.slice(0,45).map(s=>`${s.date} (energy:${s.energy}${s.completed?', completed':', partial'}) — ${s.exercises.join(' | ')}`).join('\n'):'No gym sessions logged in the last 8 weeks.';
  const rideTxt=d.rides.length?d.rides.slice(0,45).map(r=>`${r.date} [${r.src}] ${r.dur}min${r.dist!=null?', '+r.dist+'km':''}${r.hr!=null?', '+r.hr+'bpm':''}${r.watts!=null?', '+r.watts+'W':''}${r.rpe!=null?', RPE'+r.rpe:''}`).join('\n'):'No rides logged in the last 8 weeks.';
  const prTxt=Object.entries(d.prs||{}).map(([id,p])=>`${EX[id]?EX[id].n:id}: ${p.w}${u}×${p.r}`).join(', ')||'No PRs recorded.';
  const planTxt=d.plan?d.plan.map(x=>`${x.date}:${x.type}`).join(', '):'No plan set for the current week.';
  const zh=DB.get('lang','en')==='zh';
  const langNote=zh?'\n\nIMPORTANT: Write your ENTIRE response in Traditional Chinese (繁體中文). Keep the four section labels SUMMARY:/OVERLOAD:/RECOVERY:/FOCUS: in English so the app can parse them, but all content must be Traditional Chinese.':'';
  return`You are a personal training coach. Analyse the user's last 8 weeks of training data. Provide: 1) A honest weekly performance summary, 2) Progressive overload recommendations for next week (specific exercises, specific weight/rep targets), 3) Recovery flags if you detect fatigue patterns, 4) One focus goal for next week. Be concise, specific, and data-driven. No generic advice. Weights are in ${u}.${langNote}

Respond with EXACTLY these four labelled sections, each starting on its own line:
SUMMARY: <honest performance summary>
OVERLOAD: <specific progressive overload recommendations, naming exercises and weight/rep targets>
RECOVERY: <recovery flags / fatigue patterns, or state there are none>
FOCUS: <one specific focus goal for next week>

=== GYM SESSIONS (most recent first) ===
${gymTxt}

=== RIDES (most recent first) ===
${rideTxt}

=== ALL-TIME PERSONAL RECORDS ===
${prTxt}

=== CURRENT WEEK PLAN ===
${planTxt}`;
}

function parseReview(text){
  const keys=['SUMMARY','OVERLOAD','RECOVERY','FOCUS'];
  const out={};
  keys.forEach((k,i)=>{
    const next=keys[i+1];
    const re=new RegExp(k+'\\s*:\\s*([\\s\\S]*?)(?='+(next?next+'\\s*:':'$')+')','i');
    const m=text.match(re);
    let c=m?m[1].trim():'';
    c=_esc(c).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n+/g,'<br>');
    out[k.toLowerCase()]=c;
  });
  return out;
}

async function generateWeeklyReview(){
  if(S.guest){showToast(_T('wr_error'),'var(--amb)');return;}
  S.reviewLoading=true;render();
  try{
    const prompt=buildReviewPrompt(collectReviewData());
    const r=await fetch(GEMINI_PROXY,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:1100,temperature:0.7,thinkingConfig:{thinkingBudget:0}}})});
    if(!r.ok)throw new Error('API '+r.status);
    const json=await r.json();
    const text=json.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
    if(!text)throw new Error('empty response');
    const parsed=parseReview(text);
    if(!parsed.summary&&!parsed.overload&&!parsed.focus)throw new Error('unparseable');
    DB.set('weekreview_'+fd(getMon(new Date())),{generated:new Date().toISOString(),...parsed});
    S.reviewLoading=false;
    syncUp();
    render();
  }catch(e){
    console.warn('Weekly review failed:',e);
    S.reviewLoading=false;
    render();
    showToast(_T('wr_error'),'var(--red)');
  }
}

${sec(_T('wr_s_recovery'),review.recovery)}
${sec(_T('wr_s_focus'),review.focus)}
<p style="margin-top:22px;font-size:12px;color:#888">${_T('wr_generated_on')} ${review.generated?new Date(review.generated).toLocaleString():''}</p>
</div>`;
  showToast('📧 …','var(--acc)');

/* ── LOG SCREEN ── */
function startLog(ds){
  const pk=DB.pk(S.weekStart);
  const plan=DB.get(pk,null);
  const dp=plan?.find(d=>d.date===ds);
  if(!dp)return;
  let log=DB.get(DB.lk(S.viewDate),null);
  if(!log){
    log={date:ds,type:dp.type,exercises:(dp.exercises||[]).map(id=>{
      const ex=EX[id];
      const last=getLastLog(id);
      return{id,sets:makeSets(id,S.energy||'okay',last)};
    }),completed:false};
    DB.set(DB.lk(S.viewDate),log);
  }
  S.activeLog=log;S.openLogEx=0;go('log');
}

function makeSets(exId,energy,last){
  const ex=EX[exId];if(!ex)return[];
  const n=energyTargets(exId,energy).sets;
  if(ex.uni){
    return Array.from({length:n*2},(_,i)=>{
      const side=i%2===0?'L':'R';
      const pw=last?.[i]?.w||'';
      return{w:pw,r:last?.[i]?.r||'',done:false,side,_edited:!!pw};
    });
  }
  return Array.from({length:n},(_,si)=>{
    const pw=last?.[si]?.w||'';
    return{w:pw,r:last?.[si]?.r||'',done:false,_edited:!!pw};
  });
}

function getLastLog(exId){
  for(let i=1;i<=45;i++){
    const d=addDays(new Date(),-i);
    const log=DB.get(DB.lk(d),null);
    if(!log)continue;
    const ex=log.exercises?.find(e=>e.id===exId);
    if(ex&&ex.sets.some(s=>s.done))return ex.sets;
  }
  return null;
}

function rLog(){
  const log=S.activeLog;
  if(!log)return`<div class="screen"><button class="back-btn" onclick="go('day')">← Back</button></div>`;
  const wi=WI[log.type]||WI.REST;
  return`<div class="screen">
<div class="day-hdr">
  <button class="back-btn" onclick="go('day',{viewDate:S.viewDate})">← Back</button>
  <div class="day-hdr-r">Log: ${typeof wi.l==='function'?wi.l():wi.l}</div>
</div>
<div class="log-list">
  ${log.exercises.map((le,ei)=>rLogEx(le,ei)).join('')}
</div>
<button class="btn btn-p" onclick="completeWk()">✓ Complete Workout</button>
</div>`;
}

function setLabel(si,set){
  if(set.side==='L')return'<span style="font-size:10px;font-weight:800;color:var(--al)">L</span>';
  if(set.side==='R')return'<span style="font-size:10px;font-weight:800;color:#f472b6">R</span>';
  return String(si+1);
}
function rLogEx(le,ei){

  const doneSets=le.sets.filter(s=>s.done).length;
  const isOpen=S.openLogEx===ei;
  const wPh=tgt.sugW?`~${tgt.sugW}${unit()}`:'—';
  const rPh=tgt.reps||'—';
  // compact summary for when collapsed and done
  const bestSet=allDone?le.sets.filter(s=>s.done&&s.w).sort((a,b)=>parseFloat(b.w)-parseFloat(a.w))[0]:null;
  const summary=bestSet?`<span id="sum${ei}" style="font-size:11px;color:var(--t2);margin-left:6px">${bestSet.w}${unit()} × ${bestSet.r}</span>`:`<span id="sum${ei}"></span>`;
  return`<div class="log-ex${allDone?' done-ex':''}" id="lex${ei}">
<div class="log-ex-hdr" onclick="togLogEx(${ei})">

  <button class="wt-adj" style="font-size:13px;padding:4px 7px;width:auto;height:auto;margin-left:4px;flex-shrink:0" onclick="event.stopPropagation();openExSwap('${le.id}',${ei},'${S.activeLog.date}','${S.activeLog.type}')">🔄</button>
  <span class="log-ex-prog${allDone?' done':''}" id="prog${ei}">${allDone?'✓ Done':doneSets+'/'+le.sets.length}</span>
  <span class="log-ex-chev${isOpen?' open':''}" id="chev${ei}">▾</span>
</div>
<div class="log-ex-body${isOpen?'':' collapsed'}" id="lbody${ei}">
  ${unitBar()}
  <div style="font-size:11px;color:var(--t2);margin-bottom:8px">${tgt.sets} ${_T('sets_unit')} · ${tgt.reps} ${_T('reps_unit')} · RPE ${tgt.rpe}${tgt.sugW?' · <span style="color:var(--al);font-weight:700">~'+tgt.sugW+unit()+' '+_T('suggested')+'</span>':''}</div>
  <div class="sets-hdr"><span>#</span><span class="unit-lbl">${unit()}</span><span>Reps</span><span>✓</span></div>
  ${le.sets.map((set,si)=>`<div class="set-row${set.done?' s-done':''}" id="sr${ei}_${si}">
    <span class="set-n">${setLabel(si,set)}</span>
    <div class="wt-wrap">
      <button class="wt-adj" onclick="adjW(${ei},${si},-1)">−</button>
      <input class="set-inp w-inp${set.w&&!set._edited?' prefilled':''}" type="text" inputmode="decimal" placeholder="${wPh}" value="${set.w}" oninput="markEdited(${ei},${si},this)" onchange="updSet(${ei},${si},'w',this.value)">
      <button class="wt-adj" onclick="adjW(${ei},${si},1)">+</button>
    </div>
    <input class="set-inp" type="text" inputmode="numeric" placeholder="${rPh}" value="${set.r}" onchange="updSet(${ei},${si},'r',this.value)">
    <button class="set-ck${set.done?' on':''}" id="ck${ei}_${si}" onclick="togSet(${ei},${si})">${set.done?'✓':'○'}</button>
  </div>`).join('')}
  <button class="add-set" onclick="addSet(${ei})">+ Add set</button>
  <button class="ex-busy-btn" style="margin-top:10px;width:100%;text-align:center" onclick="openExSwap('${le.id}',${ei},'${S.activeLog.date}','${S.activeLog.type}')">🔄 Machine busy? Swap exercise</button>
</div>
</div>`;
}

function togLogEx(ei){
  const wasOpen=S.openLogEx===ei;
  S.openLogEx=wasOpen?null:ei;
  document.querySelectorAll('[id^="lbody"]').forEach((body,i)=>{
    const isOpen=S.openLogEx===i;
    body.classList.toggle('collapsed',!isOpen);
    const chev=document.getElementById('chev'+i);
    if(chev)chev.classList.toggle('open',isOpen);
  });
}

function updSet(ei,si,field,val){
  if(!S.activeLog)return;
  const set=S.activeLog.exercises[ei]?.sets[si];
  if(!set)return;
  set[field]=val;
  DB.set(DB.lk(S.viewDate),S.activeLog);
  debouncedSync();
}

function togSet(ei,si){
  if(!S.activeLog)return;
  if(guestLogBlock())return;
  const le=S.activeLog.exercises[ei];
  const set=le?.sets[si];if(!set)return;
  set.done=!set.done;
  DB.set(DB.lk(S.viewDate),S.activeLog);
  if(set.done&&set.w&&set.r)checkPR(le.id,parseFloat(set.w),parseInt(set.r));
  debouncedSync();
  // patch DOM
  const row=document.getElementById(`sr${ei}_${si}`);
  const ck=document.getElementById(`ck${ei}_${si}`);
  if(row)row.className='set-row'+(set.done?' s-done':'');
  if(ck){ck.className='set-ck'+(set.done?' on':'');ck.textContent=set.done?'✓':'○';}
  const allDone=le.sets.every(s=>s.done);
  const doneSets=le.sets.filter(s=>s.done).length;
  const exEl=document.getElementById(`lex${ei}`);
  if(exEl)exEl.className='log-ex'+(allDone?' done-ex':'');
  const prog=document.getElementById('prog'+ei);
  if(prog){prog.textContent=allDone?'✓ Done':doneSets+'/'+le.sets.length;prog.className='log-ex-prog'+(allDone?' done':'');}
  // update compact summary in header
  if(allDone){
    const best=le.sets.filter(s=>s.done&&s.w).sort((a,b)=>parseFloat(b.w)-parseFloat(a.w))[0];
    const sumEl=document.getElementById('sum'+ei);
    if(sumEl&&best)sumEl.textContent=`${best.w}${unit()} × ${best.r}`;
  }
  if(allDone&&set.done){
    setTimeout(()=>{
      const nextEi=ei+1;
      if(nextEi<S.activeLog.exercises.length&&!S.activeLog.exercises[nextEi].sets.every(s=>s.done))togLogEx(nextEi);
    },350);
  }
}

function addSet(ei){
  if(!S.activeLog)return;
  if(guestLogBlock())return;
  const le=S.activeLog.exercises[ei];if(!le)return;
  const last=le.sets[le.sets.length-1]||{};
  const si=le.sets.length;
  le.sets.push({w:last.w||'',r:last.r||'',done:false});
  DB.set(DB.lk(S.viewDate),S.activeLog);
  const body=document.getElementById('lbody'+ei);
  if(!body)return;
  const addBtn=body.querySelector('.add-set');
  const div=document.createElement('div');
  div.className='set-row';div.id=`sr${ei}_${si}`;
  div.innerHTML=`<span class="set-n">${si+1}</span>
    <div class="wt-wrap"><button class="wt-adj" onclick="adjW(${ei},${si},-1)">−</button><input class="set-inp w-inp" type="text" inputmode="decimal" placeholder="—" value="${last.w||''}" oninput="markEdited(${ei},${si},this)" onchange="updSet(${ei},${si},'w',this.value)"><button class="wt-adj" onclick="adjW(${ei},${si},1)">+</button></div>

    <button class="set-ck" id="ck${ei}_${si}" onclick="togSet(${ei},${si})">○</button>`;
  body.insertBefore(div,addBtn);
}

function checkPR(id,weight,reps){
  if(!weight||!reps)return;
  const prs=DB.get('prs',{});
  const cur=prs[id];
  if(!cur||weight>cur.w||(weight===cur.w&&reps>cur.r)){
    prs[id]={w:weight,r:reps,date:fd(new Date())};
    DB.set('prs',prs);
    prToast(EX[id]?.n||id);
  }
}

function prToast(name){
  let t=document.querySelector('.pr-toast');
  if(!t){t=document.createElement('div');t.className='pr-toast';document.body.appendChild(t);}
  t.textContent=`🏆 New Personal Best — ${name}!`;
  t.classList.add('on');
  clearTimeout(t._tid);
  t._tid=setTimeout(()=>{t.classList.remove('on');},2800);
}

function adjW(ei,si,dir){
  if(!S.activeLog)return;
  const set=S.activeLog.exercises[ei]?.sets[si];if(!set)return;
  const step=DB.get('unit','kg')==='lb'?5:2.5;
  const cur=parseFloat(set.w)||0;
  const nw=Math.max(0,Math.round((cur+dir*step)*10)/10);
  set.w=nw%1===0?String(nw):nw.toFixed(1);
  set._edited=true;
  DB.set(DB.lk(S.viewDate),S.activeLog);
  const inp=document.querySelector(`#sr${ei}_${si} .w-inp`);
  if(inp){inp.value=set.w;inp.classList.remove('prefilled');}
  debouncedSync();
}

function markEdited(ei,si,inp){
  if(!S.activeLog)return;
  const set=S.activeLog.exercises[ei]?.sets[si];if(!set)return;
  set._edited=true;
  inp.classList.remove('prefilled');
}

function completeWk(){
  if(!S.activeLog)return;
  S.activeLog.completed=true;
  DB.set(DB.lk(S.viewDate),S.activeLog);
  const ids=S.activeLog.exercises.map(e=>e.id);
  const recent=DB.get('recent_ex',[]);
  DB.set('recent_ex',[...new Set([...ids,...recent])].slice(0,40));
  syncUp();
  go('day',{viewDate:S.viewDate});
}

function closeSwap(){const m=document.getElementById('swap-modal');if(m)m.remove();}
function doSwap(ds,newType){
  const mon=getMon(new Date(ds+'T12:00:00'));
  const pk=DB.pk(mon);
  const plan=DB.get(pk,null);if(!plan)return;
  const di=plan.findIndex(d=>d.date===ds);if(di===-1)return;
  const oldType=plan[di].type;
  const gymTypes=['PUSH','PULL','LEGS','UPPER_PUMP'];
  const wasGym=gymTypes.includes(oldType);
  const goingToRest=newType==='REST';
  plan[di].type=newType;
  plan[di].exercises=gymTypes.includes(newType)?genSession(newType):null;
  // Auto-cascade: missed gym workout ripples through remaining gym days immediately
  if(wasGym&&goingToRest){
    const tl={PUSH:'Push',PULL:'Pull',LEGS:'Legs',UPPER_PUMP:'Upper Pump'};
    const futureGym=plan.filter((d,i)=>i!==di&&d.date>ds&&gymTypes.includes(d.type))
      .sort((a,b)=>a.date.localeCompare(b.date));
    if(futureGym.length>0){
      const cascadeTypes=[oldType,...futureGym.map(d=>d.type)];
      futureGym.forEach((d,i)=>{
        const pi=plan.findIndex(p=>p.date===d.date);
        if(pi!==-1){plan[pi].type=cascadeTypes[i];plan[pi].exercises=genSession(cascadeTypes[i]);}
      });
      const shifted=futureGym.map((d,i)=>tl[cascadeTypes[i]]).join(' · ');
      DB.set(pk,plan);
      closeSwap();syncUp();render();
      showToast(_T('shift_toast'),'var(--grn)');
      return;
    }
  }
  DB.set(pk,plan);
  closeSwap();syncUp();render();
}

function getAlternatives(exId,type){
  const slots=SLOTS[type]||[];
  let slotAlts=[];
  for(const slot of slots){if(slot.includes(exId)){slotAlts=slot.filter(id=>id!==exId);break;}}
  const pk=DB.pk(S.weekStart);
  const plan=DB.get(pk,null);
  const ds=S.viewDate?fd(S.viewDate):null;
  const currentExs=plan?.find(d=>d.date===ds)?.exercises||[];
  const ex=EX[exId];
  const sameGroup=Object.entries(EX)
    .filter(([id,e])=>id!==exId&&e.g===ex.g&&!currentExs.includes(id)&&!slotAlts.includes(id))
    .map(([id])=>id);
  // broader same-category (adjacent muscle groups)
  const broader=Object.entries(EX)
    .filter(([id,e])=>id!==exId&&e.g!==ex.g&&!currentExs.includes(id)&&!slotAlts.includes(id)&&!sameGroup.includes(id)&&ex.m.split(' · ').some(m=>e.m.includes(m.split(' ')[0])))
    .map(([id])=>id).slice(0,3);
  return{slotAlts,sameGroup,broader};
}

function openExSwap(exId,exIdx,ds,type){
  const {slotAlts,sameGroup,broader}=getAlternatives(exId,type);

  <div class="sets-hdr"><span>#</span><span class="unit-lbl">${unit()}</span><span>Reps</span><span>✓</span></div>
  <div id="exlog-rows">${le.sets.map((set,si)=>exLogRow(ei,si,set)).join('')}</div>
  <button class="add-set" style="margin-top:6px" onclick="exLogAdd(${ei})">+ Add set</button>
  <button class="btn btn-p" style="margin-top:14px" onclick="closeExLog('${ds}')">Done</button>
</div>`;
  document.body.appendChild(modal);
  requestAnimationFrame(()=>modal.classList.add('on'));
}

function exLogRow(ei,si,set){
  return`<div class="set-row${set.done?' s-done':''}" id="elr${ei}_${si}">
    <span class="set-n">${setLabel(si,set)}</span>
    <div class="wt-wrap"><button class="wt-adj" onclick="adjW(${ei},${si},-1)">−</button><input class="set-inp w-inp${set.w&&!set._edited?' prefilled':''}" type="text" inputmode="decimal" placeholder="—" value="${set.w}" oninput="markEdited(${ei},${si},this)" onchange="updSet(${ei},${si},'w',this.value)"><button class="wt-adj" onclick="adjW(${ei},${si},1)">+</button></div>
    <input class="set-inp" type="text" inputmode="numeric" placeholder="—" value="${set.r}" onchange="updSet(${ei},${si},'r',this.value)">
    <button class="set-ck${set.done?' on':''}" id="elk${ei}_${si}" onclick="exLogTog(${ei},${si})">${set.done?'✓':'○'}</button>
  </div>`;
}

function exLogTog(ei,si){
  if(!S.activeLog)return;
  const le=S.activeLog.exercises[ei];
  const set=le?.sets[si];if(!set)return;
  set.done=!set.done;
  DB.set(DB.lk(S.viewDate),S.activeLog);
  if(set.done&&set.w&&set.r)checkPR(le.id,parseFloat(set.w),parseInt(set.r));
  debouncedSync();
  const row=document.getElementById(`elr${ei}_${si}`);
  const ck=document.getElementById(`elk${ei}_${si}`);
  if(row)row.className='set-row'+(set.done?' s-done':'');
  if(ck){ck.className='set-ck'+(set.done?' on':'');ck.textContent=set.done?'✓':'○';}
}

function exLogAdd(ei){
  if(!S.activeLog)return;
  const le=S.activeLog.exercises[ei];if(!le)return;
  const last=le.sets[le.sets.length-1]||{};
  const si=le.sets.length;
  le.sets.push({w:last.w||'',r:last.r||'',done:false});
  DB.set(DB.lk(S.viewDate),S.activeLog);
  const rows=document.getElementById('exlog-rows');if(!rows)return;
  const div=document.createElement('div');
  div.innerHTML=exLogRow(ei,si,{w:last.w||'',r:last.r||'',done:false});
  rows.appendChild(div.firstElementChild);
}

function closeExLog(ds){
  document.getElementById('exlog-modal')?.remove();
  render();
}

function doExSwap(oldId,exIdx,ds,type,newId){
  // Update plan
  const mon=getMon(new Date(ds+'T12:00:00'));
  const pk=DB.pk(mon);
  const plan=DB.get(pk,null);
  if(plan){
    const di=plan.findIndex(d=>d.date===ds);
    if(di!==-1&&plan[di].exercises){plan[di].exercises[exIdx]=newId;DB.set(pk,plan);}
  }
  // Update active log if we're currently logging this day
  if(S.activeLog&&S.activeLog.date===ds){
    const ex=EX[newId];
    const last=getLastLog(newId);
    S.activeLog.exercises[exIdx]={id:newId,sets:makeSets(newId,S.energy||'okay',last)};
    DB.set(DB.lk(S.viewDate),S.activeLog);
  }
  closeExSwap();render();
}

/* ── ENERGY ── */
function bindEnergy(){
  document.querySelectorAll('.ebtn').forEach(b=>{
    b.addEventListener('click',()=>{
      S.energy=b.dataset.e;
      document.querySelectorAll('.ebtn').forEach(x=>x.classList.toggle('sel',x.dataset.e===b.dataset.e));
      const pk=DB.pk(S.weekStart);
      const plan=DB.get(pk,null);
      const ds=S.viewDate?fd(S.viewDate):null;
      const dp=plan?.find(d=>d.date===ds);
      const isRide=dp&&['LONG_OUTDOOR','SHORT_OUTDOOR','LONG_INDOOR','SHORT_INDOOR'].includes(dp.type);
      const isGym=dp&&['PUSH','PULL','LEGS','UPPER_PUMP'].includes(dp.type);
      const ct=isRide?'ride':isGym?'gym':'rest';
      // Update coach message — show default immediately, upgrade to AI quietly
      const card=document.getElementById('coach-card');
      if(card){
        const p=card.querySelector('p');
        const defaultMsg=COACH[b.dataset.e][ct];
        p.style.transition='';p.style.opacity='1';
        p.textContent=defaultMsg;
        card.classList.add('on');
        getAICoach(b.dataset.e,ct,dp).then(msg=>{
          const c2=document.getElementById('coach-card');
          if(c2&&msg&&msg!==defaultMsg){
            const p2=c2.querySelector('p');
            p2.style.transition='opacity .35s ease';
            p2.style.opacity='0';
            setTimeout(()=>{p2.textContent=msg;p2.style.opacity='1';},350);
          }
        });
      }
      // Swap exercises based on energy — gym days only
      if(isGym&&dp&&ds){
        if(!S.baseExercises)S.baseExercises=[...dp.exercises];
        const newExs=applyEnergySwap(S.baseExercises,b.dataset.e);
        const di=plan.findIndex(d=>d.date===ds);
        if(di!==-1){plan[di].exercises=newExs;DB.set(pk,plan);}
        render();
      }
    });
  });
}

/* ── EXPORT / IMPORT ── */
function exportData(){
  const data={_exported:new Date().toISOString()};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k.startsWith('log_')||k.startsWith('plan_')||k==='prs'||k==='recent_ex')data[k]=DB.get(k);
  }

/* ── CSV EXPORT — human-readable training records ── */
function exportCSV(){
  const u=unit();
  const cell=v=>{v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const rows=[['Date','Type','Exercise','Set','Weight ('+u+')','Reps','Notes']];
  const keys=[];
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('log_'))keys.push(k);}
  keys.sort();
  keys.forEach(k=>{
    const log=DB.get(k,null);if(!log)return;
    const date=k.slice(4);
    (log.exercises||[]).forEach(e=>{
      const ex=EX[e.id];const name=ex?ex.n:e.id;
      (e.sets||[]).filter(s=>s.done).forEach((s,i)=>{
        rows.push([date,'Workout',name,i+1,s.w||'',s.r||'','']);
      });
    });
    if(log.ride&&log.ride.dur!=null){
      const r=log.ride;
      const notes=[r.hr!=null?r.hr+' bpm':'',r.rpe!=null?'RPE '+r.rpe:'',r.notes||''].filter(Boolean).join(' · ');
      rows.push([date,'Ride','Cycling','',r.dist!=null?r.dist+' km':'',r.dur+' min',notes]);
    }
  });
  const prs=DB.get('prs',{});
  Object.entries(prs).forEach(([id,p])=>{
    const ex=EX[id];const name=ex?ex.n:id;
    rows.push([p.date||'','Personal Record',name,'',p.w||'',p.r||'','All-time best']);
  });
  const csv=rows.map(r=>r.map(cell).join(',')).join('\r\n');
  // BOM so Excel reads UTF-8 (Chinese exercise names) correctly
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`training-brain-${fd(new Date())}.csv`;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
}

function importData(){
  const input=document.createElement('input');
  input.type='file';input.accept='.json,.csv';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const isCSV=/\.csv$/i.test(file.name);
    const reader=new FileReader();
    reader.onload=ev=>{
      if(isCSV){importCSV(ev.target.result);return;}
      try{
        const data=JSON.parse(ev.target.result);
        let count=0;
        Object.entries(data).forEach(([k,v])=>{if(!k.startsWith('_')){DB.set(k,v);count++;}});
        syncUp();
        alert(`✅ Restored ${count} records successfully!`);
        render();
      }catch{alert('❌ Could not read file — make sure it\'s a Training Brain backup (.json) or export (.csv).');}
    };
    reader.readAsText(file);
  };
  input.click();
}

/* ── CSV PARSING + IMPORT ── */
function parseCSV(text){
  const rows=[];let row=[],field='',inQ=false;
  text=String(text).replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else inQ=false;}
      else field+=c;
    }else{
      if(c==='"')inQ=true;
      else if(c===','){row.push(field);field='';}
      else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
      else if(c==='\r'){/* skip */}
      else field+=c;
    }
  }
  if(field!==''||row.length){row.push(field);rows.push(row);}
  return rows;
}

function importCSV(text){
  let rows;
  try{rows=parseCSV(text);}catch{rows=null;}
  if(!rows||rows.length<2){alert('❌ Could not read CSV — it looks empty or malformed.');return;}
  // Build exercise name → id lookup (English, Chinese, and current display names)
  const nameToId={};
  Object.keys(EX).forEach(id=>{
    [EX_EN_NAMES[id],(typeof EX_ZH!=='undefined'?EX_ZH[id]:null),EX[id].n].forEach(nm=>{
      if(nm)nameToId[String(nm).trim().toLowerCase()]=id;
    });
  });
  const findId=nm=>nameToId[String(nm||'').trim().toLowerCase()]||null;
  const logs={}; // date → {exMap:{}, ride:null}
  const prs=DB.get('prs',{});
  let workoutRows=0,rideRows=0,prRows=0,skipped=0;
  rows.slice(1).forEach(r=>{
    if(!r||r.length<3)return;
    const date=(r[0]||'').trim(),type=(r[1]||'').trim(),exercise=r[2]||'',weight=(r[4]||'').trim(),reps=(r[5]||'').trim(),notes=r[6]||'';
    if(!date)return;
    if(type==='Workout'){
      const id=findId(exercise);
      if(!id){skipped++;return;}
      logs[date]=logs[date]||{exMap:{},ride:null};
      logs[date].exMap[id]=logs[date].exMap[id]||{id,sets:[]};
      logs[date].exMap[id].sets.push({w:weight,r:reps,done:true});
      workoutRows++;
    }else if(type==='Ride'){
      const dist=parseFloat(weight),dur=parseFloat(reps);
      let hr=null,rpe=null,note='';
      String(notes).split(' · ').forEach(tok=>{
        tok=tok.trim();if(!tok)return;
        if(/bpm$/i.test(tok))hr=parseFloat(tok);
        else if(/^rpe/i.test(tok))rpe=parseFloat(tok.replace(/rpe/i,''));
        else note=note?note+' · '+tok:tok;
      });
      logs[date]=logs[date]||{exMap:{},ride:null};
      logs[date].ride={dur:isNaN(dur)?null:dur,dist:isNaN(dist)?null:dist,hr:isNaN(hr)?null:hr,rpe:isNaN(rpe)?null:rpe,notes:note,logged:new Date().toISOString()};
      rideRows++;
    }else if(type==='Personal Record'){
      const id=findId(exercise);
      if(!id){skipped++;return;}
      prs[id]={w:parseFloat(weight)||weight,r:isNaN(+reps)?reps:+reps,date};
      prRows++;
    }
  });
  if(!workoutRows&&!rideRows&&!prRows){
    alert('❌ No recognisable rows found. Make sure this is a Training Brain CSV export.');
    return;
  }
  // Merge into storage — preserve any field the CSV does not carry
  Object.keys(logs).forEach(date=>{
    const k='log_'+date;
    const existing=DB.get(k,null)||{};
    const exList=Object.values(logs[date].exMap);
    if(exList.length)existing.exercises=exList;
    if(logs[date].ride)existing.ride=logs[date].ride;
    DB.set(k,existing);
  });
  DB.set('prs',prs);
  syncUp();
  render();
  alert(`✅ Imported ${workoutRows} workout sets, ${rideRows} rides and ${prRows} PRs across ${Object.keys(logs).length} day(s).`+(skipped?`\n⚠️ ${skipped} row(s) skipped — exercise name not recognised.`:''));
}

/* ── GENERATE PLAN ── */
function genPlan(){
  const bikePref=DB.get('bike_pref','weather');
  if(bikePref!=='weather'){
    // No location needed — build plan directly with placeholder weather data
    const wdays=Array.from({length:7},(_,i)=>({
      date:fd(addDays(S.weekStart,i)),tmax:15,tmin:5,rain:0,wind:10,code:1,score:0
    }));
    const plan=buildWeek(wdays);
    DB.set(DB.pk(S.weekStart),plan);
    render();
    return;
  }
  const btn=document.querySelector('.btn-p,.btn-s');
  if(btn){btn.textContent='📡 Fetching weather…';btn.disabled=true;}
  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      const wdays=await fetchWeather(pos.coords.latitude,pos.coords.longitude,fd(S.weekStart));
      const plan=buildWeek(wdays);
      DB.set(DB.pk(S.weekStart),plan);
      render();
    }catch(e){alert('Could not fetch weather. Check your connection.');render();}
  },()=>{alert('Location access is needed to fetch your local weather forecast.');render();});
}

function shiftWeek(dir){S.weekStart=addDays(S.weekStart,dir*7);S.energy=null;render();}

/* ── INIT ── */
function init(){
  // Restore Firebase user from localStorage cache
  const cached=DB.get('fb_user',null);
  if(cached){
    S.fbUser=cached;
    initFirebase();
    // Auto-unlock immediately if no PIN — avoids sign-in prompt on every PWA open
    if(!DB.get('pin',null))S.authed=true;
  }
  const today=new Date();
  S.weekStart=getMon(today);
  const dow=today.getDay();
  if(dow===0||dow===6)S.weekStart=getMon(addDays(today,7));
  // Handle Strava OAuth callback (?code=... in URL after redirect)
  const _qp=new URLSearchParams(window.location.search);
  const _stravaCode=_qp.get('code');
  if(_stravaCode&&!_qp.get('error')){
    S.authed=true; // auto-unlock so user lands on the app
    stravaExchangeCode(_stravaCode);
  }
  render();
  loadGifDb();
  // Auto-sync Strava if connected and last sync was >1 hour ago
  const _stravaTok=DB.get('strava_token',null);
  if(_stravaTok&&!_stravaCode){
    const _lastSync=DB.get('strava_last_sync',null);
    const _hourAgo=Date.now()-60*60*1000;
    if(!_lastSync||new Date(_lastSync).getTime()<_hourAgo){
      stravaFetchActivities();
    }
  }
  // Register service worker for cache-first loading (instant on return visits)
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/training-brain/sw.js')
      .catch(e=>console.warn('SW register failed:',e));
  }
}
// Firebase scripts are deferred — DOMContentLoaded fires after them, so init() is safe here
document.addEventListener('DOMContentLoaded', init);
