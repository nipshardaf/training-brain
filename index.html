<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Training Brain">
  <meta name="theme-color" content="#09090f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f4ff" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Training%20Brain%22%2C%22short_name%22%3A%22Training%20Brain%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2309090f%22%2C%22theme_color%22%3A%22%2309090f%22%7D">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2309090f'/%3E%3Ctext x='90' y='128' font-size='96' text-anchor='middle'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
  <title>Training Brain</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
<style>
*,::before,::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#09090f;--s1:#111119;--s2:#18182a;--s3:#252540;
  --bord:rgba(120,80,255,.18);--acc:#7c3aed;--al:#a78bfa;
  --grn:#10b981;--amb:#f59e0b;--red:#ef4444;--blu:#3b82f6;
  --txt:#f1f5f9;--t2:#8892a4;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#f5f4ff;--s1:#ffffff;--s2:#ede9ff;--s3:#ddd5ff;
    --bord:rgba(120,80,255,.18);--acc:#7c3aed;--al:#6d28d9;
    --txt:#111827;--t2:#6b7280;
  }
  .bnav{background:rgba(245,244,255,.93)!important}
  .ex-banner{background:linear-gradient(to bottom,rgba(0,0,0,.75) 0%,transparent 100%)!important}
  .set-inp{background:var(--s2)!important;color:var(--txt)!important}
  .np-btn{background:var(--s2)!important;border-color:var(--bord)!important}
  .swap-ov{background:rgba(0,0,0,.35)!important}
}
html{height:-webkit-fill-available}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;min-height:100vh;min-height:-webkit-fill-available;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.screen{max-width:430px;margin:0 auto;padding:calc(var(--st) + 18px) 16px calc(var(--sb) + 88px)}

/* header */
.hdr{text-align:center;margin-bottom:18px}
.hdr h1{font-size:24px;font-weight:800;letter-spacing:-.6px;background:linear-gradient(135deg,#a78bfa,#f472b6 55%,#fb923c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr-sub{font-size:12px;color:var(--t2);margin-top:3px}

/* week nav */
.week-nav{display:flex;align-items:center;justify-content:space-between;background:var(--s1);border-radius:16px;padding:11px 14px;margin-bottom:14px}
.wnav-btn{background:var(--s2);border:none;color:var(--txt);font-size:18px;width:34px;height:34px;border-radius:10px;cursor:pointer;-webkit-appearance:none;display:flex;align-items:center;justify-content:center}
.wnav-btn:active{transform:scale(.9)}
.week-label{font-size:15px;font-weight:700}

/* day rows */
.day-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.day-row{background:var(--s1);border:1px solid var(--bord);border-radius:18px;padding:14px 15px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:transform .1s}
.day-row:active{transform:scale(.98)}
.day-row.is-today{border-color:var(--acc)}
.day-row.is-done{opacity:.55}
.dr-l{flex:1}
.dr-day{font-size:12px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.dr-type{font-size:15px;font-weight:700;margin-bottom:2px}
.dr-desc{font-size:11px;color:var(--t2)}
.dr-r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;margin-left:12px}
.dr-weather{font-size:14px;font-weight:600}
.dr-rain{font-size:11px;color:var(--blu);margin-left:3px}
.vtag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px}
.vg{background:rgba(16,185,129,.15);color:#10b981}
.vo{background:rgba(59,130,246,.15);color:#60a5fa}
.vw{background:rgba(245,158,11,.15);color:#f59e0b}
.vb{background:rgba(239,68,68,.15);color:#ef4444}
.done-tag{font-size:10px;font-weight:700;color:var(--grn);background:rgba(16,185,129,.1);padding:3px 8px;border-radius:100px}
.today-tag{font-size:10px;font-weight:700;color:var(--al);background:rgba(124,58,237,.12);padding:3px 8px;border-radius:100px}
.swap-btn{background:var(--s2);border:none;color:var(--t2);font-size:11px;font-weight:600;padding:5px 9px;border-radius:8px;cursor:pointer;-webkit-appearance:none;margin-top:4px}
.swap-btn:active{background:var(--s3)}

/* empty state */
.empty-wrap{text-align:center;padding:48px 20px}
.empty-icon{font-size:56px;margin-bottom:14px}
.empty-title{font-size:21px;font-weight:800;margin-bottom:8px}
.empty-sub{font-size:14px;color:var(--t2);line-height:1.6;margin-bottom:24px}

/* buttons */
.btn{border:none;border-radius:15px;font-size:15px;font-weight:700;cursor:pointer;-webkit-appearance:none;padding:15px 22px;transition:transform .1s;letter-spacing:-.2px;width:100%}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--acc);color:#fff}
.btn-s{background:var(--s1);color:var(--t2);border:1px solid var(--bord);font-size:14px}

/* bottom nav */
.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(9,9,15,.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bord);display:flex;justify-content:center;padding:8px 0 calc(var(--sb) + 4px)}
.bnav-btn{flex:1;max-width:160px;background:transparent;border:none;padding:7px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;-webkit-appearance:none;opacity:.45;transition:opacity .15s}
.bnav-btn.on{opacity:1}
.bnav-btn span:first-child{font-size:22px}
.bnav-btn span:last-child{font-size:10px;font-weight:700;color:var(--txt)}

/* day screen */
.day-hdr{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back-btn{background:var(--s1);border:none;color:var(--al);font-size:14px;font-weight:700;padding:8px 13px;border-radius:10px;cursor:pointer;-webkit-appearance:none;flex-shrink:0}
.back-btn:active{transform:scale(.95)}
.day-hdr-r{font-size:16px;font-weight:700}

.day-hero{border-radius:22px;padding:18px 20px;margin-bottom:18px;background:var(--s1);border:1px solid transparent}
.hero-tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;padding:4px 10px;border-radius:100px;margin-bottom:9px}
.hero-name{font-size:20px;font-weight:800;margin-bottom:7px;letter-spacing:-.4px}
.hero-weather{font-size:13px;color:var(--t2);margin-bottom:6px}

/* energy */
.sec-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--t2);margin-bottom:10px}
.egrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:13px}
.ebtn{background:var(--s1);border:2px solid transparent;border-radius:14px;padding:11px 4px;cursor:pointer;-webkit-appearance:none;text-align:center;width:100%}
.ebtn:active{transform:scale(.93)}
.ei{font-size:22px;display:block;margin-bottom:2px}
.en{font-size:11px;font-weight:700;color:var(--txt);display:block}
.ebtn[data-e=fresh].sel{border-color:var(--grn);background:rgba(16,185,129,.1)}
.ebtn[data-e=okay].sel{border-color:var(--blu);background:rgba(59,130,246,.1)}
.ebtn[data-e=tired].sel{border-color:var(--amb);background:rgba(245,158,11,.1)}
.ebtn[data-e=sore].sel{border-color:var(--red);background:rgba(239,68,68,.1)}

/* coach */
.coach{background:var(--s1);border-radius:16px;padding:13px 15px;margin-bottom:18px;border-left:3px solid var(--acc);display:none}
.coach.on{display:block;animation:su .25s ease}
.coach-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--al);margin-bottom:5px}
.coach p{font-size:13px;line-height:1.6}
@keyframes su{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* exercise cards */
.ex-list{display:flex;flex-direction:column;gap:13px;margin-bottom:18px}
.ex-card{background:var(--s1);border:1px solid var(--bord);border-radius:20px;overflow:hidden}
.ex-gif-wrap{position:relative;height:200px;background:var(--s2);overflow:hidden}
.ex-gif{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s;position:absolute;inset:0}
.ex-gif.on{opacity:1}
.gif-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:opacity .3s}
.gif-ph.off{opacity:0;pointer-events:none}
.gif-sh{position:absolute;inset:0;background:linear-gradient(90deg,var(--s2) 0%,var(--s3) 50%,var(--s2) 100%);background-size:200% 100%;animation:sh 1.6s infinite ease-in-out}
.gif-ph-txt{position:relative;font-size:12px;color:var(--t2);text-align:center}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.ex-banner{position:absolute;top:0;left:0;right:0;padding:10px 12px 28px;background:linear-gradient(to bottom,rgba(0,0,0,.72) 0%,transparent 100%);display:flex;align-items:center;gap:8px;z-index:2;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ex-num-i{font-size:11px;font-weight:800;color:rgba(255,255,255,.5);flex-shrink:0;background:rgba(255,255,255,.15);border-radius:100px;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.ex-num-n{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.5);flex:1}
.ex-banner-chev{font-size:12px;color:rgba(255,255,255,.6);flex-shrink:0;transition:transform .2s}
.ex-card-collapsed{cursor:pointer}
.ex-card-collapsed .ex-collapse-row{display:flex;align-items:center;gap:10px;padding:13px 14px}
.ex-collapse-num{font-size:11px;font-weight:800;color:var(--t2);background:var(--s2);border-radius:100px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ex-collapse-name{font-size:14px;font-weight:700;flex:1}
.ex-collapse-chev{font-size:13px;color:var(--t2);flex-shrink:0}
.ex-mt{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:100px;padding:3px 9px;font-size:11px;font-weight:600;color:rgba(255,255,255,.9);z-index:2}
.ex-play{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:none;border-radius:100px;padding:4px 10px;font-size:11px;font-weight:700;color:#fff;cursor:pointer;z-index:2;-webkit-appearance:none;display:flex;align-items:center;gap:5px}
.ex-play:active{transform:scale(.9)}
.ex-body{padding:13px 15px}
.ex-name{font-size:16px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.ex-bdgs{display:flex;flex-wrap:wrap;gap:6px}
.bdg{border-radius:100px;padding:3px 10px;font-size:11px;font-weight:700}
.bs{background:rgba(167,139,250,.12);color:var(--al)}
.br{background:rgba(241,245,249,.07);color:var(--t2)}
.bp{background:rgba(251,191,36,.12);color:#fbbf24}
.pr-b{background:rgba(251,191,36,.12);color:#fbbf24;font-size:10px;font-weight:700;padding:2px 7px;border-radius:100px}

/* ride / rest */
.ride-card,.rest-card{background:var(--s1);border:1px solid rgba(59,130,246,.2);border-radius:20px;padding:22px 18px;margin-bottom:18px;text-align:center}
.ride-icon,.rest-emoji{font-size:52px;display:block;margin-bottom:11px}
.ride-lbl,.rest-title{font-size:19px;font-weight:800;margin-bottom:13px}
.rest-sub{font-size:13px;color:var(--t2);line-height:1.6;margin-bottom:16px}
.tips{list-style:none;text-align:left;display:flex;flex-direction:column;gap:8px}
.tips li{display:flex;gap:9px;font-size:13px;line-height:1.4}
.ta{color:#60a5fa;font-weight:700;flex-shrink:0}
.mob-list{display:flex;flex-direction:column;gap:7px;text-align:left}
.mob-item{background:var(--s2);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:10px;font-size:13px}

/* log screen */
.log-list{display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
.log-ex{background:var(--s1);border:1px solid var(--bord);border-radius:18px;padding:15px}
.log-ex.done-ex{border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.04)}
.log-ex-hdr{display:flex;align-items:center;gap:6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.log-ex-name{font-size:15px;font-weight:700;display:flex;align-items:center;flex-wrap:wrap;gap:6px;flex:1}
.log-ex-prog{font-size:12px;font-weight:700;color:var(--t2);flex-shrink:0}
.log-ex-prog.done{color:var(--grn)}
.log-ex-chev{font-size:18px;color:var(--t2);transition:transform .2s;flex-shrink:0;line-height:1}
.log-ex-chev.open{transform:rotate(180deg)}
.log-ex-body{overflow:hidden}
.log-ex-body.collapsed{display:none}
.sets-hdr{display:grid;grid-template-columns:30px 1fr 80px 42px;gap:8px;margin-bottom:7px;font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.8px;text-align:center}
.set-row{display:grid;grid-template-columns:30px 1fr 80px 42px;gap:8px;align-items:center;margin-bottom:7px}
.set-row.s-done{opacity:.45}
.set-n{font-size:12px;font-weight:700;color:var(--t2);text-align:center}
.set-inp{background:var(--s2);border:1px solid var(--bord);border-radius:10px;color:var(--txt);font-size:17px;font-weight:700;padding:10px 6px;text-align:center;-webkit-appearance:none;width:100%;outline:none;font-family:inherit}
.set-inp:focus{border-color:var(--acc)}
.set-ck{background:var(--s2);border:2px solid var(--bord);border-radius:10px;color:var(--t2);font-size:15px;font-weight:700;width:42px;height:42px;cursor:pointer;-webkit-appearance:none;display:flex;align-items:center;justify-content:center;transition:all .15s}
.set-ck.on{background:rgba(16,185,129,.15);border-color:var(--grn);color:var(--grn)}
.set-ck:active{transform:scale(.88)}
.add-set{background:transparent;border:1px dashed rgba(120,80,255,.28);border-radius:10px;color:var(--t2);font-size:12px;font-weight:600;padding:8px;width:100%;cursor:pointer;margin-top:3px;-webkit-appearance:none}

/* PR screen */
.prs-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.pr-row{background:var(--s1);border:1px solid var(--bord);border-radius:14px;padding:13px 15px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:3px}
.pr-row-name{font-size:14px;font-weight:700;flex:1}
.pr-row-val{font-size:14px;font-weight:700;color:#fbbf24}
.pr-row-date{font-size:11px;color:var(--t2);width:100%;margin-top:2px}
/* history */
.sec-hdr{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--t2);margin:20px 0 10px}
.hist-row{background:var(--s1);border:1px solid var(--bord);border-radius:14px;padding:13px 15px;margin-bottom:8px;cursor:pointer}
.hist-row:active{opacity:.75}
.hist-date{font-size:12px;color:var(--t2);margin-bottom:3px}
.hist-type{font-size:15px;font-weight:700;margin-bottom:5px}
.hist-exs{font-size:11px;color:var(--t2);line-height:1.6}
.hist-detail{margin-top:10px;border-top:1px solid var(--bord);padding-top:10px;display:none}
.hist-detail.open{display:block}
.hist-set{font-size:12px;color:var(--t2);padding:2px 0}
.data-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}

/* PR toast — offset 72px below top to clear Dynamic Island on iPhone 16 Pro Max */
.pr-toast{position:fixed;top:calc(var(--st) + 72px);left:50%;transform:translateX(-50%) translateY(-120px);background:#fbbf24;color:#000;font-size:13px;font-weight:800;padding:11px 20px;border-radius:100px;z-index:999;transition:transform .35s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.pr-toast.on{transform:translateX(-50%) translateY(0)}
/* weight ± buttons */
.wt-wrap{display:flex;align-items:center;gap:3px}
.wt-adj{background:var(--s3);border:none;border-radius:8px;color:var(--txt);font-size:18px;font-weight:700;width:30px;height:42px;cursor:pointer;-webkit-appearance:none;flex-shrink:0;display:flex;align-items:center;justify-content:center;line-height:1}
.wt-adj:active{background:var(--acc);color:#fff;transform:scale(.88)}
/* pre-filled weight (from last session) shown dimmed until user edits */
.set-inp.prefilled{color:var(--t2)}

/* swap modal */
.swap-modal{position:fixed;inset:0;z-index:200}
.swap-ov{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
.swap-sheet{position:absolute;bottom:0;left:0;right:0;background:var(--s1);border-radius:26px 26px 0 0;padding:18px 16px calc(var(--sb) + 18px);transform:translateY(100%);transition:transform .3s ease;max-height:80vh;overflow-y:auto}
.swap-modal.on .swap-sheet{transform:translateY(0)}
.swap-title{font-size:13px;font-weight:700;color:var(--t2);text-align:center;margin-bottom:14px;text-transform:uppercase;letter-spacing:.8px}
.swap-opt{background:var(--s2);border:1px solid var(--bord);border-radius:13px;padding:13px 15px;width:100%;text-align:left;color:var(--txt);font-size:15px;font-weight:700;cursor:pointer;margin-bottom:7px;display:flex;flex-direction:column;gap:2px;-webkit-appearance:none}
.swap-opt span{font-size:11px;font-weight:400;color:var(--t2)}
.swap-opt:active{background:var(--s3)}
.swap-cancel{background:transparent;border:1px solid var(--bord);border-radius:13px;padding:13px;width:100%;color:var(--t2);font-size:15px;font-weight:600;cursor:pointer;-webkit-appearance:none;margin-top:3px}
.ex-busy-btn{background:var(--s2);border:1px solid var(--bord);border-radius:8px;color:var(--t2);font-size:11px;font-weight:600;padding:5px 9px;cursor:pointer;-webkit-appearance:none;margin-top:9px;display:inline-block}
.ex-busy-btn:active{background:var(--s3)}
.unit-toggle{background:var(--s2);border:1px solid var(--bord);border-radius:8px;color:var(--al);font-size:11px;font-weight:700;padding:4px 10px;cursor:pointer;-webkit-appearance:none}
.unit-toggle:active{background:var(--s3)}

/* lock screen */
.lock-wrap{min-height:100vh;min-height:-webkit-fill-available;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;background:var(--bg)}
.lock-logo{font-size:64px;margin-bottom:12px}
.lock-title{font-size:24px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,#a78bfa,#f472b6 55%,#fb923c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.lock-sub{font-size:13px;color:var(--t2);margin-bottom:28px}
.pin-dots{display:flex;gap:14px;margin-bottom:28px;align-items:center}
.pin-dot{width:14px;height:14px;border-radius:50%;background:var(--s3);border:2px solid var(--bord);transition:all .15s}
.pin-dot.filled{background:var(--acc);border-color:var(--acc);transform:scale(1.2)}
.pin-dot.err{background:var(--red)!important;border-color:var(--red)!important}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:264px;margin-bottom:16px}
.np-btn{background:var(--s1);border:1px solid var(--bord);border-radius:16px;color:var(--txt);font-size:22px;font-weight:600;height:66px;cursor:pointer;-webkit-appearance:none;transition:transform .1s}
.np-btn:active{transform:scale(.91);background:var(--s2)}

/* ── AI COACH ── */
const _coachCache={};
async function getAICoach(energy,ct,dp){
  const key=DB.get('gemini_key','');
  if(!key)return COACH[energy][ct];
  // Cache per energy+date so it doesn't re-call on every tap
  const cacheKey=energy+'_'+(dp?.date||'');
  if(_coachCache[cacheKey])return _coachCache[cacheKey];
  // Build rich context
  const prs=DB.get('prs',{});
  const u=unit();
  const exList=(dp?.exercises||[]).map(id=>{
    const ex=EX[id];if(!ex)return null;
    const pr=prs[id];
    const tgt=energyTargets(id,energy);
    return pr
      ?`${ex.n} (PR: ${pr.w}${u}×${pr.r}, today target ~${tgt.sugW||'?'}${u} × ${tgt.reps})`
      :`${ex.n} (${tgt.sets}×${tgt.reps})`;
  }).filter(Boolean).join('\n  ');
  // Count sessions this week
  let weekSessions=0;
  for(let i=0;i<7;i++){const d=addDays(S.weekStart,i);const l=DB.get(DB.lk(d),null);if(l?.exercises?.some(e=>e.sets.some(s=>s.done)))weekSessions++;}
  // Last time this workout type was done
  let lastDone='unknown';
  for(let i=1;i<=30;i++){
    const d=addDays(new Date(),-i);
    const pk2=DB.pk(getMon(d));
    const pl=DB.get(pk2,null);
    const dd=pl?.find(x=>x.date===fd(d)&&x.type===dp?.type);
    if(dd&&DB.get(DB.lk(d),null)?.exercises?.some(e=>e.sets.some(s=>s.done))){lastDone=i===1?'yesterday':`${i} days ago`;break;}
  }
  const energyDesc={fresh:'feeling great, full energy, ready to push hard',okay:'feeling normal, decent energy',tired:'feeling tired, low energy',sore:'feeling sore or beat up, needs to be careful'};
  const prompt=`You are a no-nonsense personal trainer giving a quick pre-workout coaching note. Be direct, specific, and practical. Max 3 sentences. No fluff, no generic motivational quotes.

Athlete status:
- Energy today: ${energy} (${energyDesc[energy]})
- Workout: ${dp?.type||ct} session
- Sessions completed this week: ${weekSessions}
- Last time they did ${dp?.type}: ${lastDone}
- Today's exercises:
  ${exList||'General '+ct+' session'}

Give specific advice: mention exercises by name, reference their PR weights if relevant, adjust expectations based on energy. Sound like a real coach, not an app.`;
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:120,temperature:0.75}})
    });
    if(!r.ok)throw new Error('API '+r.status);
    const data=await r.json();
    const msg=data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
    if(msg){_coachCache[cacheKey]=msg;return msg;}
  }catch(e){console.warn('AI coach failed:',e);}
  return COACH[energy][ct]; // fallback
}

};
const SWAP_HEAVY={
  pec_deck:['bb_bench','incline_bb'],   cable_fly:['incline_bb','incline_db'],
  incline_db:['incline_bb'],            db_bench:['bb_bench'],
  db_spress:['ohp'],                    lat_raise:['db_spress','ohp'],
  tri_oh:['dips','skull'],              tri_push:['skull','dips'],
  leg_press:['bb_squat','front_squat'], lunge:['bss','bb_squat'],
  leg_curl:['rdl','deadlift'],
  cable_row:['bb_row','tbar_row'],      lat_pull:['pullup'],
  cable_curl:['bb_curl'],               db_curl:['bb_curl'],
};
function applyEnergySwap(exs,energy){
  if(energy==='okay')return exs;
  const map=energy==='fresh'?SWAP_HEAVY:SWAP_LIGHT;
  // Pre-populate used with current plan so we never swap TO something already there
  const used=new Set(exs);
  const result=[];
  for(const id of exs){
    used.delete(id); // allow this slot to be replaced
    const alts=map[id]||[];
    const picked=alts.find(a=>EX[a]&&!used.has(a))||id;
    used.add(picked);
    result.push(picked);
  }
  return result;
}

/* ── ENERGY PROFILES ── */
// sets/reps/rpe override per energy; mult = fraction of PR weight to suggest
const ENERGY_PROFILE={
  fresh:{sets:5, reps:'3–5',   rpe:'9',   mult:0.90, label:'💪 Strength — heavy weight, low reps'},
  okay: {sets:null,reps:null,  rpe:null,  mult:0.80, label:''},
  tired:{sets:3, reps:'10–15', rpe:'7',   mult:0.65, label:'😪 Volume — moderate weight, higher reps'},
  sore: {sets:2, reps:'15–20', rpe:'5',   mult:0.55, label:'🤕 Recovery — light weight, blood flow only'},
};
function energyTargets(exId,energy){
  const prof=ENERGY_PROFILE[energy]||ENERGY_PROFILE.okay;
  const ex=EX[exId];if(!ex)return{sets:3,reps:'8–12',rpe:'7',sugW:null};
  const sets=prof.sets??ex.sets;
  const reps=prof.reps??ex.reps;
  const rpe=prof.rpe??ex.rpe;
  const pr=DB.get('prs',{})[exId];
  const sugW=pr?.w?Math.round(pr.w*prof.mult/2.5)*2.5:null;
  return{sets,reps,rpe,sugW};

/* ── WEATHER ── */
async function fetchWeather(lat,lon,startStr){
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,windspeed_10m_max,weathercode&timezone=auto&forecast_days=16`;
  const r=await fetch(url);if(!r.ok)throw new Error();
  const data=await r.json();const d=data.daily;
  let si=d.time.indexOf(startStr);if(si<0)si=0;
  return Array.from({length:7},(_,i)=>({
    date:d.time[si+i],
    tmax:Math.round(d.temperature_2m_max[si+i]),
    tmin:Math.round(d.temperature_2m_min[si+i]),
    rain:Math.round(d.precipitation_sum[si+i]*10)/10,
    wind:Math.round(d.windspeed_10m_max[si+i]),
    code:d.weathercode[si+i],
    score:bikeScore(d.precipitation_sum[si+i],d.windspeed_10m_max[si+i],d.temperature_2m_max[si+i]),
  }));
}
function bikeScore(rain,wind,tmax){
  let s=100;
  if(rain>10)return 0;
  if(rain>5)s-=40;else if(rain>2)s-=20;else if(rain>0.5)s-=8;
  if(wind>40)s-=30;else if(wind>25)s-=15;else if(wind>15)s-=5;
  if(tmax<3)s-=40;else if(tmax<8)s-=15;
  return Math.max(0,Math.round(s));
}
function wIcon(code,rain){
  if(rain>5)return'🌧';if(rain>1)return'🌦';
  if(code>=95)return'⛈';if(code>=80)return'🌧';if(code>=71)return'❄️';
  if(code>=51)return'🌦';if(code>=3)return'☁️';if(code>=1)return'⛅';return'☀️';
}
function verdict(score){
  if(score>=75)return{t:'Great day to ride',c:'vg'};
  if(score>=50)return{t:'Rideable',c:'vo'};
  if(score>=25)return{t:'Borderline',c:'vw'};
  return{t:'Gym day',c:'vb'};
}

/* ── WEEK GENERATION ── */
function buildWeek(wdays){
  const bikePref=DB.get('bike_pref','weather');
  const ranked=[...wdays].map((d,i)=>({i,s:d.score})).sort((a,b)=>b.s-a.s);
  const mk=(w,type)=>{const exs=['PUSH','PULL','LEGS','UPPER_PUMP'].includes(type)?genSession(type):null;return{date:w.date,type,exercises:exs,weather:w};};

  if(bikePref==='none'){
    // No riding at all — fill week with gym + rest
    const restIdx=ranked[ranked.length-1].i;
    const gymCandidates=[0,1,2,3,4,5,6].filter(i=>i!==restIdx);
    const legsDay=gymCandidates[Math.floor(gymCandidates.length/2)];
    const others=gymCandidates.filter(i=>i!==legsDay);
    const asgn={[legsDay]:'LEGS'};
    ['PUSH','PULL','UPPER_PUMP','PUSH'].forEach((t,idx)=>{if(others[idx]!==undefined)asgn[others[idx]]=t;});
    return wdays.map((w,i)=>mk(w,i===restIdx?'REST':asgn[i]||'REST'));
  }

  const r1=ranked[0],r2=ranked[1];
  const OT=45;
  const t1=bikePref==='indoor'?'LONG_INDOOR':r1.s>=OT?'LONG_OUTDOOR':'LONG_INDOOR';
  const t2=bikePref==='indoor'?'SHORT_INDOOR':r2.s>=OT?'SHORT_OUTDOOR':'SHORT_INDOOR';
  const rideSet=new Set([r1.i,r2.i]);
  const rest5=[0,1,2,3,4,5,6].filter(i=>!rideSet.has(i));
  // Rest day: day after long ride if available, else lowest-score non-ride day
  let restIdx=(r1.i+1)%7;
  if(!rest5.includes(restIdx)){restIdx=rest5[rest5.length-1];}
  const gymDays=rest5.filter(i=>i!==restIdx);
  // LEGS: pick day farthest from rides
  const rideArr=[r1.i,r2.i];
  const legsDay=gymDays.reduce((best,i)=>{
    const dist=Math.min(...rideArr.map(r=>Math.min(Math.abs(i-r),(7-Math.abs(i-r)))));
    const bdist=Math.min(...rideArr.map(r=>Math.min(Math.abs(best-r),(7-Math.abs(best-r)))));
    return dist>bdist?i:best;
  },gymDays[0]);
  const others=gymDays.filter(i=>i!==legsDay);
  const asgn={};
  asgn[legsDay]='LEGS';
  ['PUSH','PULL','UPPER_PUMP'].forEach((t,i)=>{if(others[i]!==undefined)asgn[others[i]]=t;});
  return wdays.map((w,i)=>{
    let type;
    if(i===r1.i)type=t1;
    else if(i===r2.i)type=t2;
    else if(i===restIdx)type='REST';
    else type=asgn[i]||'REST';
    return mk(w,type);
  });
}

/* ── SESSION GENERATION ── */
function genSession(type,energy='okay'){
  const slots=SLOTS[type];
  const recent=DB.get('recent_ex',[]);
  const picked=[];
  for(const candidates of slots){
    let avail=candidates.filter(id=>!picked.includes(id));
    if(!avail.length)continue;
    // Filter by energy level — prefer compound when fresh, isolation when tired/sore
    if(energy==='fresh'){
      const comp=avail.filter(id=>EX[id]?.t==='C');
      if(comp.length)avail=comp;
    } else if(energy==='tired'||energy==='sore'){
      const iso=avail.filter(id=>EX[id]?.t==='I');
      if(iso.length)avail=iso;
    }
    const sorted=[...avail].sort((a,b)=>{
      const ai=recent.indexOf(a),bi=recent.indexOf(b);
      if(ai===-1&&bi===-1)return Math.random()<.5?-1:1;
      if(ai===-1)return -1;if(bi===-1)return 1;
      return ai-bi;
    });
    picked.push(sorted[0]);
  }
  return picked;
}

async function connectAndEnter(){
  const pat=prompt('Paste your GitHub Personal Access Token\n\nGet one at:\ngithub.com → Settings → Developer settings\n→ Personal access tokens (classic)\n→ Generate new token → tick "gist" scope');
  if(!pat||!pat.trim()){alert('No token entered. You can connect later in the PRs tab.');skipGistSetup();return;}
  DB.set('gh_pat',pat.trim());localStorage.removeItem('gh_gist');
  S.authed=true;S.lockMode='choose';
  await syncToGist();
  render();
  alert('✅ Connected! All your data now saves to GitHub automatically.');
}
function skipGistSetup(){
  S.authed=true;S.lockMode='choose';render();

function pinKey(k){
  if(k==='⌫')_pinBuf=_pinBuf.slice(0,-1);
  else if(_pinBuf.length<4)_pinBuf+=k;
  updatePinDots();
  if(_pinBuf.length===4)setTimeout(checkPin,130);
}
function updatePinDots(){
  for(let i=0;i<4;i++){const d=document.getElementById('pd'+i);if(d)d.classList.toggle('filled',i<_pinBuf.length);}
}
function checkPin(){
  const saved=DB.get('pin',null);
  if(saved){
    if(_pinBuf===saved){S.authed=true;_pinBuf='';syncFromGist().then(()=>render());render();}
    else{errPin();_pinBuf='';}
  } else {
    if(S.lockMode==='setup'){
      S.pinConfirm=_pinBuf;_pinBuf='';S.lockMode='confirm';render();
    } else {
      if(_pinBuf===S.pinConfirm){
        DB.set('pin',_pinBuf);_pinBuf='';S.pinConfirm='';
        S.lockMode='github_setup';render(); // prompt to connect cloud before entering
      } else {
        errPin();_pinBuf='';S.pinConfirm='';S.lockMode='setup';setTimeout(()=>{S.lockMode='setup';render();},600);
      }
    }
  }
}
function errPin(){
  document.querySelectorAll('.pin-dot').forEach(d=>d.classList.add('err'));
  const dots=document.getElementById('pin-dots');
  if(dots){dots.style.animation='shake .4s ease';setTimeout(()=>{dots.style.animation='';document.querySelectorAll('.pin-dot').forEach(d=>d.classList.remove('err','filled'));},500);}
}

function toggleExCollapse(i,isDone){
  const col=S.exCollapsed,exp=S.exExpanded;
  const isCol=col.has(i)||(isDone&&!exp.has(i));
  if(isCol){col.delete(i);if(isDone)exp.add(i);}
  else{if(isDone)exp.delete(i);else col.add(i);}
  render();
}

function initFirebase(){
  if(_fb)return true;
  try{
    _fb=firebase.initializeApp(FB_CFG,'tb');
    _fbAuth=firebase.auth(_fb);
    _fbDb=firebase.database(_fb);
    // When Firebase resolves its own session (handles PWA re-open on iOS)
    _fbAuth.onAuthStateChanged(user=>{
      if(user){
        S.fbUser={uid:user.uid,name:user.displayName||user.email.split('@')[0],email:user.email};
        DB.set('fb_user',S.fbUser);
        // Auto-unlock if no PIN set — user already authenticated
        if(!S.authed&&!DB.get('pin',null)){S.authed=true;render();}
      }
    });
    return true;
  }catch(e){return false;}
}

async function signInGoogle(){
  if(!initFirebase()){alert('Could not connect to Firebase.');return;}
  try{
    const provider=new firebase.auth.GoogleAuthProvider();
    const result=await _fbAuth.signInWithPopup(provider);
    S.fbUser={uid:result.user.uid,name:result.user.displayName,email:result.user.email};
    DB.set('fb_user',S.fbUser);
    S.authed=true;S.lockMode='choose';
    await loadFromCloud();
    render();
  }catch(e){
    if(e.code!=='auth/popup-closed-by-user')alert('Sign-in failed: '+e.message);
  }
}

async function doAuth(isNew){
  const emailEl=document.getElementById('auth-email');
  const passEl=document.getElementById('auth-pass');
  const errEl=document.getElementById('auth-err');
  const email=(emailEl?.value||'').trim();
  const pass=passEl?.value||'';
  if(errEl)errEl.textContent='';
  if(!email||!pass){if(errEl)errEl.textContent='Please enter your email and password.';return;}
  if(!initFirebase()){if(errEl)errEl.textContent='Could not connect — check your internet connection.';return;}
  // Show loading state
  const btn=document.querySelector('.btn-p');if(btn){btn.textContent='…';btn.disabled=true;}
  try{
    let result;
    if(isNew){
      result=await _fbAuth.createUserWithEmailAndPassword(email,pass);
    }else{
      result=await _fbAuth.signInWithEmailAndPassword(email,pass);
    }
    S.fbUser={uid:result.user.uid,name:result.user.displayName||email.split('@')[0],email:result.user.email};
    DB.set('fb_user',S.fbUser);
    S.authed=true;S.lockMode='choose';
    await loadFromCloud();
    render();
  }catch(e){
    const msgs={
      'auth/user-not-found':'No account with this email — try "Create Account".',
      'auth/wrong-password':'Wrong password. Try again.',
      'auth/invalid-credential':'Wrong email or password.',
      'auth/email-already-in-use':'Email already registered — use "Sign In".',
      'auth/weak-password':'Password must be at least 6 characters.',
      'auth/invalid-email':'Enter a valid email address.',
      'auth/too-many-requests':'Too many attempts. Try again later.',
    };
    if(errEl)errEl.textContent=msgs[e.code]||('Error: '+e.message);
    if(btn){btn.textContent='Sign In';btn.disabled=false;}
  }
}

async function saveToCloud(manual=false){
  if(!S.fbUser||!_fbDb||S.guest)return;
  const data={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k.startsWith('log_')||k.startsWith('plan_')||k==='prs'||k==='recent_ex')data[k]=DB.get(k);
  }
  try{
    await _fbDb.ref('users/'+S.fbUser.uid).set({data,updated:new Date().toISOString()});
    DB.set('fb_last_sync',new Date().toISOString());
    if(manual){const b=document.querySelector('.sync-bar');if(b)b.innerHTML=`<span><span class="sync-dot"></span>Synced just now</span><button onclick="saveToCloud(true)" style="background:none;border:none;color:var(--al);font-size:11px;font-weight:700;cursor:pointer">Sync now</button>`;render();}
  }catch(_){}
}

async function loadFromCloud(){
  if(!S.fbUser||!_fbDb)return;
  try{
    const snap=await _fbDb.ref('users/'+S.fbUser.uid).once('value');
    if(snap.exists()){const {data}=snap.val()||{};Object.entries(data||{}).forEach(([k,v])=>DB.set(k,v));}
  }catch(_){}
}

function saveFBConfig(){
  const raw=document.getElementById('fb-cfg-input')?.value?.trim();
  if(!raw){alert('Please paste your Firebase config.');return;}
  const match=raw.match(/\{[\s\S]*\}/);
  if(!match){alert('Could not read the config — copy the full firebaseConfig object from Firebase console.');return;}
  try{
    const cfg=JSON.parse(match[0]);
    DB.set('fb_config',cfg);
    _fb=null; // reset so initFirebase picks up new config
    S.lockMode='choose';render();
  }catch(e){alert('Invalid format. Make sure you copied the full firebaseConfig {...} block.');}
}

/* ── LOG SCREEN ── */
function startLog(ds){
  const pk=DB.pk(S.weekStart);
  const plan=DB.get(pk,null);
  const dp=plan?.find(d=>d.date===ds);
  if(!dp)return;
  let log=DB.get(DB.lk(S.viewDate),null);
  if(!log){
    log={date:ds,type:dp.type,exercises:(dp.exercises||[]).map(id=>{
      const ex=EX[id];
      const last=getLastLog(id);
      return{id,sets:makeSets(id,S.energy||'okay',last)};
    }),completed:false};
    DB.set(DB.lk(S.viewDate),log);
  }
  S.activeLog=log;S.openLogEx=0;go('log');
}

function makeSets(exId,energy,last){
  const ex=EX[exId];if(!ex)return[];
  const n=energyTargets(exId,energy).sets;
  if(ex.uni){
    return Array.from({length:n*2},(_,i)=>{
      const side=i%2===0?'L':'R';
      const pw=last?.[i]?.w||'';
      return{w:pw,r:last?.[i]?.r||'',done:false,side,_edited:!!pw};
    });
  }
  return Array.from({length:n},(_,si)=>{
    const pw=last?.[si]?.w||'';
    return{w:pw,r:last?.[si]?.r||'',done:false,_edited:!!pw};
  });
}

function getLastLog(exId){
  for(let i=1;i<=45;i++){
    const d=addDays(new Date(),-i);
    const log=DB.get(DB.lk(d),null);
    if(!log)continue;
    const ex=log.exercises?.find(e=>e.id===exId);
    if(ex&&ex.sets.some(s=>s.done))return ex.sets;
  }
  return null;
}

function rLog(){
  const log=S.activeLog;
  if(!log)return`<div class="screen"><button class="back-btn" onclick="go('day')">← Back</button></div>`;
  const wi=WI[log.type]||WI.REST;
  return`<div class="screen">
<div class="day-hdr">
  <button class="back-btn" onclick="go('day',{viewDate:S.viewDate})">← Back</button>
  <div class="day-hdr-r">Log: ${wi.l}</div>
</div>
<div class="log-list">
  ${log.exercises.map((le,ei)=>rLogEx(le,ei)).join('')}
</div>
<button class="btn btn-p" onclick="completeWk()">✓ Complete Workout</button>
</div>`;
}

function setLabel(si,set){
  if(set.side==='L')return'<span style="font-size:10px;font-weight:800;color:var(--al)">L</span>';
  if(set.side==='R')return'<span style="font-size:10px;font-weight:800;color:#f472b6">R</span>';
  return String(si+1);
}

  const isOpen=S.openLogEx===ei;

  const rPh=tgt.reps||'—';

  const bestSet=allDone?le.sets.filter(s=>s.done&&s.w).sort((a,b)=>parseFloat(b.w)-parseFloat(a.w))[0]:null;
  const summary=bestSet?`<span id="sum${ei}" style="font-size:11px;color:var(--t2);margin-left:6px">${bestSet.w}${unit()} × ${bestSet.r}</span>`:`<span id="sum${ei}"></span>`;
  return`<div class="log-ex${allDone?' done-ex':''}" id="lex${ei}">
<div class="log-ex-hdr" onclick="togLogEx(${ei})">
  <div class="log-ex-name">${ex.n}${pr?`<span class="pr-b">🏆 ${pr.w}${unit()}×${pr.r}</span>`:''}${!isOpen&&allDone?summary:''}</div>
  <button class="wt-adj" style="font-size:13px;padding:4px 7px;width:auto;height:auto;margin-left:4px;flex-shrink:0" onclick="event.stopPropagation();openExSwap('${le.id}',${ei},'${S.activeLog.date}','${S.activeLog.type}')">🔄</button>
  <span class="log-ex-prog${allDone?' done':''}" id="prog${ei}">${allDone?'✓ Done':doneSets+'/'+le.sets.length}</span>
  <span class="log-ex-chev${isOpen?' open':''}" id="chev${ei}">▾</span>
</div>
<div class="log-ex-body${isOpen?'':' collapsed'}" id="lbody${ei}">
  ${unitBar()}
  <div style="font-size:11px;color:var(--t2);margin-bottom:8px">${tgt.sets} sets · ${tgt.reps} reps · RPE ${tgt.rpe}${tgt.sugW?' · <span style="color:var(--al);font-weight:700">~'+tgt.sugW+unit()+' suggested</span>':''}</div>
  <div class="sets-hdr"><span>#</span><span class="unit-lbl">${unit()}</span><span>Reps</span><span>✓</span></div>
  ${le.sets.map((set,si)=>`<div class="set-row${set.done?' s-done':''}" id="sr${ei}_${si}">
    <span class="set-n">${setLabel(si,set)}</span>
    <div class="wt-wrap">
      <button class="wt-adj" onclick="adjW(${ei},${si},-1)">−</button>
      <input class="set-inp w-inp${set.w&&!set._edited?' prefilled':''}" type="text" inputmode="decimal" placeholder="${wPh}" value="${set.w}" oninput="markEdited(${ei},${si},this)" onchange="updSet(${ei},${si},'w',this.value)">
      <button class="wt-adj" onclick="adjW(${ei},${si},1)">+</button>
    </div>
    <input class="set-inp" type="text" inputmode="numeric" placeholder="${rPh}" value="${set.r}" onchange="updSet(${ei},${si},'r',this.value)">
    <button class="set-ck${set.done?' on':''}" id="ck${ei}_${si}" onclick="togSet(${ei},${si})">${set.done?'✓':'○'}</button>
  </div>`).join('')}
  <button class="add-set" onclick="addSet(${ei})">+ Add set</button>
  <button class="ex-busy-btn" style="margin-top:10px;width:100%;text-align:center" onclick="openExSwap('${le.id}',${ei},'${S.activeLog.date}','${S.activeLog.type}')">🔄 Machine busy? Swap exercise</button>
</div>
</div>`;
}

function togLogEx(ei){

  S.openLogEx=wasOpen?null:ei;
  document.querySelectorAll('[id^="lbody"]').forEach((body,i)=>{
    const isOpen=S.openLogEx===i;
    body.classList.toggle('collapsed',!isOpen);
    const chev=document.getElementById('chev'+i);
    if(chev)chev.classList.toggle('open',isOpen);

function updSet(ei,si,field,val){
  if(!S.activeLog)return;
  const set=S.activeLog.exercises[ei]?.sets[si];
  if(!set)return;
  set[field]=val;
  DB.set(DB.lk(S.viewDate),S.activeLog);
  debouncedSync();
}

function togSet(ei,si){
  if(!S.activeLog)return;
  const le=S.activeLog.exercises[ei];
  const set=le?.sets[si];if(!set)return;
  set.done=!set.done;
  DB.set(DB.lk(S.viewDate),S.activeLog);
  if(set.done&&set.w&&set.r)checkPR(le.id,parseFloat(set.w),parseInt(set.r));
  debouncedSync();
  // patch DOM
  const row=document.getElementById(`sr${ei}_${si}`);
  const ck=document.getElementById(`ck${ei}_${si}`);
  if(row)row.className='set-row'+(set.done?' s-done':'');
  if(ck){ck.className='set-ck'+(set.done?' on':'');ck.textContent=set.done?'✓':'○';}
  const allDone=le.sets.every(s=>s.done);
  const doneSets=le.sets.filter(s=>s.done).length;
  const exEl=document.getElementById(`lex${ei}`);
  if(exEl)exEl.className='log-ex'+(allDone?' done-ex':'');
  const prog=document.getElementById('prog'+ei);
  if(prog){prog.textContent=allDone?'✓ Done':doneSets+'/'+le.sets.length;prog.className='log-ex-prog'+(allDone?' done':'');}
  // update compact summary in header
  if(allDone){
    const best=le.sets.filter(s=>s.done&&s.w).sort((a,b)=>parseFloat(b.w)-parseFloat(a.w))[0];
    const sumEl=document.getElementById('sum'+ei);
    if(sumEl&&best)sumEl.textContent=`${best.w}${unit()} × ${best.r}`;
  }
  if(allDone&&set.done){
    setTimeout(()=>{
      const nextEi=ei+1;
      if(nextEi<S.activeLog.exercises.length&&!S.activeLog.exercises[nextEi].sets.every(s=>s.done))togLogEx(nextEi);
    },350);
  }
}

function addSet(ei){
  if(!S.activeLog)return;
  const le=S.activeLog.exercises[ei];if(!le)return;
  const last=le.sets[le.sets.length-1]||{};
  const si=le.sets.length;
  le.sets.push({w:last.w||'',r:last.r||'',done:false});
  DB.set(DB.lk(S.viewDate),S.activeLog);
  const body=document.getElementById('lbody'+ei);
  if(!body)return;
  const addBtn=body.querySelector('.add-set');
  const div=document.createElement('div');
  div.className='set-row';div.id=`sr${ei}_${si}`;
  div.innerHTML=`<span class="set-n">${si+1}</span>
    <div class="wt-wrap"><button class="wt-adj" onclick="adjW(${ei},${si},-1)">−</button><input class="set-inp w-inp" type="text" inputmode="decimal" placeholder="—" value="${last.w||''}" oninput="markEdited(${ei},${si},this)" onchange="updSet(${ei},${si},'w',this.value)"><button class="wt-adj" onclick="adjW(${ei},${si},1)">+</button></div>
    <input class="set-inp" type="text" inputmode="numeric" placeholder="—" value="${last.r||''}" onchange="updSet(${ei},${si},'r',this.value)">
    <button class="set-ck" id="ck${ei}_${si}" onclick="togSet(${ei},${si})">○</button>`;

function checkPR(id,weight,reps){
  if(!weight||!reps)return;
  const prs=DB.get('prs',{});
  const cur=prs[id];
  if(!cur||weight>cur.w||(weight===cur.w&&reps>cur.r)){
    prs[id]={w:weight,r:reps,date:fd(new Date())};
    DB.set('prs',prs);
    prToast(EX[id]?.n||id);
  }
}

function prToast(name){
  let t=document.querySelector('.pr-toast');
  if(!t){t=document.createElement('div');t.className='pr-toast';document.body.appendChild(t);}
  t.textContent=`🏆 New Personal Best — ${name}!`;
  t.classList.add('on');
  clearTimeout(t._tid);
  t._tid=setTimeout(()=>{t.classList.remove('on');},2800);
}

function adjW(ei,si,dir){
  if(!S.activeLog)return;
  const set=S.activeLog.exercises[ei]?.sets[si];if(!set)return;
  const step=DB.get('unit','kg')==='lb'?5:2.5;
  const cur=parseFloat(set.w)||0;
  const nw=Math.max(0,Math.round((cur+dir*step)*10)/10);
  set.w=nw%1===0?String(nw):nw.toFixed(1);
  set._edited=true;
  DB.set(DB.lk(S.viewDate),S.activeLog);
  const inp=document.querySelector(`#sr${ei}_${si} .w-inp`);
  if(inp){inp.value=set.w;inp.classList.remove('prefilled');}
  debouncedSync();
}

function markEdited(ei,si,inp){
  if(!S.activeLog)return;
  const set=S.activeLog.exercises[ei]?.sets[si];if(!set)return;
  set._edited=true;
  inp.classList.remove('prefilled');
}

function completeWk(){
  if(!S.activeLog)return;
  S.activeLog.completed=true;
  DB.set(DB.lk(S.viewDate),S.activeLog);
  const ids=S.activeLog.exercises.map(e=>e.id);
  const recent=DB.get('recent_ex',[]);
  DB.set('recent_ex',[...new Set([...ids,...recent])].slice(0,40));
  syncToGist();
  go('day',{viewDate:S.viewDate});
}

function doSwap(ds,newType){
  const mon=getMon(new Date(ds+'T12:00:00'));
  const pk=DB.pk(mon);
  const plan=DB.get(pk,null);if(!plan)return;
  const di=plan.findIndex(d=>d.date===ds);if(di===-1)return;
  plan[di].type=newType;
  plan[di].exercises=['PUSH','PULL','LEGS','UPPER_PUMP'].includes(newType)?genSession(newType):null;
  DB.set(pk,plan);
  closeSwap();syncToGist();render();
}

/* ── EXERCISE SWAP (busy machine / in-session) ── */

function getAlternatives(exId,type){
  const slots=SLOTS[type]||[];
  let slotAlts=[];
  for(const slot of slots){if(slot.includes(exId)){slotAlts=slot.filter(id=>id!==exId);break;}}
  const pk=DB.pk(S.weekStart);
  const plan=DB.get(pk,null);
  const ds=S.viewDate?fd(S.viewDate):null;
  const currentExs=plan?.find(d=>d.date===ds)?.exercises||[];
  const ex=EX[exId];
  const sameGroup=Object.entries(EX)
    .filter(([id,e])=>id!==exId&&e.g===ex.g&&!currentExs.includes(id)&&!slotAlts.includes(id))
    .map(([id])=>id);
  // broader same-category (adjacent muscle groups)
  const broader=Object.entries(EX)
    .filter(([id,e])=>id!==exId&&e.g!==ex.g&&!currentExs.includes(id)&&!slotAlts.includes(id)&&!sameGroup.includes(id)&&ex.m.split(' · ').some(m=>e.m.includes(m.split(' ')[0])))
    .map(([id])=>id).slice(0,3);
  return{slotAlts,sameGroup,broader};
}

function openExSwap(exId,exIdx,ds,type){
  const {slotAlts,sameGroup,broader}=getAlternatives(exId,type);
  const ex=EX[exId];
  function altBtn(id){const e=EX[id];if(!e)return'';
    return`<button class="swap-opt" onclick="doExSwap('${exId}',${exIdx},'${ds}','${type}','${id}')">${e.n}<span>${e.m} · ${e.t==='C'?'Compound':'Isolation'} · ${e.reps} reps · RPE ${e.rpe}</span></button>`;}
  function section(title,ids){return ids.length?`<div style="font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.8px;margin:10px 0 6px">${title}</div>${ids.map(altBtn).join('')}`:''}
  const suggestions=`
    ${section('Same movement slot',slotAlts)}
    ${section('Same muscle group',sameGroup.slice(0,4))}
    ${section('Related muscles',broader)}
    ${(!slotAlts.length&&!sameGroup.length&&!broader.length)?'<p style="color:var(--t2);font-size:13px;padding:10px 0">No alternatives found.</p>':''}`;
  const modal=document.createElement('div');
  modal.className='swap-modal';
  modal.id='ex-swap-modal';
  modal.innerHTML=`<div class="swap-ov" onclick="closeExSwap()"></div>
<div class="swap-sheet">
  <div class="swap-title">Swap: ${ex?.n||exId}</div>
  <input id="swap-search" type="text" placeholder="🔍  Search all exercises…" oninput="filterSwap('${exId}',${exIdx},'${ds}','${type}',this.value)"
    style="width:100%;background:var(--s2);border:1px solid var(--bord);border-radius:12px;color:var(--txt);font-size:15px;padding:11px 14px;outline:none;font-family:inherit;margin-bottom:4px;-webkit-appearance:none">
  <div id="swap-results">${suggestions}</div>
  <button class="swap-cancel" onclick="closeExSwap()">Cancel</button>
</div>`;
  document.body.appendChild(modal);
  requestAnimationFrame(()=>{modal.classList.add('on');document.getElementById('swap-search')?.focus();});
}

function filterSwap(exId,exIdx,ds,type,query){
  const q=query.trim().toLowerCase();
  const results=document.getElementById('swap-results');if(!results)return;
  if(!q){
    // restore suggestions
    const {slotAlts,sameGroup,broader}=getAlternatives(exId,type);
    function altBtn(id){const e=EX[id];if(!e)return'';
      return`<button class="swap-opt" onclick="doExSwap('${exId}',${exIdx},'${ds}','${type}','${id}')">${e.n}<span>${e.m} · ${e.t==='C'?'Compound':'Isolation'} · ${e.reps} reps · RPE ${e.rpe}</span></button>`;}
    function section(title,ids){return ids.length?`<div style="font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.8px;margin:10px 0 6px">${title}</div>${ids.map(altBtn).join('')}`:''}
    results.innerHTML=section('Same movement slot',slotAlts)+section('Same muscle group',sameGroup.slice(0,4))+section('Related muscles',broader);
    return;
  }
  const matches=Object.entries(EX).filter(([id,e])=>id!==exId&&(e.n.toLowerCase().includes(q)||e.m.toLowerCase().includes(q)||e.g.toLowerCase().includes(q)));
  if(!matches.length){results.innerHTML='<p style="color:var(--t2);font-size:13px;padding:10px 0">No exercises found.</p>';return;}
  results.innerHTML=`<div style="font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.8px;margin:10px 0 6px">Search results</div>`+
    matches.map(([id,e])=>`<button class="swap-opt" onclick="doExSwap('${exId}',${exIdx},'${ds}','${type}','${id}')">${e.n}<span>${e.m} · ${e.t==='C'?'Compound':'Isolation'} · ${e.reps} reps · RPE ${e.rpe}</span></button>`).join('');
}

function closeExSwap(){const m=document.getElementById('ex-swap-modal');if(m)m.remove();}

/* ── PER-EXERCISE LOG MODAL ── */
function openExLog(exId,exIdx,ds){
  const date=new Date(ds+'T12:00:00');
  S.viewDate=date;S.weekStart=getMon(date);
  const pk=DB.pk(S.weekStart);
  const plan=DB.get(pk,null);
  const dp=plan?.find(d=>d.date===ds);if(!dp)return;
  let log=DB.get(DB.lk(date),null);
  if(!log){
    log={date:ds,type:dp.type,exercises:(dp.exercises||[]).map(id=>{
      const ex=EX[id];const last=getLastLog(id);
      return{id,sets:makeSets(id,S.energy||'okay',last)};
    }),completed:false};
    DB.set(DB.lk(date),log);
  }
  S.activeLog=log;
  const le=log.exercises[exIdx];if(!le)return;
  showExLogModal(le,exIdx,ds);
}

function showExLogModal(le,ei,ds){
  document.getElementById('exlog-modal')?.remove();
  const ex=EX[le.id];if(!ex)return;
  const pr=DB.get('prs',{})[le.id];
  const modal=document.createElement('div');
  modal.className='swap-modal';modal.id='exlog-modal';
  modal.innerHTML=`<div class="swap-ov" onclick="closeExLog('${ds}')"></div>
<div class="swap-sheet">
  <div class="swap-title">${ex.n}</div>
  ${pr?`<div style="text-align:center;margin-bottom:8px"><span class="pr-b">🏆 PR: ${pr.w}${unit()}×${pr.r}</span></div>`:''}
  <div style="font-size:11px;color:var(--t2);text-align:center;margin-bottom:10px">${ex.m} · ${ex.sets} sets · ${ex.reps} reps · RPE ${ex.rpe}</div>
  ${unitBar()}
  <div class="sets-hdr"><span>#</span><span class="unit-lbl">${unit()}</span><span>Reps</span><span>✓</span></div>
  <div id="exlog-rows">${le.sets.map((set,si)=>exLogRow(ei,si,set)).join('')}</div>
  <button class="add-set" style="margin-top:6px" onclick="exLogAdd(${ei})">+ Add set</button>
  <button class="btn btn-p" style="margin-top:14px" onclick="closeExLog('${ds}')">Done</button>
</div>`;
  document.body.appendChild(modal);
  requestAnimationFrame(()=>modal.classList.add('on'));
}

function exLogRow(ei,si,set){
  return`<div class="set-row${set.done?' s-done':''}" id="elr${ei}_${si}">
    <span class="set-n">${setLabel(si,set)}</span>
    <div class="wt-wrap"><button class="wt-adj" onclick="adjW(${ei},${si},-1)">−</button><input class="set-inp w-inp${set.w&&!set._edited?' prefilled':''}" type="text" inputmode="decimal" placeholder="—" value="${set.w}" oninput="markEdited(${ei},${si},this)" onchange="updSet(${ei},${si},'w',this.value)"><button class="wt-adj" onclick="adjW(${ei},${si},1)">+</button></div>
    <input class="set-inp" type="text" inputmode="numeric" placeholder="—" value="${set.r}" onchange="updSet(${ei},${si},'r',this.value)">
    <button class="set-ck${set.done?' on':''}" id="elk${ei}_${si}" onclick="exLogTog(${ei},${si})">${set.done?'✓':'○'}</button>
  </div>`;
}

function exLogTog(ei,si){
  if(!S.activeLog)return;
  const le=S.activeLog.exercises[ei];
  const set=le?.sets[si];if(!set)return;
  set.done=!set.done;
  DB.set(DB.lk(S.viewDate),S.activeLog);
  if(set.done&&set.w&&set.r)checkPR(le.id,parseFloat(set.w),parseInt(set.r));
  debouncedSync();
  const row=document.getElementById(`elr${ei}_${si}`);
  const ck=document.getElementById(`elk${ei}_${si}`);
  if(row)row.className='set-row'+(set.done?' s-done':'');
  if(ck){ck.className='set-ck'+(set.done?' on':'');ck.textContent=set.done?'✓':'○';}
}

function exLogAdd(ei){
  if(!S.activeLog)return;
  const le=S.activeLog.exercises[ei];if(!le)return;
  const last=le.sets[le.sets.length-1]||{};
  const si=le.sets.length;
  le.sets.push({w:last.w||'',r:last.r||'',done:false});
  DB.set(DB.lk(S.viewDate),S.activeLog);
  const rows=document.getElementById('exlog-rows');if(!rows)return;
  const div=document.createElement('div');
  div.innerHTML=exLogRow(ei,si,{w:last.w||'',r:last.r||'',done:false});
  rows.appendChild(div.firstElementChild);
}

function closeExLog(ds){
  document.getElementById('exlog-modal')?.remove();
  render();
}

function doExSwap(oldId,exIdx,ds,type,newId){
  // Update plan
  const mon=getMon(new Date(ds+'T12:00:00'));
  const pk=DB.pk(mon);
  const plan=DB.get(pk,null);
  if(plan){
    const di=plan.findIndex(d=>d.date===ds);
    if(di!==-1&&plan[di].exercises){plan[di].exercises[exIdx]=newId;DB.set(pk,plan);}
  }
  // Update active log if we're currently logging this day
  if(S.activeLog&&S.activeLog.date===ds){
    const ex=EX[newId];
    const last=getLastLog(newId);
    S.activeLog.exercises[exIdx]={id:newId,sets:makeSets(newId,S.energy||'okay',last)};
    DB.set(DB.lk(S.viewDate),S.activeLog);
  }
  closeExSwap();render();
}

/* ── ENERGY ── */
function bindEnergy(){
  document.querySelectorAll('.ebtn').forEach(b=>{
    b.addEventListener('click',()=>{
      S.energy=b.dataset.e;
      document.querySelectorAll('.ebtn').forEach(x=>x.classList.toggle('sel',x.dataset.e===b.dataset.e));
      const pk=DB.pk(S.weekStart);
      const plan=DB.get(pk,null);
      const ds=S.viewDate?fd(S.viewDate):null;
      const dp=plan?.find(d=>d.date===ds);
      const isRide=dp&&['LONG_OUTDOOR','SHORT_OUTDOOR','LONG_INDOOR','SHORT_INDOOR'].includes(dp.type);
      const isGym=dp&&['PUSH','PULL','LEGS','UPPER_PUMP'].includes(dp.type);
      const ct=isRide?'ride':isGym?'gym':'rest';
      // Update coach message — async if AI key present
      const card=document.getElementById('coach-card');
      if(card){
        const p=card.querySelector('p');
        const hasKey=!!DB.get('gemini_key','');
        if(hasKey){
          p.innerHTML='<span style="opacity:.5;font-style:italic">✨ Coaching you…</span>';
          card.classList.add('on');
          getAICoach(b.dataset.e,ct,dp).then(msg=>{
            const c2=document.getElementById('coach-card');
            if(c2){c2.querySelector('p').textContent=msg;c2.style.animation='none';setTimeout(()=>{c2.style.animation='';},10);}
          });
        }else{
          p.textContent=COACH[b.dataset.e][ct];
          card.classList.add('on');
        }
      }
      // Swap exercises based on energy — gym days only
      if(isGym&&dp&&ds){
        if(!S.baseExercises)S.baseExercises=[...dp.exercises];
        const newExs=applyEnergySwap(S.baseExercises,b.dataset.e);
        const di=plan.findIndex(d=>d.date===ds);
        if(di!==-1){plan[di].exercises=newExs;DB.set(pk,plan);}
        render();
      }
    });
  });
}

/* ── EXPORT / IMPORT ── */
function exportData(){
  const data={_exported:new Date().toISOString()};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k.startsWith('log_')||k.startsWith('plan_')||k==='prs'||k==='recent_ex')data[k]=DB.get(k);
  }
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`training-brain-${fd(new Date())}.json`;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
}

function importData(){
  const input=document.createElement('input');
  input.type='file';input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        let count=0;
        Object.entries(data).forEach(([k,v])=>{if(!k.startsWith('_')){DB.set(k,v);count++;}});
        alert(`✅ Restored ${count} records successfully!`);
        render();
      }catch{alert('❌ Could not read file — make sure it\'s a Training Brain backup.');}
    };
    reader.readAsText(file);
  };
  input.click();
}

/* ── GENERATE PLAN ── */
function genPlan(){
  const bikePref=DB.get('bike_pref','weather');
  if(bikePref!=='weather'){
    // No location needed — build plan directly with placeholder weather data
    const wdays=Array.from({length:7},(_,i)=>({
      date:fd(addDays(S.weekStart,i)),tmax:15,tmin:5,rain:0,wind:10,code:1,score:0
    }));
    const plan=buildWeek(wdays);
    DB.set(DB.pk(S.weekStart),plan);
    render();
    return;
  }
  const btn=document.querySelector('.btn-p,.btn-s');
  if(btn){btn.textContent='📡 Fetching weather…';btn.disabled=true;}
  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      const wdays=await fetchWeather(pos.coords.latitude,pos.coords.longitude,fd(S.weekStart));
      const plan=buildWeek(wdays);
      DB.set(DB.pk(S.weekStart),plan);
      render();
    }catch(e){alert('Could not fetch weather. Check your connection.');render();}
  },()=>{alert('Location access is needed to fetch your local weather forecast.');render();});
}

function shiftWeek(dir){S.weekStart=addDays(S.weekStart,dir*7);S.energy=null;render();}

/* ── INIT ── */
function init(){
  // Restore Firebase user from localStorage cache
  const cached=DB.get('fb_user',null);
  if(cached){
    S.fbUser=cached;
    initFirebase();
    // Auto-unlock immediately if no PIN — avoids sign-in prompt on every PWA open
    if(!DB.get('pin',null))S.authed=true;
  }
  const today=new Date();
  S.weekStart=getMon(today);
  const dow=today.getDay();
  if(dow===0||dow===6)S.weekStart=getMon(addDays(today,7));
  render();
  loadGifDb();
  // Unregister any old service workers to prevent stale caching
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(regs=>regs.forEach(r=>r.unregister()));
  }
}
init();
