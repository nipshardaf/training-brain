  {v:'2.73',d:'Ask Coach can now control individual exercises, reps, and weights — not just whole days',det:'Two new tools give the AI coach full control over the contents of a gym day. (1) swap_exercise(date, from, to) — replace a specific exercise with another, e.g. "swap my barbell bench for dumbbell press on Tuesday" or "change leg extensions to hack squats today." Both names are fuzzy-matched against the library, the slot position is preserved, and any in-progress log is updated. (2) set_exercise_targets(date, exercise, sets, reps, weight) — prescribe the loading for a specific lift, e.g. "set my squat to 5 sets of 5 at 100kg on Friday" or "make today\'s bench 4x8." Omitted fields keep their current value; the targets pre-fill in your log so you just confirm your actual sets. To support this, the AI now sees the full exercise list (with prescribed sets×reps) for every gym day in its context — so it can reference and modify exercises by name. Both tools show a confirmation card before applying, like every other plan change. Combined with the existing day-level tools (swap days, rest, cascade) and make_legs_unilateral, the coach can now reshape your week from the calendar down to the individual set.'},
  {v:'2.72',d:'"Busy?" button renamed to "Swap" — covers any reason for switching an exercise, not just a busy machine',det:'The exercise-swap button said "🔁 Busy?", implying the only reason to switch was a taken machine. But you might want a different exercise for any reason — injury, equipment missing, preference, or just variety. Renamed to "🔄 Swap" (English) / "更換動作" (Chinese). Also updated the hardcoded "Machine busy? Swap exercise" button in the set-logging view to just "🔄 Swap exercise". Same swap menu behind it — just clearer, more universal wording.'},
  {v:'2.71',d:'In-app video player — exercise demos now play inside the app (YouTube embed), no need to leave for another app',det:'Tapping 📺 Tutorial (or a placeholder card) now opens an in-app sheet that plays the demo video right there in an embedded YouTube player — no app switching. How it works: the app asks the worker to find the best embeddable tutorial video for the exercise (via the YouTube Data API), caches the video ID per exercise (searched once, then free forever), and plays it inline in an iframe (works in the installed PWA, including inline playback on iOS). If the video ID isn\'t cached and the worker/key isn\'t available yet, it gracefully falls back to the old YouTube search links — so nothing breaks during setup. A "Browse more" button under the player drops to the search links if the auto-picked video isn\'t the right one. REQUIRES a one-time setup: a free YouTube Data API key added to the Cloudflare worker (the worker.js change is included). Until that key is live, the player falls back to search links. New yt_cache storage key (synced) holds the resolved video IDs.'},
  {v:'2.70',d:'Placeholder exercises (no GIF) are now tappable "▶ Watch demo" cards opening a video tutorial',det:'For the handful of exercises with no demo GIF in the free databases (burpee, pike push-up, wall sit, foot-mobility moves), the placeholder card now shows a "▶ Watch demo" pill and is tappable — opening the YouTube tutorial search directly. Previously the placeholder looked static even though a demo was available via the separate 📺 Tutorial button. Same treatment applied to the onerror fallback, so if ANY GIF link ever breaks in future, the user still gets a clear tappable path to a video demo instead of a dead-looking card. Context: I exhausted the free hotlinkable GIF sources (free-exercise-db, wger, Wikimedia, everkinetic) — none carry these specific exercises. The only way to embed real animated GIFs for them is ExerciseDB via RapidAPI (needs an API key + a worker proxy endpoint + caching), which is a worthwhile future project when scaling but adds an external dependency. For now every exercise has either a real GIF or a tappable video demo — nobody is left without guidance.'},
  {v:'2.69',d:'Full GIF audit — every exercise checked, 7 placeholder exercises now have real demo GIFs',det:'Audited all ~90 exercises in the library against the image CDNs. Every existing free-exercise-db path resolves (200), every wger.de image URL resolves (200) — no broken links. Filled in real GIFs for 7 exercises that previously showed only a coloured placeholder: Assisted Dip (→ dip machine), Assisted Pull-Up (→ band-assisted pull-up), Adductor Machine, Abductor Machine, Single-Leg Calf Raise, Side Plank (→ side bridge), and Nordic Curl (→ natural glute-ham raise). 8 exercises remain as styled placeholders because no demo image exists in any free database: Burpee, Pike Push-Up, Wall Sit, and 5 foot-mobility physio exercises (short foot, towel scrunches, arch raise, toe spread, heel raise). These show a clean labelled card (exercise name + muscle group + icon) rather than a blank box. Note: the image loader already has an onerror fallback — if any GIF link ever breaks in future, it auto-swaps to the styled placeholder, so no exercise ever shows an empty image.'},
  {v:'2.68',d:'Single-leg exercise variants + AI "make my legs single-leg" tool. Verified all leg GIFs work.',det:'GIF AUDIT: checked every leg exercise image against the free-exercise-db CDN — all resolve (200). The few with no image (Nordic curl, single-leg calf, wall sit) intentionally show styled placeholders. YouTube tutorial links are dynamic search queries (exercise name + channel), so they can\'t break. NEW SINGLE-LEG VARIANTS added to the library: Single-Leg Squat, Reverse Lunge, Single-Leg Leg Extension, Single-Leg Deadlift, Cable Glute Kickback, Single-Leg Seated Calf — all with working GIFs, joining the existing Bulgarian Split Squat, walking lunge, step-up, single-leg glute bridge, single-leg calf, and donkey kick. They appear automatically in the manual "🔄 Swap exercise" menu under "Same muscle group" — but are NOT forced into the default rotation (no preference toggle, as requested). NEW AI TOOL: ask the coach "change my leg day to single-leg" (or "make my legs unilateral") and it calls make_legs_unilateral(date), which swaps each bilateral leg exercise to its single-leg equivalent — squat→single-leg squat, leg press→reverse lunge, RDL/curl→single-leg deadlift, hip thrust→cable kickback, leg extension→single-leg extension, calf→single-leg calf. Shows a confirmation card before applying like all plan changes.'},
  {v:'2.67',d:'Fix: chat ↑Top / ↓Latest buttons were the same purple as sent messages — now high-contrast dark',det:'The floating scroll buttons in the Ask Coach thread used the accent purple (rgba(124,58,237,.92)), identical to the user\'s sent-message bubbles. When a button overlapped a sent bubble it was nearly invisible. Changed to a high-contrast dark pill (near-black rgba(17,24,39,.92)) with a subtle white border and stronger shadow — stands out clearly against both the purple user bubbles and the grey coach bubbles.'},
  {v:'2.66',d:'Progressive overload targets — each exercise now prescribes a weight × reps to chase, derived from your last session + goal',det:'The generator was prefilling each set by simply copying your last session\'s numbers — no progression. Now it computes a real target using standard double-progression: (1) finds your heaviest top set from the last completed session of that exercise; (2) if every set hit the top of your goal\'s rep range, it bumps the weight by your goal\'s progression step (2.5kg/5lb for muscle/fitness/endurance, 0 for lose_weight = hold weights in a deficit) and resets to the bottom of the rep range; (3) otherwise it holds the weight and asks for one more rep. The set inputs pre-fill with the target, and a "🎯 Target: 100lb × 8" banner appears on each exercise with a coloured pill showing the move (↑ +5lb / +1 rep / hold) and a one-line reason ("hit top of 6-12 rep range — progressing weight"). No history yet? It anchors to your PR, or asks you to enter a starting weight. The rep range comes from your blended goal profile (v2.59), so muscle goals target 6-12, endurance targets 5-8, etc.'},
  {v:'2.65',d:'Removed the v2.64 "Legs skipped" banner — catch-up logic stays, the noise goes',det:'The v2.64 banner used Legs as the explicit example in the wording, which made it sound like the app was hardcoded to prioritise Legs specifically. That wasn\'t the intent — Legs was just the example case in the original request. The catch-up LOGIC (getMostNeededGymType anchors the next week\'s rotation from whichever muscle group has the longest gap) is correct and stays exactly as shipped in v2.64. Just removed the visible banner that was overcommunicating. The plan quietly does the right thing without explaining itself every week. Also removed the now-unused getGymBalanceHint() helper. If you want to see why the plan looks the way it does, the Ask Coach can explain on demand.'},
  {v:'2.64',d:'Skipped muscle groups now prioritised in next week\'s plan — catch-up logic + visible hint banner',det:'BEFORE: the planner continued the PPL rotation from whatever you last completed. If you did Pull Wed then Push Fri, next week would start at Pull again (since Push was most recent), repeating Pull while Legs got skipped for a second week. AFTER: planner now calls getMostNeededGymType() which tracks each gym type\'s last-completed date over a 14-day window and starts the next week\'s rotation from whichever type has the LONGEST gap. If Legs was skipped, Legs now leads off the next week regardless of what you did most recently. Ties (e.g. both Legs and Upper untouched) break in canonical PPL order. When all four types are hit recently, falls back to the previous behavior (oldest-first). A new 💡 hint banner appears on the Week view explaining the catch-up: "Legs skipped recently — your plan this week starts with legs so you don\'t fall further behind (quads, hamstrings, glutes)." Auto-hides when the plan is balanced.'},
  {v:'2.63',d:'Chat thread auto-scrolls to latest on expand + new floating ↑Top / ↓Latest navigation buttons',det:'Three improvements to the Ask Coach thread. (1) AUTO-SCROLL ON EXPAND — when you tap to expand the collapsed chat panel, the thread now jumps to the very bottom so the latest message is visible immediately (in addition to the existing page-scroll that brings the panel into view). No more "where did the response go?" moments. (2) ↑ TOP BUTTON — a small floating purple pill in the top-right corner of the chat thread. Tap to smooth-scroll the thread to the very first message. Auto-hides when you\'re already at the top. (3) ↓ LATEST BUTTON — same pill in the bottom-right corner. Tap to smooth-scroll back to the most recent message. Auto-hides when you\'re at the bottom. Both buttons appear only when the thread is tall enough to scroll. Behavior follows the user\'s explicit request: at the top, only ↓ Latest is shown; at the bottom (default), only ↑ Top is shown; in the middle, both are visible.'},
  {v:'2.62',d:'Ask Coach collapse: tap anywhere on the header to toggle (matches exercise-card pattern)',det:'v2.60 added a small ▲ button as the only way to collapse the Ask Coach panel — inconsistent with the rest of the app where exercise cards toggle on the whole header click. Updated to match: the title + tier badge + chevron on the LEFT side of the expanded header is one large click target that toggles. Right-side controls (quota counter, 🗑 Reset) stay non-collapsing. Collapsed view already had the whole-row click pattern from v2.60 — kept that, just changed the chevron from "▼ Expand" to a simpler ▶ that mirrors how collapsed exercise cards work.'},
  {v:'2.61',d:'Fix: "Set goal" weight now uses the same bottom-sheet modal as Log weight (was a leftover browser prompt)',det:'There were two definitions of editWeightGoal() in the file: a clean wrapper that called openWeightSheet(\'goal\') at line 6852, and an old browser-prompt version at line 7387 that was overriding it (later definition wins in JavaScript). When you tapped 🎯 Set goal you got the old prompt() dialog instead of the new modal. Removed the duplicate. The goal flow now uses the same bottom-sheet design as logging a weigh-in: numeric input, lb/kg toggle, live conversion, Save/Cancel/Clear buttons. Consistent with the rest of the weight UI.'},
  {v:'2.60',d:'Collapsible Ask Coach panel + auto-scroll to bottom of chat after each response',det:'Two small UX improvements. (1) Collapse — the Ask Coach panel can now be collapsed to a single-row header bar when you\'re not actively chatting. Tap the ▲ button in the header to collapse, or tap the collapsed bar to expand again. Collapsed state shows "💬 Ask the Coach · N messages" with a "▼ Expand" hint. Preference persists across reloads via localStorage (not synced — it\'s a personal UI choice). Reclaims ~400px of vertical space on the Plan view when you don\'t need the chat. (2) Auto-scroll on response — after the coach replies, the page now scrolls so the input box is brought into view at the bottom of the viewport. This means the latest message is always visible without having to manually scroll back up. The chat thread\'s internal scroll also jumps to the latest message. Combined: you can scroll anywhere on the page, send a question, and when the response arrives you\'re back at the chat reading the answer.'},
  {v:'2.59',d:'Goal-driven plan generation — workouts shaped by your actual goals (with priority ranking) instead of random picks',det:'Foundational redesign of how plans get generated. Each goal in your profile now has a structured profile defining how it should shape your week: gym/cardio ratio, rep range, RPE range, target sets per muscle group per week, exercise bias (compound/functional/balanced), and cardio focus (easy/mixed/periodised). Muscle: 70% gym, 6-12 reps, RPE 7-9, compound-first, easy cardio for recovery. Lose weight: 50/50, 8-12 reps, compounds to preserve muscle, mixed cardio, weights held in deficit. Fitness: balanced. Endurance: 30% gym/70% cardio, 5-8 reps for strength maintenance. Performance: periodised. The week generator now uses these profiles instead of looking at only your first goal: cardio_ratio determines ride count, exercise_bias determines which slot candidates get preferred (compound vs balanced). Multi-goal users get a BLENDED profile (equal weights by default — e.g. muscle + endurance averages to ~50/50 gym/cardio, 5-10 reps). NEW priority ranking: in goals setup, if you select 2+ goals, a "Priority" section appears with an EQUAL/RANKED toggle. RANKED lets you reorder with ↑↓ arrows — top = highest priority, weighted more in the blend. Default stays EQUAL. The "My Training" tab\'s Your Goals card now shows your actual training mix derived from your goals ("70% gym · 30% cardio · 6-12 reps · RPE 7-9 · ~14 sets/muscle/wk") so you can see exactly what your goals translate to. v2.60 will add progressive overload targets (weight × reps prescribed per set based on PRs).'},
  {v:'2.58',d:'Coach uses feeling-words instead of raw Form numbers — "carrying fatigue" not "Form of -17"',det:'v2.49/v2.54 fixed the acronym problem ("Form" not "TSB") but the raw number itself is still abstract for non-cycling users. "Form of -17" tells you nothing if you don\'t already know the scale. Updated the prompt to add explicit DESCRIPTIVE LANGUAGE rules: the AI must translate Form numbers into feeling-words using the interpretation bands ("fully fresh", "well-rested and recovered", "productive training zone", "carrying noticeable fatigue", "deep fatigue"). The raw Form/Fitness/Fatigue numbers are now forbidden unless the user explicitly asks for them. Per-ride numbers (load, intensity, power, HR) are still allowed since they\'re concrete. Examples: ✓ "You\'re carrying noticeable fatigue from two ride days in a row" / ✗ "Your Form is -17, so…"'},
  {v:'2.57',d:'Admin tier bypasses the 4-second client throttle — truly unlimited Ask Coach usage',det:'Admin is now exempt from the 4-second client-side throttle introduced in v2.56. Non-admin users (pro, basic) still get the 4-second cooldown between sends to avoid tripping Gemini\'s 15 RPM limit. Admin is still bounded by Gemini\'s API-side limits (15 RPM, 1500 RPD on free tier) and will see a friendly 429 message if they hit them — but the app no longer pre-throttles admin requests. Suitable for solo use where no one else is sharing the API key.'},
  {v:'2.56',d:'Friendlier rate-limit error message + client-side throttle to avoid tripping Gemini\'s 15 RPM limit',det:'When you sent a few back-to-back coach messages, Gemini returned HTTP 429 (Too Many Requests) and the app just showed "API 429" — opaque. Now: (1) Status code 429 shows "Too many requests in a short time. Wait ~30 seconds and try again — the free Gemini tier allows 15 requests per minute." Other known status codes also get friendly messages (403 = "API access denied", 5xx = "Gemini service is having a moment"). (2) Added a 4-second client-side throttle between Ask Coach sends. If you hit Send within 4 seconds of the last one, you get a toast "Hold on 3s — pacing requests" and the request is dropped instead of being sent. 4s = ~15/min ceiling matches the free tier so you can\'t accidentally trip the limit through rapid use. The throttle resets after the cooldown so genuine multi-turn conversation still flows fine.'},
  {v:'2.55',d:'Cascade no longer silently drops a workout when changing a gym day to REST + AI prefers swap over destructive change',det:'Two bugs cascaded in v2.54 user-reported scenario: AI said "move Pull to Friday" but called change_day_type(Wed, REST) instead of swap_workout_days(Wed, Fri); then doSwap\'s cascade shifted Pull→Thu, Push→Sun, and dropped Legs off the end. Result: a week with no Push day, AI\'s words didn\'t match the action. FIX 1: doSwap is now smart. When changing a gym day to REST, it first looks for any future REST day in the week and places the displaced workout there (non-destructive — no other workouts move or get dropped). Only if NO future REST day exists does it fall back to the cascade-and-drop behavior, and the toast now explicitly warns which workout type was dropped ("Cascaded forward — Push dropped"). FIX 2: tool-selection guidance in the prompt is much more explicit — when the user wants to MOVE a workout to a specific day, the AI must use swap_workout_days (non-destructive). change_day_type(X, REST) is reserved for "just take this day off" without a target. The prompt also requires the AI\'s text to match the tool — saying "moving to Friday" must call swap_workout_days, not change_day_type.'},
  {v:'2.54',d:'Coach stops writing "(TSB)" alongside "Form" + becomes proactive with tool calls (no more 3-turn back-and-forth)',det:'TWO fixes. (1) ACRONYM STRIPPING — the v2.49 prompt had said "use plain term first + acronym in parens" but the model interpreted that as "always write Form (TSB)". Tightened the rule: NEVER write the acronym at all. Only "Form is -17", never "Form (TSB) is -17" or "TSB -17". Added a post-processor safety net that strips parenthetical acronyms and replaces any remaining standalone TSB/CTL/ATL/TSS/IF tokens with their plain-English equivalents — even if the model slips up, the user never sees a raw acronym. (2) PROACTIVE TOOL CALLS — when you said "I\'m tired, will resting today impact my week?" the model gave advice without calling change_day_type, then "Ok adjust my plan" still didn\'t call it (just described intent), and only "Ok" triggered the actual tool call. Three turns for one decision. Updated prompt: explicit examples that tool calls are PROPOSALS (the confirmation card is where consent happens, not a separate turn). The model should call the tool in the same response as the question, not describe what it would do and wait. Forbidden phrases like "I can adjust your plan to…" or "I will move your workout…" are flagged in the rules.'},
  {v:'2.53',d:'Hotfix — syntax error in v2.52 broke the app (escaped quotes inside a template-literal expression)',det:'The v2.52 edit to the "+ Add workout" button used \\" to escape double quotes inside a ${...} expression within a template literal. That works for escape sequences BETWEEN expressions in a template literal, but inside an expression in ${...} you\'re in normal JS land and \\" is a syntax error. Result: the entire script failed to parse, app wouldn\'t open. Rewrote the button using a self-invoking arrow function with backtick template literals for the strings — no escaping needed, no nested-quote problems. App opens again.'},
  {v:'2.52',d:'Guest sees ALL features now — locked-but-visible state with "Sign in to unlock" CTAs instead of hiding things',det:'Previous behaviour hid Ask the Coach, Friends, the "+ Add workout" button, and showed only a generic Strava-connect prompt for guests. Now every feature is visible to guests so they can see the full scope of what they\'d get if they signed up. Each gated feature shows a small "🔒 SIGN IN" pill badge in its header plus a brief description of what the feature does, and a "🔓 Sign in to unlock" CTA. Specifically: (1) ASK THE COACH — guest sees the panel with disabled-look suggestion chips and a description of the AI coach, plus the unlock button. (2) FRIENDS — same pattern, with the description of what Friends does. (3) STRAVA CONNECT in Settings — explains what it does but the button now reads "🔓 Sign in to connect Strava" for guests. (4) "+ ADD WORKOUT" button on ride days — still visible but the label includes "🔒 sign in" and tapping shows a toast. Workout-log save buttons were already showing for guests with a toast on save (no change needed). Cleaner discovery — guests can see everything the app offers, not just whatever wasn\'t gated.'},
  {v:'2.51',d:'Welcome sheet + sample data for guests + setup tour for new users + "View intro again" button in Settings',det:'Guests were getting dropped onto an empty Week view with zero explanation of what the app does. Now: (1) When you tap "Continue as Guest" on the lock screen, a proper welcome sheet appears with 6 feature cards explaining smart weekly plan, Strava sync, gym tracking, body metrics, AI Coach, and progress charts. Three CTAs at the bottom: "🎯 Try with sample data" (loads realistic mock data into the guest store — 12 Strava rides over 30 days with computed fitness curve, 5 gym logs, weight log with 4-week loss trend, FTP 230W, body weight 78.5kg with 74kg goal, 5 PRs on compound lifts), "Start fresh — empty", or "Sign up instead". The sample data lets a guest poke around every feature in action without setting anything up. (2) New signed-in users who finish goals setup now see the same welcome sheet with a "🚀 NEXT STEPS" checklist (generate plan, connect Strava, log first workout, check My Training). Only shown once — tracked via welcome_seen flag. (3) New "📖 About the app" section in Settings has a "🧠 View intro again" button so anyone can reopen the welcome anytime.'},
  {v:'2.50',d:'Plain-English everywhere: "Load" not "TSS", "Intensity" not "IF", "Fitness − Fatigue" not "CTL−ATL" + info sheet explaining all the cycling metrics',det:'Sweep through every UI label that was using TrainingPeaks acronyms and replaced with plain English. Ride card badge: "📊 TSS 95 · IF 0.85" → "📊 Load 95 · Intensity 0.85". Fitness · Fatigue · Form panel: "CTL−ATL" subtitle under Form → "Fitness − Fatigue". Cycling Progress chart metric chips: "EF" → "Efficiency", "TSS" → "Load" (full label "Training Load per Ride"). Weekly Summary table column: "TSS" → "Load". History row Strava entries: "TSS X · IF Y" → "Load X · Intensity Y". NEW ⓘ button on the Fitness · Fatigue · Form section header opens an info sheet that explains each metric in plain English with concrete examples and your CURRENT NUMBERS plugged in — so you can see "Fatigue: 25" and read what that means alongside "Form: -17 = carrying fatigue, monitor recovery". Each metric chip in the chart also has a one-line hint shown below the metric label.'},
  {v:'2.49',d:'Coach uses plain-English labels — "Form" not "TSB", "Fitness" not "CTL", etc.',det:'The Ask Coach prompt was letting the AI sprinkle raw acronyms (TSB, CTL, ATL, NP, IF, EF, TSS) into responses without explanation, which is confusing if you haven\'t memorized the cycling-coach lexicon. Updated the prompt with an explicit VOCABULARY section: CTL → "Fitness", ATL → "Fatigue", TSB → "Form", TSS → "training load", NP → "normalized power", IF → "intensity", EF → "aerobic efficiency". When the AI does need to be precise, it puts the plain term first and the acronym in parentheses ("Your Form (TSB) is -17"). No more bare "-17 TSB" mystery numbers. Existing conversation history isn\'t retroactively translated, but new questions get the friendlier vocabulary.'},
  {v:'2.48',d:'Ask Coach is now multi-turn — full conversation with memory, scrollable thread, follow-up questions just work',det:'Single-shot Q&A replaced with a real chat thread. Each user message and coach response appears as a bubble (user right-aligned in purple, coach left-aligned in grey) inside a scrollable container. The full conversation history is sent to Gemini on every new question — so follow-ups like "what about Wednesday too?" or "actually undo that" work naturally because the model sees the previous turns. Confirmation cards for plan changes still appear inside the corresponding coach bubble, and applied actions stay visible in the thread so you can scroll back and see what got executed. A new "🗑 Reset" button at the top of the panel clears the conversation when you want a fresh start. Conversation persists across page reloads via ai_chat_session (synced through Firebase). When the AI sees applied actions from earlier in the conversation, those are summarized in its system context for the next turn so it doesn\'t re-propose the same change. Loading state now shows a typing-dots bubble inside the thread instead of just disabling the input. Suggested-question chips only appear when the conversation is empty (don\'t clutter mid-thread).'},
  {v:'2.47',d:'Ask Coach gains four more tools: mark_day_complete, set_lock_day, log_gym_sets, regenerate_remaining_week',det:'Builds on v2.46\'s tool-calling. Four new tools the AI can call (still gated by confirmation cards before any change applies): (1) mark_day_complete(date, completed?) — flip the completion flag for a gym day. Use when user says "I finished my workout today" without dictating sets. (2) set_lock_day(date, locked?) — lock/unlock a day so future regens preserve or don\'t preserve it. (3) log_gym_sets(date, exercises[]) — log structured gym data. Each exercise has a name (fuzzy-matched against the library — "bench" → Barbell Bench Press) and an array of {weight, reps} sets. Updates PRs automatically. User can say "log my Push: bench 100 lb 3x8, OHP 65 lb 3x10" and the AI structures it. Returns a note about any names that couldn\'t be matched. (4) regenerate_remaining_week(from_date) — regenerates the plan from a date forward. Days before from_date are temp-locked so buildWeek preserves them; original lock state is restored after. Used when user wants a fresh plan for the rest of the week without losing what they\'ve already done.'},
  {v:'2.46',d:'Ask Coach can now actually modify your plan via Gemini function calling — confirmation card before every change',det:'The chatbot is no longer read-only. Four new tools the AI can call when you ask for a plan change: (1) swap_workout_days(date1, date2) — swaps types and exercises between two days; (2) change_day_type(date, new_type) — change a day to REST or any other type, with auto-cascade when a gym day becomes REST; (3) add_workout_to_ride_day(date, gym_type) — stack a gym session on top of a ride day with cascade; (4) replace_gym_with_ride(date) — convert a planned gym day to a ride day (requires a Strava ride on that date). Safety pattern: when the AI calls a tool, the response shows your normal coach text answer PLUS a purple "⚡ Proposed change" confirmation card describing exactly what will happen (e.g. "Swap Tue 26 (Pull) ↔ Wed 27 (Legs)"). You tap ✓ Apply or Skip — nothing changes until you confirm. After applying, a green "✓ done" line replaces the card so you can see what was executed. Multiple tools can be returned in one response and confirmed independently. The AI is instructed to only call tools when you explicitly ask for changes (questions like "am I overtraining?" still get pure text answers).'},
  {v:'2.45',d:'Ask Coach sees full week plan + knows its capabilities (read-only for now, points users to UI buttons for changes)',det:'Two small but important upgrades to the v2.44 Ask Coach prompt. (1) The AI now receives the FULL current week plan (all 7 days, with type, lock state, completion status, and any extraGym additions) — not just today\'s plan. So if you ask "swap my Tuesday Pull to Wednesday," the AI can actually see what\'s on Wednesday and reason about whether the swap makes sense. (2) The prompt now explicitly tells the AI what it CAN do (analyse, suggest, recommend) vs CANNOT do (directly modify plan, log workouts, swap days). When the AI recommends a change, it now points the user to the specific UI button to tap — "Swap ↕" on the week row, "+ Add workout" on a ride day, or "🔄 Replace gym with ride" prompt when Strava logs a ride on a gym day. No more false promises like "I\'ll swap them for you." Full plan-modification via Gemini function calling is the bigger v2.46 work — that\'ll let the AI actually execute the change (with a confirmation card before applying).'},
  {v:'2.44',d:'Ask the Coach — interactive AI Q&A on the Week view, with tiered access (admin/pro/basic) to cap API costs',det:'New 💬 Ask the Coach panel at the top of the Week view. Tap a suggested chip ("Should I ride today or rest?", "Am I overtraining?", "How is my week going?", "Should I take a recovery day?", "What should I focus on this week?", "Why is my form negative?") or type your own question. The AI receives FULL context: today\'s plan + weather, what you\'ve already logged today, yesterday\'s training, your CTL/ATL/TSB fitness curve, body weight trend, last 7 days of gym + Strava rides with TSS, FTP, W/kg, and your goals/level/activities. Response is short (2-3 sentences, ~80 words max) and specifically cites your actual numbers — not generic advice. ACCESS TIERS to control API costs: admin (unlimited, you — ht9323@gmail.com), pro (20/day, trusted users — edit _PRO_EMAILS array to grant), basic (0/day, default — sees a locked teaser). The tier badge appears next to the panel header so you always know your level. Daily counter shown ("3 of 20 left today"). Quota tracked locally and synced via Firebase per signed-in user, resets at midnight local time. Limit-reached state disables the input and shows when access resets. Errors fall back gracefully with the error message inline.'},
  {v:'2.43',d:'Strava ride on a gym day no longer hides the planned gym work — explicit "Replace gym with ride" cascade option',det:'Previously: when a Strava ride synced on a planned gym day (e.g., went riding on Pull Tuesday), the week-view row replaced the gym label with the ride name and stats, making it look like the gym day vanished. The plan data was still PULL underneath, but the UI made it invisible. Now: the week-view row keeps showing the gym workout as the primary label (with its colour and icon) and adds a small orange "+ 🚴 X km · Y min logged" line below — both the planned gym and the actual ride are visible. When you open the day, a Strava-ride banner appears at the top with TWO clear actions: "🔄 Replace gym with ride" (cascades the gym workout forward, last gym day in the week becomes REST — mirroring the v2.20 add-workout cascade but in reverse) or "💪 Keep both" (do the gym workout in addition to the ride, prompt is dismissed but ride stays visible as a small inline note). The chosen state persists on the plan day (rideAlongside flag) so re-opens don\'t re-prompt.'},
  {v:'2.42',d:'Compact "Waiting for Strava" card on ride days + backdate weigh-ins',det:'TWO improvements. (1) RIDE-DAY UX — the big 4-field manual ride log form no longer takes up screen space on every ride day when you have Strava connected. Instead a compact single-row card appears with the last sync timestamp, a 🟠 Sync now button, and a 📝 toggle to expand the full manual form if you genuinely want to log without Strava. Future-dated ride days (planned but not yet arrived) hide the manual log form entirely — no point logging a ride that hasn\'t happened. Once you do tap 📝 to expand, the form stays expanded for the rest of the session. (2) BACKDATE WEIGH-INS — the body weight sheet now has a date picker (defaults to today, max = today, no future dates). Useful for filling in missed days from memory, especially when you want to see the chart appear ASAP after starting to log. Backdated entries write to weight_log at the selected date but only update your "current weight" (used for W/kg) if the selected date is your most recent — so backdating doesn\'t overwrite a more recent weigh-in.'},
  {v:'2.41',d:'Group cycling sections under one "🚴 Cycling Performance" header with subtle visual container',det:'The Training tab had 4 separate uppercase section headings ("CYCLING PROFILE", "💪 FITNESS · FATIGUE · FORM", "📊 CYCLING PROGRESS", "📈 CYCLING — WEEKLY SUMMARY") which felt redundant and busy. Replaced with one main "🚴 CYCLING PERFORMANCE" header wrapping all 4 subsections in a subtle purple-tinted bordered container. Each subsection now has a smaller inline label inside the container (Profile / 💪 Fitness · Fatigue · Form / 📊 Progress chart / 📈 Weekly summary) so they\'re still distinguishable but visually subordinate to the main cycling group. Trend metadata that lived in the sub-headers (trend badges, "vs N days ago") is preserved inline next to each sub-label. The logical flow within the group is now Profile (baseline) → Form (current state) → Progress chart (trend) → Weekly summary (volume) — moving from "where I am" to "how I\'m changing".'},
  {v:'2.40',d:'Reordered Training tab — daily data up top, config (goals/activities/plan) at the bottom',det:'Body Weight is now the very first section under the header — fastest path to log today\'s weigh-in. Followed by the cycling block (Profile, Fitness, Progress chart, Weekly Summary), then Gym Progress (Tonnage + 1RM), then PRs. The configuration sections (Your Goals, Your Activities, Training Plan / Workout preference) moved to the bottom just above History — you set those once and rarely touch them. Eliminates ~600px of scrolling past static config to reach the daily-action area.'},
  {v:'2.39',d:'FTP estimate transparency sheet — see which rides drove the number, spot missing power data',det:'Tapping "📊 Estimate FTP from your rides" no longer shows a generic browser confirm dialog. Instead a proper bottom sheet opens showing the suggested FTP at the top, then a list of the actual rides driving the estimate — each row shows date, duration, NP, the duration adjustment factor applied, and the resulting per-ride FTP estimate. A "Show all eligible rides" toggle expands to every ride considered, sorted by FTP-equivalent NP. If any of your rides ≥30 min lack power data, the sheet shows a warning ("⚠️ N rides skipped — no power data") explaining why HR-only rides can\'t feed the estimate. This is a transparency tool: if your hardest 1-hour Zone 4 effort isn\'t in the top-rides list, you immediately know it was an HR-only ride and the auto-estimator couldn\'t see it — so you can hit ✏️ Set my own value and enter what you actually know your FTP is. Three actions at the bottom: Apply the estimate, Set your own value (opens the manual FTP editor), or Cancel.'},
  {v:'2.38',d:'W/kg bands refined to match Coggan chart precisely — 7 tiers, Untrained tier added',det:'Cross-checked the W/kg categorization against the original Coggan/Allen table (from "Training and Racing with a Power Meter") and multiple other sources (Zwift Insider, Cycling Analytics, TrainingPeaks). Refined the male thresholds from 2.0/3.0/4.0/5.0/5.5 to 2.0/2.5/3.2/4.0/5.0/5.5 — adding a distinct "Untrained" tier (< 2.0 W/kg, sedentary or new to cycling) below "Beginner" (2.0-2.5, first few months of regular training). Recreational now starts at 2.5 W/kg (active weekend rider) instead of 2.0. Female bands adjusted similarly (≈0.5 W/kg lower per tier). The W/kg info sheet now shows all 7 tiers.'},
  {v:'2.37',d:'Remove redundant Weight card from Cycling Profile — single source of truth is now Body Weight section',det:'The Cycling Profile card showed Weight in the middle column AND the Body Weight section below repeated the same number. Both were already linked to the same profile.weight value, so the Cycling Profile copy was pure duplication. Removed the Weight column. Cycling Profile is now a cleaner 2-column layout (FTP + W/kg), with both cards visually larger (24px numeric values instead of 20px). The W/kg card now shows the calculation breakdown ("125W ÷ 244.1 lb") as a small subtitle so you can verify where the ratio comes from. When weight is unset but FTP is set, the W/kg card displays "Log weight ↓" pointing the user to the Body Weight section. When FTP is unset but weight is set, it says "Set FTP →".'},
  {v:'2.36',d:'W/kg categories now align with Coggan/Allen standard + gender-aware bands + info sheet',det:'The W/kg label below the W/KG stat was using overly generous bands ("Recreational" started at 0 W/kg). Corrected to match Coggan & Allen\'s "Training and Racing with a Power Meter" — the gold-standard reference used by TrainingPeaks, Zwift, and every credible cycling platform. 6 tiers: Beginner / Recreational / Trained / Strong / Cat 1 / Elite or Pro. Bands are now gender-aware — male thresholds at 2.0/3.0/4.0/5.0/5.5 W/kg, female at 1.5/2.5/3.5/4.5/5.0 W/kg (using profile.gender). New ⓘ info button next to "W/KG" opens a sheet showing all 6 bands with ranges, your current tier highlighted, and a note that W/kg matters most on climbs (absolute power matters more on flats due to CdA + drafting).'},
  {v:'2.35',d:'Proper weight entry sheet — number input + lb/kg toggle + live conversion (no more browser prompt)',det:'Replaced the browser prompt() dialogs for weight entry with a proper bottom sheet modal matching the app\'s design language. The sheet has a single large numeric input, two pill toggle buttons (lb / kg) right below, a live conversion line ("≈ 110.7 kg") that updates as you type, and your last weigh-in shown for reference. Switching units mid-entry intelligently converts the current input value so you don\'t lose your typing. The same sheet is used for logging weigh-ins (from Cycling Profile ✏️ Edit, Body Weight + Log weight, or other entry points) and for setting your goal weight — same unit toggle, same live conversion. Logging a weight from the Cycling Profile card writes to both the current weight (powering W/kg) AND the weight history (powering the Body Weight chart) — so a single entry point updates everything. Clear-current-weight and clear-goal options are available as red secondary buttons on the sheet when there\'s an existing value to clear.'},
  {v:'2.34',d:'Body weight in lb/kg — flexible input parser, displays follow your unit preference (same setting as gym weights)',det:'All body weight inputs and displays now respect the app\'s unit preference (same setting controls gym weights and body weight — default lb). Weight prompts accept flexible input: bare numbers ("180" or "82") are interpreted in your preferred unit, or you can include an explicit suffix like "180 lb", "82kg", "180 pounds" to override. Editing the Cycling Profile weight stat, logging a daily weigh-in, and setting a goal weight all use the same flexible parser. Storage is always in kg internally so W/kg math stays consistent across the app regardless of display preference. The Body Weight chart Y-axis labels, current value, 90-day change, goal line annotation, slope/week rate, and dot tooltips all render in your preferred unit. Toasts confirm both units after each save (e.g. "Logged 82.5 kg (181.9 lb)") so you can sanity-check the conversion landed where you expected. When viewing in lb, the secondary "kg · logged date" line still shows the kg value for reference.'},
  {v:'2.33',d:'Performance Trends → "Cycling — Weekly Summary": removed gym column (redundant with dedicated Gym Progress section), added TSS column when FTP is set',det:'The 4-week trends panel now lives cleanly inside the cycling block as a pure cycling weekly summary. The Gym session-count column was redundant once the dedicated 💪 Gym Progress section with weekly tonnage chart shipped in v2.30. The Gym trend chip was replaced with a Rides chip, and a new TSS column appears in the table whenever FTP is set — surfacing the actual training-stress load per week alongside distance and kJ. Section heading renamed to "Cycling — Weekly Summary" for clarity.'},
  {v:'2.32',d:'Tighten cycling section grouping — remove redundant Fitness/Form hint card when no FTP set',det:'The "📊 Unlock training-load tracking" hint card was rendering between the Cycling Profile and the Cycling Progress chart whenever Strava was connected but no FTP was set yet — visually splitting the cycling block. The Cycling Profile card already shows the same "set FTP to unlock" guidance at its bottom, so the duplicate hint card was just clutter. Now when there\'s no fitness curve yet, the Fitness · Fatigue · Form section renders nothing, and the Cycling Profile sits directly adjacent to the Cycling Progress chart as intended.'},
  {v:'2.31',d:'Auto-estimate FTP from ride data + group cycling sections + hide them when cycling is not selected',det:'Three Training tab improvements. (1) FTP is now auto-estimated from your Strava ride NP data using Coggan\'s intensity model — duration-adjusted top-10% of per-ride NP values: 30-45min × 0.88, 45-75min × 0.95, 75-120min × 1.00, 120+ min × 1.05. Runs automatically on every Strava sync (if you haven\'t set FTP manually) and on app load. A new ESTIMATED badge replaces the STRAVA/MANUAL tag when the value came from auto-estimation. A new "📊 Estimate FTP from your rides" button appears on the Cycling Profile card whenever you have 3+ qualifying rides — tap to recompute and apply with a confirmation dialog. (2) All cycling sections (Cycling Profile, Fitness · Fatigue · Form, Cycling Progress, Performance Trends) are now grouped together at the top, followed by Body Weight, Gym Progress, then PRs. (3) The cycling block is hidden entirely when "Cycling" is not one of your selected activities — keeps the Training tab clean for gym-only users. Also added a hint explaining why weight can\'t be auto-derived from ride data (no weight signal in activity objects — needs to be set on Strava profile or entered manually).'},
  {v:'2.30',d:'Gym Progress charts — weekly tonnage with muscle-group split + per-exercise 1RM progression with plateau detection',det:'New 💪 Gym Progress section on the Training tab with two charts. (1) Weekly Tonnage: stacked bar chart of total weight × reps across all completed sets, broken down by muscle group (Push / Pull / Legs / Core), last 12 weeks. Trend badge in the header compares recent 4-week average to prior 4-week average. Each bar is tooltipped with the per-group breakdown. (2) Estimated 1RM Progression: pick any exercise from a dropdown (sorted by recent frequency) and see your estimated one-rep max trajectory over 180 days. Uses Epley formula (weight × (1 + reps/30)) on the peak set per session. Shows current, best, and trend rate (kg/lb per month). Dashed regression line indicates direction. Auto-flags plateaus when no new peak 1RM in 21+ days, suggesting a deload or rep-range switch. AI weekly review prompt now receives tonnage trend (recent vs prior 4-week average) and per-exercise 1RM trajectories for your top 6 most-trained lifts, including plateau flags — so coaching advice can reference specific lifts ("your bench has plateaued at 92.5kg for 3 weeks → time for a deload at 85kg × 8").'},
  {v:'2.29',d:'Body weight tracking with chart, goal target, ETA estimate, and AI integration',det:'New ⚖️ Body Weight panel on the Training tab logs weigh-ins over time. Tap + Log weight to drop a weigh-in (default: previous value, just nudge the digit). Chart shows raw dots + 7-day rolling average over 90 days, with auto-detected trend rate (kg/week) in the header. Set an optional 🎯 goal weight and a dashed amber line appears on the chart with an estimated "weeks to reach goal" projection based on your current trajectory. 90-day total change shown as a stat above the chart. The existing Cycling Profile ✏️ Edit weight button now also writes to the history log, so manual edits become weigh-ins. Strava\'s athlete weight is auto-seeded as today\'s value on first import (unless you\'ve already logged manually). The AI weekly review prompt now receives the full weight context: current value, goal proximity, 7-day and 28-day deltas, rate of change, and healthy cut/bulk reference ranges — so feedback can correlate weight trends with training load (e.g. "you\'re losing 0.7 kg/week while CTL keeps climbing — sustainable cut" vs "weight dropping but CTL also falling — under-fueling, eat more carbs on ride days").'},
  {v:'2.28',d:'Cycling Progress chart — see fitness trends over 90 days with metric switcher (EF, NP, Power, HR, TSS, Distance, Suffer)',det:'A new SVG chart panel on the Training tab plots your last 90 days of rides. Tap chips at the top to switch between 7 metrics: Aerobic Efficiency (W/bpm — the gold-standard endurance fitness indicator, rising = aerobically fitter at the same effort), Normalised Power, Avg Power, Avg HR, TSS per ride, Distance, and Suffer Score. Each ride is a dot, the purple line is a 7-day rolling average for smoothing. The chart auto-picks a sensible default metric based on what data is available (EF if your rides have both power and HR, NP if power-only, HR if neither). A trend badge in the header (↑ IMPROVING / → STABLE / ↓ REGRESSING) uses linear regression across the window — and inverts for HR (lower = improving). Below the chart, first-half vs recent-half averages with a percentage change tell you the magnitude of improvement at a glance.'},
  {v:'2.27',d:'FTP + body weight + IF/TSS per ride + CTL/ATL/TSB fitness curve — proper training-load tracking and richer AI feedback',det:'Imports FTP and body weight from Strava\'s athlete endpoint on connect and every sync (preserves manual overrides — tap ✏️ on the Cycling Profile card to set values manually). With FTP known, every ride now gets an IF (Intensity Factor = NP/FTP) and TSS (Training Stress Score) computed and displayed as a badge on the ride card and history detail. A new Fitness · Fatigue · Form panel on the Training tab shows current CTL (42-day exponential-weighted average TSS — your fitness), ATL (7-day EMA — your fatigue), TSB (CTL−ATL — your form), with a 28-day fitness trend mini-chart and a plain-English interpretation ("Productive training zone" / "Carrying fatigue" etc). 7-day delta indicators show whether fitness is rising or falling. A new Cycling Profile card displays FTP/weight/W·kg⁻¹ with badges showing whether each value came from Strava or was manually set. The AI weekly review prompt now receives the full cycling profile (FTP, weight, W/kg), current CTL/ATL/TSB snapshot with 7-day and 28-day deltas, and per-ride TSS/IF — so feedback can reference your actual training load trajectory ("CTL +6 in 4 weeks is a healthy build, today\'s ride at IF 0.92 was suprathreshold"). On app load, existing users with an FTP set get IF/TSS backfilled and the curve computed without needing a fresh sync. Disconnecting Strava clears Strava-sourced FTP/weight but preserves manual values.'},
  {v:'2.26',d:'Comprehensive ride metrics in history + 4-week performance trends panel on Training tab',det:'History Strava rows now show all captured performance fields in a structured expandable view: power (NP vs avg watts with real/estimated flag, max watts, kJ total), cardio (avg and max HR, suffer score), movement (speed, cadence, elevation), and context (elapsed time, RPE, PR count, workout type badge). The history push is also extended to carry speed, max watts, device_watts flag, RPE, PR count and workout type. A new 4-week Performance Trends panel appears at the top of the Training tab — it shows trend arrows (↑→↓) comparing this week vs 4 weeks ago for distance, training load (kJ), avg NP and gym sessions, plus a compact week-by-week grid showing rides, km, kJ and gym count at a glance. Only shown when Strava ride data is present.'},
  {v:'2.25',d:'Smarter ride adaptation — analyzeStravaAdapt now uses kJ, suffer score and NP instead of duration alone',det:'The adaptation engine was only checking two things: did you show up, did you ride long enough. It ignored all quality signals. Rewritten to score each ride on three dimensions: (1) duration — ≥80% of planned time, (2) load quality — kilojoules output vs expected Zone 2 baseline (~9kJ/min), benefit-of-doubt if no power meter, (3) fatigue signal — suffer_score >200 on long rides flags overreaching, NP >25% above avg watts on long rides flags variable-intensity effort (not Zone 2). The factor now has 5 outcomes: overreaching consistently → ease back 0.05, crushing it (comp+quality both high) → pace up 0.08, completing but quality mixed → pace up 0.04, on track → hold, low completion → ease back 0.1. Adaptation detail (completion %, quality %, reason) stored in bike_adapt_detail and shown on the ride day adaptation badge so you can see what drove the change.'},
  {v:'2.24',d:'Richer Strava data — save and display NP, max HR, cadence, kJ, suffer score for better training analysis and AI review',det:'Extended the Strava activity field strip to capture 5 training-relevant fields that were previously discarded: weighted_average_watts (Normalized Power — more meaningful than average watts for variable rides), max_heartrate (effort ceiling for zone analysis), average_cadence (pedalling form), kilojoules (total energy output — the real training load number), suffer_score (Strava HR-zone stress score). These are now shown on the ride card (NP with avg watts as sub-label, avg/max HR combined, cadence block, kJ and suffer score as badges) and passed to the AI weekly review prompt so the coach has actual training load data to work with. History tab also carries the new fields. The field strip remains tight — elapsed_time is the only addition without a direct display use but is cheap and meaningful as stopped-time context (elapsed_time − moving_time = rest stops).'},
  {v:'2.23',d:'Fix Strava sync not persisting — strip activities to minimal fields before storing to prevent localStorage quota overflow',det:'Raw Strava activity objects include GPS polylines, segment efforts, achievement counts, kudos, best efforts and dozens of other fields. At ~10KB per ride × 200 rides the strava_activities payload can exceed 2MB. DB.set() wraps localStorage.setItem in a silent try/catch, so when the quota is exceeded the data is never actually written, syncUp() then pushes whatever was previously stored (null or stale data), and the next loadFromCloud() overwrites with the stale Firebase snapshot. Fixed by mapping each activity to only the 9 fields the app actually reads: start_date_local, moving_time, distance, average_heartrate, average_watts, total_elevation_gain, name, type, sport_type. 200 rides now takes ~25-35KB instead of 1-3MB. syncUp() is also awaited so Firebase write completes before the success toast appears. Error cases now show a red toast instead of failing silently.'},
  {v:'2.22',d:'Fix Strava rides not persisting across sessions — syncUp() now called after every Strava fetch',det:'stravaFetchActivities() was saving rides to localStorage and re-rendering but never calling syncUp(), so the data never reached Firebase. On next app open, loadFromCloud() ran first and overwrote localStorage with the stale Firebase snapshot (no activities), silently wiping the fresh sync. Fixed by adding syncUp() immediately after DB.set(strava_activities). Also added strava_last_sync to the _syncKeys list so the sync timestamp persists too, and fixed stravaDisconnect() which had the same missing syncUp() bug.'},
  {v:'2.21',d:'Smart "Add workout" sheet on ride days — suggests pulling in the next scheduled gym session with a cascade preview; picking a different type auto-resolves week duplicates instead of always cascading',det:'The "Add workout" sheet now detects the next scheduled gym day and presents it as the primary suggestion with a coloured card showing the full cascade preview (e.g. Tue → Pull · Wed → Legs · Thu → REST). Confirming the suggestion does the cascade as before. If the user picks any of the other 3 types instead, the week schedule stays untouched but duplicate-resolution runs: any gym day that shares the chosen type with the new extra session gets replaced with whichever of the 4 standard gym types is absent from that week. If no type is missing (5-session edge case), the duplicate is left as-is. If there are no upcoming gym days left in the week, the sheet falls back to showing all 4 types without a suggestion.'},
  {v:'2.20',d:'Add gym session to ride days — tap "+ Add workout" on any ride day to stack a gym session; remaining gym days shift forward automatically',det:'Ride days now show a "+ Add workout" button. Tapping it opens a sheet to pick a gym type (Push/Pull/Legs/Upper Pump). The chosen session is stored as extraGym on the plan entry and rendered below the ride card with its exercise list and a separate "Log workout" button. The extra gym log is stored under a separate key (extralog_YYYY-MM-DD) so it never overwrites the ride log. After adding the gym session, all subsequent unlocked gym days in the week cascade forward one slot — the first upcoming gym day gets the second\'s type, the second gets the third\'s, and the last becomes REST — so the weekly training volume stays correct. Ride days are never moved. Log saving is now routed through _saveLog() which respects S.activeLogKey so extra gym sets are always persisted to the right key.'},
  {v:'2.19',d:'Fix consecutive ride days — short ride now avoids the day immediately before or after the long ride',det:'buildWeek picked the long ride day first (best weather) then picked the short ride day from the remaining candidates penalising only the day after LEGS. There was no penalty for placing the short ride adjacent to the long ride, so Mon long + Tue short (or similar back-to-back pairs) was common. Fixed by computing postLongIdx and preLongIdx after r1 is known, then applying -60 and -40 score penalties respectively when sorting short ride candidates. Day after long ride gets the strongest penalty (-60) since riding hard two days in a row is the worst case; day before gets a moderate penalty (-40). The penalties are soft (not hard exclusions) so in tight weeks with few available days the app can still place them adjacent rather than failing.'},
  {v:'2.18',d:'Fix ride title still showing "Short Ride"/"Long Ride" — title now shows actual session name (Sweet Spot, Tempo Intervals, etc)',det:'The WI label (wi.l) for ride types was still returning the generic "Short Ride"/"Long Ride" i18n string even after v2.17 made the description dynamic. Updated wi.l to also call getRideSession() so the week row title now shows the actual session name. Description updated to show duration + ride category (Zone 2 for long rides, Quality/Recovery for short rides) without redundantly repeating the name.'},
  {v:'2.17',d:'Fix ride plan showing wrong info — week view now shows actual session name and duration from the structured plan, not hardcoded "25–35 min · Zone 2"',det:'The WI (workout info) object had hardcoded descriptions for ride types ("25–35 min · Zone 2 · Outdoor", "60–90 min · Zone 2 · Outdoor") that bore no relation to the actual planned sessions. The real planner (getRideSession) builds structured workouts — Tempo Intervals (55 min), Sweet Spot (60 min), Hill Repeats (55 min), Recovery Spin (35 min), Endurance Ride (duration adapts based on setup + Strava adapt factor) — but this info never made it to the week view row or day screen hero. Fixed by making the WI descriptions dynamic functions that call getRideSession() so the week row now shows e.g. "Tempo Intervals · 55 min · Outdoor" instead of "25–35 min · Zone 2". Also added a Strava adaptation badge (Pacing up / Easing back) on the ride card when bike_adapt_factor is meaningfully away from 1.0, so users can see the plan is reacting to their Strava history.'},
  {v:'2.16',d:'3 new features: Assisted Pull-Up + Assisted Dip exercises, Weekly AI Review enabled (exercise type/sequence recs based on goal), End-of-week prompt to plan next week with AI weight/rep suggestions per exercise',det:'(1) Added Assisted Pull-Up and Assisted Dip to the exercise database as machine-based alternatives to Pull-Ups and Tricep Dips. Both are added to their respective SLOTS arrays so they surface as swap alternatives. (2) Enabled the Weekly AI Review feature (FEATURE_WEEKLY_REVIEW=true). The review prompt now includes user goal and fitness level, and adds a 5th SEQUENCE section with exercise type and sequencing advice. (3) After completing all exercises in your last gym session of the week, an end-of-week prompt appears asking if you want AI to plan next week. If confirmed, AI reviews your week\'s performance and generates next week\'s plan with per-exercise starting weight and rep suggestions. Suggestions are pre-filled in your workout logs for next week.'},
  {v:'2.15',d:'Fix login hanging in Safari — set Firebase auth persistence to LOCAL',det:'Safari\'s Intelligent Tracking Prevention (ITP) blocks the hidden cross-origin iframe that Firebase Auth uses to restore sessions and complete sign-in. This caused login to hang indefinitely in Safari while working fine in Chrome. Fixed by explicitly calling setPersistence(LOCAL) when Firebase initialises, which forces Firebase to use localStorage for auth state instead of the iframe/cookie mechanism. This is the standard fix for Firebase + Safari.'},
  {v:'2.14',d:'Sign-in field label changed to "Username"'},
  {v:'2.13',d:'Sign-up now uses username instead of email — simpler and no more derivation issues',det:'The sign-up form showed "Email" which caused users to enter their full email address (e.g. helenlenlau@gmail.com). The code then had to strip the domain and special characters to derive a username, which was confusing and error-prone. Changed sign-up to ask for a plain username (letters, numbers, _ only — no @ allowed). Sign-in still accepts username or email for existing users. Added validation: min 3 chars, no @ allowed on sign-up, clear hint text under the field.'},
  {v:'2.12',d:'Sign in / sign up no longer hang forever on bad connections',det:'Firebase auth calls (signInWithEmailAndPassword and createUserWithEmailAndPassword) had no timeout — on a slow or flaky connection they would spin on "..." indefinitely with no feedback. Added a 12-second timeout to both: if Firebase doesn\'t respond within 12s the user sees "Connection timed out — check your internet and try again." and the button re-enables so they can retry.'},
  {v:'2.11',d:'Fix 4 signup bugs: mangled username, orphaned accounts, missing rules guidance, login hang',det:'(1) Username was derived from the full email including domain — helenlenlau@gmail.com became "helenlenlaugmailcom". Fixed to extract only the local part before @, giving "helenlenlau". (2) Firebase rules for /usernames/ were missing entirely — added to docs and the rules block is now in the setup guide. (3) If auth account creation succeeded but the DB transaction failed (network drop etc), the auth account became orphaned — user gets email-already-in-use on retry with no recovery path. Improved the error message to explain the situation and guide toward password reset. (4) loadFromCloud() after signup had no timeout — could leave the user stuck on the loading button forever. Added an 8s timeout so the app always proceeds.'},
  {v:'2.10',d:'Fix account creation error: permission_denied when signing up',det:'Creating an account was failing with "permission_denied at /usernames/..." for new users. Root cause: the code was reading /usernames/ to check if the username was taken BEFORE creating the Firebase Auth account — so the user was unauthenticated and Firebase blocked the read. Fixed by creating the auth account first, then using a Firebase transaction to atomically claim the username while authenticated. The transaction aborts if the username is already taken, rolls back the auth account, and shows the "already taken" message. This also makes the username claim atomic, preventing two users from racing to claim the same username.'},
  {v:'2.09',d:'Swipe-back: eliminate lag — pre-build behind layer at touchstart, cache DOM refs',det:'The lag in v2.07/2.08 had two causes: (1) rWeek() + innerHTML was called on the first touchmove frame, causing a visible jank spike right as the drag started. Moved to touchstart so the DOM work is done before any finger movement. (2) The parallax behind element had transition:0.1s which fought against direct style updates every frame, making it sluggish. Removed the transition entirely — parallax is now a direct assignment each frame. (3) document.querySelector was being called on every touchmove event — replaced with cached sEl/behindEl references stored in the _sb state object. Behind layer now starts fully transparent (opacity:0) and fades in as you drag, which also looks better.'},
  {v:'2.08',d:'Swipe-back: fix workout page losing background + vertical scroll during drag',det:'Two bugs from v2.07: (1) The .screen element had no background colour set, so as it slid right the week view injected behind it was visible through the page — the workout appeared to lose its background. Fixed by adding background:var(--bg) to .screen. (2) The touchmove listener was passive:true so the browser could still scroll the page vertically while a horizontal drag was in progress. Fixed by attaching a non-passive touchmove listener (with preventDefault) only for the duration of an active horizontal tracking session — it is added when tracking starts and removed immediately on touchend/touchcancel/cancel, so scroll performance everywhere else is unaffected.'},
  {v:'2.07',d:'Swipe-back: week view now visible behind the workout page as you drag',det:'Previously the area behind the sliding workout page was black (just the app background). Now when you start swiping right, the week view is rendered behind the current screen immediately. As you drag, it scales up from 95% to 100% and fades from 70% to full opacity — the same parallax depth effect iOS uses. On release: if you commit, the behind element is removed and the week view appears; if you cancel, the behind element is removed and the workout page snaps back. No jank: the week HTML is generated once when tracking starts and reused for the entire gesture.'},
  {v:'2.06',d:'Swipe-back is now interactive — page follows your finger like Safari',det:'Rewrote the gesture from a trigger-and-animate model to a true finger-following model. The workout page now moves with your finger in real-time as you swipe right, with a growing left-edge shadow for depth. On release: if you committed (strong flick or past 40% screen width) the page slides off to the right and the week view appears; if you released early the page springs back to its original position. Vertical scroll intent is detected early and cancels the gesture immediately so scrolling in workouts still works. Activation thresholds are unchanged from v2.05.'},
  {v:'2.05',d:'Swipe-back activation toned down further',det:'Raised thresholds again: quick-flick now requires 80px travel (was 50px) at velocity >0.65 px/ms (was 0.5), and slow-drag requires 160px (~40% of screen width, was 120px). The gesture should now only fire on a clear, strong intentional swipe.'},
  {v:'2.04',d:'Swipe-back requires a more deliberate swipe to activate',det:'The gesture was firing too easily on accidental brushes. Raised the quick-flick threshold from 25px to 50px travel (and velocity from 0.4 to 0.5 px/ms), and the slow-drag threshold from 70px to 120px (~quarter of the screen width). You now need a clear intentional swipe to go back rather than a small nudge.'},
  {v:'2.03',d:'Fix wrong week on open, bottom nav bar out of place, and swipe-back too fast',det:'Three fixes: (1) On weekends, init() was advancing weekStart to next Monday — removed that logic so the app always opens on the current week. (2) The nav slide animations used will-change:transform,opacity which creates a CSS stacking context, causing position:fixed on the bottom nav bar to anchor to the .screen element instead of the viewport, making it appear in the wrong place after any navigation animation. Fixed by removing will-change from the animation CSS and adding an animationend listener to strip the animation class as soon as it finishes. Also removed dead sb-slide-off-right/sb-slide-in-from-left keyframes and .sb-animating-out/.sb-behind-anim classes left over from v2.00. (3) Nav transition duration increased from 300ms to 420ms and slide distance from 22% to 35% — the previous values made the transition barely perceptible; the new values match iOS native navigation feel.'},
  {v:'2.02',d:'Swipe-back diagnostic toast removed now that the gesture is confirmed working',det:'v2.01 added a green debug toast on every detected swipe to verify the gesture was firing. User confirmed the swipe + animation works end-to-end, so the toast is no longer needed. Removed in this version for a clean, silent gesture experience. The simplified animation approach (using the existing .nav-back slide-in keyframes that the back button also uses) is the keeper.'},
  {v:'2.01',d:'Swipe-back simplified to use the existing back-button animation + diagnostic toast to verify the gesture is even being detected',det:'After six failed attempts (v1.96 through v2.00) to get a two-screen swipe animation working on iPhone, ripped out all the custom code and made the swipe gesture do exactly the same thing as tapping the back button: render the week view with the existing .nav-back CSS slide-in animation (which already works — you can see it when you tap the back button). The trade-off: only the new screen animates in from the left, the workout page doesn\'t slide off to the right. But that is far better than zero animation. Also added a green debug toast on every detected swipe showing the measured dx and velocity, so we can confirm in your next test whether the gesture is firing at all — if you see the toast but no animation, the issue is somewhere in the rendering path; if you do not see the toast, the gesture detection itself is broken.'},
  {v:'2.00',d:'Swipe-back animation rewritten with CSS @keyframes — fixes the long-running issue where the workout page wasn\'t actually animating',det:'After three attempts to fix the swipe-back animation with CSS transitions (v1.96, v1.97, v1.99) the workout page was still not moving. Switched to CSS @keyframes which have explicit from/to states baked in — no inline transform timing tricks, no double-rAF dance, no transitionend race conditions. The outgoing screen gets a class with animation: sb-slide-off-right which animates from translate3d(0,0,0) to translate3d(100vw,0,0). The destination (week view) is layered behind with its own animation from translate3d(-100vw,0,0) to translate3d(0,0,0). Both slide a full screen width across (was only 25% before, which was too subtle to see clearly). Cleanup happens on the animationend event when the outgoing screen finishes, with a 500ms setTimeout safety net. Also bumped to v2.00 as a milestone — this should be the last gesture-related fix.'},
  {v:'1.99',d:'Swipe-back animation actually visible now — workout page slides off to the right instead of just teleporting away',det:'Diagnosed from the video: the wrap (week view behind) was animating correctly because its initial transform was set explicitly, but the workout page itself was not animating because I never set its initial transform, and browsers (especially iOS Safari) fail to animate a transform change when the previous value was the "none" keyword instead of an actual transform value. The result was: workout sits still for 300ms while the wrap silently slides in behind it (invisible because the workout was layered on top), then setTimeout fires and replaces the workout with the week view — looking like an instant teleport. Fixed by explicitly setting transform:translate3d(0,0,0) on the workout page before the transition, forcing a layout commit with getBoundingClientRect, using a double requestAnimationFrame to ensure the transition is registered before the transform changes, and switching from setTimeout-based cleanup to the transitionend event so cleanup happens after the animation actually finishes (with a setTimeout fallback in case transitionend never fires).'},
  {v:'1.98',d:'Swipe-back rewritten with velocity detection — no more finger-dragging, just flick right and the page slides off cleanly',det:'Watched a screen recording of v1.97 and saw the problem: the finger-follow approach made the gesture feel sluggish during slow swipes (the screen literally only moved as much as the user\'s finger did, which on a slow drag is barely any) and required a long deliberate drag to commit. Replaced the entire gesture with a velocity + distance trigger model: tracks finger velocity via an exponential moving average; once velocity exceeds 0.4 px/ms with at least 25px traveled (a quick flick) OR a slower drag passes 70px (deliberate), the back animation fires. The animation is now a clean 300ms slide-off — the workout page glides to the right with a drop shadow while the week view parallaxes in from the left. No more finger-dragging. This matches how React Native\'s default navigation handles back-swipe, not Safari\'s exact gesture, but feels far more responsive on iPhone. Layout commit is forced with offsetWidth + the transform change is deferred via requestAnimationFrame so the transition always actually plays.'},
  {v:'1.97',d:'Swipe-back fix: slow swipes no longer get stuck mid-screen — release now always smoothly commits or snaps back',det:'In v1.96 a slow swipe would visually move the workout page with your finger but then "stick" at the release point without animating to commit or snap-back. Root cause: when transition was set to "none" during the drag, then both transition and transform were changed in the same synchronous block at touchend, the browser would skip the animation and either jump instantly to the end state or appear frozen. Fixed by separating the transition change from the transform change with requestAnimationFrame and a forced layout commit (offsetWidth read) in between — the browser registers the new transition value before the transform changes, so the animation actually plays. Also: activation threshold dropped from 12px to 8px (more responsive feedback), commit threshold dropped from 35% to 30% of screen width (easier to complete), commit duration scales with drag distance so a near-full swipe finishes faster than a partial one.'},
  {v:'1.96',d:'Safari-style interactive swipe-back — current page follows your finger, week view peeks in from the left with parallax + drop shadow',det:'The previous version just played a slide-in animation after a swipe completed, which is why it still felt jumpy. This release rewrites the gesture as a real interactive drag: when you start swiping right inside a workout, the week view is pre-rendered behind the current page, then both pages move together while your finger is on the screen. The current page tracks 1:1 with your finger and has a soft drop shadow on its left edge; the week view behind it parallax-scrolls in from -25% to 0% as you drag, matching iOS Safari\'s native behavior. Release past 35% of the screen width commits the navigation (smooth 280ms ease-out completion); release before that snaps both pages back to their starting positions. The previous slide-in animation is suppressed during a completed swipe (via a new _noAnim option on go()) so you don\'t see two animations stacked. Activation only fires after 12px of clear horizontal motion, so vertical scrolling through long workouts doesn\'t accidentally trigger it.'},
  {v:'1.95',d:'Smooth iOS-style slide transitions on navigation — back-and-forward now actually feels like a real app',det:'Previously every screen change was an instant innerHTML swap with zero animation, which felt jarring even when the data was right. Added two CSS keyframe animations on the .screen container: nav-fwd slides in from the right when you drill into a workout from the week view, nav-back slides in from the left when you swipe right or tap the back button. 300ms with an iOS-style ease curve (cubic-bezier(.32,.72,0,1)). The go() function now accepts a _dir option that applies the matching class to the freshly rendered screen. All back buttons (← Week, ← Back) and the swipe-right gesture pass _dir:back; tapping into a day passes _dir:fwd. Also added a window.scrollTo(0,0) on every navigation so the new screen always opens at the top instead of inheriting the previous screen\'s scroll position. Respects prefers-reduced-motion for accessibility.'},
  {v:'1.94',d:'Swipe-right to go back (matches iOS convention) — previously had the direction inverted',det:'Earlier versions implemented swipe LEFT to go back based on a wording miscommunication. iOS uses swipe RIGHT as its universal back gesture (Safari, Mail, Messages, every native and web app). Flipped the detection: a clear swipe to the right inside a workout now navigates back to the week view. Threshold widened slightly to 60px of vertical tolerance now that we are matching user muscle memory.'},
  {v:'1.93',d:'Sticky back button in workouts — the back arrow now stays pinned to the top of the screen as you scroll through exercises',det:'The v1.92 debug toast revealed why swipe-left was never triggering: real "swipes" on a scrollable workout list end up dominated by vertical motion (dy ~240px vs dx ~50px). Tuning thresholds wasn\'t going to fix that — the only reliable solution is a back button that\'s always visible. The day header (← Week  ·  Sat 23  ·  Swap ↕) is now sticky-positioned with a translucent backdrop blur, so it follows the page as you scroll. The swipe-left gesture still exists as a power-user shortcut, but it now requires a very horizontal swipe (90px+ left, <50px of vertical drift, completed in <600ms). Debug toast removed.'},
  {v:'1.92',d:'Swipe-back diagnostic build — added pointer-event fallback, broadened thresholds, and a temporary debug toast that shows the measured swipe values on every touch',det:'The swipe-left-to-go-back gesture still wasn\'t triggering on iPhone after the screen-name fix in v1.91. This release attaches the listener to window (not document) and adds a parallel pointer-event listener as a fallback path in case iOS isn\'t bubbling touch events the way we expected. Distance threshold lowered to 60px, time window widened to 800ms, horizontal-vs-vertical ratio relaxed to 1.2:1. Debug toast is temporarily enabled so any swipe with dx or dy >25px shows the actual measured values — green if it would have triggered back navigation, gray if it didn\'t. Use this to tell us whether the gesture is being detected at all, and if so what the measurements look like. Will remove the debug toast in 1.93 once we know what\'s happening.'},
  {v:'1.91',d:'Bulletproof cross-device sync, swipe-left to leave a workout, tap-to-sync on Account, and a stack of plan/advisor fixes',det:'Sync now actually works on every app open — a long-standing bug meant returning users never re-pulled from Firebase because S.authed was set early by init() before the auth listener fired. Added a four-layer auto-sync system: instant Firebase listener while active, foreground refresh when the PWA wakes from background, 60-second polling safety net, and an online-event trigger when the network reconnects. The Account section now folds the sync status, last-pulled timestamp, and error display into one block — tap the green card to manually push+pull on demand. Removed the redundant JSON backup/import (cloud sync replaces them; import was actually dangerous because it could overwrite synced data) and the dead "Feedback & Wishlist coming soon" section. Inside a workout, swiping left anywhere on the page now navigates back to the week view — the screen identifier was "day" not "log" so the original gesture never fired. Other fixes shipped this round: regenerate plan now locks any day with completed sets (was relying solely on per-set done flags and could overwrite logged workouts); filterSlot now prefers gym exercises and only falls back to bodyweight when no gym option exists (was mixing push-ups into your GoodLife Push days); weekly advisor now sends planned exercises for upcoming sessions plus the best set from history, with rules to suggest +2.5 of weight or +1 rep targets across every upcoming exercise; exercise-swap now pushes to Firebase (was localStorage-only); subtle "Synced 2m ago" indicator on the Week view footer.'},
  {v:'1.90',d:'Cycling preference tabs moved to My Training — week view decluttered, Regenerate shortcut added to header',det:'The three cycling mode buttons (Outdoor + Gym / Indoor + Gym / Gym only) have been moved from the week view into a new Training Plan section on the My Training tab. They were only useful once at initial setup and were cluttering the week screen on every visit. A 🔄 icon in the week-nav header now lets you regenerate the current plan without scrolling. The week view empty state is simplified — it just shows a Generate button and points to My Training to change the cycling preference.'},
  {v:'1.89',d:'Advisor exercise swap suggestions — AI recommends specific exercise changes, wired directly into your workout',det:'The Weekly Advisor now outputs a SWAPS section alongside TARGETS. When the AI spots stalled progress on an exercise (3+ sessions with no weight or rep improvement), a missing movement pattern for your goal, or a clearly better alternative for your level — it flags it with a specific swap: e.g. "Switch Lying Leg Curl → Nordic Curl — better eccentric hamstring load". That suggestion appears as an amber badge inside the exercise card when you open it in your workout. One tap on Swap → applies it immediately to your session and plan, exactly like the existing machine-busy swap. The sequencing research (NSCA compound-before-isolation guidelines, agonist-antagonist pairing for Upper Pump) is also documented inline in the slot templates.'},
  {v:'1.88',d:'Exercise sequencing overhaul — proper movement order and slot logic for all workout types',det:'Four fixes to how sessions are built. (1) PUSH: shoulder compound (OHP/DB press) was sitting in slot 3, after chest accessories — it now comes immediately after flat bench as slot 2, which is the standard push protocol. (2) PULL: had two separate bicep slots meaning every pull session forced two bicep exercises. Merged into one slot — biceps already get significant work from all the rows. (3) LEGS: BSS, lunges, and step-ups (heavy unilateral compound movements) were in slot 3 alongside leg press and leg extension. Moved all unilateral compounds to slot 1/3 properly — slot 3 is now secondary compound and machine work, slot 4 is pure isolation. (4) Sort bug: the exercise variety sort had ai-bi inverted — it was silently picking the MOST recently used exercise each time instead of the least recently used. Fixed to bi-ai so the app correctly rotates exercises across sessions.'},
