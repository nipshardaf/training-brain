  {v:'1.87',d:'Fix advisor cross-device trigger + merge AI usage counts across devices',det:'Two sync fixes. (1) The advisor was saving to its own Firebase path but never updating the users/{uid}/updated timestamp, so the cross-device listener on other devices never fired. Fixed by re-adding a saveToCloud() call after advisor generates (updates the timestamp), and extending the sync listener to also pull the current week advisor from Firebase when it wakes up. (2) AI usage log was never synced — each device had its own count. Added ai_usage to the sync bundle, and changed loadFromCloud to merge the calls arrays by timestamp union rather than blindly overwriting — so both devices end up with the combined total.'},
  {v:'1.86',d:'Weekly Advisor cross-device sync — fix Firebase array conversion + dedicated storage path',det:'v1.85 had two silent bugs. (1) The PC PWA was cached on v1.84 when the fix shipped, so weekly_advisor_* keys were never included in the Firebase save. (2) Firebase Realtime Database converts JavaScript arrays to objects with numeric keys on round-trip — so even if the data synced, the targets array came back as {"0":{...}} instead of [{...}], breaking the target lookup silently. Fixed by: storing the advisor result directly at users/{uid}/advisor/{weekKey} as a JSON string (strings round-trip perfectly through Firebase), checking that path first on any device before hitting the API, and falling back to the AI only when Firebase has nothing. This means generate-once-use-everywhere with no wasted API calls.'},
  {v:'1.85',d:'Weekly Advisor syncs to Firebase — generate once, available on all your devices',det:'The weekly advisor result (including Smart Targets) was previously stored only in localStorage, meaning each device had to make its own API call. Now weekly_advisor_* keys are included in the Firebase sync bundle. As soon as the advisor generates on any device, it saves to the cloud and your other devices pick it up automatically via the existing cross-device listener — no extra API calls needed.'},
  {v:'1.84',d:'Smart Targets — Weekly Advisor now sets exercise targets that appear in your workout log',det:'The Weekly Advisor now outputs a structured TARGETS block alongside its text advice. When you open an exercise that has a specific target this week (e.g. "Lying Leg Curl at 130lbs × 12"), a green 🎯 badge appears in the exercise body showing exactly what to aim for. When you complete all sets on that exercise, the app checks your best set against the target: hit it and you get a "Target achieved!" toast; close but not quite gets an encouraging nudge. Targets are extracted by the AI from the FOCUS section using the exact exercise names in your training data, so they only appear for exercises the AI actually mentioned.'},
  {v:'1.83',d:'Handle Gemini 503 overload — better error messages for all AI failure types',det:'Gemini occasionally returns 503 (temporarily overloaded) in addition to 429 (quota) and 403 (auth). The Cloudflare Worker now falls through to the next provider on 503 as well. The app now distinguishes three error states: quota exhausted (no retry, reset at midnight), overloaded (retry shown, "usually clears in a minute"), and connection blip (retry shown). Previously 503 looked the same as a connection blip with no explanation.'},
  {v:'1.82',d:'Weekly Advisor: workout names now human-readable instead of raw code',det:'The AI was receiving internal type constants like UPPER_PUMP, PUSH, PULL, LONG_OUTDOOR in the prompt and echoing them back verbatim in the advice. Added a type label map so the AI always receives plain English names — "Upper Body (Full Upper)", "Push (Chest/Shoulders/Triceps)", "Long Outdoor Ride" etc. Both the training history and the upcoming schedule sections of the prompt are now translated.'},
  {v:'1.81',d:'Body stats added to profile — weight, height, age fed to AI coach',det:'Added weight, height, and age fields to the profile setup (step 3 — Last few details). Both weight and height have kg/lb and cm/ft unit toggles. A privacy notice explains the data is stored privately in your account and never shared with friends or used outside your own training coach. All three values are now passed to the Weekly Advisor and Gym Coach AI prompts so the AI can calibrate intensity, suggest appropriate loading, and factor in body composition when giving advice (e.g. strength-to-body-weight ratios, appropriate cardio intensity for weight loss goals).'},
  {v:'1.80',d:'Friends — connect with friends and see each other\'s weekly training',det:'Added a full friends system. Each user gets a unique 6-character friend code (e.g. A3K9P2) generated at login. Share your code — your friend enters it to send a request. You get a red badge on the Settings tab when a request comes in. Accept or decline inline. Once connected, you see each other\'s Strava-style weekly card: a 7-dot Mon–Sun activity strip, session counts (gym + rides), total km, and week streak. No weights or PRs are shared — just the summary. Week summary is written to Firebase on every save so friends always see current data. Friend codes are stored in a reverse-lookup table so there\'s no searching the user database.'},
  {v:'1.79',d:'Rest days no longer show "How are you feeling?"',det:'The energy selector (Fresh / Okay / Tired / Sore) is only relevant before a training session. On REST & MOBILITY days it served no purpose and added noise. It is now hidden on rest days — only shown on gym and ride days where the coach uses it to adjust your session targets.'},
  {v:'1.78',d:'Auth: fix half-stuck accounts + smarter error messages',det:'Fixed a scenario where a user (e.g. on a restricted network) could start creating an account, have the network drop mid-way, and then be permanently stuck — unable to create (email already in use) or sign in (unknown password). Now: auth/email-already-in-use shows inline "Sign in instead" and "Reset your password" action buttons. Wrong-password errors on sign-in now show an inline "Forgot password?" link. Added the modern auth/invalid-login-credentials error code to the map (Firebase changed this code and it was falling through to a raw ugly error message). Added auth/network-request-failed with a clear connection error message.'},
  {v:'1.77',d:'Weekly Advisor: smarter context for new users + better PR labels',det:'Two improvements to the Weekly Advisor. (1) The advisor now counts how many weeks of gym history exist in the app and passes that context to the AI — on week 1 it explicitly tells the AI these are baseline measurements, not progressions, so it stops saying "excellent progression" when everything is a first-time entry. (2) PR labels in the training data sent to the AI now distinguish between [baseline — first logged], [NEW PR], and [below PR: X×Y] so the AI has real signal about whether a number is a first-time baseline, a genuine new personal record, or a below-best session.'},
  {v:'1.76',d:'Code cleanup — quota-error helper, stale-flag fix',det:'Internal code review cleanup. (1) The 429/403 quota-error check was copy-pasted in 4 places — now a single isQuotaErr() helper. (2) Fixed a bug where the "AI quota used up" note could linger all session: the _aiQuotaHit flag now clears automatically as soon as any AI call succeeds again. (3) Removed redundant comments.'},
  {v:'1.75',d:'AI Usage dashboard in Settings — see calls today, this week, by type, and quota bar',det:'Added a full AI usage tracker. Every Gemini call (Gym Coach, Ride Coach, Weekly Advisor, Weekly Review) is logged to localStorage with timestamp and success/fail status. The Settings tab now shows: Today / This week / All time counts, a daily quota progress bar vs the ~1500/day free tier limit, a 7-day bar chart, a breakdown by feature type, and the last call time. A Clear button resets the log. Quota warning appears when >85% of daily limit is used.'},
  {v:'1.74',d:'AI quota awareness — clear messages when daily limit is hit',det:'When Gemini\'s free-tier daily quota is exhausted (403/429), the app now shows a specific message: "Daily AI quota is used up — resets at midnight Pacific time" instead of a generic error. The Weekly Advisor hides the retry button (no point retrying until quota resets). The AI Coach shows a small note below the default tip. A global _aiQuotaHit flag is set by any AI call so all components respond consistently.'},
  {v:'1.73',d:'Cross-device sync — plan and log data now syncs live between your phone and PC',det:'Added a Firebase real-time listener that watches for changes from other devices. When you log a session or generate a plan on your phone, your PC picks it up automatically (and vice versa) without needing to reload the app. Uses the existing Firebase Realtime Database — no new setup required. A "Synced from another device" toast appears when remote data is pulled in.'},
  {v:'1.72',d:'Weekly Advisor: fix silent API errors + human-friendly messages',det:'Two improvements to the Weekly Advisor. (1) API errors were being swallowed and mis-reported as "not enough data" — now errors propagate correctly so the right message is shown. (2) All advisor states now use plain human language: connection failures say "might just be a blip", genuinely empty data shows a first-week welcome, and the idle state is shorter and friendlier.'},
  {v:'1.71',d:'Fix: duplicate Monday row; Weekly Advisor shows error state instead of silent failure',det:'Two fixes. (1) A bug could produce duplicate day entries in the plan (two Monday rows). Now deduplicated at render time so only the first entry per date is shown. (2) The Weekly Advisor "Analyse" button was failing silently — if the API returned no data or errored, the card just stayed empty with no feedback. Now shows a specific error message ("not enough data" vs "connection failed") with a retry button, and a success toast when the analysis completes.'},
  {v:'1.70',d:'Weekly Advisor added — AI analysis of your training with weekly focus points',det:'A new 🧠 Weekly Advisor card now appears on the week plan screen. Tap "Analyse my training" and Gemini reviews the last 2 weeks of your actual logged data — gym sets/weights/reps per exercise, Strava rides with HR and power — and returns 4 specific points: Training Load (volume assessment), Trend (what the numbers show — flagging fatigue, progression, plateaus by name), Focus (specific targets for this week), and Recovery (readiness note). Cached per week so it does not re-fetch on every render. Refresh button available to re-run the analysis.'},
  {v:'1.69',d:'Weather refresh preserves exercises; AI Coach uses real training data',det:'Two major upgrades. (1) "Refresh with new weather" now only reschedules which days are rides, gym, or rest — it no longer regenerates exercise selections if the session type is unchanged. Your workout content survives a weather refresh. (2) AI Coach is now data-driven: ride days get coaching based on your last 8 Strava rides (HR, watts, distance trends) with specific targets; gym days now show 4-week set/rep trends per exercise so the coach can flag fatigue (dropped reps), plateaus, or PR opportunities with exact numbers.'},
  {v:'1.68',d:'Plan now uses your goal and Strava rides to decide how many ride days to schedule',det:'Previously the planner always assigned exactly 2 ride days regardless of what you already rode or what your goal is. Now: (1) Your profile goal drives the ride quota — endurance/performance goals get more ride days, muscle goals get mostly gym, fitness goals get a balanced split. (2) Strava rides already done this week count toward that quota first — if you rode Monday and Thursday and your target is 2 rides, no more rides are added to the remaining days.'},
  {v:'1.67',d:'Past weeks with no plan now auto-show recorded Strava rides and gym sessions',det:'Navigating to a previous week that had no generated plan used to show the empty "Ready to generate" screen even if you had Strava rides or logged gym sessions that week. Now the app scans strava_activities and gym log keys for that date range and renders whatever was recorded automatically — no generate needed. A "Generate plan for this week" button still appears below.'},
  {v:'1.66',d:'Strava history extended to 6 months; history panel extended to 180 days',det:'Strava sync was only fetching 8 weeks of rides with a 100-activity cap. Bumped to 180 days and per_page=200 (Strava API max) so older rides appear in workout history. The workout history panel in My Training was also extended from 90 to 180 days to match.'},
  {v:'1.65',d:'Strava ride name always shown on plan day rows, not just on unplanned days',det:'When a Strava ride was recorded on a planned ride day (Long Ride, Short Ride), the plan row kept showing the generic plan name instead of the actual Strava activity name. Fixed — the Strava ride name and stats now always take priority over the planned label.'},
  {v:'1.64',d:'Service worker cache busted; EMountainBikeRide added to ride type filter',det:'The service worker was serving a stale cached index.html so recent fixes (v1.62/1.63 Strava plan row changes) were not reaching users. Bumped cache to tb-v3 to force a fresh load. Also added EMountainBikeRide and EBikeSport to the Strava ride type filter so e-bike rides are always captured on sync.'},
  {v:'1.63',d:'Strava days labelled "Logged · Strava" on the week plan',det:'Any day with a Strava ride now shows an orange "🟠 Logged · Strava" badge on the plan row, making it immediately clear which days were recorded via Strava.'},
  {v:'1.62',d:'Strava rides now show on plan day rows; unplanned rides override rest/gym label',det:'When a Strava ride is recorded on any day — including rest days or gym days — the week plan now replaces that day\'s label with the ride name, distance, and duration, and marks it with an orange Strava badge. Rides on planned rest days (like an unplanned Monday ride) are fully surfaced in the plan view.'},
  {v:'1.61',d:'Past days are now greyed out in the week view',det:'Days before today now appear at reduced opacity, matching the same faded treatment used for completed days. Today stays full brightness with the purple border and upcoming days remain fully visible.'},
  {v:'1.60',d:'Strava rides now appear in workout history',det:'Strava activities were stored in strava_activities but never shown in the My Training history tab. The history scan now includes rides from the past 90 days alongside gym sessions, sorted newest-first. Each ride shows the activity name, distance, duration, heart rate, watts, and elevation gain with an orange Strava badge.'},
  {v:'1.59',d:'Plan order fixed; Strava rides now lock completed days on refresh',det:'Two fixes. (1) The lock logic that preserves completed days on refresh was keyed by array position, not by date — so a previously corrupted plan (with wrong order) would scramble the new plan. It is now keyed by date string so position never matters. The day list is also sorted by date at render time as a final safety net. (2) Completed Strava rides now lock ride days the same way completed gym sessions lock gym days — refreshing the plan will no longer overwrite a day you already rode.'},
  {v:'1.58',d:'"Sync now" button added to ride card; Garmin ride types now recognised',det:'When Strava is connected but no activity has synced for a ride day yet, the ride log card now shows a "🟠 Sync now · Synced Xm ago" button so you can trigger a fresh Strava fetch without leaving the day screen. Also widened the ride type filter to include GravelRide, MountainBikeRide, EBikeRide and sport_type variants — Garmin can produce any of these and they were previously ignored.'},
  {v:'1.57',d:'Fix: "Refresh with new weather" now always fetches fresh data and never drops days',det:'Two fixes. (1) Clicking "Refresh with new weather" was still returning a stale cached result if you had refreshed in the last 3 hours — including bad cached results from before the v1.56 fix. The explicit refresh button now always bypasses the weather cache and forces a fresh API call. (2) buildWeek now has a safety net: if the weather array arrives with fewer than 7 days for any reason, it pads the missing days from the existing plan or a neutral placeholder, so a partial result can never produce a short week.'},
  {v:'1.56',d:'Fix: refreshing plan mid-week no longer drops past days from the week view',det:'When you refreshed the plan on Wednesday, Monday and Tuesday disappeared. Root cause: the Open-Meteo weather API only returns forecast data from today onwards — so looking up Monday on a Wednesday returned nothing, and the plan was built starting from Wednesday. Fixed by building all 7 days from the Monday start date individually, falling back to the existing plan\'s weather data for any past day (or a neutral placeholder if there is no prior data). Refreshing on any day of the week now always produces a complete Mon–Sun week.'},
  {v:'1.55',d:'Bodyweight exercise images: 14 of 18 now show real demos instead of placeholders',det:'Added a second image source (wger.de) for exercises missing from the free-exercise-db. Push-Up, Diamond Push-Up, Inverted Row, Donkey Kick now pull from wger.de. Bicycle Crunch and Floor Leg Raise have 2-frame animations. Combined with the 8 already fixed in v1.54, 14 of the 18 bodyweight exercises now show real images. The remaining 4 (Pike Push-Up, Wall Sit, Side Plank, Burpee) have no suitable image in either database and show styled muscle-group placeholders. The image loader now supports both free-exercise-db folder paths and direct wger.de URLs.'},
  {v:'1.54',d:'"At home today" moved to each workout day — now per-day, instant, no regenerate needed',det:'"Training from home this week?" has been redesigned. Instead of a week-wide toggle on the Plan tab that required a separate Regenerate tap, there is now a compact "Training at home today?" row on each individual gym day screen. Tap it and the exercises switch to bodyweight immediately — no second step. Tap it again to switch back to gym exercises. It only affects that one day. Also fixed: 8 of the 18 bodyweight exercises now show real demo images (Decline Push-Up, Superman, Bodyweight Squat, Jump Squat, Bodyweight Lunge, Single-Leg Glute Bridge, Mountain Climber, Crunch) — the remaining 10 show styled muscle-group placeholders since those specific movements are not in the exercise image database.'},
  {v:'1.53',d:'Settings Account section layout fixes — no empty space, clearer button labels',det:'"Sign out" no longer sits in a half-empty two-column row. "Backup (.json)" renamed to "Download backup" — the .json detail was meaningless to most people.'},
  {v:'1.52',d:'iPhone home screen icon updated to the current app logo',det:'The apple-touch-icon (the icon shown when you add Training Brain to your iPhone home screen) was still the original placeholder. It now uses the same logo shown inside the app. To see the update: remove the existing home screen shortcut and re-add it via Safari → Share → Add to Home Screen.'},
  {v:'1.51',d:'Backup status now lives inside the Account card in Settings',det:'The backup status row (green dot, "Backed up X ago", "Back up now") is now grouped inside the Account card under Settings → Account & Backup, separated by a subtle divider below the signed-in name. It was previously floating as a standalone bar at the top of Settings. This keeps all account and backup actions in one place.'},
  {v:'1.49',d:'Plan mode labels clarified — Outdoor + Gym, Indoor + Gym, Gym only',det:'The three plan modes have been renamed to be self-explanatory. "Use weather" is now "Outdoor + Gym" — it schedules outdoor cardio on the best weather days and gym on the rest. "Indoor only" is now "Indoor + Gym" — trainer or Zwift sessions indoors plus gym, weather ignored. "No biking" / "Gym only" keeps the same meaning but is now clearly labelled everywhere: the plan tab selector, the generate/regenerate buttons, the empty state, and the ride preference section in Settings. All three labels are consistent across every part of the app.'},
  {v:'1.48',d:'Goals and settings no longer re-ask after sign-in — login now syncs both ways',det:'Every sign-in (Google, username/password, PIN unlock, and iOS PWA auto-restore) now runs a load-then-push cycle: it pulls the latest data from Firebase first, then immediately pushes any local data that Firebase is missing back up. This fixes the root cause of goals, activities, and Strava reappearing after reinstall or signing in on a new device — the profile was stored locally but never made it to Firebase because the sync only ran on explicit data changes. Now the first login after any gap automatically closes that gap.'},
  {v:'1.47',d:'Bodyweight exercises added; "Home week" toggle skips the gym without changing your profile',det:'18 new bodyweight exercises added across all session types: push-ups (standard, decline, diamond), pike push-up, inverted row, superman, bodyweight squat, jump squat, bodyweight lunge, single-leg glute bridge, donkey kick, wall sit, mountain climber, bicycle crunch, side plank, floor leg raise, crunch, and burpee. Each has full coaching cues and Traditional Chinese translation. Every slot in every workout type now includes bodyweight alternatives — when gym equipment is unavailable (e.g. home gym profile), the app automatically falls back to bodyweight versions without you having to do anything. The new "Training from home this week?" toggle on the Plan tab forces bodyweight-only session generation for that week only, without permanently changing your gym profile — tap it again or shift to a different week to turn it off. A purple "Home week" badge appears on each gym-day screen so you know the mode is active.'},
  {v:'1.46',d:'"Gym only" replaces "No biking"; plan now respects your training-days-per-week setting',det:'The third plan mode was renamed from "No biking" to "Gym only" — a much clearer description of what it actually does. More importantly, the weekly plan generator now honours the training-days-per-week setting from your profile (3–6 days). Previously every mode hard-coded 6 active days regardless of what you set. Now: Gym only = your chosen number of gym days, worst-weather days become rest. With rides = 2 ride days + (target days − 2) gym days + rest. For example, a 4-day user on "Use weather" gets 2 rides + 2 gym + 3 rest instead of 2 rides + 4 gym + 1 rest. The "Gym only" option also now appears in the Ride preference section of Settings so you can switch without going back to the Plan tab. Cycling-specific options (Use weather / Indoor only) are hidden on the Plan tab for users who have no cycling activity selected.'},
  {v:'1.45',d:'Goals, Strava and bike plan now survive reinstalls and sign-outs',det:'Profile data (goals, activities, training days, experience level) and the Strava token were never included in the Firebase sync — so reinstalling the app or signing out and back in cleared them, causing the goals onboarding sheet to reappear and Strava to disconnect. All of this data is now included in saveToCloud. The goals and bike plan setup sheets also now push to Firebase immediately on save, so the data is backed up the moment you tap Save rather than waiting for the next log entry.'},
  {v:'1.44',d:'Friendlier ride-log message — explains Strava syncs on its own and may just need time',det:'The hint on the manual ride log was reworded. The old wording ("Strava has no ride logged for today") sounded like the ride would never sync. It now makes clear that a connected Strava ride syncs in automatically once Strava finishes processing it — so you can skip the form — and that manual entry is there if you want it tracked right away. For users without Strava, the message is more encouraging about logging to keep progress moving.'},
  {v:'1.43',d:'Ride logging is now inline on the ride card (no pop-up); Weekly Review set to "coming soon"',det:'The manual ride log no longer opens a separate screen. The duration, distance, average heart rate, perceived effort and notes fields now sit directly on the ride card and save as you type — with a short note explaining that rides sync automatically once Strava is connected. The Weekly Review email setup in Settings is temporarily shown as "coming soon" while the email backend is being finished; it will be switched back on alongside the Feedback feature.'},
  {v:'1.42',d:'Import now accepts CSV files — restore workouts, rides and PRs from a CSV export',det:'The Restore button previously only accepted the JSON backup. It now also reads the CSV produced by Export CSV: it parses workout sets, rides and personal records back into the app, matching exercise names in English or Chinese. CSV import merges into your existing data rather than wiping it, and preserves any fields the CSV does not carry. Rows whose exercise name is not recognised are skipped and reported. The JSON backup is still the recommended full backup (it also carries your plan and settings); CSV import is handy for restoring training records specifically.'},
  {v:'1.41',d:'Performance — weather cached, AI coach recovers from failures, exercise images cached offline',det:'Three optimisations. (1) The AI coach previously marked its daily batch as "done" before the network call returned — so a single failed request disabled AI coaching for the rest of the day. It now only marks the batch done after a successful response, with an in-memory guard against duplicate concurrent calls. (2) Weather is cached for 3 hours per week and location, so regenerating your plan no longer re-hits the weather API every time. (3) The service worker now caches exercise demo images from the free-exercise-db CDN — they load instantly on repeat views and work fully offline (previously cross-origin "opaque" responses were skipped by the cache).'},
  {v:'1.40',d:'CSV export, manual ride logging fix, cleaner language labels, and a Feedback section preview',det:'Export data now offers a readable CSV (open it in Excel or Sheets to see every workout set, ride and PR as a plain table) alongside the existing JSON backup used for restore. Manual ride logging now appears on any ride day that Strava did not auto-capture — previously it was hidden entirely whenever a Strava account was connected, so connected users could not log a ride Strava missed. The language switcher no longer shows the stray "GB" / "HK" letters (unsupported flag emoji) before English / 繁體中文. A Feedback & Wishlist section was added to Settings as a coming-soon preview.'},
  {v:'1.39',d:'Chinese translation expanded — all 61 exercise names, form cues, coach messages, and the workout day screen',det:'All 61 exercises now show proper Traditional Chinese names (硬舉, 深蹲, 臥推, 引體向上, etc.) everywhere they appear — day screen, log, history, PRs and swap sheets. The 💡 form-cue tip on every exercise card is now translated. The "Coach says" pre-workout messages are fully translated for every energy level. The workout day screen UI is now translated too: the Exercises heading, Animate / Tutorial / collapse buttons, Busy? and Log sets buttons, set/rep badges, the back and swap buttons, and the log-workout button.'},
  {v:'1.38',d:'Fixed the Swap Workout sheet showing raw code instead of workout names',det:'After workout labels were made translatable (lazy functions), the "Change workout for this day" sheet was still rendering them directly — so it showed text like ()=>_T(\'wt_push\') instead of "Push". The swap sheet now calls the label and description functions correctly, matching every other screen.'},
  {v:'1.37',d:'Chinese language polish — history screen translated, overcrowding fixes, layout class added',det:'The Workout History screen is now fully translated (Completed, exercise/set counts, set rows). Added a lang-zh class on the page root when Traditional Chinese is active, with CSS rules that slightly reduce font sizes, allow exercise card titles to wrap to two lines instead of truncating, tighten button padding, and shrink the bottom-nav labels so nothing overflows. The My Training tab label was shortened to 訓練. Language preference now syncs to the cloud, so it restores correctly after signing in on a new device. Exercise-name and coach-message translation are still to come.'},
  {v:'1.36',d:'Weekly AI Review added — a Sunday training analysis covering 8 weeks of data',det:'Every Sunday a card appears on the Plan tab offering a weekly review. Tapping Generate sends your last 8 weeks of gym sessions, ride data (Strava or manually logged), all-time PRs and the current plan to the AI coach. It returns four sections: an honest performance summary, progressive overload targets for next week, recovery flags, and one focus goal. The result is cached per week and synced to the cloud, so reopening the app the same Sunday never re-calls the API. An optional "Email me this summary" button delivers it via EmailJS once you add your email and EmailJS keys in Settings. Fully bilingual.'},
  {v:'1.35',d:'Strava sync now pulls 8 weeks of ride history (was 30 days) to power the upcoming weekly AI review',det:'The Strava activity sync window was extended from 30 to 56 days, and the page size raised to 100 activities, so the app always holds a full 8 weeks of ride data — distance, duration, average heart rate and average power are all included in each activity. This history feeds the weekly AI review. Existing behaviour (per-day ride matching, plan auto-adapt) is unaffected; it simply has more data to work with.'},
  {v:'1.34',d:'Manual ride logging added for cyclists who haven\'t connected Strava',det:'On any ride day, users without a Strava connection now see a "Log this ride" button. Tapping it opens a form to record duration, distance, average heart rate, perceived effort (RPE) and free-text notes. Logged rides are saved alongside gym sessions, sync to the cloud automatically, and display in a summary card that can be edited later. This ride data also feeds the upcoming weekly AI review. Strava-connected users are unaffected — their rides still pull in automatically. Fully bilingual (English / 繁體中文).'},
  {v:'1.33',d:'Custom PNG icons replace emoji throughout the app — workout types, nav tabs, activities, logo',det:'All major emoji icons replaced with purpose-built PNG graphics: each gym workout type (Push/Pull/Legs/Upper Pump) has its own icon, cycling and ride days use a proper bicycle image, rest days show the mobility graphic, activity chips in Settings use the corresponding sport icons, and nav tabs use the branded icon set. The app logo symbol appears in the lock screen and screen headers. Emoji fallbacks activate automatically if an icon fails to load, so the app always looks correct even offline.'},
  {v:'1.32',d:'New users now see a 3-step welcome guide on the Plan tab instead of a blank "no plan" state',det:'When someone opens the app for the first time without a profile, the Plan tab now shows a friendly welcome screen with three numbered steps: set up your profile, generate your first plan, and start training. Step 1 is highlighted with a call-to-action button; steps 2 and 3 are greyed out until reached. Once a profile exists, the tab shows the standard "Ready to generate your plan" state with the preference tabs and Generate button.'},
  {v:'1.31',d:'Exercise "Coach" button renamed to "Tips" — more accurate label for hardcoded guidance',det:'The Coach button on each exercise opened a hardcoded tips panel with connection cues, setup notes, rep execution and what to avoid — not live AI coaching. Renamed to Tips with a 💡 icon to set the right expectation. The AI Coach section at the top of each workout day is the actual real-time coaching.'},
  {v:'1.30',d:'Traditional Chinese language support added — switch between English and 繁體中文 in Settings',det:'Added a full translations system with English and Traditional Chinese. Tap Settings → Language to switch. Translated: navigation tabs, screen subtitles, all section headers, workout type names, day names, energy selector, activity names, and key toasts. The language preference is saved locally and applied instantly on switch.'},
  {v:'1.29',d:'Sign-up hardened — orphaned accounts prevented, password length validated before attempting',det:'Fixed a gap where Firebase Auth could create an account but the database write immediately after could fail, leaving a user permanently locked out. Now if the database registration fails after auth creation, the auth account is automatically deleted so the user can try again cleanly. Also added an early password length check (minimum 6 chars) before any network call is made.'},
  {v:'1.28',d:'Active activity chips now have a − button to remove instantly; "Change my activities" button removed',det:'Each active activity chip (Cycling, Gym & Weights, etc.) now has a red − button on the right to remove it directly. The redundant "Change my activities" button is gone — add and remove are now handled entirely from the chips. The "Set up activities" button only appears when you have no activities at all.'},
  {v:'1.27',d:'Every changelog entry now has expandable detail explaining the logic and reasoning behind the change',det:'Tap any version row in What\'s New to expand a longer explanation of why the change was made, how the logic works, and any relevant context. Useful for understanding what the app actually does under the hood or checking if a specific behaviour was intentional.'},
  {v:'1.26',d:'Tapping + Add on an activity now adds it instantly — no more going through the full setup screen',det:'Each activity chip has its own + Add button. Tapping it immediately writes that activity into your profile and confirms with a green toast. Previously all chips opened the full goals setup screen, which was unnecessary when you just wanted to add one thing. The ⓘ button still opens the info popup independently.'},
  {v:'1.25',d:'Skipping a gym day automatically shifts the rest of the week — no prompts, no dropped muscle groups',det:'When you swap a gym day to Rest, the app finds all remaining gym days that week and cascades the missed workout type through them in order — Push moves to the next gym slot, that slot\'s type moves to the one after it, and so on. Cycling, running, cardio, and rest days are completely ignored by the cascade; only Push/Pull/Legs/Upper Pump sessions shift.'},
  {v:'1.23',d:'Activity chips now show an ⓘ info button explaining what each activity covers; renamed to Cardio & Classes',det:'Added a small ⓘ button to the right of every activity chip (both active and the dashed + Add ones). Tapping it opens a sheet describing what that activity covers in the app and what syncs automatically. Also renamed the fourth activity from "Other Cardio" to "Cardio & Classes" to better reflect that it covers HIIT, rowing, elliptical, stair master, swimming, group fitness and similar.'},
  {v:'1.22',d:'Smarter swap rebalancing — skipping a workout now offered to replace an upcoming session',det:'Intermediate version before the full auto-cascade in v1.25. When skipping a gym day, the app offered two options: move the workout to a free rest day, or replace a different upcoming gym session with the missed type. This was replaced in v1.25 with fully automatic cascading.'},
  {v:'1.21',d:'Your Activities card moved to My Training tab — activities and goals now live together',det:'The Your Activities card was previously in Settings. Moved it to the My Training tab so all your training setup — goals, activities, PRs — lives in one place. Settings is now purely about configuration (AI coach, gym, Strava, account).'},
  {v:'1.20',d:'Progress and Settings split into separate tabs — cleaner navigation',det:'The old Progress tab was getting crowded — it had PRs, history, goals, AND settings all mixed in. Split into My Training (PRs, history, goals, activities) and Settings (AI coach, gym profile, Strava, account, What\'s New). The bottom nav now has three tabs: Plan, My Training, Settings.'},
  {v:'1.19',d:'App loads faster — service worker caching for instant return visits, Firebase scripts deferred',det:'Added a service worker (sw.js) that caches the app shell on first visit. Every return visit loads instantly from cache and updates in the background. Also moved Firebase scripts to deferred loading so they don\'t block the initial render — Firebase only initialises after the page is ready.'},
  {v:'1.18',d:'Strava auto-syncs on app open if last sync was over 1 hour ago — no manual tap needed',det:'On every app open, checks the timestamp of the last Strava sync. If it was more than 60 minutes ago and you have a valid Strava token, a background sync runs automatically. Ride data is always fresh without you having to remember to tap Sync.'},
  {v:'1.17',d:'Edit PR sheet spacing fixed — better padding and breathing room around inputs',det:'The edit PR bottom sheet had inputs sitting too close to the card edges. Fixed padding on all sides so the sheet is comfortable to use on small screens.'},
  {v:'1.16',d:'Rest day swap now offers to move the workout to another rest day to keep your weekly goal on track',det:'Early version of the rebalancing logic. When swapping a workout to rest, the app checked for other rest days in the same week and offered to slot the workout there. Evolved into the full cascade in v1.22 and v1.25.'},
  {v:'1.15',d:'Goals are now multi-select; biological sex question added to onboarding; skip option on every step',det:'Previously you could only pick one goal (e.g. Build muscle OR Lose weight). Now you can select multiple. Biological sex was added so the app can tailor coaching — only Male and Female options. Every onboarding step now has a Skip option so you\'re never forced to answer before you\'re ready.'},
  {v:'1.14',d:'Strava connect now shows a success toast with ride count; error toast if connection fails',det:'After Strava OAuth completes, the app now shows a green toast confirming how many rides were synced, or a red toast with the error message if something went wrong. Previously there was no feedback at all.'},
  {v:'1.13',d:'Goals onboarding — set your activities and goal; non-cyclists no longer get bike days in their plan',det:'Added the goals setup flow: pick your activities, training days per week, experience level, and goals. The weekly plan generator now checks your selected activities — if cycling isn\'t in your list, no ride days appear in your plan.'},
  {v:'1.12',d:'Coach Says fetches all 4 mood notes in one API call — switching energy is now instant with zero extra calls',det:'Previously each energy level tap (Fresh/Okay/Tired/Sore) triggered a new API call. Now the app fetches all four mood variants in a single call on page load and caches them. Switching how you feel is instant and uses no extra quota.'},
  {v:'1.11',d:'Coach Says skips the API entirely for new users with no training data — shows a personalised explainer instead',det:'New users with no logged workouts got a generic or broken AI response. Now the app detects no training history and shows a built-in welcome message instead of wasting an API call.'},
  {v:'1.10',d:'Exercise Coach tips hardcoded for all 61 exercises — instant, works offline, zero API usage',det:'Exercise-specific coaching tips (connection cue, setup, rep execution, what to avoid, today\'s focus) are now baked into the app for all 61 exercises. No API call needed — tips appear instantly and work with no internet.'},
  {v:'1.9', d:'AI fallback chain added — Gemini → Perplexity → OpenAI so coaching never goes down when quota is hit',det:'The Cloudflare Worker now tries three AI providers in order: Gemini 2.5 Flash first, then Perplexity Sonar if Gemini hits its quota (429), then GPT-4o-mini if Perplexity also fails. All responses are normalised to the same format so the app never knows which provider responded.'},
  {v:'1.8', d:'Login fixed to support real Gmail addresses; Forgot Password button added',det:'Firebase email auth was rejecting some valid Gmail addresses due to a validation bug. Fixed. Also added a Forgot Password button that triggers Firebase\'s password reset email flow.'},
  {v:'1.7', d:'Edit PR modal overhauled — live lb↔kg conversion, current PR shown, better layout',det:'The edit PR sheet now shows your current PR value at the top, supports live unit conversion as you type (switch between kg and lb), and has a cleaner layout with proper spacing.'},
  {v:'1.6', d:'iOS PWA: install to home screen, correct app icon, social share preview image added',det:'Added the apple-touch-icon so the correct icon appears when you add the app to your iPhone home screen. Also added Open Graph meta tags so sharing the link shows a proper preview image instead of a blank card.'},
  {v:'1.5', d:'Exercise Coach overhauled — 5-section muscle-activation guide: Connect, Setup, Rep, Avoid, Today',det:'Replaced the single-paragraph coach tip with a structured 5-section breakdown for every exercise: muscle connection cue, setup position, rep execution, common mistakes to avoid, and a session-specific focus based on your energy level and PRs.'},
  {v:'1.4', d:'Coach Says introduced — AI pre-workout note personalised to energy level and PR history via Gemini',det:'Added the Coach Says card on the workout day screen. It sends your energy level, current PRs, and workout type to Gemini and returns a short personalised coaching note. Cached per session so it doesn\'t re-fetch on every render.'},
  {v:'1.3', d:'Energy selector (Fresh / Okay / Tired / Sore) added — exercises and coach adapt to how you feel',det:'Added a 4-state energy selector at the top of each workout day. The AI coach adjusts its tone and advice based on your selection. Tired/Sore states also show a reduced-intensity note on the session.'},
  {v:'1.2', d:'Strava integration — sync real ride data, gym profile picker, bike setup wizard',det:'Full Strava OAuth flow via Cloudflare Worker (keeps client secret off the device). Syncs recent rides and displays them in the plan. Added a gym picker with live search across a database of gyms, home gym equipment list, and a bike setup wizard with event target date and peak/taper periodisation.'},
  {v:'1.1', d:'Cycling planner added — weather-based outdoor/indoor day selection, Zone 2 ride blocks',det:'Added cycling days to the weekly plan. The app fetches weather for your location and recommends outdoor vs indoor based on temperature and rain. Ride sessions are Zone 2 blocks with progressive duration scaling across the week.'},
  {v:'1.0', d:'Exercise cards with GIF animations, collapse/expand, and muscle group banners added',det:'Added animated GIF demos to every exercise card. Cards collapse by default to keep the session view clean and expand on tap. Muscle group colour banners (Push/Pull/Legs) added to each session header.'},
  {v:'0.9', d:'Google Sign-In via Firebase replaced GitHub Gist sync — no setup required, works across devices',det:'Replaced the original GitHub Gist sync (which required a personal access token) with Firebase Auth + Realtime Database. Sign in with Google in one tap, data syncs automatically across all your devices.'},
  {v:'0.8', d:'Guest preview mode added — try the app without signing up, with sample data throughout',det:'Added a guest mode that pre-loads sample PRs, a sample weekly plan, and lets you explore all features without creating an account. Guest mode never makes API calls and never writes to the database.'},
  {v:'0.7', d:'PIN lock screen added — app locks on close, auto-unlocks on PWA open if no PIN is set',det:'Added an optional 4-digit PIN that locks the app when you close it. If no PIN is set, the app opens straight to the plan. PIN is stored locally and never sent to any server.'},
  {v:'0.6', d:'kg / lb toggle added — switch units in the log modal, all weights convert automatically',det:'Added a unit toggle in the set logging modal. Switching between kg and lb converts all displayed weights in real time. Preference is saved and applied globally across PRs and logging.'},
  {v:'0.5', d:'Workout history added — last 90 days of sessions; export and import backup for your data',det:'Added a workout history view showing the last 90 days of logged sessions with exercise count and sets. Also added export (downloads a JSON backup) and import (restores from a JSON file) for full data portability.'},
  {v:'0.4', d:'Per-exercise swap added — change any exercise mid-workout when machines are busy',det:'Added a Swap button on every exercise card during a session. Tapping it shows alternative exercises for the same muscle slot — so if the bench press is taken you can switch to dumbbell press without leaving the workout.'},
  {v:'0.3', d:'Inline set logging added — track weight × reps for every set with a done checkbox',det:'Added set-by-set logging directly on the exercise cards. Each set has weight, reps, and a done checkbox. Completed sets are highlighted and counted. Data saves automatically to localStorage and Firebase on each tap.'},
  {v:'0.2', d:'Change Workout button added to day screen — swap to a different workout type on the fly',det:'Added the Swap button to the day view. Lets you switch the day\'s workout type (e.g. Push → Pull) without going back to the weekly plan. The session regenerates immediately with the new type.'},
  {v:'0.1', d:'Initial build — weather-driven weekly planner, Push / Pull / Legs splits, exercise library, and PR tracking',det:'First working version. Weekly plan generated based on number of training days. Push/Pull/Legs splits with a fixed exercise library. Weather fetched from Open-Meteo and used to pick outdoor vs indoor days. PR tracking with localStorage persistence.'},
];

function trackAICall(type,ok){
  if(ok)_aiQuotaHit=false; // clear stale quota flag once a call succeeds again
  const today=fd(new Date());
  const usage=DB.get('ai_usage',{calls:[]})||{calls:[]};
  usage.calls.push({type,ts:Date.now(),date:today,ok:!!ok});
  const cutoff=fd(addDays(new Date(),-30));
  usage.calls=usage.calls.filter(c=>c.date>=cutoff);
  DB.set('ai_usage',usage);
}
function getAIUsageStats(){
  const usage=DB.get('ai_usage',{calls:[]})||{calls:[]};
  const calls=usage.calls||[];
  const today=fd(new Date());
  const weekStart=fd(getMon(new Date()));
  const todayCalls=calls.filter(c=>c.date===today);
  const weekCalls=calls.filter(c=>c.date>=weekStart);
  const byType={};
  calls.forEach(c=>{byType[c.type]=(byType[c.type]||0)+1;});
  const failed=calls.filter(c=>!c.ok).length;
  const last=calls.length?calls[calls.length-1]:null;
  const days=[];
  for(let i=6;i>=0;i--){const d=fd(addDays(new Date(),-i));days.push({d,n:calls.filter(c=>c.date===d).length});}
  return{total:calls.length,todayCount:todayCalls.length,todayFailed:todayCalls.filter(c=>!c.ok).length,weekCount:weekCalls.length,byType,failed,last,days};
}

async function getAICoach(energy,ct,dp){
  // Guests get hardcoded responses — no API keys wasted
  if(S.guest)return coachMsg(energy,ct);

  const date=dp?.date||'';
  const cacheKey='coach_'+energy+'_'+date;
  // Return from cache if already fetched
  if(_coachCache[cacheKey])return _coachCache[cacheKey];
  const stored=DB.get(cacheKey,null);
  if(stored){_coachCache[cacheKey]=stored;return stored;}

  // Check if we already fetched all 4 moods today (avoid duplicate batch call)
  const batchKey='coach_batch_'+date+'_'+(dp?.type||ct);
  if(DB.get(batchKey,false))return coachMsg(energy,ct);
  if(_coachInFlight[batchKey])return coachMsg(energy,ct);

  // Build rich context — skip API entirely if no meaningful data
  const prs=DB.get('prs',{});
  const u=unit();
  let hasPRs=0,hasHistory=0;
  const exLines=(dp?.exercises||[]).map(id=>{
    const ex=EX[id];if(!ex)return null;
    const pr=prs[id];
    const lastSets=getLastLog(id);
    let line=ex.n;
    if(pr){
      hasPRs++;
      line+=` (PR: ${pr.w}${u}×${pr.r}`;
      if(lastSets){
        const done=lastSets.filter(s=>s.done&&s.w);
        if(done.length){
          hasHistory++;
          const avgW=Math.round(done.reduce((a,s)=>a+(parseFloat(s.w)||0),0)/done.length);
          const avgR=Math.round(done.reduce((a,s)=>a+(parseInt(s.r)||0),0)/done.length);
          const pct=pr.w>0?Math.round(avgW/pr.w*100):0;
          line+=`, last session: ${avgW}${u}×${avgR} avg — ${done.length}/${lastSets.length} sets done${pct<85?' ⚠️ below PR pace':''}`;
        }
      }
      line+=')';
    }
    return line;
  }).filter(Boolean);

  const isRideDay=['LONG_OUTDOOR','SHORT_OUTDOOR','LONG_INDOOR','SHORT_INDOOR'].includes(dp?.type||ct);

  // For ride days: build coaching from Strava history instead of gym PRs
  if(isRideDay){
    const _rSet=new Set(['Ride','VirtualRide','EBikeRide','EBikeSport','EMountainBikeRide','GravelRide','MountainBikeRide','Handcycle','Velomobile']);
    const recentRides=(DB.get('strava_activities',[])||[])
      .filter(a=>_rSet.has(a.type)||_rSet.has(a.sport_type))
      .sort((a,b)=>new Date(b.start_date_local)-new Date(a.start_date_local))
      .slice(0,8);
    if(!recentRides.length){
      return coachMsg(energy,ct);
    }
    const rideLines=recentRides.map(a=>{
      const ds=(a.start_date_local||'').slice(0,10);
      const dur=Math.round((a.moving_time||0)/60);
      const dist=+((a.distance||0)/1000).toFixed(1);
      const hr=a.average_heartrate?Math.round(a.average_heartrate):null;
      const watts=a.average_watts?Math.round(a.average_watts):null;
      const elev=a.total_elevation_gain?Math.round(a.total_elevation_gain):null;
      return `${ds}: ${dist}km ${dur}min${hr?' HR '+hr+'bpm':''}${watts?' '+watts+'W':''}${elev?' ↗'+elev+'m':''}`;
    });
    const profile2=DB.get('user_profile',null);
    const _gm2={muscle:'build muscle',lose_weight:'lose weight',fitness:'general fitness',endurance:'endurance/event prep',performance:'sport performance'};
    const _g2=(profile2?.goals||[profile2?.goal]||[]).filter(Boolean);
    const gd2=_g2.map(g=>_gm2[g]||g).join(' + ')||'general fitness';
    const isLong=(dp?.type||ct).includes('LONG');
    const ridePrompt=`You are a cycling coach. Write 4 pre-ride coaching notes for today's ${isLong?'long':'short'} ride. Each note is 2 sentences max — specific, data-driven, actionable. Reference actual numbers from the athlete's ride history.

Athlete goal: ${gd2}
Recent rides (newest first):
${rideLines.join('\n')}

Write exactly 4 notes labelled:
FRESH: [push harder — specific HR/power/distance target based on their data]
OKAY: [steady session — what numbers to aim for]
TIRED: [easier session — what to back off on, specific targets]
SORE: [active recovery ride — specific reduced targets]`;
    // Not worth calling AI without real data already checked above
    _coachInFlight[batchKey]=true;
    try{
      const r2=await fetch(GEMINI_PROXY,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({contents:[{parts:[{text:ridePrompt}]}],generationConfig:{maxOutputTokens:300,temperature:0.7,thinkingConfig:{thinkingBudget:0}}})});
      const raw2=await r2.text();
      trackAICall('coach_ride',r2.ok);
      if(!r2.ok)throw new Error('API '+r2.status);
      const data2=JSON.parse(raw2);
      const text2=data2.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
      if(text2){
        const moods2=['FRESH','OKAY','TIRED','SORE'];
        moods2.forEach(m=>{
          const rx=new RegExp(m+':\\s*(.+?)(?=(?:FRESH|OKAY|TIRED|SORE):|$)','si');
          const match=text2.match(rx);
          if(match){
            const k='coach_'+m.toLowerCase()+'_'+date;
            const val=match[1].trim();
            DB.set(k,val);_coachCache[k]=val;
          }
        });
        DB.set(batchKey,true);
      }
    }catch(e){console.warn('Ride coach failed:',e);if(isQuotaErr(e.message))_aiQuotaHit=true;}
    _coachInFlight[batchKey]=false;
    return DB.get(cacheKey,null)||coachMsg(energy,ct);
  }

  // Not worth calling AI if user has no real gym data yet
  if(hasPRs===0&&hasHistory===0){
    DB.set(batchKey,false);
    return coachMsg(energy,ct);
  }

  let weekSessions=0;
  for(let i=0;i<7;i++){const d=addDays(S.weekStart,i);const l=DB.get(DB.lk(d),null);if(l?.exercises?.some(e=>e.sets.some(s=>s.done)))weekSessions++;}
  let lastDone='unknown';
  for(let i=1;i<=30;i++){
    const d=addDays(new Date(),-i);
    const pk2=DB.pk(getMon(d));
    const pl=DB.get(pk2,null);
    const dd=pl?.find(x=>x.date===fd(d)&&x.type===dp?.type);
    if(dd&&DB.get(DB.lk(d),null)?.exercises?.some(e=>e.sets.some(s=>s.done))){lastDone=i===1?'yesterday':`${i} days ago`;break;}
  }

  const profile=DB.get('user_profile',null);
  const _goalMap={muscle:'build muscle and strength',lose_weight:'lose weight and recomp',fitness:'general fitness',endurance:'endurance and event prep',performance:'sport performance'};
  const _goals=profile?.goals?.length?profile.goals:(profile?.goal?[profile.goal]:[]);
  const goalDesc=_goals.length?_goals.map(g=>_goalMap[g]||g).join(' + '):'general fitness';
  const genderNote=profile?.gender?`- Sex: ${profile.gender}`:'';
  const levelNote=profile?.level?`- Experience: ${profile.level}`:'- Experience: intermediate';
  const bodyNote=(()=>{const p=[];if(profile?.weight&&profile?.weightUnit)p.push(`Weight: ${profile.weight}${profile.weightUnit}`);if(profile?.height&&profile?.heightUnit)p.push(`Height: ${profile.height}${profile.heightUnit}`);if(profile?.age)p.push(`Age: ${profile.age}`);return p.length?'- '+p.join(', '):''})();

  // Build richer gym history: last 4 weeks of sets per exercise to spot trends
  const trendLines=(dp?.exercises||[]).map(id=>{
    const ex=EX[id];if(!ex)return null;
    const sessions=[];
    for(let i=1;i<=28;i++){
      const d=addDays(new Date(),-i);
      const l=DB.get(DB.lk(d),null);
      if(!l?.exercises)continue;
      const le=l.exercises.find(e=>e.id===id);
      if(!le)continue;
      const done=le.sets.filter(s=>s.done&&s.w&&s.r);
      if(!done.length)continue;
      const avgW=Math.round(done.reduce((a,s)=>a+(parseFloat(s.w)||0),0)/done.length*10)/10;
      const avgR=Math.round(done.reduce((a,s)=>a+(parseInt(s.r)||0),0)/done.length);
      sessions.push(`${fd(d)}: ${avgW}${unit()}×${avgR} (${done.length} sets)`);
      if(sessions.length>=3)break;
    }
    const pr=DB.get('prs',{})[id];
    let line=`${ex.n}`;
    if(pr)line+=` | PR: ${pr.w}${unit()}×${pr.r}`;
    if(sessions.length)line+=` | Recent: ${sessions.join(', ')}`;
    return line;
  }).filter(Boolean);

  const prompt=`You are a no-nonsense strength coach. Write 4 pre-workout coaching notes for today's ${dp?.type||ct} session. Each note is 2 sentences — specific, data-driven. Look at the trend data: if reps dropped at the same weight, flag possible fatigue. If the athlete is close to a PR, push them. Reference exercise names and actual numbers.

Athlete:
- Goal: ${goalDesc}
${levelNote}
${genderNote}
${bodyNote}
- Sessions this week: ${weekSessions}
- Last ${dp?.type||ct}: ${lastDone}
- Exercise history (PR + last 3 sessions):
${trendLines.map(l=>'  '+l).join('\n')}

Write exactly 4 notes:
FRESH: [push hard — specific target e.g. "add 2.5kg to Bench, aim for 8 clean reps"]
OKAY: [hit your numbers — specific consistent targets]
TIRED: [what to cut — specific weights/sets to reduce based on the data]
SORE: [recovery focus — what to skip or go light on]`;

  _coachInFlight[batchKey]=true;
  try{
    const r=await fetch(GEMINI_PROXY,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:300,temperature:0.75,thinkingConfig:{thinkingBudget:0}}})
    });

    if(text){
      // Parse all 4 moods from one response
      const moods=['FRESH','OKAY','TIRED','SORE'];
      moods.forEach((m,i)=>{
        const next=moods[i+1];
        const re=new RegExp(m+':\\s*([\\s\\S]*?)(?='+( next?next+':':'$')+')','i');
        const match=text.match(re);
        if(match){

      DB.set(batchKey,true); // mark the batch done only after a successful fetch — a failed call retries
      return _coachCache[cacheKey]||coachMsg(energy,ct);
    }
  }catch(e){console.warn('AI coach failed:',e);if(isQuotaErr(e.message))_aiQuotaHit=true;}
  finally{delete _coachInFlight[batchKey];}
  return coachMsg(energy,ct);
}

      const c=parsed[d.k];if(!c)return'';
      return`<div style="background:${d.bg};border-left:3px solid ${d.col};border-radius:0 12px 12px 0;padding:12px 14px;margin-bottom:10px">
  <div style="font-size:10px;font-weight:900;color:${d.col};text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px">${d.icon} ${d.label}</div>
  <div style="font-size:14px;line-height:1.65;color:var(--txt)">${c}</div>
</div>`;
    }).join('');
    const el=document.getElementById('ex-coach-body');
    if(el)el.innerHTML=html||`<p style="font-size:14px;color:var(--t2);line-height:1.7">${text.replace(/\n/g,'<br>')}</p>`;
  }

  // Use hardcoded tips instantly — no API needed
  if(EX_COACH_TIPS[id]){
    const t=EX_COACH_TIPS[id];
    const today=calcToday(id,prs,energy,u);
    renderSections(`CONNECT: ${t.CONNECT}\nSETUP: ${t.SETUP}\nREP: ${t.REP}\nAVOID: ${t.AVOID}\nTODAY: ${today}`);
    return;
  }

  if(_exCoachCache[cacheKey]){renderSections(_exCoachCache[cacheKey]);return;}
  const lsCached=DB.get(cacheKey);
  if(lsCached){_exCoachCache[cacheKey]=lsCached;renderSections(lsCached);return;}

  try{
    const prompt=`You are an expert strength coach giving a focused 1-on-1 coaching session.

Exercise: ${ex.n}
Target muscles: ${ex.m}
User energy today: ${energyLabel}
${prTxt}

Write a coaching guide using EXACTLY these 5 labelled sections on separate lines:

CONNECT: How to mentally connect with and feel ${ex.m} working during this lift — one specific visualisation or sensation cue.
SETUP: Two specific body-positioning cues that maximise the stretch and tension on ${ex.m} before the first rep.
REP: How to execute the eccentric (lowering) and concentric (lifting) to maximise ${ex.m} stimulus — include one tempo or pause tip.
AVOID: The single most common error that shifts stress off ${ex.m} on ${ex.n}, and the one-sentence fix.
TODAY: A specific weight × reps recommendation for their next working set based on their PR and energy level. If no PR, suggest a starting approach.

Rules: 1–2 sentences per section. Under 200 words total. Be precise and direct — no filler phrases.`;

    const r=await fetch(GEMINI_PROXY,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:420,temperature:0.7,thinkingConfig:{thinkingBudget:0}}})});
    if(!r.ok)throw new Error('API '+r.status);
    const data=await r.json();
    const msg=data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
    if(msg){_exCoachCache[cacheKey]=msg;DB.set(cacheKey,msg);renderSections(msg);}
  }catch(e){
    const el=document.getElementById('ex-coach-body');
    const cue=EX_CUES[id]||'Focus on full range of motion and controlled tempo.';
    if(el)el.innerHTML=`<div style="background:var(--s2);border-radius:12px;padding:14px;font-size:14px;color:var(--t2);line-height:1.7"><em>${cue}</em></div>`;
  }
}

          <button onclick="selHeightUnit='ft';gsRender()" style="border:none;padding:0 8px;font-size:11px;font-weight:700;cursor:pointer;background:${selHeightUnit==='ft'?'var(--acc)':'transparent'};color:${selHeightUnit==='ft'?'#fff':'var(--t2)'}">ft</button>
        </div>
      </div>

  </div>
  <div style="margin-bottom:22px">
    <div style="font-size:11px;font-weight:700;color:var(--t2);margin-bottom:5px">Age</div>
    <input id="gs-age" type="number" min="13" max="100" placeholder="—" value="${selAge}" oninput="selAge=this.value" style="width:80px;background:var(--s2);border:1px solid var(--bord);border-radius:11px;color:var(--txt);font-size:15px;font-weight:700;padding:10px 12px;outline:none">
  </div>

  <div style="display:flex;gap:8px">
    <button onclick="gsBack()" style="flex:1;background:var(--s2);border:1px solid var(--bord);border-radius:13px;color:var(--t2);font-size:15px;font-weight:800;padding:15px;cursor:pointer">← Back</button>
    <button onclick="gsSave()" style="flex:2;background:var(--acc);border:none;border-radius:13px;color:#fff;font-size:15px;font-weight:800;padding:15px;cursor:pointer">${isEdit?'Save changes':'Let\'s go 🚀'}</button>
  </div>
  ${skipRow}
  `:''}
</div>`;

    window.gsGoal=v=>{selGoals.has(v)?selGoals.delete(v):selGoals.add(v);gsRender();};
    window.gsTogglePriority=()=>{selEqualPriority=!selEqualPriority;gsRender();};
    window.gsMoveGoal=(g,dir)=>{
      const arr=[...selGoals];
      const i=arr.indexOf(g);
      const j=i+dir;
      if(i<0||j<0||j>=arr.length)return;
      [arr[i],arr[j]]=[arr[j],arr[i]];
      selGoals=new Set(arr);
      gsRender();
    };
    window.gsAct=v=>{selActs.has(v)?selActs.delete(v):selActs.add(v);gsRender();};
    window.gsDays=n=>{selDays=n;gsRender();};
    window.gsLevel=v=>{selLevel=v;gsRender();};
    window.gsGender=v=>{selGender=selGender===v?null:v;gsRender();};
    // Capture body stat inputs before re-render wipes them
    function gsCaptureStats(){
      const w=document.getElementById('gs-weight');const h=document.getElementById('gs-height');const a=document.getElementById('gs-age');
      if(w)selWeight=w.value;if(h)selHeight=h.value;if(a)selAge=a.value;
    }
    const _origGsRender=gsRender;
    // Patch unit toggles to capture inputs first
    const _origNext=window.gsNext;window.gsNext=()=>{gsCaptureStats();step++;gsRender();};
    window.gsBack=()=>{gsCaptureStats();step--;gsRender();};
    window.gsSkipAll=gsSkipAll;
    window.gsNext=()=>{step++;gsRender();};
    window.gsBack=()=>{step--;gsRender();};
    window.gsSave=()=>{
      gsCaptureStats();
      const goals_arr=[...selGoals];
      const profile={
        goals:goals_arr,goal:goals_arr[0]||null,
        activities:[...selActs],days:selDays,level:selLevel,
        gender:selGender,onboarded:true,
        weight:selWeight?parseFloat(selWeight):null,weightUnit:selWeightUnit,
        height:selHeight?parseFloat(selHeight):null,heightUnit:selHeightUnit,
        age:selAge?parseInt(selAge):null
      };
      DB.set('user_profile',profile);
      if(!selActs.has('cycling'))DB.set('bike_pref','none');
      else if(DB.get('bike_pref','none')==='none')DB.set('bike_pref','weather');
      syncUp();
      sheet.remove();
      render();
      if(!isEdit)setTimeout(()=>showToast('🚀 Plan ready! Tap Plan to see your week','var(--grn)'),300);
    };
  }
  gsRender();
  document.body.appendChild(sheet);
}

/* ── STRAVA INTEGRATION ── */
function stravaConnect(){
  const url=`https://www.strava.com/oauth/authorize?client_id=${STRAVA_CLIENT_ID}&redirect_uri=${encodeURIComponent(STRAVA_REDIRECT)}&response_type=code&scope=activity:read_all&approval_prompt=auto`;
  window.location.href=url;
}

async function stravaExchangeCode(code){
  try{
    const r=await fetch(GEMINI_PROXY+'/strava/token',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({grant_type:'authorization_code',code})
    });
    if(!r.ok)throw new Error('exchange '+r.status);
    const data=await r.json();
    if(!data.access_token)throw new Error('no token');
    DB.set('strava_token',{
      access:data.access_token,refresh:data.refresh_token,
      expires:data.expires_at,
      athlete:{name:data.athlete?.firstname,id:data.athlete?.id}
    });
    // Clean the ?code= from the URL
    window.history.replaceState({},'',window.location.pathname);
    await stravaFetchActivities();
    const rides=DB.get('strava_activities',[]);
    const name=data.athlete?.firstname?` — hey ${data.athlete.firstname}!`:'';
    showToast(`✅ Strava connected${name} ${rides.length} ride${rides.length!==1?'s':''} synced`,'var(--grn)');
  }catch(e){
    console.warn('Strava exchange failed:',e);
    showToast('⚠️ Strava connection failed — try again','var(--red)');
  }
}

async function _stravaAccessToken(){
  const tok=DB.get('strava_token',null);
  if(!tok)return null;
  // Refresh if expiring within 5 minutes
  if(Date.now()/1000<tok.expires-300)return tok.access;
  try{
    const r=await fetch(GEMINI_PROXY+'/strava/token',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({grant_type:'refresh_token',refresh_token:tok.refresh})
    });
    if(!r.ok)throw new Error('refresh '+r.status);
    const data=await r.json();
    DB.set('strava_token',{...tok,access:data.access_token,refresh:data.refresh_token,expires:data.expires_at});
    return data.access_token;
  }catch(e){console.warn('Strava refresh failed:',e);return tok.access;}
}

// Pulls athlete-level data (FTP, weight) from Strava. Strava is source of truth UNLESS
// the user has manually overridden either value (ftp_source/weight_source === 'manual'),
// in which case the manual value is preserved.
async function stravaFetchAthlete(){
  const token=await _stravaAccessToken();
  if(!token)return;
  try{
    const r=await fetch('https://www.strava.com/api/v3/athlete',{headers:{Authorization:'Bearer '+token}});
    if(!r.ok)return;
    const a=await r.json();
    const profile=DB.get('user_profile',{})||{};
    let changed=false;
    if(a.ftp&&a.ftp>0&&profile.ftp_source!=='manual'){
      if(profile.ftp!==a.ftp){profile.ftp=a.ftp;profile.ftp_source='strava';changed=true;}
    }
    if(a.weight&&a.weight>0&&profile.weight_source!=='manual'){
      const w=+a.weight.toFixed(1);
      if(profile.weight!==w){
        profile.weight=w;profile.weight_source='strava';changed=true;
        // Seed weight history with today's value if not already logged today
        const log=DB.get('weight_log',{})||{};
        const todayKey=fd(new Date());
        if(!log[todayKey]){log[todayKey]=w;DB.set('weight_log',log);}
      }
    }
    if(changed)DB.set('user_profile',profile);
  }catch(e){console.warn('Strava athlete fetch failed:',e);}
}

// W/kg category label using Coggan/Allen FTP categories from "Training and
// Racing with a Power Meter". Male standard; female bands run ~0.5 W/kg lower
// per tier. The Coggan chart has 8 tiers — consolidated to 5 for display.
function _wkgLabel(wpkg,gender){
  const female=gender==='female';
  if(female){
    if(wpkg<1.5)return'Untrained';
    if(wpkg<2.0)return'Beginner';
    if(wpkg<2.7)return'Recreational';
    if(wpkg<3.5)return'Trained';
    if(wpkg<4.5)return'Strong';
    if(wpkg<5.0)return'Cat 1';
    return'Elite / Pro';
  }
  if(wpkg<2.0)return'Untrained';
  if(wpkg<2.5)return'Beginner';
  if(wpkg<3.2)return'Recreational';
  if(wpkg<4.0)return'Trained';
  if(wpkg<5.0)return'Strong';
  if(wpkg<5.5)return'Cat 1';
  return'Elite / Pro';
}

// Estimates FTP from ride NP/duration data using Coggan's intensity model:
//   30-45 min rides: NP × 0.88   (NP for short hard efforts > FTP)
//   45-75 min: NP × 0.95         (~ Coggan's "best 20-min × 0.95" but extended)
//   75-120 min: NP × 1.00        (~ 1hr sustained ≈ FTP by definition)
//   120+ min: NP × 1.05          (long ride NP runs slightly below FTP)
// Takes the top-10% of per-ride estimates and averages them — robust against
// outliers, captures genuine hard efforts. Returns null if not enough data.
function _estimateFtpFromRides(rides){
  const d=_ftpEstimateDetail(rides);
  return d?d.ftp:null;
}

// Same algorithm as above but returns the contributing rides too — used by the
// FTP estimate sheet so the user can SEE which rides drove the number (and
// notice if their hardest effort is missing because it had no power data).
function _ftpEstimateDetail(rides){
  if(!rides||rides.length<3)return null;
  const eligible=rides
    .filter(a=>a.weighted_average_watts&&a.moving_time>=30*60)
    .map(a=>{
      const min=a.moving_time/60;
      const f=min<45?0.88:min<75?0.95:min<120?1.0:1.05;
      return{
        date:(a.start_date_local||'').slice(0,10),
        name:a.name||'',
        mins:Math.round(min),
        np:Math.round(a.weighted_average_watts),
        factor:f,
        est:Math.round(a.weighted_average_watts*f)
      };
    });
  if(eligible.length<3)return null;
  eligible.sort((a,b)=>b.est-a.est);
  const topN=Math.max(1,Math.ceil(eligible.length*0.1));
  const top=eligible.slice(0,topN);
  const avg=top.reduce((s,v)=>s+v.est,0)/top.length;
  const ftp=Math.round(avg/5)*5;
  // How many rides total has power data, and how many don't (so we can flag missing data)
  const withoutPower=rides.filter(a=>!a.weighted_average_watts&&a.moving_time>=30*60).length;
  return{ftp,top,allEligible:eligible,withoutPower};
}

// Auto-apply FTP estimate if user hasn't set one. Returns true if applied.
// Idempotent: skips if profile.ftp already set OR ftp_source is 'manual'/'strava'.
function _maybeAutoEstimateFtp(rides){
  const profile=DB.get('user_profile',{})||{};
  if(profile.ftp&&profile.ftp_source!=='estimated')return false; // Respect existing manual/strava value
  const est=_estimateFtpFromRides(rides);
  if(!est||est<60||est>500)return false;
  if(profile.ftp===est)return false;
  profile.ftp=est;profile.ftp_source='estimated';
  DB.set('user_profile',profile);
  return true;
}

// Adds derived training-load metrics (IF, TSS) to each ride object. Both require FTP.
// IF = NP/FTP   TSS = (moving_time × NP²) / (FTP² × 3600) × 100
function _annotateRideLoad(rides,ftp){
  if(!ftp||ftp<=0)return rides;
  for(const a of rides){
    const np=a.weighted_average_watts||a.average_watts;
    if(np&&a.moving_time){
      a._if=+(np/ftp).toFixed(2);
      a._tss=Math.round((a.moving_time*np*np)/(ftp*ftp*3600)*100);
    }
  }
  return rides;
}

// Builds 120-day fitness curve from ride TSS values. Uses exponentially-weighted moving
// averages — CTL = 42-day (fitness), ATL = 7-day (fatigue), TSB = CTL−ATL (form).
// Returns an object keyed by date string with {tss, ctl, atl, tsb}.
function computeFitnessCurve(rides){
  if(!rides||!rides.length)return null;
  // Daily TSS totals
  const dailyTss={};
  for(const a of rides){
    if(!a._tss)continue;
    const ds=(a.start_date_local||'').slice(0,10);
    if(!ds)continue;
    dailyTss[ds]=(dailyTss[ds]||0)+a._tss;
  }
  if(!Object.keys(dailyTss).length)return null;
  // Walk forward from 120 days ago to today, applying EMA
  const today=new Date();
  const start=addDays(today,-120);
  const curve={};
  let ctl=0,atl=0;
  const kCtl=1-Math.exp(-1/42), kAtl=1-Math.exp(-1/7);
  for(let d=new Date(start);d<=today;d=addDays(d,1)){
    const ds=fd(d);
    const tss=dailyTss[ds]||0;
    ctl=ctl+(tss-ctl)*kCtl;
    atl=atl+(tss-atl)*kAtl;
    curve[ds]={tss,ctl:+ctl.toFixed(1),atl:+atl.toFixed(1),tsb:+(ctl-atl).toFixed(1)};
  }
  return curve;
}

async function stravaFetchActivities(){
  const token=await _stravaAccessToken();
  if(!token)return;
  try{
    // Pull athlete data (FTP/weight) in parallel — fail-soft, doesn't block activity sync
    stravaFetchAthlete().catch(()=>{});
    const after=Math.floor(Date.now()/1000)-180*86400; // 6 months of history
    const r=await fetch(`https://www.strava.com/api/v3/athlete/activities?after=${after}&per_page=200`,{
      headers:{Authorization:'Bearer '+token}
    });
    if(!r.ok)throw new Error('activities '+r.status);
    const acts=await r.json();
    const _rideTypes=new Set(['Ride','VirtualRide','EBikeRide','EBikeSport','EMountainBikeRide','GravelRide','MountainBikeRide','Handcycle','Velomobile']);
    // Strip each activity to only the fields the app uses — raw Strava objects include GPS
    // polylines, segment efforts, achievement data etc. which can push 200 rides to 2MB+,
    // silently blowing localStorage quota and causing syncUp to write stale/null data.
    const rides=acts
      .filter(a=>_rideTypes.has(a.type)||_rideTypes.has(a.sport_type))
      .map(({start_date_local,moving_time,elapsed_time,distance,
             average_heartrate,max_heartrate,
             average_watts,weighted_average_watts,max_watts,device_watts,
             total_elevation_gain,average_cadence,average_speed,
             kilojoules,suffer_score,
             perceived_exertion,pr_count,workout_type,
             name,type,sport_type})=>
        ({start_date_local,moving_time,elapsed_time,distance,
          average_heartrate,max_heartrate,
          average_watts,weighted_average_watts,max_watts,device_watts,
          total_elevation_gain,average_cadence,average_speed,
          kilojoules,suffer_score,
          perceived_exertion,pr_count,workout_type,
          name,type,sport_type}));
    // Auto-estimate FTP if not set yet (uses NP from rides) — must happen before annotation
    DB.set('strava_activities',rides); // Set first so _maybeAutoEstimateFtp can read rides
    const autoFtpApplied=_maybeAutoEstimateFtp(rides);
    // Compute IF/TSS per ride and build CTL/ATL/TSB curve (requires FTP)
    const ftp=DB.get('user_profile',{})?.ftp||null;
    _annotateRideLoad(rides,ftp);
    const curve=computeFitnessCurve(rides);
    DB.set('strava_activities',rides);
    DB.set('strava_last_sync',new Date().toISOString());
    if(curve)DB.set('bike_fitness_curve',curve);
    if(autoFtpApplied)showToast(`📊 FTP estimated from rides: ${ftp}W (tap ✏️ to override)`,'var(--acc)');
    analyzeStravaAdapt(rides); // auto-adapt plan based on completion
    await syncUp(); // persist to Firebase so data survives across sessions
    const kb=Math.round(JSON.stringify(rides).length/1024);
    const ftpNote=ftp?` · FTP ${ftp}W`:' · set FTP for TSS';
    showToast(`🟠 Strava synced · ${rides.length} rides · ${kb}KB${ftpNote}`,'var(--grn)');
    render();
  }catch(e){
    console.warn('Strava activities failed:',e);
    showToast(`⚠️ Strava sync failed: ${e?.message||e}`,'var(--red)');
  }
}

/* ── C: STRAVA AUTO-ADAPT ── */
// Scores each completed ride against its plan on 3 dimensions:
//   duration  — did they ride ≥80% of planned time?
//   load      — did kJ output justify the session? (9 kJ/min Zone 2 baseline; benefit-of-doubt if no power meter)
//   fatigue   — is suffer_score consistently too high for the session type? (overreaching signal)
// The factor drives getRideSession() duration so plans scale up or back automatically.
function analyzeStravaAdapt(rides){
  const rideTypes=['LONG_OUTDOOR','SHORT_OUTDOOR','LONG_INDOOR','SHORT_INDOOR'];
  let totalPlanned=0,totalCompleted=0,qualityCount=0,overreachCount=0;
  for(let w=1;w<=2;w++){
    const mon=getMon(addDays(new Date(),-w*7));
    const plan=DB.get(DB.pk(mon),null);
    if(!plan)continue;
    const rideDays=plan.filter(d=>rideTypes.includes(d.type));
    totalPlanned+=rideDays.length;
    rideDays.forEach(dp=>{
      const actual=rides.find(a=>(a.start_date_local||'').slice(0,10)===dp.date);
      if(!actual)return;
      totalCompleted++;
      const plannedMin=dp.type.includes('LONG')?getRideDuration('LONG'):getRideDuration('SHORT');
      const actualMin=actual.moving_time/60;
      // 1. Duration: did they ride ≥80% of planned time?
      const durationOk=actualMin>=plannedMin*0.8;
      // 2. Load quality: ~9 kJ/min is a Zone 2 baseline; no power meter → give benefit of doubt
      const expectedKj=plannedMin*9;
      const kjOk=!actual.kilojoules||actual.kilojoules>=expectedKj*0.75;
      // 3. NP sanity: if NP is much higher than avg watts on a long ride, they were spiking effort
      const npSpike=actual.weighted_average_watts&&actual.average_watts&&
        dp.type.includes('LONG')&&
        actual.weighted_average_watts>actual.average_watts*1.25; // >25% higher NP = variable-intensity
      // 4. Overreaching: suffer score too high for intended session type
      //    Long rides are Zone 2 (suffer ~80–150 is fine); >200 = pushing too hard
      //    Short/interval rides can go higher naturally
      const overreaching=actual.suffer_score!=null&&
        actual.suffer_score>200&&dp.type.includes('LONG');
      if(durationOk&&kjOk&&!npSpike)qualityCount++;
      if(overreaching)overreachCount++;
    });
  }
  if(totalPlanned===0)return;
  const compRate=totalCompleted/totalPlanned;
  const qualityRate=totalCompleted>0?qualityCount/totalCompleted:0;
  const overreachRate=totalCompleted>0?overreachCount/totalCompleted:0;
  let cur=DB.get('bike_adapt_factor',1.0);
  let reason='';
  if(overreachRate>=0.5){
    // Consistently spiking effort on long rides → scale back regardless of completion
    cur=Math.max(0.7,cur-0.05);reason='overreaching';
  } else if(compRate>=0.9&&qualityRate>=0.8){
    cur=Math.min(1.3,cur+0.08);reason='crushing it';
  } else if(compRate>=0.9&&qualityRate>=0.5){
    cur=Math.min(1.3,cur+0.04);reason='completing, quality mixed';
  } else if(compRate>=0.6){
    reason='on track';// hold
  } else {
    cur=Math.max(0.7,cur-0.1);reason='low completion';
  }
  DB.set('bike_adapt_factor',Math.round(cur*100)/100);
  DB.set('bike_adapt_check',fd(new Date()));
  // Store breakdown for diagnostics (shown in bike setup / settings)
  DB.set('bike_adapt_detail',{
    compRate:Math.round(compRate*100),
    qualityRate:Math.round(qualityRate*100),
    overreachRate:Math.round(overreachRate*100),
    reason,planned:totalPlanned,completed:totalCompleted,
    factor:Math.round(cur*100)/100,
    updated:fd(new Date())
  });
}

function getRideDuration(which){
  const{wk,block,phase,weeksToEvent,ev}=getRideWeek();
  const setup=DB.get('bike_setup',{dur:45,goal:'base'});
  const goalRate={base:15,event:20,active:10}[setup.goal]||15;
  if(which==='LONG'){
    if(ev?.date&&weeksToEvent!==null){
      const distKm=ev.unit==='mi'?ev.dist*1.609:ev.dist;
      const targetDur=Math.min(Math.round(distKm/22*60*0.75/5)*5,180);
      if(phase==='taper') return Math.round(targetDur*0.5/5)*5;
      if(phase==='peak')  return targetDur;
      // build: interpolate from setup.dur to targetDur
      const buildWeeks=Math.max(weeksToEvent-2,1);
      const prog=Math.min(1,(block*4+wk)/buildWeeks);
      return Math.min(Math.round((setup.dur+(targetDur-setup.dur)*prog)/5)*5,180);
    }
    let d=setup.dur+(wk<3?wk*goalRate+block*10:0);
    return Math.min(d,150);
  }
  if(phase==='taper') return 35;
  if(phase==='peak'&&ev?.date) return 60;
  return[55,60,55,35][wk]||50; // short ride durations by phase week
}

function stravaRideOnDate(dateStr){
  const acts=DB.get('strava_activities',[])||[];
  return acts.find(a=>(a.start_date_local||'').slice(0,10)===dateStr)||null;
}

function stravaDisconnect(){
  DB.set('strava_token',null);DB.set('strava_activities',null);DB.set('strava_last_sync',null);
  DB.set('bike_fitness_curve',null);
  // Clear Strava-sourced FTP/weight (preserve manual overrides)
  const profile=DB.get('user_profile',{})||{};
  if(profile.ftp_source==='strava'){delete profile.ftp;delete profile.ftp_source;}
  if(profile.weight_source==='strava'){delete profile.weight;delete profile.weight_source;}
  DB.set('user_profile',profile);
  syncUp();render();
}
